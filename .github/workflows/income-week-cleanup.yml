name: Income Week Audit / Cleanup

# Investigate one reporting week's income entries and, if needed, keep only the
# entries a chosen role (default Treasurer) actually entered.
#
#   audit       - read-only report: every entry in the week, who entered it,
#                 duplicate groups, per-week totals for the month. Writes nothing.
#   prune_dry_run - shows exactly which rows a prune would delete. Writes nothing.
#   prune_apply   - deletes those rows. Every deletion writes an auditLogs entry
#                   holding the full document, so it stays recoverable.
#   restore_dry_run / restore_apply
#                 - the undo: rebuild income documents named in `doc_ids` from
#                   those audit entries. Writes with .create(), so it can never
#                   overwrite a live row.
#
# Always run `audit` (and then `prune_dry_run`) before `prune_apply`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - prune_dry_run
          - prune_apply
          - restore_dry_run
          - restore_apply
      year:
        description: 'Year'
        required: false
        default: '2026'
      month:
        description: 'Month (1-12)'
        required: false
        default: '9'
      week:
        description: 'Reporting week 1-5, as shown in Reports > Weekly Collection ("all" is audit-only)'
        required: false
        default: '2'
      keep_role:
        description: 'Role whose entries are kept when pruning'
        required: false
        default: 'Treasurer'
      doc_ids:
        description: 'Restore modes only: comma-separated income document ids to rebuild from their deletion audit entries'
        required: false
        default: ''

jobs:
  income-week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Audit (read-only)
        if: inputs.mode == 'audit'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GB_YEAR: ${{ inputs.year }}
          GB_MONTH: ${{ inputs.month }}
          GB_WEEK: ${{ inputs.week }}
        run: node scripts/audit-income-week.js

      - name: Prune
        if: inputs.mode == 'prune_dry_run' || inputs.mode == 'prune_apply'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GB_YEAR: ${{ inputs.year }}
          GB_MONTH: ${{ inputs.month }}
          GB_WEEK: ${{ inputs.week }}
          GB_KEEP_ROLE: ${{ inputs.keep_role }}
          GB_APPLY: ${{ inputs.mode == 'prune_apply' && 'true' || 'false' }}
        run: node scripts/prune-income-week.js

      - name: Restore from audit log
        if: inputs.mode == 'restore_dry_run' || inputs.mode == 'restore_apply'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GB_DOC_IDS: ${{ inputs.doc_ids }}
          GB_APPLY: ${{ inputs.mode == 'restore_apply' && 'true' || 'false' }}
        run: node scripts/restore-income-from-audit.js
