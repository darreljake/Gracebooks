name: Deploy to Firebase

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Must run BEFORE the rules deploy: storage.rules reads each user's role
      # claim and verify-certificate.html reads certificateVerifications.
      # Idempotent; prints counts only (this repository's logs are public).
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Security migration (role claims, certificate verification copies)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/security-migration.js

      - name: Deploy Hosting, Firestore rules, and Storage rules
        run: npx firebase-tools@latest deploy --only hosting,firestore:rules,storage --project gracebooks-7eebc --non-interactive
