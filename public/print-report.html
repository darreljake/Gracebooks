            <span><button type="button" class="rbtn rbtn-view" onclick="openReviewMonthlySheetFile('${escapeAttr(month)}', ${i})">View</button>${currentRole === 'Treasurer' ? csActionBtnsHtml('month', month, sheet.id, file.fileId) : ''}</span>
          </li>`).join('')}

           <p style="margin:0; color:#555;">${file.url ? 'PDF files open in a new browser tab for viewing.' : 'File not available.'}</p>
           ${file.url ? `<a href="${escapeHtml(file.url)}" target="_blank" rel="noopener noreferrer" class="rbtn rbtn-view">Open PDF in New Tab</a>` : ''}
         </div>`;

    }
    window.GraceBooksAnnotator.open({
      title: file.name || 'Monthly sheet', imageUrl: file.url, fileName: file.name || '',
      subtitle: `Monthly tally sheet — ${month}`, annotations: [], editable: false, locked: true
    });

  function openReviewMonthlyAttach(month) {
    if (currentRole !== 'Treasurer') return;
    pickReviewSheetFiles(files => saveReviewMonthlySheet(month, files));
  }

  async function saveReviewMonthlySheet(month, files) {
    if (currentRole !== 'Treasurer' || !/^\d{4}-\d{2}$/.test(month)) return;
    const err = validateReviewSheetFiles(files);
    if (err) return alert(err);
    try {
      const existingSnap = await db.collection('countSheets').where('month', '==', month).get();
      const existing = existingSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(sh => sh.scope === 'month')[0] || null;
      if (existing) {
        const uploaded = await appendFilesToReviewSheet(existing.id, files, `monthly tally sheet for ${month}`);
        const list = reviewMonthSheetMap.get(month) || [];
        const local = list.find(sh => sh.id === existing.id);
        if (local) local.files = (local.files || []).concat(uploaded);
        else { list.push({ ...existing, files: (existing.files || []).concat(uploaded) }); reviewMonthSheetMap.set(month, list); }
        renderReviewMonthlyLine();
        alert('Files added to the monthly sheet.');
        return;
      }
      let monthlyTotal = null;
      const totalAnswer = window.prompt('Sheet total ₱ (optional - leave blank to skip):', '');
      if (totalAnswer === null) return;
      if (totalAnswer.trim() !== '') {
        monthlyTotal = Number(totalAnswer.replace(/,/g, ''));
        if (!isFinite(monthlyTotal) || monthlyTotal < 0) { alert('Sheet total must be a valid amount.'); return; }
      }
      const uid = firebase.auth().currentUser.uid;
      const sheetId = `monthly-${month}`;
      const uploaded = await uploadReviewSheetFiles(sheetId, files);
      const payload = {
        scope: 'month', month, date: `${month}-01`,
        createdAt: new Date().toISOString(),
        createdBy: { uid, name: (window.graceBooksUser && window.graceBooksUser.name) || '', role: currentRole || '' },
        files: uploaded, notes: 'Attached from Report Preview (review mode).'
      };
      if (monthlyTotal != null) payload.monthlyTotal = monthlyTotal;
      await db.collection('countSheets').doc(sheetId).set(payload);
      await writeReviewAuditLog('monthly_count_sheet_created', sheetId, null, payload,
        `Attached monthly tally sheet for ${month} (${uploaded.length} file${uploaded.length === 1 ? '' : 's'}) (via Report Preview review mode)`, 'countSheets');
      reviewMonthSheetMap.set(month, [{ id: sheetId, ...payload }]);
      renderReviewMonthlyLine();
      alert('Monthly sheet saved.');
    } catch (error) {
      console.error(error);
      alert('Error saving monthly sheet: ' + (error.message || error));
    }
  }

  // ── Count sheet file management (Treasurer only) ─────────────────────────
  // Replace / Remove one file on an existing countSheets doc, and edit a
  // monthly sheet's total/notes. The `files` array is only ever changed inside
  // a transaction that reads the doc, finds the entry by its `fileId` and
  // writes the whole array back (position kept), never arrayRemove/arrayUnion
  // on objects. A countSheets doc is NEVER deleted here and no income entry is
  // ever unlinked: removing the last file leaves a "no photo" sheet. Storage
  // objects are only deleted when their path is one of THIS sheet's own `files`
  // entries AND lives under count-sheets/{sheetId}/ (best effort, after the doc
  // is already correct).
  const CS_ID_RE = /^[A-Za-z0-9_-]{1,128}$/;
  function csFileError(file) {
    if (!file) return 'No file selected.';
    const okType = /^image\//.test(file.type) || file.type === 'application/pdf';
    if (!okType) return `"${file.name}" must be an image or PDF.`;
    if (file.size > 5 * 1024 * 1024) return `"${file.name}" must be 5 MB or smaller.`;
    return '';
  }
  function csOwnPath(sheetId, path) {
    return CS_ID_RE.test(sheetId) && typeof path === 'string' && path.length < 400 &&
      path.startsWith(`count-sheets/${sheetId}/`) && path.indexOf('..') === -1 && path.indexOf('//') === -1;
  }
  function csMeta(f) {
    return f ? { fileId: f.fileId || '', name: f.name || '', path: f.path || '', url: f.url || '', contentType: f.contentType || '', size: f.size || 0 } : null;
  }
  async function csAudit(env, action, sheetId, before, after, summary) {
    try { await env.audit(action, sheetId, before, after, summary); return ''; }
    catch (error) { console.warn('Count sheet change saved but the audit entry failed.', error); return error && error.message ? error.message : String(error); }
  }
  async function csDeleteStorage(env, sheetId, file) {
    if (!file || !file.path) return '';
    if (!csOwnPath(sheetId, file.path)) { console.warn('Refusing to delete a storage path outside this sheet:', file.path); return 'path not under this sheet - not deleted'; }
    try { await env.storage.ref(file.path).delete(); return ''; }
    catch (error) { console.warn('Could not delete the old storage object (the sheet is already correct).', file.path, error); return (error && error.message) ? error.message : String(error); }
  }
  function csGate(env, sheetId) {
    if (!env.isTreasurer()) throw new Error('Only the Treasurer can change count sheet files.');
    if (!CS_ID_RE.test(sheetId || '')) throw new Error('Invalid count sheet reference.');
  }
  async function csReplaceFile(env, sheetId, fileId, newFile, reason) {
    csGate(env, sheetId);
    const err = csFileError(newFile);
    if (err) throw new Error(err);
    const ref = env.db.collection('countSheets').doc(sheetId);
    const pre = await ref.get();
    if (!pre.exists || !(pre.data().files || []).some(f => f && f.fileId === fileId)) throw new Error('That file is no longer on this count sheet. Please refresh and try again.');
    // Upload to a NEW path first: if this throws nothing has changed.
    const uploaded = (await env.upload(sheetId, [newFile]))[0];
    let result;
    try {
      result = await env.db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists) throw new Error('That count sheet no longer exists.');
        const data = snap.data() || {};
        const files = Array.isArray(data.files) ? data.files.slice() : [];
        const idx = files.findIndex(f => f && f.fileId === fileId);
        if (idx < 0) throw new Error('That file is no longer on this count sheet. Please refresh and try again.');
        const old = files[idx];
        files[idx] = uploaded; // same position
        tx.update(ref, { files });
        return { old, files, index: idx };
      });
    } catch (error) {
      // The doc was not changed: drop the orphan we just uploaded (best effort).
      try { await env.storage.ref(uploaded.path).delete(); } catch (delError) { console.warn('Could not delete the orphaned upload.', uploaded.path, delError); }
      throw error;
    }
    const deleteError = uploaded.path !== result.old.path ? await csDeleteStorage(env, sheetId, result.old) : 'same path - not deleted';
    const auditError = await csAudit(env, 'count_sheet_file_replaced', sheetId,
      { sheetId, position: result.index, file: csMeta(result.old) },
      { sheetId, position: result.index, file: csMeta(uploaded), reason: reason || '', oldStorageDeleted: !deleteError, oldStorageDeleteError: deleteError },
      `Replaced count sheet file "${result.old.name || ''}" with "${uploaded.name}" on sheet ${sheetId}${reason ? ' - ' + reason : ''}${deleteError ? ' (old storage object could not be deleted)' : ''}`);
    return { files: result.files, oldDeleteError: deleteError, auditError };
  }
  async function csRemoveFile(env, sheetId, fileId) {
    csGate(env, sheetId);
    const ref = env.db.collection('countSheets').doc(sheetId);
    const result = await env.db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error('That count sheet no longer exists.');
      const files = Array.isArray((snap.data() || {}).files) ? snap.data().files.slice() : [];
      const idx = files.findIndex(f => f && f.fileId === fileId);
      if (idx < 0) throw new Error('That file is no longer on this count sheet. Please refresh and try again.');
      const old = files[idx];
      files.splice(idx, 1);
      tx.update(ref, { files });
      return { old, files, index: idx };
    });
    const deleteError = await csDeleteStorage(env, sheetId, result.old);
    const auditError = await csAudit(env, 'count_sheet_file_removed', sheetId,
      { sheetId, position: result.index, file: csMeta(result.old) },
      { sheetId, remainingFileCount: result.files.length, oldStorageDeleted: !deleteError, oldStorageDeleteError: deleteError },
      `Removed count sheet file "${result.old.name || ''}" from sheet ${sheetId}${result.files.length ? '' : ' (sheet now has no photo)'}${deleteError ? ' (storage object could not be deleted)' : ''}`);
    return { files: result.files, oldDeleteError: deleteError, auditError };
  }
  // monthlyTotal: a number, or null to clear it. notes: string ('' clears).
  async function csUpdateMonthly(env, sheetId, monthlyTotal, notes) {
    csGate(env, sheetId);
    if (monthlyTotal != null && (!isFinite(monthlyTotal) || monthlyTotal < 0)) throw new Error('Sheet total must be a valid amount.');
    const ref = env.db.collection('countSheets').doc(sheetId);
    const result = await env.db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error('That monthly sheet no longer exists.');
      const data = snap.data() || {};
      if (data.scope !== 'month') throw new Error('Only a monthly sheet has a sheet total.');
      tx.update(ref, { monthlyTotal: monthlyTotal == null ? firebase.firestore.FieldValue.delete() : monthlyTotal, notes: notes || '' });
      return { month: data.month || '', before: { monthlyTotal: data.monthlyTotal == null ? null : data.monthlyTotal, notes: data.notes || '' } };
    });
    const after = { monthlyTotal: monthlyTotal == null ? null : monthlyTotal, notes: notes || '' };
    const auditError = await csAudit(env, 'monthly_count_sheet_updated', sheetId,
      { sheetId, month: result.month, ...result.before }, { sheetId, month: result.month, ...after },
      `Updated monthly tally sheet ${result.month || sheetId}: total ${result.before.monthlyTotal == null ? '(none)' : result.before.monthlyTotal} -> ${after.monthlyTotal == null ? '(none)' : after.monthlyTotal}${result.before.notes !== after.notes ? ', notes changed' : ''}`);
    return { monthlyTotal: after.monthlyTotal, notes: after.notes, auditError };
  }
  // Asks for a new monthly total then notes via prompt(); null = cancelled.
  function csPromptMonthly(sheet) {
    const curTotal = sheet && sheet.monthlyTotal != null && isFinite(Number(sheet.monthlyTotal)) ? String(Number(sheet.monthlyTotal)) : '';
    const totalAnswer = window.prompt('Sheet total ₱ (leave blank to clear the total):', curTotal);
    if (totalAnswer === null) return null;
    let monthlyTotal = null;
    if (totalAnswer.trim() !== '') {
      monthlyTotal = Number(totalAnswer.replace(/,/g, ''));
      if (!isFinite(monthlyTotal) || monthlyTotal < 0) { alert('Sheet total must be a valid amount.'); return null; }
    }
    const notesAnswer = window.prompt('Notes (leave blank to clear):', (sheet && sheet.notes) || '');
    if (notesAnswer === null) return null;
    return { monthlyTotal, notes: notesAnswer.trim() };
  }
  // One file picker (single file) for Replace.
  function csPickOneFile(onFile) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,application/pdf';
    input.onchange = () => { const f = (input.files || [])[0]; if (f) onFile(f); };
    input.click();
  }


  const csEnv = {
    db, storage,
    isTreasurer: () => currentRole === 'Treasurer',
    upload: (sheetId, files) => uploadReviewSheetFiles(sheetId, files),
    audit: (action, sheetId, before, after, summary) => writeReviewAuditLog(action, sheetId, before, after, `${summary} (via Report Preview review mode)`, 'countSheets')
  };
  let csChooserState = null; // which Replace/Remove chooser is open, so it can be re-opened after an action
  let csBusy = false;

  // Replace / Remove buttons (review-mode panels only: those rows are
  // review-only, hidden in print and skipped by the Excel export). Ids ride
  // in data- attributes, never inside an inline JS string.
  function csActionBtnsHtml(kind, key, sheetId, fileId) {
    if (currentRole !== 'Treasurer' || !reviewMode || !sheetId || !fileId) return '';
    const attrs = `data-cs-kind="${escapeAttr(kind)}" data-cs-key="${escapeAttr(key)}" data-cs-sheet="${escapeAttr(sheetId)}" data-cs-file="${escapeAttr(fileId)}"`;
    return ` <button type="button" class="rbtn rbtn-upload" title="Upload the right file in place of this one" data-cs-act="replace" ${attrs}>Replace</button>` +
           ` <button type="button" class="rbtn rbtn-upload" style="color:#c0392b;" title="Remove this file (the sheet stays)" data-cs-act="remove" ${attrs}>Remove</button>`;
  }
  function csLocalSheet(kind, key, sheetId) {
    if (kind === 'month') return (reviewMonthSheetMap.get(key) || []).find(sh => sh.id === sheetId && sh.scope === 'month') || null;
    const sheet = reviewCountSheetMap.get(sheetId);
    return sheet && sheet.scope !== 'month' ? sheet : null;
  }
  function csAfterChange(kind, key, sheetId, patch) {
    const local = csLocalSheet(kind, key, sheetId);
    if (local) Object.keys(patch).forEach(k => { if (patch[k] === undefined || patch[k] === null && k === 'monthlyTotal') delete local[k]; else local[k] = patch[k]; });
    closeReviewReceiptViewer();
    if (kind === 'month') renderReviewMonthlyLine(); else refreshIncomeDateGroup(key);
    const chooser = csChooserState;
    csChooserState = null;
    if (chooser && chooser.kind === kind && chooser.key === key && local && (local.files || []).length) {
      if (kind === 'month') openReviewMonthlySheet(key); else openReviewCountSheet(key);
    }
  }
  async function handleCsAction(act, kind, key, sheetId, fileId) {
    if (csBusy || currentRole !== 'Treasurer' || !reviewMode) return;
    if (kind !== 'week' && kind !== 'month') return;
    const sheet = csLocalSheet(kind, key, sheetId);
    if (!sheet) { alert('That count sheet is no longer loaded. Please reload the preview.'); return; }
    const file = (sheet.files || []).find(f => f && f.fileId === fileId);
    try {
      if (act === 'editmonthly') {
        if (kind !== 'month') return;
        const answer = csPromptMonthly(sheet);
        if (!answer) return;
        csBusy = true;
        const res = await csUpdateMonthly(csEnv, sheetId, answer.monthlyTotal, answer.notes);
        csAfterChange(kind, key, sheetId, { monthlyTotal: res.monthlyTotal, notes: res.notes });
        alert('Monthly sheet updated.' + (res.auditError ? ' (The audit entry could not be written.)' : ''));
      } else if (act === 'remove') {
        if (!file) { alert('That file is no longer on this sheet. Please reload the preview.'); return; }
        if (!confirm(`Remove "${file.name || 'this file'}" from this ${kind === 'month' ? 'monthly' : 'count'} sheet?\n\nThe sheet itself${kind === 'month' ? '' : ' and its income entries'} stay; only this file is removed.`)) return;
        csBusy = true;
        const res = await csRemoveFile(csEnv, sheetId, fileId);
        csAfterChange(kind, key, sheetId, { files: res.files });
        alert('File removed.' + (res.oldDeleteError ? ' (The stored copy could not be deleted; it has been noted in the audit log.)' : ''));
      } else if (act === 'replace') {
        if (!file) { alert('That file is no longer on this sheet. Please reload the preview.'); return; }
        csPickOneFile(async newFile => {
          const err = csFileError(newFile);
          if (err) return alert(err);
          const reason = window.prompt(`Reason for replacing "${file.name || 'this file'}" (optional):`, '');
          if (reason === null) return;
          csBusy = true;
          try {
            const res = await csReplaceFile(csEnv, sheetId, fileId, newFile, reason.trim());
            csAfterChange(kind, key, sheetId, { files: res.files });
            alert('File replaced.' + (res.oldDeleteError ? ' (The old stored copy could not be deleted; it has been noted in the audit log.)' : ''));
          } catch (error) {
            console.error(error);
            alert('Error replacing file: ' + (error.message || error));
          } finally { csBusy = false; }
        });
      }
    } catch (error) {
      console.error(error);
      alert('Error: ' + (error.message || error));
    } finally {
      if (act !== 'replace') csBusy = false;
    }
  }
  document.addEventListener('click', event => {
    const btn = event.target && event.target.closest ? event.target.closest('[data-cs-act]') : null;
    if (!btn) return;
    event.preventDefault();
    handleCsAction(btn.dataset.csAct, btn.dataset.csKind, btn.dataset.csKey, btn.dataset.csSheet, btn.dataset.csFile);
  });

  // ── Treasurer: attach a count sheet to a date with no linked entries ───
  // Mirrors income-log.html's Attach Count Sheet flow exactly (no shared
  // JS modules in this repo - see CLAUDE.md); only the entries for THIS
  // date that don't already carry a countSheetId are linked.
  function openAttachCountSheetPrompt(date) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,application/pdf';
    input.multiple = true;
    input.onchange = () => saveReviewAttachCountSheet(date, Array.from(input.files || []));
    input.click();
  }

  async function saveReviewAttachCountSheet(date, files) {
    for (const file of files) {
      const okType = /^image\//.test(file.type) || file.type === 'application/pdf';
      if (!okType) return alert(`"${file.name}" must be an image or PDF.`);
      if (file.size > 5 * 1024 * 1024) return alert(`"${file.name}" must be 5 MB or smaller.`);
    }
    try {
      const snapshot = await db.collection('income').where('date', '==', date).get();
      const unattached = snapshot.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(r => !r.countSheetId && (r.type || '').toLowerCase() !== 'transfer');
      if (!unattached.length) { alert('No income entries without a count sheet were found for this date.'); return; }

      const uid = firebase.auth().currentUser.uid;
      const sheetRef = db.collection('countSheets').doc();
      const sheetId = sheetRef.id;
      const uploaded = [];
      for (const file of files) {
        const fileId = generateStorageToken();
        const path = `count-sheets/${sheetId}/${uid}/${fileId}${safeFileExtension(file.name)}`;
        const fileRef = storage.ref(path);
        await fileRef.put(file);
        const url = await fileRef.getDownloadURL();
        uploaded.push({ fileId, name: file.name, path, url, contentType: file.type || '', size: file.size || 0 });
      }
      const cashTotal = unattached.filter(r => r.payment === 'Cash').reduce((s, r) => s + parseFloat(r.amount || 0), 0);
      const nonCashTotal = unattached.filter(r => r.payment !== 'Cash').reduce((s, r) => s + parseFloat(r.amount || 0), 0);
      const totalAmount = unattached.reduce((s, r) => s + parseFloat(r.amount || 0), 0);
      const sheetPayload = {
        date, createdAt: new Date().toISOString(),
        createdBy: { uid, name: (window.graceBooksUser && window.graceBooksUser.name) || '', role: currentRole || '' },
        entryCount: unattached.length, totalAmount, cashTotal, nonCashTotal,
        denominations: {}, files: uploaded, notes: 'Attached from Report Preview (review mode).'
      };
      await sheetRef.set(sheetPayload);
      await writeReviewAuditLog('count_sheet_created', sheetId, null, sheetPayload,
        `Attached count sheet for ${date} to ${unattached.length} existing income entr${unattached.length === 1 ? 'y' : 'ies'} (via Report Preview review mode)`, 'countSheets');

      const batch = db.batch();
      unattached.forEach(r => batch.update(db.collection('income').doc(r.id), { countSheetId: sheetId }));
      await batch.commit();
      await writeReviewAuditLog('income_count_sheet_attached', sheetId, null,
        { countSheetId: sheetId, incomeIds: unattached.map(r => r.id) },
        `Linked ${unattached.length} income entr${unattached.length === 1 ? 'y' : 'ies'} on ${date} to count sheet ${sheetId}`, 'income');

      reviewCountSheetMap.set(sheetId, { id: sheetId, ...sheetPayload });
      const unattachedIds = new Set(unattached.map(r => r.id));
      (reviewIncomeDateCache.get(date) || []).forEach(e => { if (unattachedIds.has(e.id)) e.countSheetId = sheetId; });
      incomeData.forEach(e => { if (unattachedIds.has(e.id)) e.countSheetId = sheetId; });
      refreshIncomeDateGroup(date);
      alert('Count sheet saved and linked.');
    } catch (error) {
      console.error(error);
      alert('Error saving count sheet: ' + (error.message || error));
    }
  }

  // ── Paper size switcher ─────────────────────────────────────────────────
  let _paperStyleEl = null;
  function setPaperSize(val) {
    if (!_paperStyleEl) {
      _paperStyleEl = document.createElement('style');
      _paperStyleEl.id = 'dynamic-page-size';
      document.head.appendChild(_paperStyleEl);
    }
    document.body.classList.remove('paper-letter', 'paper-a4');
    if (val === 'letter') {
      document.body.classList.add('paper-letter');
      _paperStyleEl.textContent = '@page { size: 8.5in 11in; margin: 0.5in 0.6in; }';
    } else if (val === 'a4') {
      document.body.classList.add('paper-a4');
      _paperStyleEl.textContent = '@page { size: 210mm 297mm; margin: 14mm 16mm; }';
    } else {
      _paperStyleEl.textContent = '@page { size: 8.5in 13in; margin: 0.6in 0.65in; }';
    }
  }
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
