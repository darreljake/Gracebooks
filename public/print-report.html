  async function render() {
    await loadWorkflowSignaturesForCurrentPeriod();
    updateReviewModeGate();
    const budgetYear = parseInt(document.getElementById('sel-year').value);
    currentBudgets = Number.isInteger(budgetYear) ? await ensureBudgetsForYear(budgetYear) : null;
    if (reportType === 'monthly') renderMonthly();
    else if (reportType === 'annual') renderAnnual();
    else if (reportType === 'special-project') renderSpecialProject();
    applyReviewModeUI();
    if (reviewMode) ensureReviewMonthlyLine();
    fitReportToScreen();
  }

  // Review mode is enabled only when ALL hold: ?review=1 is present; the
  // role is Treasurer, or Auditor with this period's reportReviews status
  // past 'draft'; and the report type is monthly or annual. Otherwise the
  // page behaves exactly as it always has.
  function updateReviewModeGate() {
    reviewGateChecked = true;
    if (!initialReviewRequested) { reviewMode = false; return; }
    if (reportType !== 'monthly' && reportType !== 'annual') { reviewMode = false; return; }
    if (currentRole === 'Treasurer') { reviewMode = true; return; }
    if (currentRole === 'Auditor') { reviewMode = !!currentWorkflowStatus && currentWorkflowStatus !== 'draft'; return; }
    reviewMode = false;
  }

  function currentWorkflowId() {
    const year = document.getElementById('sel-year').value || new Date().getFullYear();
    if (reportType === 'special-project') return `special-project-${document.getElementById('sel-special-project').value || 'none'}`;
    if (reportType === 'annual') return `annual-${year}`;
    const month = String(Number(document.getElementById('sel-month').value || 0) + 1).padStart(2, '0');
    return `monthly-${year}-${month}`;
  }

  async function loadWorkflowSignaturesForCurrentPeriod() {
    try {
      const doc = await db.collection('reportReviews').doc(currentWorkflowId()).get();
      workflowSignatures = doc.exists ? (doc.data().signatures || {}) : {};
      currentWorkflowStatus = doc.exists ? (doc.data().status || '') : '';
    } catch (error) {
      console.warn('Unable to load report workflow signatures.', error);
      workflowSignatures = {};
      currentWorkflowStatus = '';
    }
  }

  function workflowSignatureHtml(key, fallbackName, fallbackTitle) {
    const sig = workflowSignatures[key] || {};
    const name = fallbackName || sig.name || '';
    const image = sig.signedAt && sig.mode === 'electronic' && sig.signatureUrl
      ? `<div class="workflow-sig-space"><img class="workflow-sig-img" src="${escapeAttr(sig.signatureUrl)}" alt="Signature" onerror="this.parentElement.innerHTML='<span class=&quot;workflow-sig-unavailable&quot;>Signature image unavailable</span>';"></div>`
      : '';
    const manual = '<div class="workflow-sig-space"></div>';
    return `
      ${image || manual}
      <div class="workflow-sig-line"></div>
      <div style="font-weight:700; font-size:12px;">${escapeHtml(name)}</div>
      <div style="font-size:11px; color:var(--gray);">${escapeHtml(fallbackTitle || '')}</div>
    `;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, '&#96;');
  }

  function updateReportZoom() {
    document.documentElement.style.setProperty('--report-zoom', reportZoom.toFixed(2));
    document.getElementById('report-zoom-label').textContent = Math.round(reportZoom * 100) + '%';
  }

  function openReportFullscreen() {
    document.body.classList.add('report-fullscreen');
    updateReportZoom();
    fitReportToScreen();
    const page = document.getElementById('report-page');
    if (page && page.scrollIntoView) page.scrollIntoView({ block: 'start' });
  }

  function closeReportFullscreen() {
    document.body.classList.remove('report-fullscreen');
    fitReportToScreen();
  }

  function changeReportZoom(delta) {
    reportZoom = Math.min(1.8, Math.max(0.6, reportZoom + delta));
    updateReportZoom();
  }

  function resetReportZoom() {
    reportZoom = 1;
    updateReportZoom();
  }

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && document.body.classList.contains('report-fullscreen')) {
      closeReportFullscreen();
    }
  });

  updateReportZoom();

  // Phone auto-fit (screen only). The paper is laid out at a "design width"
  // (--fit-width) wide enough for the statement's REAL content, then scaled
  // down to the viewport width with transform: scale() (--fit-zoom), so the
  // whole statement is visible as a scaled page (pinch to zoom in). The CSS
  // reads these vars only inside a screen media query, so print and desktop
  // are unaffected. Runs inside the report-workflow iframe too.
  //
  // The design width is the table's min-content width, measured by briefly
  // collapsing the paper so the table shrinks to the narrowest layout its
  // nowrap columns, longest word and obligations sub-table allow. (Measuring
  // table.scrollWidth at a preset width - the earlier approach - only ever
  // reports the width the table was GIVEN, so it never noticed that real
  // data overflowed it.) Because it measures rendered content, it adapts to
  // long names, budget columns, the obligations table and larger system fonts.
  const FIT_MIN_DESIGN_WIDTH = 480;
  let fitRaf = 0, fitBusy = false;
  function fitReportToScreen() {
    const page = document.getElementById('report-page');
    if (!page || fitBusy) return;
    fitBusy = true;
    try {
      const root = document.documentElement.style;
      const wrapper = page.parentElement;
      const phone = window.matchMedia('(max-width: 600px)').matches && !document.body.classList.contains('report-fullscreen');
      if (!phone) { ['--fit-width', '--fit-zoom', '--fit-h'].forEach(k => root.removeProperty(k)); return; }
      root.setProperty('--fit-zoom', '1');
      root.setProperty('--fit-h', 'auto');
      root.setProperty('--fit-width', '1px');   // table collapses to min-content
      const table = document.getElementById('export-table');
      const cs = getComputedStyle(page);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      let content = FIT_MIN_DESIGN_WIDTH;
      if (table) content = Math.max(content, Math.ceil(table.getBoundingClientRect().width) + 4);
      const needed = content + padX;
      root.setProperty('--fit-width', needed + 'px');
      const wcs = getComputedStyle(wrapper);
      const avail = document.documentElement.clientWidth - parseFloat(wcs.paddingLeft) - parseFloat(wcs.paddingRight);
      const zoom = Math.min(1, avail / needed);
      root.setProperty('--fit-zoom', zoom.toFixed(4));
      root.setProperty('--fit-h', Math.ceil(page.offsetHeight * zoom) + 'px');
    } finally { fitBusy = false; }
  }
  function scheduleFit() {
    if (fitRaf) cancelAnimationFrame(fitRaf);
    fitRaf = requestAnimationFrame(() => { fitRaf = 0; fitReportToScreen(); });
  }
  window.addEventListener('resize', scheduleFit);
  window.addEventListener('orientationchange', () => setTimeout(scheduleFit, 200));
  window.addEventListener('load', scheduleFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', scheduleFit);
  // Content changes (render, budget toggle, paper size, review panels opening)
  // change the paper's height; re-fit whenever its box changes size.
  if (window.ResizeObserver) {
    const pageEl = document.getElementById('report-page');
    if (pageEl) new ResizeObserver(scheduleFit).observe(pageEl);
  }

  function getObligationPaidAmount(o) {
    if (o.paidAmount !== undefined) return Math.max(0, parseFloat(o.paidAmount) || 0);
    return o.status === 'Paid' ? (parseFloat(o.amount) || 0) : 0;
  }

  function getObligationBalance(o) {
    const amount = Math.max(0, parseFloat(o.amount) || 0);
    return Math.max(0, amount - getObligationPaidAmount(o));
  }

  function getObligationStatus(o) {
    const amount = Math.max(0, parseFloat(o.amount) || 0);
    const paidAmount = Math.min(amount, getObligationPaidAmount(o));
    if (amount > 0 && paidAmount >= amount) return 'Paid';
    if (paidAmount > 0) return 'Partially Paid';
    return 'Unpaid';
  }

  // ── CORE REPORT GENERATION ───────────────────────────────────────────────
  function generateReportHTML(year, month, isAnnual) {
    if (reviewMode) { reviewIncLineEntries = {}; reviewExpLineEntries = {}; reviewRestrictedEntries = {}; }
    const targetDate = isAnnual ? new Date(year, 0, 1) : new Date(year, month, 1);
    const periodEndDate = isAnnual ? new Date(year, 11, 31, 23, 59, 59) : new Date(year, month + 1, 0, 23, 59, 59);
    const dayBeforeStart = new Date(targetDate.getTime() - 1);

    // ── Item 7: Budget / % Used columns ─────────────────────────────────────
    // Annual statement: Budget = the full annual amount from budgets/{year}.
    // Monthly statement: Budget = Year-to-Date, i.e. the sum of
    // expenseBudgetForMonth/incomeBudgetForMonth (copied above from
    // budget-vs-actual.html) for every month from January through the
    // selected month, on the same schedule-aware basis budget-vs-actual.html
    // uses. Neither figure changes any existing Amount figure - these are
    // purely additive columns.
    const budgetsObj = currentBudgets || { expense: {}, income: {}, expenseSchedule: {}, incomeSchedule: {} };
    function budgetForExpenseKey(key) {
      if (isAnnual) return (budgetsObj.expense || {})[key] || 0;
      let sum = 0;
      for (let m = 0; m <= month; m++) sum += expenseBudgetForMonth(key, m, budgetsObj);
      return sum;
    }
    function budgetForIncomeKey(key) {
      if (isAnnual) return (budgetsObj.income || {})[key] || 0;
      let sum = 0;
      for (let m = 0; m <= month; m++) sum += incomeBudgetForMonth(key, m, budgetsObj);
      return sum;
    }
    const COLSPAN = showBudgetCols ? 5 : 3;
    const emptyBudgetCells = showBudgetCols ? '<td class="col-budget"></td><td class="col-pct"></td>' : '';
    // isExpenseSide: colour % Used red above 100% for expenses, amber below
    // 100% for income (an income shortfall is the concerning direction).
    function budgetCellsHtml(budgetAmt, actualAmt, isExpenseSide, dash) {
      if (!showBudgetCols) return '';
      if (dash) return '<td class="col-budget">—</td><td class="col-pct"></td>';
      if (!(budgetAmt > 0)) return emptyBudgetCells;
      const pct = (actualAmt / budgetAmt) * 100;
      let cls = '';
      if (isExpenseSide && pct > 100) cls = 'pct-over';
      else if (!isExpenseSide && pct < 100) cls = 'pct-under';
      return `<td class="col-budget">₱ ${fmt(budgetAmt)}</td><td class="col-pct ${cls}">${pct.toFixed(1)}%</td>`;
    }

    // ── General Fund vs Restricted Funds ────────────────────────────────────
    // isGeneralFundAccount() reads the Treasurer's own per-account setting
    // (Financial Overview > Beginning Balances), so which of the six
    // FINANCIAL_ACCOUNTS count as "General Fund" here is configurable, not
    // hardcoded - Mission/Investment default to General Fund unless the
    // Treasurer explicitly excludes them. The Building Fund is the exception:
    // it is treated as a separate fund with its own reporting, so it is ALWAYS
    // restricted here regardless of that setting (isGeneralFundAccount()), and
    // any income/expense that is Building Fund money by explicit account OR by
    // its category/type text (isBuildingFundEntry()) is kept out of the General
    // Fund Receipts/Disbursements and reported only under Restricted Fund
    // Activity. Building Fund cash that physically sits in a General Fund
    // account (posted to / paid from cash-hand or cash-bank) is carried as its
    // own reconciling item - see buildingFundHeldInGfThrough().
    const gfAccounts = FINANCIAL_ACCOUNTS.filter(a => isGeneralFundAccount(a.id));
    const restrictedAccounts = FINANCIAL_ACCOUNTS.filter(a => !isGeneralFundAccount(a.id));
    const gfIds = gfAccounts.map(a => a.id);
    const restrictedIds = restrictedAccounts.map(a => a.id);
    function sumIds(balances, ids) {
      return ids.reduce((s, id) => s + (parseFloat(balances[id]) || 0), 0);
    }

    // getAccountBalancesThrough() is the one place that already nets every
    // real cash effect - income, expense (at net cash impact for payroll),
    // deduction-payment remittances, and both sides of a fund transfer - so
    // it's used here as the single source of truth for the General Fund's
    // true beginning/ending cash balance, instead of a second hand-rolled
    // loop that could silently drift from it (see the transfer note below).
    const beginningAccountBalances = getAccountBalancesThrough(dayBeforeStart);
    const accountBalances = getAccountBalancesThrough(periodEndDate);
    const gfTrueEndBalance = sumIds(accountBalances, gfIds);
    const restrictedTrueEndBalance = sumIds(accountBalances, restrictedIds);
    // Duplicate legacy "Cash Advance Return" income docs are excluded from
    // every pool here (see isDuplicateCashAdvanceReturn()) but Financial
    // Overview still counts them, so its balances run high by exactly their
    // total until the Treasurer removes them. Shown as a screen-only note.
    const excludedReturnTotal = (rawIncomeDocs || [])
      .filter(d => !d.isSpecialProject && d.date && new Date(d.date) <= periodEndDate && isDuplicateCashAdvanceReturn(d))
      .reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
    const excludedReturnNoteHtml = excludedReturnTotal >= 0.01
      ? `
          <tr class="screen-only-note-row">
            <td class="col-desc screen-only-note" colspan="${COLSPAN}">Financial Overview still includes ₱ ${fmt(excludedReturnTotal)} of duplicate cash advance return entries — remove them from Liquidation &amp; Reimbursements.</td>
          </tr>`
      : '';

    // ── Beginning/Ending Balance basis ──────────────────────────────────────
    // This statement's Beginning and Ending Balance must be on the SAME
    // basis, or they won't carry over from one period's Ending Balance to
    // the next period's Beginning Balance - an auditor would catch that
    // immediately. getAccountBalancesThrough() (above) recognizes payroll at
    // NET cash impact, while the statement's own period math (totalOut,
    // below) deliberately keeps payroll at GROSS pay, so the true account
    // balance and this statement's own running total diverge by exactly the
    // payroll withheld-but-not-yet-remitted amount, and that amount carries
    // forward indefinitely until it's remitted. The fix: put BOTH balances
    // on "cash net of payroll withholdings still held for remittance" -
    // i.e. subtract the *cumulative* outstanding withholding (all-time
    // withheld minus all-time remitted, through a given date) from the true
    // cash balance at that same date. Because that adjustment is applied
    // identically at both the period's start and its end, the statement's
    // own beginBal + netChange + netTransferGF math (below) lands on
    // exactly that adjusted basis too - see the reconciliation section
    // further down, where the two are shown to be algebraically equal.
    function outstandingWithholdingsThrough(throughDate) {
      let withheld = 0;
      let remitted = 0;
      allExpenseData.forEach(d => {
        if (!d.date) return;
        const dt = new Date(d.date);
        if (dt > throughDate) return;
        if (!isGeneralFundAccount(getExpenseAccountId(d))) return;
        if (d.isPayrollGenerated && !d.isBenefit) {
          const netPay = parseFloat(d.netPay);
          if (Number.isFinite(netPay)) withheld += Math.max(0, parseFloat(d.amount || 0) - netPay);
        } else if (d.type === 'deduction-payment') {
          remitted += parseFloat(d.amount || 0);
        }
      });
      return withheld - remitted;
    }
    // Building Fund money held in General Fund accounts: a Building Fund
    // entry posted to (or paid from) a GENERAL FUND account (cash-hand,
    // cash-bank...) moves that account's true cash balance but is NOT part
    // of this statement's General Fund receipts/disbursements (it is reported
    // under Restricted Fund Activity instead). Exactly like the payroll
    // withholdings above, that cash is earmarked rather than free General
    // Fund cash, so the cumulative net (Building Fund income on GF accounts
    // minus Building Fund expenses on GF accounts, expenses at the same gross
    // d.amount the period math uses) is subtracted from BOTH the beginning
    // balance and the reconciliation comparison point. Same adjustment at
    // both ends, so begBal + netChange + netTransferGF still equals
    // gfTrueEndBalance - withholdings - buildingHeld, and Ending Balance
    // carries over into the next period's Beginning Balance.
    function buildingFundHeldInGfThrough(throughDate) {
      let held = 0;
      incomeData.forEach(d => {
        if (!d.date || new Date(d.date) > throughDate) return;
        if (isBuildingFundEntry(d, false) && isGeneralFundAccount(getIncomeAccountId(d))) held += parseFloat(d.amount || 0);
      });
      expenseData.forEach(d => {
        if (!d.date || new Date(d.date) > throughDate) return;
        if (isBuildingFundEntry(d, true) && isGeneralFundAccount(getExpenseAccountId(d))) held -= parseFloat(d.amount || 0);
      });
      return held;
    }
    const outstandingWithholdingsBeforePeriod = outstandingWithholdingsThrough(dayBeforeStart);
    const outstandingWithholdingsAtEnd = outstandingWithholdingsThrough(periodEndDate);
    const buildingHeldBeforePeriod = buildingFundHeldInGfThrough(dayBeforeStart);
    const buildingHeldAtEnd = buildingFundHeldInGfThrough(periodEndDate);
    const begBal = sumIds(beginningAccountBalances, gfIds) - outstandingWithholdingsBeforePeriod - buildingHeldBeforePeriod;

    // ── Period pools: real (non-transfer) income/expense records ────────────
    // Kept whole (both General Fund and restricted) so the new Restricted
    // Fund Activity section below can show what the General-Fund-basis
    // statement excludes, rather than that money silently disappearing from
    // the report the way excluded Building Fund income used to.
    const periodIncome = incomeData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });
    const periodExpense = expenseData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });

    const fInc = periodIncome.filter(isGeneralFundIncome);
    const fExp = periodExpense.filter(isGeneralFundExpense);
    const restrictedIncomeRows = periodIncome.filter(d => !isGeneralFundIncome(d));
    const restrictedExpenseRows = periodExpense.filter(d => !isGeneralFundExpense(d));

    // Item 7 (monthly YTD % Used): a separate Year-to-Date pool (January
    // through the selected month), General-Fund-basis like fInc/fExp, used
    // ONLY to compute the YTD *actual* half of "YTD actual / YTD budget".
    // fInc/fExp (this period only) still drive every existing Amount figure
    // unchanged - this pool is additive, never a replacement.
    const ytdIncomePool = isAnnual ? fInc : incomeData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return dt.getFullYear() === year && dt.getMonth() <= month;
    }).filter(isGeneralFundIncome);
    const ytdExpensePool = isAnnual ? fExp : expenseData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return dt.getFullYear() === year && dt.getMonth() <= month;
    }).filter(isGeneralFundExpense);
    const ytdTotalIn = ytdIncomePool.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const ytdTotalOut = ytdExpensePool.reduce((s, d) => s + parseFloat(d.amount || 0), 0);

    // ── Fund transfers ───────────────────────────────────────────────────────
    // Transfers move cash between accounts rather than representing real
    // income/expense, so incomeData/expenseData (and so fInc/fExp above)
    // deliberately exclude them entirely ("Skip transfers", see where those
    // arrays are built). That used to mean a transfer moving money between a
    // General Fund account and a restricted one was invisible to this
    // statement's own beginning/ending balance math - the printed Ending
    // Balance would silently drift away from the true account balances
    // (Financial Overview) every time such a transfer happened. Per
    // financial-overview.html's transferFunds(), each transfer writes two
    // docs tagged type:'transfer': an expenses-collection doc debiting the
    // source account (targetAccId = source) and an income-collection doc
    // crediting the destination (targetAccId = destination). Netting those
    // two pools by General-Fund-ness gives this period's net transfer into
    // (or out of) the General Fund, now folded into the statement as its own
    // labelled line instead of being silently absorbed into an
    // unreconciled beginning balance.
    const periodTransferIn = allIncomeData.filter(d => {
      if (d.type !== 'transfer' || !d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });
    const periodTransferOut = allExpenseData.filter(d => {
      if (d.type !== 'transfer' || !d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });
    const transferIntoGF = periodTransferIn
      .filter(d => isGeneralFundAccount(getIncomeAccountId(d)))
      .reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const transferOutOfGF = periodTransferOut
      .filter(d => isGeneralFundAccount(getExpenseAccountId(d)))
      .reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const netTransferGF = transferIntoGF - transferOutOfGF;

    const totalIn = fInc.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const totalOut = fExp.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    // Surplus/Deficit is operating performance only (income vs. expense) -
    // fund transfers are financing/movement, not operating results, so they
    // sit on their own line below rather than inside this computation.
    const netChange = totalIn - totalOut;
    const endBal = begBal + netChange + netTransferGF;

    // ── Reconciliation: General Fund accounts vs Ending Balance ─────────────
    // This statement deliberately keeps using GROSS pay (d.amount) for
    // payroll, same as Total Disbursements always has, so a reader sees the
    // same figure that was budgeted/expensed. The true account balance
    // (gfTrueEndBalance, above) instead recognizes payroll's cash impact at
    // NET pay - the withheld tithe/SSS/other deductions only actually leave
    // cash later, via a separate deduction-payment record (see
    // getExpenseCashImpact()). outstandingWithholdingsAtEnd is exactly that
    // gap, carried cumulatively (not just this period's own withholding) so
    // it matches what begBal above already subtracted at the period's
    // start: gfTrueEndBalance - outstandingWithholdingsAtEnd is algebraically
    // identical to endBal (begBal + netChange + netTransferGF), so this
    // should always reconcile to zero - a genuine mismatch here (red ✗)
    // means something outside this accounting (a data issue, a
    // misclassified account, etc.) needs investigating.
    const reconcileDiff = (gfTrueEndBalance - outstandingWithholdingsAtEnd - buildingHeldAtEnd) - endBal;
    const reconcileIsClean = Math.abs(reconcileDiff) < 0.01;

    const periodObligations = obligationsData.filter(o => {
      if (getObligationBalance(o) <= 0) return false;
      if (!o.dueDate) return true;
      const dt = new Date(o.dueDate);
      return !isNaN(dt.getTime()) && dt.getFullYear() === year;
    }).sort((a, b) => String(a.dueDate || '').localeCompare(String(b.dueDate || '')));
    // Item 6: Church Obligations rendered as a compact sub-table (Obligation
    // / Due Date / Amount / Paid / Balance / Status, plus a totals row)
    // instead of a status/due-date/settlement span crammed into col-desc.
    // It's nested inside a single colspan="3"/"5" cell of the outer fs-table
    // so it fits the existing layout, and carries its own row classes
    // (obligation-header-row/-row/-totals-row) so exportToExcel() can pick
    // it apart explicitly instead of falling through to the generic
    // class-based row handling (which would otherwise read the whole nested
    // table's text as one giant cell).
    let obligationsAmountTotal = 0, obligationsPaidTotal = 0, obligationsBalanceTotal = 0;
    const obligationDataRows = periodObligations.map(o => {
      const amount = Math.max(0, parseFloat(o.amount || 0));
      const paidAmount = Math.min(amount, getObligationPaidAmount(o));
      const balanceAmount = getObligationBalance(o);
      const status = getObligationStatus(o);
      obligationsAmountTotal += amount;
      obligationsPaidTotal += paidAmount;
      obligationsBalanceTotal += balanceAmount;
      return `
        <tr class="obligation-row">
          <td>${escapeHtml(o.name || 'Church Obligation')}</td>
          <td>${o.dueDate ? escapeHtml(o.dueDate) : '—'}</td>
          <td class="ob-num">₱ ${fmt(amount)}</td>
          <td class="ob-num">₱ ${fmt(paidAmount)}</td>
          <td class="ob-num">₱ ${fmt(balanceAmount)}</td>
          <td class="ob-status">${escapeHtml(status)}</td>
        </tr>`;
    }).join('');
    const obligationsTableHtml = periodObligations.length
      ? `
      <tr class="obligation-wrapper-row">
        <td colspan="${COLSPAN}">
          <table class="obligation-table">
            <tr class="obligation-header-row">
              <td>Obligation</td>
              <td>Due Date</td>
              <td class="ob-num">Amount</td>
              <td class="ob-num">Paid</td>
              <td class="ob-num">Balance</td>
              <td class="ob-status">Status</td>
            </tr>
            ${obligationDataRows}
            <tr class="obligation-totals-row">
              <td colspan="2">Total</td>
              <td class="ob-num">₱ ${fmt(obligationsAmountTotal)}</td>
              <td class="ob-num">₱ ${fmt(obligationsPaidTotal)}</td>
              <td class="ob-num">₱ ${fmt(obligationsBalanceTotal)}</td>
              <td></td>
            </tr>
          </table>
        </td>
      </tr>`
      : '';

    // Account rows shared by the General Fund / Restricted Funds sections:
    // hides an account with an exactly-zero balance, unless every account in
    // that subset is zero (so the section is never left completely empty).
    function accountRowsFor(accounts) {
      const nonZero = accounts.filter(a => Math.abs(parseFloat(accountBalances[a.id]) || 0) >= 0.01);
      const shown = nonZero.length ? nonZero : accounts;
      return shown.map(a => {
        const balance = parseFloat(accountBalances[a.id]) || 0;
        return `
          <tr>
            <td class="col-desc indent-1">${escapeHtml(a.name)}</td>
            <td class="col-sub"></td>
            <td class="col-main ${balance < 0 ? 'amount-negative' : ''}">₱ ${fmt(balance)}</td>
            ${emptyBudgetCells}
          </tr>`;
      }).join('');
    }
    const gfAccountRows = accountRowsFor(gfAccounts);
    const restrictedAccountRows = accountRowsFor(restrictedAccounts);
    const grandTotalBalance = gfTrueEndBalance + restrictedTrueEndBalance;

    // Restricted Fund Activity: what this period's General-Fund-only
    // statement excludes must still be visible somewhere, not disappear -
    // including transfers into/out of a restricted account, so each
    // account's own Net here ties to its true balance movement for the
    // period (its Receipts In/Disbursements Out alone would miss a transfer
    // that moved money into or out of it - see the GF "Net Fund Transfers"
    // line above for the mirror-image General Fund side of the same
    // transfers).
    const restrictedActivityRows = restrictedAccounts.map(a => {
      const realInAmt = restrictedIncomeRows.filter(d => getIncomeReportAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const realOutAmt = restrictedExpenseRows.filter(d => getExpenseReportAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const transferInAmt = periodTransferIn.filter(d => getIncomeAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const transferOutAmt = periodTransferOut.filter(d => getExpenseAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const transferNet = transferInAmt - transferOutAmt;
      const inAmt = realInAmt + transferInAmt;
      const outAmt = realOutAmt + transferOutAmt;
      return { id: a.id, name: a.name, realInAmt, realOutAmt, transferNet, inAmt, outAmt, net: inAmt - outAmt };
    }).filter(row => Math.abs(row.inAmt) >= 0.01 || Math.abs(row.outAmt) >= 0.01);
    // Review mode only: the account's own name row becomes the clickable
    // line (one panel per restricted account, listing its income, expense
    // and transfer docs together) - see buildRestrictedPanelHtml(). The
    // contributing docs are collected here, additively, exactly like
    // reviewIncLineEntries/reviewExpLineEntries; nothing below changes any
    // amount. reviewMode is false on the normal page, so none of this
    // markup is emitted there.
    function restrictedReviewAttrs(row) {
      if (!reviewMode) return { attrs: '', clip: '' };
      const rk = 'rst|' + row.id;
      const entries = {
        name: row.name,
        income: restrictedIncomeRows.filter(d => getIncomeReportAccountId(d) === row.id),
        expense: restrictedExpenseRows.filter(d => getExpenseReportAccountId(d) === row.id),
        transferIn: periodTransferIn.filter(d => getIncomeAccountId(d) === row.id),
        transferOut: periodTransferOut.filter(d => getExpenseAccountId(d) === row.id)
      };
      reviewRestrictedEntries[rk] = entries;
      const n = entries.income.length + entries.expense.length + entries.transferIn.length + entries.transferOut.length;
      return {
        attrs: ` class="review-line" data-rk="${escapeAttr(rk)}" onclick="toggleReviewPanel(this)"`,
        clip: ` <span class="review-only review-clip" data-export-skip="1">📎 ${n}</span>`
      };
    }
    const restrictedActivityHtml = restrictedActivityRows.length
      ? restrictedActivityRows.map(row => { const rv = restrictedReviewAttrs(row); return `
        <tr${rv.attrs}>
          <td class="col-desc indent-1">${escapeHtml(row.name)}${rv.clip}</td>
          <td class="col-sub"></td>
          <td class="col-main"></td>
          ${emptyBudgetCells}
        </tr>
        <tr>
          <td class="col-desc indent-2">Receipts In</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(row.realInAmt)}</td>
          ${emptyBudgetCells}
        </tr>
        <tr>
          <td class="col-desc indent-2">Disbursements Out</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(row.realOutAmt)}</td>
          ${emptyBudgetCells}
        </tr>
        ${Math.abs(row.transferNet) >= 0.01 ? `
        <tr>
          <td class="col-desc indent-2">Transfers (Net)</td>
          <td class="col-sub"></td>
          <td class="col-main ${row.transferNet < 0 ? 'amount-negative' : ''}">₱ ${fmt(row.transferNet)}</td>
          ${emptyBudgetCells}
        </tr>` : ''}
        <tr class="subtotal-row">
          <td class="col-desc indent-2">Net</td>
          <td class="col-sub"></td>
          <td class="col-main ${row.net < 0 ? 'amount-negative' : ''}">₱ ${fmt(row.net)}</td>
          ${emptyBudgetCells}
        </tr>`; }).join('')
      : `<tr><td class="indent-1 col-desc" colspan="${COLSPAN}" style="color:#aaa;padding:8px 0;">No restricted fund activity this period.</td></tr>`;

    // expOrderMain / expOrderSub use the EXACT original strings from accountOrder.expense
    // so the report order always matches the budget setup exactly, with no formatting drift.
    let expOrderMain = [];   // e.g. ["Administrative Pastor", "Deaconess", ...]
    let expOrderSub  = {};   // e.g. { "Administrative Pastor": ["SSS","HDMF/Pagibig",...] }
    // catKeyToMain: maps the raw category key stored in d.category -> canonical main name
    // catKeyToSub:  maps the raw category key -> canonical sub name
    const catKeyToMain = {};
    const catKeyToSub  = {};
    // Budget keys naming the Building Fund are left out of both sides: it is
    // a separate fund with its own reporting, so its budget line must not
    // appear in (or inflate the Budget/% Used columns of) the General Fund
    // statement any more than its actuals do.
    const isBuildingFundKey = k => String(k || '').toLowerCase().includes('building fund');
    const gfExpenseKeys = (accountOrder.expense || []).filter(k => !isBuildingFundKey(k));
    const gfIncomeKeys = (accountOrder.income || []).filter(k => !isBuildingFundKey(k));
    const expAllKeys = gfExpenseKeys;
    // Helper: resolve correct main group for a key given all sibling keys
    function resolveMainGroup(k, allKeys) {
      if (!k.includes(' - ')) return k;
      const parts = k.split(' - ');
      // Try longest prefix first
      for (let i = parts.length - 1; i >= 1; i--) {
        const prefix = parts.slice(0, i).join(' - ');
        const prefixDash = prefix + ' - ';
        if (allKeys.some(other => other !== k && other.startsWith(prefixDash))) return prefix;
      }
      return parts[0];
    }
    expAllKeys.forEach(k => {
      let rawMain = resolveMainGroup(k, expAllKeys);
      let rawSub  = k.startsWith(rawMain + ' - ') ? k.slice(rawMain.length + 3).trim() : (k.includes(' - ') ? k.split(' - ').slice(1).join(' - ').trim() : '');
      // Use formatCategoryName only on the main group for consistent capitalisation of normal words;
      // preserve the sub exactly as typed in the budget setup (acronyms, slashes, etc.)
      let m = formatCategoryName(rawMain);
      let s = rawSub || k;  // standalone key (no dash) uses itself as sub label e.g. 'PCC BOP'
      if (!expOrderMain.includes(m)) expOrderMain.push(m);
      if (!expOrderSub[m]) expOrderSub[m] = [];
      if (!expOrderSub[m].includes(s)) expOrderSub[m].push(s);
      // Map the full original key -> main & sub so expense records resolve to the right bucket
      catKeyToMain[k] = m;
      catKeyToSub[k]  = s;
    });

    let incOrderMain = [];
    let incOrderSub = {};
    // incKeyToMain/incKeyToSub: same key -> canonical main/sub mapping as
    // catKeyToMain/catKeyToSub above, but for accountOrder.income, so Item 7
    // can sum each income budget key into the same main/sub buckets the
    // actuals below are grouped into.
    const incKeyToMain = {};
    const incKeyToSub = {};
    gfIncomeKeys.forEach(k => {
      let parts = k.split(' - ');
      let m = formatCategoryName(parts[0].trim());
      let s = parts.length > 1 ? formatCategoryName(parts.slice(1).join(' - ').trim()) : 'Others';
      if (!incOrderMain.includes(m)) incOrderMain.push(m);
      if (!incOrderSub[m]) incOrderSub[m] = [];
      if (!incOrderSub[m].includes(s)) incOrderSub[m].push(s);
      incKeyToMain[k] = m;
      incKeyToSub[k] = s;
    });
    // Main-category budget = sum of its subs' budgets, built directly from
    // the mapping above so a budget line always lands in the same bucket its
    // actual income would.
    const incBudgetMainTotals = {};
    const incBudgetSubTotals = {};
    gfIncomeKeys.forEach(k => {
      const main = incKeyToMain[k];
      const sub = incKeyToSub[k];
      const amt = budgetForIncomeKey(k);
      incBudgetMainTotals[main] = (incBudgetMainTotals[main] || 0) + amt;
      if (!incBudgetSubTotals[main]) incBudgetSubTotals[main] = {};
      incBudgetSubTotals[main][sub] = (incBudgetSubTotals[main][sub] || 0) + amt;
    });

    const MISC_MAIN = 'Miscellaneous (Unbudgeted)';
    // Wrapped in a function (rather than inlined against fInc directly) so
    // Item 7's monthly YTD % Used can run the exact same categorization
    // against a YTD-filtered pool (Jan through the selected month) to get a
    // YTD actual, without duplicating - and risking drifting from - this
    // classification logic. The Amount column's own actuals (fInc, this
    // period only) are completely unaffected: buildIncGroups(fInc) below is
    // the same call this code always made.
    function buildIncGroups(list) {
    const incGroups = {
      'Source of Funds': { t: 0, s: {}, sLabels: {} },
      'Occasional Offering': { t: 0, s: {}, sLabels: {} },
      [MISC_MAIN]: { t: 0, s: {}, sLabels: {} }
    };

    list.forEach(d => {
      let mainType = (d.type || '').trim();
      let budgetCat = (d.budgetCategory || d.category || '').trim();
      let details = (d.budgetDetails || d.notes || '').trim();

      let subLow = budgetCat.toLowerCase();
      let mainLow = mainType.toLowerCase();
      let checkMain = formatCategoryName(mainType);

      let finalMain = '';
      let sub = '';

      let isKnown = false;
      if (incOrderMain.length === 0) {
          isKnown = true;
      } else if (incOrderMain.includes(checkMain)) {
          isKnown = true;
      }

      if (mainType === 'Source of Funds' || subLow.includes('tithe') || subLow.includes('loose') || subLow.includes('sunday school') || mainType === 'Occasional Offering') {
          isKnown = true;
      }

      if (subLow.includes('not in') || mainLow.includes('not in') || !isKnown) {
        finalMain = MISC_MAIN;

        // Label source order: the most specific human text. A budget
        // category that says something ("Not in the budget - Youth Camp")
        // wins; the generic "Not in the budget / Miscellaneous" is skipped,
        // and so are generic words like "Source of Funds". Then budgetDetails,
        // notes, the member/payer name (unless "General Collection"), and the
        // generic income type only as the very last resort.
        const memberName = resolveMemberName(d);
        let subName = pickMiscLabel([budgetCat, d.budgetDetails, d.notes, { text: isRealPayerName(memberName) ? memberName : '' }, mainType], '');
        if (!subName) subName = 'Other Unbudgeted Income (no details recorded)';
        sub = subName;

      } else {
        if (mainType === 'Source of Funds' || subLow.includes('tithe') || subLow.includes('loose') || subLow.includes('sunday school')) {
          finalMain = 'Source of Funds';
          if (subLow.includes('tithe')) sub = 'Tithes';
          else if (subLow.includes('loose') || subLow === 'offering') sub = 'Loose Offering';
          else if (subLow.includes('sunday school')) sub = 'Sunday School';
          else sub = formatCategoryName(budgetCat);
        }
        else if (mainType === 'Occasional Offering') {
          finalMain = 'Occasional Offering';
          let cleanedSub = budgetCat;
          if (cleanedSub.toLowerCase().startsWith('occasional offering')) {
              cleanedSub = cleanedSub.replace(/occasional offering/i, '').replace(/^[\s\-]+/, '').trim();
          }
          if (!cleanedSub) cleanedSub = 'General';
          sub = formatCategoryName(cleanedSub) || 'Others';
        } else {
          finalMain = checkMain;
          sub = formatCategoryName(budgetCat) || 'Others';
        }
      }

      if (finalMain !== MISC_MAIN && (finalMain.toLowerCase() === 'miscellaneous' || finalMain.toLowerCase() === 'others')) {
          finalMain = MISC_MAIN;
          // Same label source order as above: budget category text first,
          // notes/details last.
          sub = pickMiscLabel([budgetCat, d.budgetDetails, d.notes, { text: isRealPayerName(resolveMemberName(d)) ? resolveMemberName(d) : '' }, mainType], 'Other Unbudgeted Income (no details recorded)');
      }

      // Tagged pass-through line: same amounts, own heading (see passThroughKeys).
      if (finalMain === MISC_MAIN && isPassThroughLabel('income', sub)) finalMain = PT_INC_MAIN;
      if (!incGroups[finalMain]) incGroups[finalMain] = { t: 0, s: {}, sLabels: {} };
      const group = incGroups[finalMain];
      // Miscellaneous sub-labels merge case/whitespace-insensitively so near
      // -duplicate spellings ("Meralco" vs "MERALCO") land on one line
      // instead of splitting the same income across several; budgeted mains
      // keep their exact budget wording as the key, unchanged.
      const subKey = (finalMain === MISC_MAIN || finalMain === PT_INC_MAIN) ? (normalizeGroupKey(sub) || 'other unbudgeted income') : sub;
      if ((finalMain === MISC_MAIN || finalMain === PT_INC_MAIN) && !group.sLabels[subKey]) group.sLabels[subKey] = sub;
      if (!group.s[subKey]) group.s[subKey] = { t: 0, m: {}, ids: {}, cnt: 0, entries: [] };

      let amt = parseFloat(d.amount || 0);
      let member = resolveMemberName(d);
      let mId = getMemberId(d);

      group.s[subKey].t += amt;
      group.s[subKey].cnt += 1;
      // Review mode (see report-workflow.html's Report Preview): keeps the
      // contributing income docs per display line so a click can show them
      // without changing any of the amounts above.
      group.s[subKey].entries.push(d);

      if (member.toLowerCase() !== 'general collection') {
        group.s[subKey].m[member] = (group.s[subKey].m[member] || 0) + amt;
        if (mId) group.s[subKey].ids[member] = mId;
      }
      group.t += amt;
    });
    return incGroups;
    }
    const incGroups = buildIncGroups(fInc);
    reviewIncGroups = incGroups; // review mode reads this period's entries; never affects amounts above
    // Item 7: YTD actual groups (annual: identical to incGroups, since the
    // whole year already is the YTD range).
    const ytdIncGroups = isAnnual ? incGroups : buildIncGroups(ytdIncomePool);
    function incActualForSub(groups, main, subLabel) {
      const g = groups[main];
      return (g && g.s[subLabel]) ? g.s[subLabel].t : 0;
    }

    // Pass-through collections still to be remitted: collected - remitted, cumulative through the period end (only
    // computed when something is tagged; no tags = nothing below changes).
    let ptStillToRemit = 0, ptExpInPeriod = false;
    if (passThroughKeys.size > 0) {
      const upToEnd = d => d.date && new Date(d.date) <= periodEndDate;
      const cumIn = buildIncGroups(incomeData.filter(upToEnd).filter(isGeneralFundIncome))[PT_INC_MAIN];
      const cumOut = buildExpGroups(expenseData.filter(upToEnd).filter(isGeneralFundExpense))[PT_EXP_MAIN];
      ptStillToRemit = (cumIn ? cumIn.t : 0) - (cumOut ? cumOut.total : 0);
      ptExpInPeriod = !!buildExpGroups(fExp)[PT_EXP_MAIN];
    }
    const ptStillRow = () => Math.abs(ptStillToRemit) < 0.005 ? '' : `
        <tr>
          <td class="col-desc indent-2 misc-note" colspan="${COLSPAN - 1}">Still to remit: ₱ ${fmt(ptStillToRemit)}</td>
          <td class="col-main"></td>
        </tr>`;
    let incRows = '';
    // Annual only: every Miscellaneous (Unbudgeted) line, both sides, for the
    // "Unbudgeted items to consider for next year's budget" block.
    const unbudgetedItems = [];
    const sortedIncMainKeys = Object.keys(incGroups).sort((a, b) => {
       if (a === PT_INC_MAIN) return 1;
       if (b === PT_INC_MAIN) return -1;
       if (a === MISC_MAIN) return 1;
       if (b === MISC_MAIN) return -1;
       const order = ['Source of Funds', 'Occasional Offering'];
       let idxA = order.indexOf(a);
       let idxB = order.indexOf(b);
       if (idxA !== -1 && idxB !== -1) return idxA - idxB;
       if (idxA !== -1) return -1;
       if (idxB !== -1) return 1;
       return a.localeCompare(b);
    });

    sortedIncMainKeys.forEach(main => {
      const g = incGroups[main];
      if (g.t === 0) return;

      const isMisc = main === MISC_MAIN || main === PT_INC_MAIN; // pass-through lines are labelled and shown without a budget like Miscellaneous
      incRows += `
        <tr>
          <td class="col-desc indent-1" style="font-weight:bold;">${escapeHtml(main)}</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(g.t)}</td>
          ${budgetCellsHtml(incBudgetMainTotals[main], (ytdIncGroups[main] || {}).t || 0, false, isMisc)}
        </tr>`;
      if (main === MISC_MAIN) {
        incRows += `
        <tr>
          <td class="col-desc indent-2 misc-note" colspan="${COLSPAN - 1}">Items not in the approved budget — consider adding a budget line.</td>
          <td class="col-main"></td>
        </tr>`;
      }

      if (main === PT_INC_MAIN && !ptExpInPeriod) incRows += ptStillRow();

      const sortedIncomeSubKeys = Object.keys(g.s).sort((a, b) => {
        const la = g.sLabels[a] || a, lb = g.sLabels[b] || b;
        const al = la.toLowerCase(), bl = lb.toLowerCase();
        if (al.includes('tithe') && !bl.includes('tithe')) return -1;
        if (!al.includes('tithe') && bl.includes('tithe')) return 1;
        return la.localeCompare(lb);
      });

      sortedIncomeSubKeys.forEach(subKey => {
        const subLabel = g.sLabels[subKey] || subKey;
        // Sub-category total now sits in col-main (same column as the
        // main-category total above), so it's never stacked in the same
        // column as the member-detail amounts below - see the CLAUDE.md
        // note on report-line "levelling" for why.
        let entryCountHtml = '';
        if (isMisc) {
          const miscEntries = g.s[subKey].entries;
          const miscWho = miscSingleExtra(miscEntries, subLabel, miscEntries.length === 1 ? resolveMemberName(miscEntries[0]) : '');
          entryCountHtml = ` <span class="entry-count">(${escapeHtml(miscDetailText(miscEntries, isAnnual, miscWho))})</span>`;
          if (main === MISC_MAIN) unbudgetedItems.push({ label: subLabel, who: miscWho, side: 'Income', count: miscEntries.length, months: miscWhen(miscEntries, true), total: g.s[subKey].t });
        }
        const incSundayLine = subLabel.toLowerCase().includes('loose') || subLabel.toLowerCase().includes('sunday school');
        const incEntries = g.s[subKey].entries;
        // Annual only: a line made only of payer-less entries gets a muted count/months note.
        const incGeneralOnly = isAnnual && !isMisc && incEntries.length > 0 && incEntries.every(d => !isRealPayerName(resolveMemberName(d)));
        if (incGeneralOnly) {
          const cnt = incEntries.length, when = incomeMonthsText(incEntries);
          const noun = incSundayLine ? (cnt === 1 ? 'collection' : 'collections') : (cnt === 1 ? 'entry' : 'entries');
          entryCountHtml = ` <span class="entry-count">(${escapeHtml(cnt + ' ' + noun + (when ? ' · ' + when : ''))})</span>`;
        }
        // Review mode only: makes this line clickable to show the income
        // entries behind it (see report-workflow.html's Report Preview /
        // openReviewPanel()). reviewMode is false on the normal page, so
        // this is a no-op there and the generated HTML is unchanged.
        const incLineKey = 'inc|' + main + '|' + subKey;
        if (reviewMode) reviewIncLineEntries[incLineKey] = g.s[subKey].entries;
        const incReviewAttrs = reviewMode ? ` class="review-line" data-rk="${escapeAttr(incLineKey)}" onclick="toggleReviewPanel(this)"` : '';
        const incReviewClip = reviewMode ? ` <span class="review-only review-clip" data-export-skip="1">📎 ${g.s[subKey].cnt}</span>` : '';
        incRows += `
          <tr${incReviewAttrs}>
            <td class="col-desc indent-2">${escapeHtml(subLabel)}${entryCountHtml}${incReviewClip}</td>
            <td class="col-sub"></td>
            <td class="col-main" style="font-weight:600;">₱ ${fmt(g.s[subKey].t)}</td>
            ${budgetCellsHtml(isMisc ? 0 : (incBudgetSubTotals[main] || {})[subLabel], incActualForSub(ytdIncGroups, main, subLabel), false, isMisc)}
          </tr>`;

        const incDetailRow = (label, amt) => `
              <tr>
                <td class="col-desc" style="padding-left:54px; font-size:11.5px; color:#888;">- ${escapeHtml(label)}</td>
                <td class="col-sub" style="font-size:11.5px; color:#888;">₱ ${fmt(amt)}</td>
                <td class="col-main"></td>
                ${emptyBudgetCells}
              </tr>`;
        if (!isAnnual) {
          const sortType = document.getElementById('sel-member-sort').value;
          const memberList = Object.keys(g.s[subKey].m).filter(isListedPayerName);
          const memberAmounts = g.s[subKey].m;
          const memberIds = g.s[subKey].ids || {};

          memberList.sort((a, b) => {
            switch (sortType) {
              case 'surname': {
                const getSurname = (n) => n.trim().split(' ').pop().toLowerCase();
                return getSurname(a).localeCompare(getSurname(b));
              }
              case 'id': {
                const idA = memberIds[a] || '';
                const idB = memberIds[b] || '';
                return idA.localeCompare(idB, undefined, { numeric: true });
              }
              case 'amount-desc':
                return memberAmounts[b] - memberAmounts[a];
              case 'amount-asc':
                return memberAmounts[a] - memberAmounts[b];
              case 'name':
              default:
                return a.localeCompare(b);
            }
          }).forEach(m => { incRows += incDetailRow(m, g.s[subKey].m[m]); });

          // Payer-less (General Collection etc.) entries: labelled rows after the named members.
          const generalEntries = incEntries.filter(d => !isListedPayerName(resolveMemberName(d)));
          buildGeneralIncomeRows(generalEntries, subLabel, incSundayLine, isMisc)
            .forEach(r => { incRows += incDetailRow(r.label, r.amt); });
        } else if (incGeneralOnly && !incSundayLine) {
          // Up to 8 specific-detail rows (rest under Others); Sunday lines stay count-only.
          buildAnnualGeneralRows(incEntries, subLabel).forEach(r => { incRows += incDetailRow(r.label, r.amt); });
        }
      });
    });

    // Same reasoning as buildIncGroups() above: wrapped so Item 7's monthly
    // YTD % Used can reuse this exact classification against a YTD-filtered
    // pool. buildExpGroups(fExp) below is the same call this code always
    // made, so the Amount column's own per-period actuals are unaffected.
    function buildExpGroups(list) {
    const expGroups = {};
    list.forEach(d => {  // fExp = date-filtered, General-Fund-only expenses, so totals match totalOut
      const rawVal = (d.category || '').trim();
      const rawLow = rawVal.toLowerCase();
      let main, sub;

      // ── Primary path: look up the category key directly in the budget map ──
      // catKeyToMain/catKeyToSub were built from accountOrder.expense with the
      // exact original strings, so this preserves budget order and naming perfectly.
      if (catKeyToMain[rawVal]) {
        main = catKeyToMain[rawVal];
        sub  = catKeyToSub[rawVal];
      } else {
        // ── Fallback for unbudgeted / manually-entered categories ──
        let parts = rawVal.includes(' - ') ? rawVal.split(' - ') : [rawVal];
        main = parts[0].trim() ? formatCategoryName(parts[0].trim()) : MISC_MAIN;
        sub  = parts.length > 1 ? formatCategoryName(parts.slice(1).join(' - ').trim()) : '';
        const checkMain = main.toLowerCase();
        if (rawLow.includes('not in') || checkMain === 'others' || checkMain === 'unbudgeted'
            || checkMain === 'miscellaneous' || !expOrderMain.includes(main)) {
          main = MISC_MAIN;
        }
      }

      // ── Miscellaneous (Unbudgeted): derive best available sub-label ──
      // A detail (indent-3) row only ever comes from the budget's own
      // multi-level key structure (see the "Budgeted" branch below and
      // getExpenseDisplayParts()) - free-text payee/notes never split an
      // unbudgeted line into further sub-buckets here.
      if (main === MISC_MAIN) {
        // Label source order: the most specific human text - the
        // particulars (d.sub), then notes, then payee, then the category text
        // (generic words like "Not in the budget / Miscellaneous" never
        // count as a label).
        const subName = pickMiscLabel([d.sub, d.notes, d.payee, rawVal], 'Other Unbudgeted');
        sub = subName;
      } else if (!sub || sub.toLowerCase() === 'n/a') {
        // ── Budgeted: sub comes straight from the budget's own key, never
        // from free-text d.sub/notes (previously appended here, which
        // fragmented one budget line into "Meralco", "meralco bill", etc.
        // depending on what the Treasurer happened to type that day).
        sub = 'Others';
      }

      // Tagged pass-through remittance: same amounts, own heading (see passThroughKeys).
      if (main === MISC_MAIN && isPassThroughLabel('expense', sub)) main = PT_EXP_MAIN;
      if (!expGroups[main]) expGroups[main] = { total: 0, subs: {}, subLabels: {}, subCounts: {}, subEntries: {} };
      const group = expGroups[main];
      const subKey = (main === MISC_MAIN || main === PT_EXP_MAIN) ? (normalizeGroupKey(sub) || 'other unbudgeted') : sub;
      if ((main === MISC_MAIN || main === PT_EXP_MAIN) && !group.subLabels[subKey]) group.subLabels[subKey] = sub;
      if (subKey) {
        group.subs[subKey] = (group.subs[subKey] || 0) + parseFloat(d.amount || 0);
        group.subCounts[subKey] = (group.subCounts[subKey] || 0) + 1;
        // Review mode: keeps the contributing expense docs per raw budget
        // sub-key, aggregated below (nestedSubs) to match the displayed
        // sub-category line - never affects any amount above.
        if (!group.subEntries[subKey]) group.subEntries[subKey] = [];
        group.subEntries[subKey].push(d);
      }
      group.total += parseFloat(d.amount || 0);
    });
    return expGroups;
    }
    const expGroups = buildExpGroups(fExp);
    reviewExpGroups = expGroups; // review mode reads this period's entries; never affects amounts above

    function getExpenseDisplayParts(main, sub) {
      let label = String(sub || '').trim();
      if (label.toLowerCase().startsWith(main.toLowerCase() + ' - ')) {
        label = label.slice(main.length + 3).trim();
      }
      const parts = label.split(' - ').map(p => p.trim()).filter(Boolean);
      if (main.toLowerCase() === 'utilities' && parts.length > 1 && parts.slice(1).join(' - ').toLowerCase() === 'with fee') {
        return {
          subCategory: `${parts[0]} - ${parts.slice(1).join(' - ')}`,
          detail: ''
        };
      }
      return {
        subCategory: parts[0] || label || 'Others',
        detail: parts.length > 1 ? parts.slice(1).join(' - ') : ''
      };
    }

    // Item 7: expense Budget totals, grouped by the same main/subCategory
    // buckets the actuals above use - main total is the sum of every budget
    // key mapped to it (catKeyToMain), sub-category total is the sum of
    // every budget key whose getExpenseDisplayParts() subCategory matches
    // (the same split the actuals' nestedSubs grouping uses just below).
    const expBudgetMainTotals = {};
    const expBudgetSubTotals = {};
    expAllKeys.forEach(k => {
      const main = catKeyToMain[k];
      const subFull = catKeyToSub[k];
      const parts = getExpenseDisplayParts(main, subFull);
      const amt = budgetForExpenseKey(k);
      expBudgetMainTotals[main] = (expBudgetMainTotals[main] || 0) + amt;
      if (!expBudgetSubTotals[main]) expBudgetSubTotals[main] = {};
      expBudgetSubTotals[main][parts.subCategory] = (expBudgetSubTotals[main][parts.subCategory] || 0) + amt;
    });

    // Item 7: YTD actual groups (annual: identical to expGroups). A
    // sub-category's YTD actual sums every raw budget-sub key that maps to
    // it via getExpenseDisplayParts(), same as the display-side nestedSubs
    // grouping further below.
    const ytdExpGroups = isAnnual ? expGroups : buildExpGroups(ytdExpensePool);
    function expActualForSubCategory(groups, main, subCategory) {
      const g = groups[main];
      if (!g) return 0;
      let sum = 0;
      Object.keys(g.subs).forEach(subKey => {
        const label = g.subLabels[subKey] || subKey;
        if (getExpenseDisplayParts(main, label).subCategory === subCategory) sum += g.subs[subKey];
      });
      return sum;
    }

    let expRows = '';

    const sortedExpMainKeys = Object.keys(expGroups).sort((a, b) => {
      if (a === PT_EXP_MAIN) return 1;
      if (b === PT_EXP_MAIN) return -1;
      if (a === MISC_MAIN) return 1;
      if (b === MISC_MAIN) return -1;

      let idxA = expOrderMain.indexOf(a);
      let idxB = expOrderMain.indexOf(b);

      if (idxA === -1 && idxB === -1) return a.localeCompare(b);
      if (idxA === -1) return 1;
      if (idxB === -1) return -1;
      return idxA - idxB;
    });

    sortedExpMainKeys.forEach(main => {
      const g = expGroups[main];
      const isMiscExp = main === MISC_MAIN || main === PT_EXP_MAIN; // pass-through lines: no budget, labelled like Miscellaneous
      expRows += `
        <tr>
          <td class="col-desc indent-1" style="font-weight: bold;">${escapeHtml(main)}</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(g.total)}</td>
          ${budgetCellsHtml(expBudgetMainTotals[main], (ytdExpGroups[main] || {}).total || 0, true, isMiscExp)}
        </tr>`;
      if (main === MISC_MAIN) {
        expRows += `
        <tr>
          <td class="col-desc indent-2 misc-note" colspan="${COLSPAN - 1}">Items not in the approved budget — consider adding a budget line.</td>
          <td class="col-main"></td>
        </tr>`;
      }

      if (main === PT_EXP_MAIN) expRows += ptStillRow();

      const sortedSubKeys = Object.keys(g.subs).sort((a, b) => {
        if (main === MISC_MAIN || main === PT_EXP_MAIN) {
          // No budget-defined order for unbudgeted lines - alphabetise by
          // the display label instead of the normalized grouping key.
          const la = g.subLabels[a] || a, lb = g.subLabels[b] || b;
          return la.localeCompare(lb);
        }
        // g.subs keys are exact original budget sub names, and so is expOrderSub[main].
        // Simple indexOf gives perfect budget-defined order.
        let arr = expOrderSub[main] || [];
        let idxA = arr.indexOf(a);
        let idxB = arr.indexOf(b);
        if (idxA === -1 && idxB === -1) return a.localeCompare(b);
        if (idxA === -1) return 1;
        if (idxB === -1) return -1;
        return idxA - idxB;
      });

      const nestedSubs = [];
      sortedSubKeys.forEach(subKey => {
        const subLabel = g.subLabels[subKey] || subKey;
        // A Miscellaneous label is free text and shown whole: never split at
        // " - " into a sub-category plus a detail row.
        const parts = (main === MISC_MAIN || main === PT_EXP_MAIN) ? { subCategory: subLabel, detail: '' } : getExpenseDisplayParts(main, subLabel);
        let group = nestedSubs.find(item => item.subCategory === parts.subCategory);
        if (!group) {
          group = { subCategory: parts.subCategory, total: 0, rows: [], count: 0, entries: [] };
          nestedSubs.push(group);
        }
        group.total += g.subs[subKey];
        group.count += (g.subCounts || {})[subKey] || 0;
        group.rows.push({ detail: parts.detail, amount: g.subs[subKey] });
        // Review mode: aggregate the raw budget sub-keys' entries onto the
        // displayed sub-category line - never affects any amount above.
        (g.subEntries[subKey] || []).forEach(d => group.entries.push(d));
      });

      nestedSubs.forEach(group => {
        const hasDetails = group.rows.some(row => row.detail);
        let entryCountHtml = '';
        if (isMiscExp) {
          const miscWho = miscSingleExtra(group.entries, group.subCategory, group.entries.length === 1 ? group.entries[0].payee : '');
          entryCountHtml = ` <span class="entry-count">(${escapeHtml(miscDetailText(group.entries, isAnnual, miscWho))})</span>`;
          if (main === MISC_MAIN) unbudgetedItems.push({ label: group.subCategory, who: miscWho, side: 'Expense', count: group.entries.length, months: miscWhen(group.entries, true), total: group.total });
        }
        // Review mode only: see the income-side comment above.
        const expLineKey = 'exp|' + main + '|' + group.subCategory;
        if (reviewMode) reviewExpLineEntries[expLineKey] = group.entries;
        const expReviewAttrs = reviewMode ? ` class="review-line" data-rk="${escapeAttr(expLineKey)}" onclick="toggleReviewPanel(this)"` : '';
        const expReviewClip = reviewMode ? ` <span class="review-only review-clip" data-export-skip="1">📎 ${group.entries.length}</span>` : '';
        // Sub-category total now sits in col-main - the same column as the
        // main-category total above it - so its own detail (indent-3) rows
        // below, which stay in col-sub, are never stacked in the same
        // column as a total they're already part of.
        expRows += `
          <tr${expReviewAttrs}>
            <td class="col-desc indent-2">${escapeHtml(group.subCategory)}${entryCountHtml}${expReviewClip}</td>
            <td class="col-sub"></td>
            <td class="col-main" style="font-weight:600;">₱ ${fmt(group.total)}</td>
            ${budgetCellsHtml(isMiscExp ? 0 : (expBudgetSubTotals[main] || {})[group.subCategory], expActualForSubCategory(ytdExpGroups, main, group.subCategory), true, isMiscExp)}
          </tr>`;

        if (!hasDetails) { return; }

        group.rows.forEach(row => {
          expRows += `
            <tr>
              <td class="col-desc indent-3">${escapeHtml(row.detail || 'General')}</td>
              <td class="col-sub" style="font-size:11.5px; color:#777;">₱ ${fmt(row.amount)}</td>
              <td class="col-main"></td>
              ${emptyBudgetCells}
            </tr>`;
        });
      });
    });

    // Annual only: a compact table of the unbudgeted lines above, biggest
    // first, so the Finance Committee can weigh them for next year's budget.
    // Nested in one colspan cell like the Church Obligations table; the
    // unbudgeted-*-row classes let exportToExcel() pick it apart explicitly.
    const unbudgetedBlockHtml = (isAnnual && unbudgetedItems.length)
      ? `
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>
          <tr class="section-header">
            <td colspan="${COLSPAN}">Unbudgeted items to consider for next year's budget</td>
          </tr>
          <tr class="unbudgeted-wrapper-row">
            <td colspan="${COLSPAN}">
              <table class="unbudgeted-table">
                <tr class="unbudgeted-header-row">
                  <td>Item</td>
                  <td class="ub-side">Side</td>
                  <td class="ub-num">Entries</td>
                  <td>Months</td>
                  <td class="ub-num">Total</td>
                </tr>
                ${unbudgetedItems.slice().sort((x, y) => (y.total - x.total) || x.label.localeCompare(y.label)).map(it => `
                <tr class="unbudgeted-row">
                  <td>${escapeHtml(it.label)}${it.who ? ` <span class="entry-count">(${escapeHtml(it.who)})</span>` : ''}</td>
                  <td class="ub-side">${it.side}</td>
                  <td class="ub-num">${it.count}</td>
                  <td>${escapeHtml(it.months)}</td>
                  <td class="ub-num">₱ ${fmt(it.total)}</td>
                </tr>`).join('')}
              </table>
            </td>
          </tr>`
      : '';

    const periodText = isAnnual ? `For the Year ${year}` : `For the Month of ${MONTHS[month]} ${year}`;
    const footerText = isAnnual ? `${year}` : `${MONTHS[month]} ${year}`;

    const reconcileLineHtml = Math.abs(outstandingWithholdingsAtEnd) >= 0.01
      ? `
        <tr class="reconcile-row">
          <td class="col-desc">Payroll withholdings held for remittance (cumulative)</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(outstandingWithholdingsAtEnd)}</td>
          ${emptyBudgetCells}
        </tr>`
      : '';
    const buildingHeldLineHtml = Math.abs(buildingHeldAtEnd) >= 0.01
      ? `
        <tr class="reconcile-row">
          <td class="col-desc">Building Fund money held in General Fund accounts (cumulative)</td>
          <td class="col-sub"></td>
          <td class="col-main ${buildingHeldAtEnd < 0 ? 'amount-negative' : ''}">₱ ${fmt(buildingHeldAtEnd)}</td>
          ${emptyBudgetCells}
        </tr>`
      : '';
    const reconcileNetOf = [
      Math.abs(outstandingWithholdingsAtEnd) >= 0.01 ? 'payroll withholdings held for remittance' : '',
      Math.abs(buildingHeldAtEnd) >= 0.01 ? 'Building Fund money held' : ''
    ].filter(Boolean).join(' and ');
    const reconcileCheckHtml = reconcileIsClean
      ? `<span class="reconcile-ok">✓ Matches${reconcileNetOf ? ` (net of ${reconcileNetOf})` : ''}</span>`
      : `<span class="reconcile-bad">✗ Off by ₱ ${fmt(Math.abs(reconcileDiff))}</span>`;

    // Item 7: Total Budget / % Used on the Total Cash Receipts / Total
    // Disbursements lines - the sum of every budgeted main category's own
    // budget (Miscellaneous (Unbudgeted) contributes no budget amount).
    const totalIncomeBudget = Object.keys(incBudgetMainTotals)
      .filter(m => m !== MISC_MAIN).reduce((s, m) => s + (incBudgetMainTotals[m] || 0), 0);
    const totalExpenseBudget = Object.keys(expBudgetMainTotals)
      .filter(m => m !== MISC_MAIN).reduce((s, m) => s + (expBudgetMainTotals[m] || 0), 0);
    const budgetColLabel = isAnnual ? 'Budget' : 'YTD Budget';
    const pctColLabel = isAnnual ? '% Used' : 'YTD % Used';
    const headerBudgetCells = showBudgetCols
      ? `<td class="col-budget">${budgetColLabel}</td><td class="col-pct">${pctColLabel}</td>`
      : '';

    return `
      <div class="siksik-container" id="printable-content">
        <div class="rpt-header">
          <img src="umc-logo.png" alt="UMC Logo" onerror="this.style.display='none'">
          <div class="rpt-header-text">
            <div class="rpt-church-name">Tagaytay United Methodist Church</div>
            <div class="rpt-church-address">Maglabe Drive, Asisan, Tagaytay City</div>
            <div class="rpt-title">Statement of Receipts and Disbursements</div>
            <div class="rpt-period">${periodText}</div>
          </div>
        </div>

        <table class="fs-table ${showBudgetCols ? 'has-budget' : ''}" id="export-table">
          <tr class="col-header-row">
            <td class="col-desc">Account</td>
            <td class="col-sub">Detail</td>
            <td class="col-main">Amount</td>
            ${headerBudgetCells}
          </tr>
          <tr class="bold-row">
            <td class="col-desc">Beginning Balance (General Fund)</td>
            <td class="col-sub"></td>
            <td class="col-main ${begBal<0?'amount-negative':''}">₱ ${fmt(begBal)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Receipts / Income (General Fund)</td>
          </tr>${reviewMode ? reviewMonthlyPlaceholderRowHtml(COLSPAN) : ''}
          ${incRows || `<tr><td class="indent-1 col-desc" colspan="${COLSPAN}" style="color:#aaa;padding:8px 0;">No income recorded for this period.</td></tr>`}
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Total Cash Receipts</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(totalIn)}</td>
            ${budgetCellsHtml(totalIncomeBudget, ytdTotalIn, false, false)}
          </tr>
          <tr class="bold-row">
            <td class="col-desc">Total Cash Available</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(begBal + totalIn)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Disbursements / Expenses (General Fund)</td>
          </tr>
          ${expRows || `<tr><td class="indent-1 col-desc" colspan="${COLSPAN}" style="color:#aaa;padding:8px 0;">No expenses recorded for this period.</td></tr>`}
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Total Disbursements</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(totalOut)}</td>
            ${budgetCellsHtml(totalExpenseBudget, ytdTotalOut, true, false)}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Restricted Fund Activity</td>
          </tr>
          ${restrictedActivityHtml}
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="bold-row">
            <td class="col-desc">Net Fund Transfers (into)/out of General Fund</td>
            <td class="col-sub"></td>
            <td class="col-main ${netTransferGF < 0 ? 'amount-negative' : ''}">₱ ${fmt(netTransferGF)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="total-row">
            <td class="col-desc">Ending Balance (General Fund)</td>
            <td class="col-sub"></td>
            <td class="col-main ${endBal<0?'amount-negative':'amount-positive'}">₱ ${fmt(endBal)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Surplus / Deficit Computation (General Fund)</td>
          </tr>
          <tr class="bold-row">
            <td class="col-desc">Total Income</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(totalIn)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="subtotal-row">
            <td class="col-desc">Less: Total Disbursements</td>
            <td class="col-sub">-</td>
            <td class="col-main">₱ ${fmt(totalOut)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="subtotal-row bold-row">
            <td class="col-desc">${netChange >= 0 ? 'Surplus' : 'Deficit'}</td>
            <td class="col-sub">=</td>
            <td class="col-main ${netChange < 0 ? 'amount-negative' : 'amount-positive'}">₱ ${fmt(Math.abs(netChange))}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">General Fund Accounts</td>
          </tr>
          ${gfAccountRows}
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Subtotal, General Fund</td>
            <td class="col-sub"></td>
            <td class="col-main ${gfTrueEndBalance < 0 ? 'amount-negative' : ''}">₱ ${fmt(gfTrueEndBalance)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Restricted Funds</td>
          </tr>
          ${restrictedAccountRows}
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Subtotal, Restricted Funds</td>
            <td class="col-sub"></td>
            <td class="col-main ${restrictedTrueEndBalance < 0 ? 'amount-negative' : ''}">₱ ${fmt(restrictedTrueEndBalance)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="total-row">
            <td class="col-desc">Grand Total, All Accounts</td>
            <td class="col-sub"></td>
            <td class="col-main ${grandTotalBalance < 0 ? 'amount-negative' : ''}">₱ ${fmt(grandTotalBalance)}</td>
            ${emptyBudgetCells}
          </tr>
          ${reconcileLineHtml}
          ${buildingHeldLineHtml}
          <tr class="reconcile-row">
            <td class="col-desc">General Fund accounts vs Ending Balance</td>
            <td class="col-sub"></td>
            <td class="col-main">${reconcileCheckHtml}</td>
            ${emptyBudgetCells}
          </tr>${excludedReturnNoteHtml}
          ${unbudgetedBlockHtml}
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Church Obligations</td>
          </tr>
          ${obligationsTableHtml || `<tr><td class="indent-1 col-desc" colspan="${COLSPAN}" style="color:#aaa;padding:8px 0;">No outstanding church obligations for this year.</td></tr>`}
        </table>

        <div class="sig-section">

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.chairpersonLabel)}</div>
            ${workflowSignatureHtml('chairperson', signatories.chairpersonName, signatories.chairpersonTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.financeChairLabel)}</div>
            ${workflowSignatureHtml('financeChair', signatories.financeChairName, signatories.financeChairTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.treasurerLabel)}</div>
            ${workflowSignatureHtml('treasurer', signatories.treasurerName, signatories.treasurerTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.auditorLabel)}</div>
            ${workflowSignatureHtml('auditor', signatories.auditorName, signatories.auditorTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.pastorLabel)}</div>
            ${workflowSignatureHtml('pastor', signatories.pastorName, signatories.pastorTitle)}
          </div>

        </div>

        <div class="rpt-footer">
          <span>GraceBooks — TUMC Finance System</span>
          <span>Tagaytay United Methodist Church · ${footerText}</span>
        </div>
      </div>`;
  }

  function renderMonthly() {
    const year  = parseInt(document.getElementById('sel-year').value);
    const month = parseInt(document.getElementById('sel-month').value);
    document.getElementById('report-page').innerHTML = generateReportHTML(year, month, false);
  }

  function renderAnnual() {
    const year = parseInt(document.getElementById('sel-year').value);
    document.getElementById('report-page').innerHTML = generateReportHTML(year, null, true);
  }

  function renderSpecialProject() {
    populateSpecialProjectSelector();
    const projectId = document.getElementById('sel-special-project').value;
    const project = specialProjects.find(p => p.id === projectId && p.printReportPublished);
    document.getElementById('report-page').innerHTML = project
      ? generateSpecialProjectReportHTML(project)
      : `<div style="text-align:center; padding:60px; color:#777;">
          <div style="font-weight:700; color:var(--red); margin-bottom:8px;">No Special Project Selected</div>
          <div>Push a project from the Special Projects page first, then select it here.</div>
        </div>`;
  }

  function projectCostTotal(projectId) {
    return specialProjectCosts
      .filter(c => c.projectId === projectId)
      .reduce((sum, c) => sum + Number(c.amount || 0), 0);
  }

  function projectFundingTotal(projectId) {
    // Gross receipts (type 'Receipt') are money the fund raising activity
    // itself collected, not a funding source paying for the project's
    // cost, so they're excluded here just like in special-projects.html.
    return specialProjectEntries
      .filter(e => e.projectId === projectId && e.type !== 'Receipt')
      .reduce((sum, e) => sum + Number(e.amount || 0), 0);
  }

  function projectGrossReceiptsTotal(projectId) {
    return specialProjectEntries
      .filter(e => e.projectId === projectId && e.type === 'Receipt')
      .reduce((sum, e) => sum + Number(e.amount || 0), 0);
  }

  function projectExpensesIncurredTotal(projectId) {
    return allExpenseData
      .filter(e => e.specialProjectId === projectId && e.type !== 'transfer')
      .reduce((sum, e) => sum + Number(e.amount || 0), 0);
  }

  function groupRows(rows, keyFn) {
    return rows.reduce((acc, row) => {
      const key = keyFn(row) || 'Uncategorized';
      if (!acc[key]) acc[key] = [];
      acc[key].push(row);
      return acc;
    }, {});
  }

  function generateSpecialProjectReportHTML(project) {
    const projectCosts = specialProjectCosts.filter(c => c.projectId === project.id);
    const projectEntries = specialProjectEntries.filter(e => e.projectId === project.id && e.type !== 'Receipt');
    // Mirrors special-projects.html's proceedsEnabled(): 'Fund Raising' always
    // tallies proceeds, 'Activity Contribution' only when the Treasurer opted in.
    const isActivityContribution = project.projectType === 'Activity Contribution';
    const showsProceeds = project.projectType === 'Fund Raising'
      || (isActivityContribution && project.postProceedsToGeneralFund === true);
    const grossLabel = isActivityContribution ? 'Contributions Collected' : 'Gross Receipts';
    const proceedsHeading = isActivityContribution ? 'Activity Contribution Results' : 'Fund Raising Results';
    const grossReceipts = showsProceeds ? projectGrossReceiptsTotal(project.id) : 0;
    const expensesIncurred = showsProceeds ? projectExpensesIncurredTotal(project.id) : 0;
    const netProceeds = grossReceipts - expensesIncurred;
    const costTotal = projectCostTotal(project.id);
    const fundingTotal = projectFundingTotal(project.id);
    const remainingNeed = Math.max(0, costTotal - fundingTotal);
    const surplus = Math.max(0, fundingTotal - costTotal);
    const isClosed = project.status === 'Closed';
    const closedDateStr = isClosed && project.finishedAt
      ? new Date(project.finishedAt).toLocaleDateString('en-PH') : '';
    const fundingPct = costTotal > 0 ? Math.min(100, Math.round(fundingTotal / costTotal * 100)) : null;

    const actualCostTotal = projectCosts.filter(c => c.basis === 'Actual').reduce((s, c) => s + Number(c.amount || 0), 0);
    const estimatedCostTotal = projectCosts.filter(c => c.basis !== 'Actual').reduce((s, c) => s + Number(c.amount || 0), 0);
    const hasMixedBasis = actualCostTotal > 0 && estimatedCostTotal > 0;

    const costGroups = groupRows(projectCosts, c => c.mainCategory);
    const costRows = Object.keys(costGroups).sort().map(main => {
      const rows = costGroups[main];
      const total = rows.reduce((sum, r) => sum + Number(r.amount || 0), 0);
      return `
        <tr>
          <td class="col-desc indent-1" style="font-weight:bold;">${escapeHtml(main)}</td>
