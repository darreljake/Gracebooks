<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#8B0000"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>GraceBooks — Financial Reports</title>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="auth.js"></script>
<script>requireGraceBooksAuth();
try { if (window.self !== window.top && /[?&]review=1/.test(location.search)) document.documentElement.classList.add('embedded-review'); } catch (e) { document.documentElement.classList.add('embedded-review'); }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="receipt-annotator.js"></script>

  <style>
    :root {
      --red:      #8B0000;
      --red-mid:  #c0392b;
      --red-light:#fdf2f2;
      --gold:     #c9a84c;
      --dark:     #1a1a1a;
      --gray:     #555;
      --line:     #ccc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f2f5;
      color: var(--dark);
      min-height: 100vh;
    }

    /* ── TOPBAR ─────────────────────────────────────────────── */
    .topbar {
      background: var(--red);
      color: white;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.25);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { height: 46px; }
    .brand-text { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .brand-sub  { font-size: 11px; opacity: 0.75; letter-spacing: 0.5px; }

    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action {
      padding: 8px 14px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      color: white; transition: 0.2s; font-family: 'Poppins', sans-serif;
    }
    .btn-action:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-back   { background: rgba(255,255,255,0.15); }
    .btn-excel  { background: #1e8449; }
    .btn-print  { background: #1a5276; }
    .btn-fullscreen { background: #5a2a7a; }

    /* ── CONTROLS ───────────────────────────────────────────── */
    .controls-bar {
      background: white;
      padding: 16px 28px;
      display: flex; gap: 14px; flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .controls-bar label { font-size: 12px; font-weight: 600; color: var(--gray); }
    .controls-bar select {
      padding: 8px 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 13px; background: white;
      font-family: 'Poppins', sans-serif;
    }
    .controls-bar select:focus { outline: none; border-color: var(--red); }
    .report-type-tabs {
      display: flex; gap: 6px;
    }
    .rtype-btn {
      padding: 7px 16px; border: 2px solid #ddd;
      border-radius: 20px; background: white;
      font-size: 12px; font-weight: 600; cursor: pointer;
      color: var(--gray); transition: 0.2s;
      font-family: 'Poppins', sans-serif;
    }
    .rtype-btn.active {
      background: var(--red); color: white; border-color: var(--red);
    }

    /* ── MODAL STYLES (For Signatories) ─────────────────────── */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; padding:30px; border-radius:12px; width:600px; max-width:95%; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
    .modal-header { font-size:18px; font-weight:700; margin-bottom:5px; border-bottom:1px solid #ddd; padding-bottom:10px; color:var(--dark); }
    .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .btn-cancel { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600; background:#eee; color:#333; }
    .btn-save { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600; background:var(--red); color:white; }
    
    .sig-header-label { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 8px; margin-top: 15px; border-bottom: 1px solid #eee; padding-bottom: 3px; }
    .sig-grid { display: grid; grid-template-columns: 1fr 1.5fr 1.5fr; gap: 10px; margin-bottom: 10px; }
    .sig-grid label { font-size: 11px; color: var(--gray); font-weight: 600; margin-bottom: 3px; display: block; }
    .sig-grid input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 13px; }

    /* ── REPORT WRAPPER ─────────────────────────────────────── */
    .report-wrapper {
      max-width: 860px;
      margin: 28px auto;
      padding: 0 20px 60px;
    }

    /* ── REPORT PAGE (Printable) ────────────────────────────── */
    .report-page {
      background: white;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 48px 56px;
      position: relative;
    }
    .report-page::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: linear-gradient(to bottom, var(--red), var(--red-mid));
    }

    .fullscreen-toolbar {
      display: none;
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 2000;
      gap: 8px;
      align-items: center;
      background: rgba(26,26,26,0.9);
      color: white;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    .fs-tool-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.14);
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    .fs-tool-btn:hover { background: rgba(255,255,255,0.24); }
    .fs-zoom-label {
      min-width: 52px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }
    body.report-fullscreen {
      overflow: auto;
      background: #1a1a1a;
    }
    body.report-fullscreen .topbar,
    body.report-fullscreen .controls-bar {
      display: none;
    }
    body.report-fullscreen .fullscreen-toolbar {
      display: flex;
    }
    body.report-fullscreen .report-wrapper {
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 56px 24px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
    }
    body.report-fullscreen .report-page {
      transform: scale(var(--report-zoom, 1));
      transform-origin: top center;
      margin-bottom: 40px;
    }

    /* ── REPORT HEADER ──────────────────────────────────────── */
    .rpt-header {
      display: flex;
      align-items: center; 
      gap: 20px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--red);
    }
    .rpt-header img { height: 70px; }
    .rpt-header-text { flex: 1; text-align: center; }
    .rpt-church-name {
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--red);
    }
    .rpt-church-address { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .rpt-title { font-size: 14px; font-weight: 700; color: var(--dark); text-transform: uppercase; margin-top: 10px; }
    .rpt-period { font-size: 12px; color: var(--gray); margin-top: 2px; }

    /* ── SIKSIK LAYOUT CONTAINER ────────────────────────────── */
    .siksik-container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* ── FINANCIAL STATEMENT TABLE ──────────────── */
    .fs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .fs-table td {
      padding: 2.5px 4px;
      vertical-align: top;
      line-height: 1.5;
    }
    .col-desc { width: 60%; color: #111; }
    .col-sub  { width: 20%; text-align: right; padding-right: 12px; color: var(--gray); }
    .col-main { width: 20%; text-align: right; font-weight: 600; }
    .indent-1 { padding-left: 18px !important; font-weight: 600; }
    .indent-2 { padding-left: 36px !important; color: #111; font-size: 12px; }
    .indent-3 { padding-left: 54px !important; color: #222; font-size: 11.5px; }

    /* Budget / % Used columns (Item 7) - only emitted when the "Show budget
       columns" toggle is on, so widths only need to account for the 5-column
       layout; the 3-column layout keeps col-desc/col-sub/col-main at 60/20/20
       as above. */
    .fs-table.has-budget .col-desc { width: 40%; }
    .fs-table.has-budget .col-sub  { width: 14%; }
    .fs-table.has-budget .col-main { width: 16%; }
    .col-budget, .col-pct { width: 15%; text-align: right; padding-right: 8px; font-size: 11px; color: var(--gray); }
    .fs-table.has-budget .col-budget, .fs-table.has-budget .col-pct { font-size: 11px; }
    .pct-over  { color: var(--red-mid); font-weight: 700; }
    .pct-under { color: #b8860b; font-weight: 700; }

    /* Miscellaneous (Unbudgeted) helper note + entry counts */
    .misc-note { color: #888; font-size: 10.5px; font-style: italic; }
    .entry-count { color: #999; font-size: 10px; font-weight: 400; }

    /* Church Obligations compact sub-table (Item 6) */
    .obligation-table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 2px 0 4px; }
    .obligation-table td { padding: 3px 5px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .obligation-table .obligation-header-row td {
      font-weight: 700; font-size: 10px; text-transform: uppercase; color: var(--red);
      border-bottom: 1px solid var(--red); padding-top: 4px !important; padding-bottom: 4px !important;
    }
    .obligation-table .obligation-totals-row td {
      font-weight: 700; border-top: 1px solid var(--dark); border-bottom: none;
    }
    .obligation-table td.ob-num { text-align: right; }
    .obligation-table td.ob-status { text-align: center; white-space: nowrap; }

    .section-header td {
      font-weight: 700;
      font-size: 12.5px;
      text-transform: uppercase;
      padding-top: 14px !important;
      padding-bottom: 4px !important;
      color: var(--red);
      border-bottom: 1px solid var(--red);
    }

    .bold-row td { font-weight: 700; }
    .subtotal-row td { font-weight: 700; border-top: 1px solid var(--line); padding-top: 4px !important; }
    .total-row td {
      font-weight: 700; font-size: 13px; border-top: 2px solid var(--dark);
      border-bottom: 3px double var(--dark); padding-top: 5px !important; padding-bottom: 5px !important; color: var(--dark);
    }
    .spacer-row td { padding: 5px 0 !important; }

    .amount-positive { color: #1e8449; }
    .amount-negative { color: var(--red-mid); }

    /* Column header row (Account / Detail / Amount) - styled like the
       section headers above, but with three separate cells instead of one
       colspan title, so it needs its own class (kept distinct from
       .section-header so exportToExcel's className-based row detection
       doesn't merge it into a single-cell section title). */
    .col-header-row td {
      font-weight: 700; font-size: 10.5px; text-transform: uppercase;
      letter-spacing: 0.4px; padding-top: 6px !important; padding-bottom: 6px !important;
      color: var(--red); border-bottom: 1px solid var(--red);
    }
    .col-header-row .col-sub, .col-header-row .col-main { font-weight: 700; }

    /* Reconciliation line (General Fund accounts vs Ending Balance). */
    .reconcile-row td { padding-top: 6px !important; font-size: 11.5px; }
    .reconcile-ok { color: #1e8449; font-weight: 700; }
    .reconcile-bad { color: var(--red-mid); font-weight: 700; }

    /* ── SIGNATURES ──────────────────────────────────────────── */
    .sig-section { margin-top: 60px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .sig-box { text-align: center; flex: 1 1 145px; max-width: 180px; }
    .workflow-sig-space { height: 48px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 3px; }
    .workflow-sig-img { max-width: 155px; max-height: 46px; object-fit: contain; display: block; filter: brightness(0); }
    .workflow-sig-line { border-top: 1px solid var(--dark); margin-bottom: 2px; }
    .workflow-sig-unavailable { font-size: 9px; color: #777; padding-bottom: 5px; }
    
    /* ── FOOTER ──────────────────────────────────────────────── */
    .rpt-footer {
      margin-top: 32px; padding-top: 12px; border-top: 1px solid #eee;
      display: flex; justify-content: space-between; font-size: 10px; color: #aaa;
    }

    /* ── PRINT STYLES ───────────────────────────────────────── */

    /* Default: Long Bond 8.5 x 13 */
    @page { size: 8.5in 13in; margin: 0.6in 0.65in; }

    /* Letter 8.5 x 11 — activated when <body> has class 'paper-letter' */
    body.paper-letter { --paper: letter; }
    @media print {
      body.paper-letter { }
    }
    /* Swap @page size via a dedicated stylesheet injected by JS */

    @media print {
      .topbar, .controls-bar, .fullscreen-toolbar, .no-print, .review-only { display: none !important; }
      body { background: white; }
      .report-wrapper { margin: 0; padding: 0; max-width: 100%; }
      .report-page { box-shadow: none; border-radius: 0; padding: 0; margin: 0; }
      .report-page::before { display: none; }
      .siksik-container { max-width: 100% !important; }

      /* ── Page-break rules ── */
      /* Never break immediately after a section header or bold category row */
      .section-header   { break-after: avoid; page-break-after: avoid; }
      .bold-row         { break-after: avoid; page-break-after: avoid; }
      /* Never orphan a sub-row from its parent category */
      .fs-table tr      { break-inside: avoid; page-break-inside: avoid; }
      /* Keep signature block together on one page */
      .sig-section      { break-inside: avoid; page-break-inside: avoid;
                          break-before: auto; page-break-before: auto; }
      .rpt-footer       { break-inside: avoid; page-break-inside: avoid; }
      .obligation-table { break-inside: avoid; page-break-inside: avoid; }

      /* ── Font scaling per paper size ── */
      /* Long bond — default, comfortable */
      body:not(.paper-letter) .fs-table       { font-size: 12.5px; }
      body:not(.paper-letter) .fs-table td    { padding: 2.5px 4px; }
      /* Letter — slightly tighter to fit more per page */
      body.paper-letter .fs-table             { font-size: 11.5px; }
      body.paper-letter .fs-table td          { padding: 1.5px 4px; }
      body.paper-letter .spacer-row td        { padding: 3px 0 !important; }
      body.paper-letter .section-header td    { padding-top: 10px !important; }
      /* A4 — similar to letter, slightly adjusted */
      body.paper-a4 .fs-table                 { font-size: 11.5px; }
      body.paper-a4 .fs-table td              { padding: 2px 4px; }
      body.paper-a4 .spacer-row td            { padding: 3px 0 !important; }
      body.paper-a4 .section-header td        { padding-top: 11px !important; }

      /* Budget columns make each row wider - shrink a little further so the
         5-column layout still fits comfortably on one printed line. */
      .fs-table.has-budget            { font-size: 11px; }
      .fs-table.has-budget .col-budget,
      .fs-table.has-budget .col-pct   { font-size: 10px; }
      .obligation-table                { font-size: 10px; }
    }

    /* ── PHONE LAYOUT (screen only - print output is untouched) ───────────
       At <=600px the topbar is a compact, non-sticky, full-width bar whose
       buttons scroll horizontally in one row, and the report "paper" is
       auto-fitted to the screen: fitReportToScreen() measures the table's
       natural width and publishes --fit-width / --fit-zoom, which only this
       screen rule consumes (so printing from a phone stays at full size). */
    @media screen {
      /* Amounts never wrap; give the 5-column (budget) layout a little more
         room on screen so the description column doesn't pay for it. Print
         keeps its own max-width:100% rule. */
      .siksik-container:has(.fs-table.has-budget) { max-width: 640px; }
      .col-sub, .col-main, .col-budget, .col-pct,
      .obligation-table td.ob-num, .rpeso { white-space: nowrap; }
    }
    @media screen and (max-width: 600px) {
      .topbar { position: static; flex-wrap: wrap; padding: 8px 12px; gap: 6px 10px; }
      .brand { gap: 10px; }
      .brand img { height: 32px; width: auto; flex: 0 0 auto; }
      .brand-text { font-size: 17px; }
      .brand-sub { display: none; }
      .top-actions { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
      .top-actions > * { flex: 0 0 auto; }
      .btn-action { padding: 7px 11px; white-space: nowrap; }
      .controls-bar { padding: 10px 12px; gap: 10px; }
      .report-type-tabs { flex-wrap: wrap; }
      .report-wrapper { margin: 10px auto 0; padding: 0 6px 40px; }
      /* Embedded as report-workflow's Report Preview (iframe + review=1): the
         parent already owns period/type selection and offers "Open full
         screen", so on a phone the iframe shows just the statement instead
         of spending most of its small height on toolbars. */
      html.embedded-review .topbar, html.embedded-review .controls-bar { display: none; }
      body:not(.report-fullscreen) .report-page {
        padding: 22px 14px 22px 20px;
        width: var(--fit-width, auto);
        zoom: var(--fit-zoom, 1);
      }
    }

    /* ── REVIEW MODE (report-workflow.html embedded preview) ─────────────── */
    .review-banner {
      background: #fff7e0; border: 1px solid #e6c65c; color: #6b5a12;
      padding: 10px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
      margin: 0 0 12px; display: flex; align-items: center; gap: 8px;
    }
    tr.review-line { cursor: pointer; }
    tr.review-line:hover td { background: #fdf6e3; }
    .review-clip {
      display: inline-flex; align-items: center; gap: 3px; margin-left: 8px;
      font-size: 11px; font-weight: 600; color: #8a6d00; background: #fdf0c4;
      border-radius: 10px; padding: 1px 7px; vertical-align: middle;
    }
    .review-panel-row td { background: #fbfaf5; padding: 0 !important; }
    .review-panel { padding: 10px 14px 14px 30px; font-size: 12px; color: #333; }
    .review-panel-loading { color: #888; font-style: italic; padding: 8px 0; }
    .review-entry {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px dashed #ddd;
    }
    .review-entry:last-child { border-bottom: none; }
    .review-entry-main { flex: 1 1 260px; min-width: 0; }
    .review-entry-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .review-date-group { margin-bottom: 10px; }
    .review-date-head {
      font-weight: 700; font-size: 12px; display: flex; align-items: center;
      gap: 8px; flex-wrap: wrap; margin-bottom: 3px;
    }
    .rbtn {
      border: none; border-radius: 5px; padding: 4px 9px; font-size: 11px;
      font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif;
    }
    .rbtn-view   { background: #1a5276; color: #fff; }
    .rbtn-upload { background: #1e8449; color: #fff; }
    .rbtn-voucher{ background: #7a4a1e; color: #fff; }
    .rbtn-refresh{ background: #888; color: #fff; }
    .review-sub-head { font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--red); margin: 8px 0 2px; }
    .rbadge { font-size: 10.5px; font-weight: 700; border-radius: 9px; padding: 2px 8px; }
    .rbadge-missing { background: #fbeaea; color: #b03a2e; }
    .rbadge-awaiting { background: #fdf3d9; color: #8a6d00; }
    .rbadge-mismatch { background: #fbeaea; color: #b03a2e; }
    .rbadge-ok { background: #eafaf1; color: #1e8449; }
  </style>
</head>
<body>
<div class="topbar no-print">
  <div class="brand">
    <img src="umc-logo.png" alt="UMC Logo" onerror="this.style.display='none'">
    <div>
      <div class="brand-text">GraceBooks</div>
      <div class="brand-sub">TUMC Finance System</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn-action btn-excel" onclick="exportToExcel()">
      <i class="fas fa-file-excel"></i> Export Excel
    </button>
    <select id="paper-size-sel" onchange="setPaperSize(this.value)"
      style="padding:7px 10px; border:none; border-radius:6px; font-size:12px;
             font-weight:600; font-family:'Poppins',sans-serif; background:rgba(255,255,255,0.18);
             color:white; cursor:pointer; outline:none;">
      <option value="long" style="color:#333;">📄 Long Bond (8.5×13)</option>
      <option value="letter" style="color:#333;">📄 Letter (8.5×11)</option>
      <option value="a4" style="color:#333;">📄 A4 (8.27×11.7)</option>
    </select>
    <button class="btn-action btn-print" onclick="window.print()">
      <i class="fas fa-print"></i> Print
    </button>
    <button class="btn-action btn-fullscreen" onclick="openReportFullscreen()">

<script>
  // ── FIREBASE CONFIGURATION ────────────────────────────────────────────────
  const firebaseConfig = {

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Special Project spending only belongs in the church's regular reports when the
  // money actually left the General Fund - Cash on Hand or Cash in Bank. Project
  // costs paid out of the Building/Mission/Petty Cash/Investment funds, or out of
  // the pledges and donations raised for the project itself, are accounted for in
  // the project ledger on special-projects.html and must not be double-reported as
  // church expenses here. Legacy rows stored a payment mode instead of an account
  // id, so both shapes are recognised; a blank account falls back to Cash on Hand
  // the same way the cash-balance code does.
  const GENERAL_FUND_EXPENSE_ACCOUNTS = ['cash-hand', 'cash-bank', 'cash', 'cash on hand', 'cash in bank', 'bank transfer', 'bank'];
  function isReportableSpecialProjectExpense(d) {
    if (!d || !d.isSpecialProject) return true;
    const account = (d.targetAccId || d.payment || 'cash-hand').toString().trim().toLowerCase();
    return GENERAL_FUND_EXPENSE_ACCOUNTS.includes(account);
  }

  let incomeData   = [];
  let expenseData  = [];
  let allIncomeData = [];
  let allExpenseData = [];
  let obligationsData = [];
  // Item 7 (Budget / % Used columns): budgets/{year} is loaded once per year
  // with a one-time .get() and cached here (keyed by year), reloaded only
  // when the selected year changes. A missing doc caches as null ("no
  // budget"), not undefined, so it's never re-fetched needlessly.
  let budgetsCache = {};
  let currentBudgets = null;
  let showBudgetCols = true;
  async function ensureBudgetsForYear(year) {
    if (Object.prototype.hasOwnProperty.call(budgetsCache, year)) return budgetsCache[year];
    try {
      const doc = await db.collection('budgets').doc(String(year)).get();
      budgetsCache[year] = doc.exists ? doc.data() : null;
    } catch (err) {
      console.warn('Unable to load budget for year', year, err);
      budgetsCache[year] = null;
    }
    return budgetsCache[year];
  }
  function toggleBudgetCols(checked) {
    showBudgetCols = checked;
    render();
  }
  // Scheduling helpers mirrored from budget-vs-actual.html (no shared JS
  // modules in this repo - see CLAUDE.md), operating on a passed-in budgets
  // doc rather than a page-level global.
  function getScheduleMonths(sched) {
    if (!sched) return [];
    if (Array.isArray(sched.months) && sched.months.length) {
      return [...new Set(sched.months.map(m => parseInt(m)).filter(m => Number.isInteger(m) && m >= 0 && m <= 11))].sort((a,b)=>a-b);
    }
    if (Number.isInteger(sched.month)) return [sched.month];
    return [];
  }
  function isRecurringExpense(key, budgetsObj) {
    const sched = (budgetsObj.expenseSchedule || {})[key];
    return !sched || sched.recurring !== false;
  }
  function expenseBudgetForMonth(key, month, budgetsObj) {
    const ann = (budgetsObj.expense || {})[key] || 0;
    if (isRecurringExpense(key, budgetsObj)) return ann / 12;
    const months = getScheduleMonths((budgetsObj.expenseSchedule || {})[key]);
    if (!months.length) return 0;
    return months.includes(month) ? ann / months.length : 0;
  }
  function isRecurringIncome(key, budgetsObj) {
    const sched = (budgetsObj.incomeSchedule || {})[key];
    return !sched || sched.recurring !== false;
  }
  function incomeBudgetForMonth(key, month, budgetsObj) {
    const ann = (budgetsObj.income || {})[key] || 0;
    if (isRecurringIncome(key, budgetsObj)) return ann / 12;
    const months = getScheduleMonths((budgetsObj.incomeSchedule || {})[key]);
    if (!months.length) return 0;
    return months.includes(month) ? ann / months.length : 0;
  }
  let specialProjects = [];
  let specialProjectEntries = [];
  let specialProjectCosts = [];
  let memberNameById = {};
  let memberNameByLegacyKey = {};
  let accountOrder = { income: [], expense: [] }; 
  let reportType   = 'monthly';

  let beginningAccounts = {};
  let generalFundAccounts = {};
  let reportZoom = 1;
  let workflowSignatures = {};

  // ── Review mode (embedded in report-workflow.html's Report Preview card,
  // or opened full screen from there) ────────────────────────────────────

  let initialReviewRequested = false;
  let reviewMode = false;
  let reviewGateChecked = false;
  let currentWorkflowStatus = '';
  let reviewIncGroups = null; // set by buildIncGroups(fInc) each render; entries kept per sub-line
  let reviewExpGroups = null; // set by buildExpGroups(fExp) each render; entries kept per sub-line
  let reviewIncLineEntries = {}; // 'inc|main|subKey' -> income docs for that displayed line
  let reviewExpLineEntries = {}; // 'exp|main|subCategory' -> expense docs for that displayed line
  let reviewRestrictedEntries = {}; // 'rst|accountId' -> {name, income, expense, transferIn, transferOut} for that restricted account
  let reviewLiquidationMap = new Map();
  let reviewCountSheetMap = new Map();
  let reviewDataLoadedForPeriod = '';
  let reviewOpenPanelKeys = new Set();
  let currentRole = (function () {
    try { return sessionStorage.getItem('role') || ''; } catch (e) { return ''; }
  })();
  const FINANCIAL_ACCOUNTS = [
    { id:'cash-hand',  name:'Cash on Hand' },
    { id:'cash-bank',  name:'Cash in Bank' },
    { id:'petty-cash', name:'Petty Cash Fund' },
    { id:'building',   name:'Building Fund' },
    { id:'mission',    name:'Mission Fund' },
    { id:'investment', name:'Investments/TD' }
  ];
  
  // Default Signatories Variables (Nakalagay na ang Label, Name, at Title)
  let signatories = {
    chairpersonLabel: "Approved by",
    chairpersonName: "",
    chairpersonTitle: "Church Council Chairperson",

    financeChairLabel: "Approved by",
    financeChairName: "",
    financeChairTitle: "Finance Chair",

  };

  function syncSignatoryInputs() {

    document.getElementById('sig-pastor-name').value = signatories.pastorName;
    document.getElementById('sig-pastor-title').value = signatories.pastorTitle;
  }

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const SPECIAL_PROJECT_SOURCE_LABELS = {
    'Church Fund': 'Church Funds',
    'Pledge': 'Pledges',
    'Direct Contribution': 'Direct Contributions'
  };

  function fmt(num) {
    return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatCategoryName(str) {
    if (!str) return '';
    str = String(str).trim();
    if (!str) return '';
    // Preserve words that are all-uppercase (acronyms like SSS, HDMF, BIR, VAT, etc.)
    return str.split(' ').map(word => {
      if (!word) return word;
      // If the word (ignoring slashes and digits) is all uppercase letters, preserve it
      const letters = word.replace(/[^a-zA-Z]/g, '');
      if (letters.length > 0 && letters === letters.toUpperCase()) return word;
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }).join(' ');
  }

  function getMemberId(d) {
    return (d.memberId || d.memberID || d.memberCode || '').toString().trim();
  }

  // Case/whitespace-insensitive key for merging near-duplicate Miscellaneous
  // (Unbudgeted) sub-labels - e.g. "Meralco" and "MERALCO" - into a single
  // report line instead of one line per spelling variant. Used only for
  // grouping; the *displayed* label is still whichever formatCategoryName()
  // form was seen first for that key, so acronyms in the original text
  // survive rather than being re-derived from a lowercased key.
  function normalizeGroupKey(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  }

  // Adds `amt` to a Miscellaneous-style group keyed by the case/whitespace
  // -insensitive form of `label`, recording the first-seen label as the
  // group's display text. `bucket.totals` maps normalized key -> amount,
  // `bucket.labels` maps normalized key -> display label.
  function addToMiscBucket(bucket, label, amt) {
    const key = normalizeGroupKey(label) || 'other unbudgeted';
    if (!bucket.labels[key]) bucket.labels[key] = label || 'Other Unbudgeted';
    bucket.totals[key] = (bucket.totals[key] || 0) + amt;
    return key;
  }

  function resolveMemberName(d) {
    const memberId = getMemberId(d);
    if (memberId && memberNameById[memberId]) return memberNameById[memberId];
    const rawName = (d.member || d.name || d.Member || '').trim();
    const legacyName = memberNameByLegacyKey[normalizeMemberLookupName(rawName)];
    if (legacyName && legacyName !== '__AMBIGUOUS__') return legacyName;
    return rawName || 'General Collection';
  }

  function formatMemberName(d) {
    const last = d.last || d.lastName || '';
    const first = d.first || d.firstName || '';
    return `${last}, ${first}`.replace(/^,\s*|\s*,\s*$/g, '').trim();
  }

  function normalizeMemberLookupName(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function addMemberNameAlias(rawName, currentName) {
    const key = normalizeMemberLookupName(rawName);
    if (!key || !currentName) return;
    if (memberNameByLegacyKey[key] && memberNameByLegacyKey[key] !== currentName) {
      memberNameByLegacyKey[key] = '__AMBIGUOUS__';
      return;
    }
    memberNameByLegacyKey[key] = currentName;
  }

  function addMemberNameAliases(d, currentName) {
    const last = (d.last || d.lastName || '').toString().trim();
    const first = (d.first || d.firstName || '').toString().trim();
    const firstToken = first.split(/\s+/).filter(Boolean)[0] || '';

    addMemberNameAlias(currentName, currentName);
    addMemberNameAlias(`${last}, ${first}`, currentName);
    addMemberNameAlias(`${first} ${last}`, currentName);
    addMemberNameAlias(`${last} ${first}`, currentName);
    if (firstToken && firstToken !== first) {
      addMemberNameAlias(`${firstToken} ${last}`, currentName);
      addMemberNameAlias(`${last}, ${firstToken}`, currentName);
      addMemberNameAlias(`${last} ${firstToken}`, currentName);
    }
  }

  // Populate UI dates
  const now = new Date();
  const yrSel = document.getElementById('sel-year');
  const initialReportParams = new URLSearchParams(window.location.search);
  initialReviewRequested = initialReportParams.get('review') === '1';
  document.getElementById('sel-month').value = now.getMonth();

  // ── KUNIN ANG AVAILABLE YEARS SA CLOUD (SYNCED SA BVA) ──
  db.collection("settings").doc("yearsConfig").get().then(doc => {
    let availableYears = [2024, 2025, 2026]; // Default fallback
    if(doc.exists && doc.data().list) {
      availableYears = doc.data().list;
    }
    
    const currentVal = yrSel.value;
    yrSel.innerHTML = "";
    // I-sort para laging nasa itaas ang pinakabagong taon

      yrSel.innerHTML += `<option value="${y}">${y}</option>`; 
    });
    
    // Panatilihin ang napiling taon, o gamitin ang current year
    yrSel.value = currentVal || now.getFullYear();
    applyInitialReportParams();
    render(); 
  });

  // Load Data
  db.collection('settings').doc('accountStructure').get().then(s => {

  });

  // Listener para sa Beginning Balance

    if (s.exists) {

      generalFundAccounts = data.generalFundAccounts || {};

    }
    render();
  });

  // Listener para sa Signatories Settings
  db.collection('settings').doc('signatories').get().then(s => {
    if (s.exists) { 
      const data = s.data();

      signatories.chairpersonLabel = data.chairpersonLabel || "Approved by";
      signatories.chairpersonName = data.chairpersonName || "";

      signatories.financeChairTitle = data.financeChairTitle || "Finance Chair";
      
      signatories.treasurerLabel = data.treasurerLabel || "Prepared by";
      signatories.treasurerName = data.treasurerName || "";
      signatories.treasurerTitle = data.treasurerTitle || "Church Treasurer";
      
      signatories.pastorLabel = data.pastorLabel || "Noted by";
      signatories.pastorName = data.pastorName || "";
      signatories.pastorTitle = data.pastorTitle || "Church Pastor";
      
      signatories.auditorLabel = data.auditorLabel || "Audited by";
      signatories.auditorName = data.auditorName || "";
      signatories.auditorTitle = data.auditorTitle || "Church Auditor";

      // Update Modal Inputs
      document.getElementById('sig-chairperson-label').value = signatories.chairpersonLabel;
      document.getElementById('sig-chairperson-name').value = signatories.chairpersonName;
      document.getElementById('sig-chairperson-title').value = signatories.chairpersonTitle;

      document.getElementById('sig-finance-chair-label').value = signatories.financeChairLabel;
      document.getElementById('sig-finance-chair-name').value = signatories.financeChairName;
      document.getElementById('sig-finance-chair-title').value = signatories.financeChairTitle;

      document.getElementById('sig-treasurer-label').value = signatories.treasurerLabel;
      document.getElementById('sig-treasurer-name').value = signatories.treasurerName;
      document.getElementById('sig-treasurer-title').value = signatories.treasurerTitle;
      
      document.getElementById('sig-pastor-label').value = signatories.pastorLabel;
      document.getElementById('sig-pastor-name').value = signatories.pastorName;
      document.getElementById('sig-pastor-title').value = signatories.pastorTitle;
      
      document.getElementById('sig-auditor-label').value = signatories.auditorLabel;
      document.getElementById('sig-auditor-name').value = signatories.auditorName;
      document.getElementById('sig-auditor-title').value = signatories.auditorTitle;
    }
    syncSignatoryInputs();
    render();
  });

  db.collection('members').get().then(s => {
    memberNameById = {};
    memberNameByLegacyKey = {};
    s.forEach(doc => {
      const d = doc.data();
      const memberId = (d.memberId || doc.id || '').toString().trim();
      const currentName = formatMemberName(d);
      if (memberId) memberNameById[memberId] = currentName;
      addMemberNameAliases(d, currentName);
    });
    render();
  });

  db.collection('income').get().then(s => {
    // Keep the complete income pool for Financial Overview account balances.
    allIncomeData = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => !d.isSpecialProject);
    incomeData = allIncomeData.filter(d => {
      // Skip transfers - a fund transfer is a cash movement between
      // accounts, not real income; generateReportHTML() nets transfers
      // separately (see its own "Skip transfers" comment) so the General
      // Fund ending balance still reconciles with the true account
      // balances. Building Fund income is deliberately no longer excluded
      // here: it now flows into whichever of the General Fund / Restricted
      // Fund Activity sections its account belongs to (see
      // isGeneralFundAccount()), instead of silently vanishing from the
      // report entirely as it used to.
      if (d.type === 'transfer') return false;
      // Skip legacy special project inflows; project reports handle these separately.
      if (d.isSpecialProject) return false;
      return true;
    });

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, '&#96;');

  updateReportZoom();

  // Phone auto-fit (screen only). The paper is laid out at a "design width"
  // wide enough for the whole table (budget columns included, amounts never
  // wrapping), then scaled down with CSS zoom to the viewport width, so the
  // full statement is visible as a scaled page (pinch to zoom in). The CSS
  // reads --fit-width/--fit-zoom only inside a screen media query, so print
  // and desktop are unaffected. Runs inside the report-workflow iframe too
  // (its own viewport is what matters).
  function fitReportToScreen() {
    const page = document.getElementById('report-page');
    if (!page) return;
    const root = document.documentElement.style;
    const phone = window.matchMedia('(max-width: 600px)').matches && !document.body.classList.contains('report-fullscreen');
    if (!phone) { root.removeProperty('--fit-width'); root.removeProperty('--fit-zoom'); return; }
    // Measure at natural (unzoomed) size: let the paper grow to whatever the
    // table needs, starting from a readable minimum.
    root.setProperty('--fit-zoom', '1');
    root.setProperty('--fit-width', '420px');
    const table = document.getElementById('export-table');
    const cs = getComputedStyle(page);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    let needed = 420;
    if (table) needed = Math.max(needed, Math.ceil(table.scrollWidth + padX));
    root.setProperty('--fit-width', needed + 'px');
    const wrapper = page.parentElement;
    const wcs = getComputedStyle(wrapper);
    const avail = document.documentElement.clientWidth - parseFloat(wcs.paddingLeft) - parseFloat(wcs.paddingRight);
    root.setProperty('--fit-zoom', Math.min(1, avail / needed).toFixed(4));
  }
  window.addEventListener('resize', fitReportToScreen);
  window.addEventListener('orientationchange', fitReportToScreen);

  function getObligationPaidAmount(o) {
    if (o.paidAmount !== undefined) return Math.max(0, parseFloat(o.paidAmount) || 0);
    return o.status === 'Paid' ? (parseFloat(o.amount) || 0) : 0;
  }

  function getObligationBalance(o) {
    const amount = Math.max(0, parseFloat(o.amount) || 0);
    return Math.max(0, amount - getObligationPaidAmount(o));
  }

  function getObligationStatus(o) {
    const amount = Math.max(0, parseFloat(o.amount) || 0);
    const paidAmount = Math.min(amount, getObligationPaidAmount(o));
    if (amount > 0 && paidAmount >= amount) return 'Paid';
    if (paidAmount > 0) return 'Partially Paid';
    return 'Unpaid';
  }

  // ── CORE REPORT GENERATION ───────────────────────────────────────────────
  function generateReportHTML(year, month, isAnnual) {
    if (reviewMode) { reviewIncLineEntries = {}; reviewExpLineEntries = {}; reviewRestrictedEntries = {}; }
    const targetDate = isAnnual ? new Date(year, 0, 1) : new Date(year, month, 1);
    const periodEndDate = isAnnual ? new Date(year, 11, 31, 23, 59, 59) : new Date(year, month + 1, 0, 23, 59, 59);
    const dayBeforeStart = new Date(targetDate.getTime() - 1);

    // ── Item 7: Budget / % Used columns ─────────────────────────────────────
    // Annual statement: Budget = the full annual amount from budgets/{year}.
    // Monthly statement: Budget = Year-to-Date, i.e. the sum of
    // expenseBudgetForMonth/incomeBudgetForMonth (copied above from
    // budget-vs-actual.html) for every month from January through the
    // selected month, on the same schedule-aware basis budget-vs-actual.html
    // uses. Neither figure changes any existing Amount figure - these are
    // purely additive columns.
    const budgetsObj = currentBudgets || { expense: {}, income: {}, expenseSchedule: {}, incomeSchedule: {} };
    function budgetForExpenseKey(key) {
      if (isAnnual) return (budgetsObj.expense || {})[key] || 0;
      let sum = 0;
      for (let m = 0; m <= month; m++) sum += expenseBudgetForMonth(key, m, budgetsObj);
      return sum;
    }
    function budgetForIncomeKey(key) {
      if (isAnnual) return (budgetsObj.income || {})[key] || 0;
      let sum = 0;
      for (let m = 0; m <= month; m++) sum += incomeBudgetForMonth(key, m, budgetsObj);
      return sum;
    }
    const COLSPAN = showBudgetCols ? 5 : 3;
    const emptyBudgetCells = showBudgetCols ? '<td class="col-budget"></td><td class="col-pct"></td>' : '';
    // isExpenseSide: colour % Used red above 100% for expenses, amber below
    // 100% for income (an income shortfall is the concerning direction).
    function budgetCellsHtml(budgetAmt, actualAmt, isExpenseSide, dash) {
      if (!showBudgetCols) return '';
      if (dash) return '<td class="col-budget">—</td><td class="col-pct"></td>';
      if (!(budgetAmt > 0)) return emptyBudgetCells;
      const pct = (actualAmt / budgetAmt) * 100;
      let cls = '';
      if (isExpenseSide && pct > 100) cls = 'pct-over';
      else if (!isExpenseSide && pct < 100) cls = 'pct-under';
      return `<td class="col-budget">₱ ${fmt(budgetAmt)}</td><td class="col-pct ${cls}">${pct.toFixed(1)}%</td>`;
    }

    // ── General Fund vs Restricted Funds ────────────────────────────────────
    // isGeneralFundAccount() reads the Treasurer's own per-account setting
    // (Financial Overview > Beginning Balances), so which of the six
    // FINANCIAL_ACCOUNTS count as "General Fund" here is configurable, not
    // hardcoded - Building/Mission/Investment default to General Fund unless
    // the Treasurer explicitly excludes them.
    const gfAccounts = FINANCIAL_ACCOUNTS.filter(a => isGeneralFundAccount(a.id));
    const restrictedAccounts = FINANCIAL_ACCOUNTS.filter(a => !isGeneralFundAccount(a.id));
    const gfIds = gfAccounts.map(a => a.id);
    const restrictedIds = restrictedAccounts.map(a => a.id);
    function sumIds(balances, ids) {
      return ids.reduce((s, id) => s + (parseFloat(balances[id]) || 0), 0);
    }

    // getAccountBalancesThrough() is the one place that already nets every
    // real cash effect - income, expense (at net cash impact for payroll),
    // deduction-payment remittances, and both sides of a fund transfer - so
    // it's used here as the single source of truth for the General Fund's
    // true beginning/ending cash balance, instead of a second hand-rolled
    // loop that could silently drift from it (see the transfer note below).
    const beginningAccountBalances = getAccountBalancesThrough(dayBeforeStart);
    const accountBalances = getAccountBalancesThrough(periodEndDate);
    const gfTrueEndBalance = sumIds(accountBalances, gfIds);
    const restrictedTrueEndBalance = sumIds(accountBalances, restrictedIds);

    // ── Beginning/Ending Balance basis ──────────────────────────────────────
    // This statement's Beginning and Ending Balance must be on the SAME
    // basis, or they won't carry over from one period's Ending Balance to
    // the next period's Beginning Balance - an auditor would catch that
    // immediately. getAccountBalancesThrough() (above) recognizes payroll at
    // NET cash impact, while the statement's own period math (totalOut,
    // below) deliberately keeps payroll at GROSS pay, so the true account
    // balance and this statement's own running total diverge by exactly the
    // payroll withheld-but-not-yet-remitted amount, and that amount carries
    // forward indefinitely until it's remitted. The fix: put BOTH balances
    // on "cash net of payroll withholdings still held for remittance" -
    // i.e. subtract the *cumulative* outstanding withholding (all-time
    // withheld minus all-time remitted, through a given date) from the true
    // cash balance at that same date. Because that adjustment is applied
    // identically at both the period's start and its end, the statement's
    // own beginBal + netChange + netTransferGF math (below) lands on
    // exactly that adjusted basis too - see the reconciliation section
    // further down, where the two are shown to be algebraically equal.
    function outstandingWithholdingsThrough(throughDate) {
      let withheld = 0;
      let remitted = 0;
      allExpenseData.forEach(d => {
        if (!d.date) return;
        const dt = new Date(d.date);
        if (dt > throughDate) return;
        if (!isGeneralFundAccount(getExpenseAccountId(d))) return;
        if (d.isPayrollGenerated && !d.isBenefit) {
          const netPay = parseFloat(d.netPay);
          if (Number.isFinite(netPay)) withheld += Math.max(0, parseFloat(d.amount || 0) - netPay);
        } else if (d.type === 'deduction-payment') {
          remitted += parseFloat(d.amount || 0);
        }
      });
      return withheld - remitted;
    }
    const outstandingWithholdingsBeforePeriod = outstandingWithholdingsThrough(dayBeforeStart);
    const outstandingWithholdingsAtEnd = outstandingWithholdingsThrough(periodEndDate);
    const begBal = sumIds(beginningAccountBalances, gfIds) - outstandingWithholdingsBeforePeriod;

    // ── Period pools: real (non-transfer) income/expense records ────────────
    // Kept whole (both General Fund and restricted) so the new Restricted
    // Fund Activity section below can show what the General-Fund-basis
    // statement excludes, rather than that money silently disappearing from
    // the report the way excluded Building Fund income used to.
    const periodIncome = incomeData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });
    const periodExpense = expenseData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });

    const fInc = periodIncome.filter(d => isGeneralFundAccount(getIncomeAccountId(d)));
    const fExp = periodExpense.filter(d => isGeneralFundAccount(getExpenseAccountId(d)));
    const restrictedIncomeRows = periodIncome.filter(d => !isGeneralFundAccount(getIncomeAccountId(d)));
    const restrictedExpenseRows = periodExpense.filter(d => !isGeneralFundAccount(getExpenseAccountId(d)));

    // Item 7 (monthly YTD % Used): a separate Year-to-Date pool (January
    // through the selected month), General-Fund-basis like fInc/fExp, used
    // ONLY to compute the YTD *actual* half of "YTD actual / YTD budget".
    // fInc/fExp (this period only) still drive every existing Amount figure
    // unchanged - this pool is additive, never a replacement.
    const ytdIncomePool = isAnnual ? fInc : incomeData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return dt.getFullYear() === year && dt.getMonth() <= month;
    }).filter(d => isGeneralFundAccount(getIncomeAccountId(d)));
    const ytdExpensePool = isAnnual ? fExp : expenseData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return dt.getFullYear() === year && dt.getMonth() <= month;
    }).filter(d => isGeneralFundAccount(getExpenseAccountId(d)));
    const ytdTotalIn = ytdIncomePool.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const ytdTotalOut = ytdExpensePool.reduce((s, d) => s + parseFloat(d.amount || 0), 0);

    // ── Fund transfers ───────────────────────────────────────────────────────
    // Transfers move cash between accounts rather than representing real
    // income/expense, so incomeData/expenseData (and so fInc/fExp above)
    // deliberately exclude them entirely ("Skip transfers", see where those
    // arrays are built). That used to mean a transfer moving money between a
    // General Fund account and a restricted one was invisible to this
    // statement's own beginning/ending balance math - the printed Ending
    // Balance would silently drift away from the true account balances
    // (Financial Overview) every time such a transfer happened. Per
    // financial-overview.html's transferFunds(), each transfer writes two
    // docs tagged type:'transfer': an expenses-collection doc debiting the
    // source account (targetAccId = source) and an income-collection doc
    // crediting the destination (targetAccId = destination). Netting those
    // two pools by General-Fund-ness gives this period's net transfer into
    // (or out of) the General Fund, now folded into the statement as its own
    // labelled line instead of being silently absorbed into an
    // unreconciled beginning balance.
    const periodTransferIn = allIncomeData.filter(d => {
      if (d.type !== 'transfer' || !d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });
    const periodTransferOut = allExpenseData.filter(d => {
      if (d.type !== 'transfer' || !d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });
    const transferIntoGF = periodTransferIn
      .filter(d => isGeneralFundAccount(getIncomeAccountId(d)))
      .reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const transferOutOfGF = periodTransferOut
      .filter(d => isGeneralFundAccount(getExpenseAccountId(d)))
      .reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const netTransferGF = transferIntoGF - transferOutOfGF;

    const totalIn = fInc.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const totalOut = fExp.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    // Surplus/Deficit is operating performance only (income vs. expense) -
    // fund transfers are financing/movement, not operating results, so they
    // sit on their own line below rather than inside this computation.
    const netChange = totalIn - totalOut;
    const endBal = begBal + netChange + netTransferGF;

    // ── Reconciliation: General Fund accounts vs Ending Balance ─────────────
    // This statement deliberately keeps using GROSS pay (d.amount) for
    // payroll, same as Total Disbursements always has, so a reader sees the
    // same figure that was budgeted/expensed. The true account balance
    // (gfTrueEndBalance, above) instead recognizes payroll's cash impact at
    // NET pay - the withheld tithe/SSS/other deductions only actually leave
    // cash later, via a separate deduction-payment record (see
    // getExpenseCashImpact()). outstandingWithholdingsAtEnd is exactly that
    // gap, carried cumulatively (not just this period's own withholding) so
    // it matches what begBal above already subtracted at the period's
    // start: gfTrueEndBalance - outstandingWithholdingsAtEnd is algebraically
    // identical to endBal (begBal + netChange + netTransferGF), so this
    // should always reconcile to zero - a genuine mismatch here (red ✗)
    // means something outside this accounting (a data issue, a
    // misclassified account, etc.) needs investigating.
    const reconcileDiff = (gfTrueEndBalance - outstandingWithholdingsAtEnd) - endBal;
    const reconcileIsClean = Math.abs(reconcileDiff) < 0.01;

    const periodObligations = obligationsData.filter(o => {
      if (getObligationBalance(o) <= 0) return false;
      if (!o.dueDate) return true;
      const dt = new Date(o.dueDate);
      return !isNaN(dt.getTime()) && dt.getFullYear() === year;
    }).sort((a, b) => String(a.dueDate || '').localeCompare(String(b.dueDate || '')));
    // Item 6: Church Obligations rendered as a compact sub-table (Obligation
    // / Due Date / Amount / Paid / Balance / Status, plus a totals row)
    // instead of a status/due-date/settlement span crammed into col-desc.
    // It's nested inside a single colspan="3"/"5" cell of the outer fs-table
    // so it fits the existing layout, and carries its own row classes
    // (obligation-header-row/-row/-totals-row) so exportToExcel() can pick
    // it apart explicitly instead of falling through to the generic
    // class-based row handling (which would otherwise read the whole nested
    // table's text as one giant cell).
    let obligationsAmountTotal = 0, obligationsPaidTotal = 0, obligationsBalanceTotal = 0;
    const obligationDataRows = periodObligations.map(o => {
      const amount = Math.max(0, parseFloat(o.amount || 0));
      const paidAmount = Math.min(amount, getObligationPaidAmount(o));
      const balanceAmount = getObligationBalance(o);
      const status = getObligationStatus(o);
      obligationsAmountTotal += amount;
      obligationsPaidTotal += paidAmount;
      obligationsBalanceTotal += balanceAmount;
      return `
        <tr class="obligation-row">
          <td>${escapeHtml(o.name || 'Church Obligation')}</td>
          <td>${o.dueDate ? escapeHtml(o.dueDate) : '—'}</td>
          <td class="ob-num">₱ ${fmt(amount)}</td>
          <td class="ob-num">₱ ${fmt(paidAmount)}</td>
          <td class="ob-num">₱ ${fmt(balanceAmount)}</td>
          <td class="ob-status">${escapeHtml(status)}</td>
        </tr>`;
    }).join('');
    const obligationsTableHtml = periodObligations.length

      if (main.toLowerCase() === 'utilities' && parts.length > 1 && parts.slice(1).join(' - ').toLowerCase() === 'with fee') {

          subCategory: `${parts[0]} - ${parts.slice(1).join(' - ')}`,
          detail: ''
        };
      }
      return {
        subCategory: parts[0] || label || 'Others',
        detail: parts.length > 1 ? parts.slice(1).join(' - ') : ''
      };
    }

    // Item 7: expense Budget totals, grouped by the same main/subCategory
    // buckets the actuals above use - main total is the sum of every budget
    // key mapped to it (catKeyToMain), sub-category total is the sum of
    // every budget key whose getExpenseDisplayParts() subCategory matches
    // (the same split the actuals' nestedSubs grouping uses just below).
    const expBudgetMainTotals = {};
    const expBudgetSubTotals = {};
    expAllKeys.forEach(k => {
      const main = catKeyToMain[k];
      const subFull = catKeyToSub[k];
      const parts = getExpenseDisplayParts(main, subFull);
      const amt = budgetForExpenseKey(k);
      expBudgetMainTotals[main] = (expBudgetMainTotals[main] || 0) + amt;
      if (!expBudgetSubTotals[main]) expBudgetSubTotals[main] = {};
      expBudgetSubTotals[main][parts.subCategory] = (expBudgetSubTotals[main][parts.subCategory] || 0) + amt;
    });

    // Item 7: YTD actual groups (annual: identical to expGroups). A
    // sub-category's YTD actual sums every raw budget-sub key that maps to
    // it via getExpenseDisplayParts(), same as the display-side nestedSubs
    // grouping further below.
    const ytdExpGroups = isAnnual ? expGroups : buildExpGroups(ytdExpensePool);
    function expActualForSubCategory(groups, main, subCategory) {
      const g = groups[main];
      if (!g) return 0;
      let sum = 0;
      Object.keys(g.subs).forEach(subKey => {
        const label = g.subLabels[subKey] || subKey;
        if (getExpenseDisplayParts(main, label).subCategory === subCategory) sum += g.subs[subKey];
      });
      return sum;
    }

    let expRows = '';

    const sortedExpMainKeys = Object.keys(expGroups).sort((a, b) => {
      if (a === MISC_MAIN) return 1;
      if (b === MISC_MAIN) return -1;

      let idxA = expOrderMain.indexOf(a);
      let idxB = expOrderMain.indexOf(b);

      if (idxA === -1 && idxB === -1) return a.localeCompare(b);
      if (idxA === -1) return 1;
      if (idxB === -1) return -1;
      return idxA - idxB;
    });

    sortedExpMainKeys.forEach(main => {
      const g = expGroups[main];
      const isMiscExp = main === MISC_MAIN;
      expRows += `
        <tr>
          <td class="col-desc indent-1" style="font-weight: bold;">${escapeHtml(main)}</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(g.total)}</td>
          ${budgetCellsHtml(expBudgetMainTotals[main], (ytdExpGroups[main] || {}).total || 0, true, isMiscExp)}
        </tr>`;
      if (isMiscExp) {
        expRows += `
        <tr>
          <td class="col-desc indent-2 misc-note" colspan="${COLSPAN - 1}">Items not in the approved budget — consider adding a budget line.</td>
          <td class="col-main"></td>
        </tr>`;
      }

      const sortedSubKeys = Object.keys(g.subs).sort((a, b) => {
        if (main === MISC_MAIN) {
          // No budget-defined order for unbudgeted lines - alphabetise by
          // the display label instead of the normalized grouping key.
          const la = g.subLabels[a] || a, lb = g.subLabels[b] || b;
          return la.localeCompare(lb);
        }
        // g.subs keys are exact original budget sub names, and so is expOrderSub[main].
        // Simple indexOf gives perfect budget-defined order.
        let arr = expOrderSub[main] || [];
        let idxA = arr.indexOf(a);
        let idxB = arr.indexOf(b);
        if (idxA === -1 && idxB === -1) return a.localeCompare(b);
        if (idxA === -1) return 1;
        if (idxB === -1) return -1;
        return idxA - idxB;
      });

      const nestedSubs = [];
      sortedSubKeys.forEach(subKey => {
        const subLabel = g.subLabels[subKey] || subKey;
        const parts = getExpenseDisplayParts(main, subLabel);
        let group = nestedSubs.find(item => item.subCategory === parts.subCategory);
        if (!group) {
          group = { subCategory: parts.subCategory, total: 0, rows: [], count: 0, entries: [] };
          nestedSubs.push(group);
        }
        group.total += g.subs[subKey];
        group.count += (g.subCounts || {})[subKey] || 0;
        group.rows.push({ detail: parts.detail, amount: g.subs[subKey] });
        // Review mode: aggregate the raw budget sub-keys' entries onto the
        // displayed sub-category line - never affects any amount above.
        (g.subEntries[subKey] || []).forEach(d => group.entries.push(d));
      });

      nestedSubs.forEach(group => {
        const hasDetails = group.rows.some(row => row.detail);
        const entryCountHtml = isMiscExp ? ` <span class="entry-count">(${group.count} ${group.count === 1 ? 'entry' : 'entries'})</span>` : '';
        // Review mode only: see the income-side comment above.
        const expLineKey = 'exp|' + main + '|' + group.subCategory;
        if (reviewMode) reviewExpLineEntries[expLineKey] = group.entries;
        const expReviewAttrs = reviewMode ? ` class="review-line" data-rk="${escapeAttr(expLineKey)}" onclick="toggleReviewPanel(this)"` : '';
        const expReviewClip = reviewMode ? ` <span class="review-only review-clip" data-export-skip="1">📎 ${group.entries.length}</span>` : '';
        // Sub-category total now sits in col-main - the same column as the
        // main-category total above it - so its own detail (indent-3) rows
        // below, which stay in col-sub, are never stacked in the same
        // column as a total they're already part of.
        expRows += `
          <tr${expReviewAttrs}>
            <td class="col-desc indent-2">${escapeHtml(group.subCategory)}${entryCountHtml}${expReviewClip}</td>
            <td class="col-sub"></td>
            <td class="col-main" style="font-weight:600;">₱ ${fmt(group.total)}</td>
            ${budgetCellsHtml(isMiscExp ? 0 : (expBudgetSubTotals[main] || {})[group.subCategory], expActualForSubCategory(ytdExpGroups, main, group.subCategory), true, isMiscExp)}
          </tr>`;

        if (!hasDetails) { return; }

        group.rows.forEach(row => {
          expRows += `
            <tr>
              <td class="col-desc indent-3">${escapeHtml(row.detail || 'General')}</td>
              <td class="col-sub" style="font-size:11.5px; color:#777;">₱ ${fmt(row.amount)}</td>
              <td class="col-main"></td>
              ${emptyBudgetCells}
            </tr>`;
        });
      });
    });

    const periodText = isAnnual ? `For the Year ${year}` : `For the Month of ${MONTHS[month]} ${year}`;
    const footerText = isAnnual ? `${year}` : `${MONTHS[month]} ${year}`;

    const reconcileLineHtml = Math.abs(outstandingWithholdingsAtEnd) >= 0.01
      ? `
        <tr class="reconcile-row">
          <td class="col-desc">Payroll withholdings held for remittance (cumulative)</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(outstandingWithholdingsAtEnd)}</td>
          ${emptyBudgetCells}
        </tr>`
      : '';
    const reconcileCheckHtml = reconcileIsClean
      ? `<span class="reconcile-ok">✓ Matches${Math.abs(outstandingWithholdingsAtEnd) >= 0.01 ? ' (net of payroll withholdings held for remittance)' : ''}</span>`
      : `<span class="reconcile-bad">✗ Off by ₱ ${fmt(Math.abs(reconcileDiff))}</span>`;

    // Item 7: Total Budget / % Used on the Total Cash Receipts / Total
    // Disbursements lines - the sum of every budgeted main category's own
    // budget (Miscellaneous (Unbudgeted) contributes no budget amount).
    const totalIncomeBudget = Object.keys(incBudgetMainTotals)
      .filter(m => m !== MISC_MAIN).reduce((s, m) => s + (incBudgetMainTotals[m] || 0), 0);
    const totalExpenseBudget = Object.keys(expBudgetMainTotals)
      .filter(m => m !== MISC_MAIN).reduce((s, m) => s + (expBudgetMainTotals[m] || 0), 0);
    const budgetColLabel = isAnnual ? 'Budget' : 'YTD Budget';
    const pctColLabel = isAnnual ? '% Used' : 'YTD % Used';
    const headerBudgetCells = showBudgetCols
      ? `<td class="col-budget">${budgetColLabel}</td><td class="col-pct">${pctColLabel}</td>`
      : '';

    return `
      <div class="siksik-container" id="printable-content">
        <div class="rpt-header">
          <img src="umc-logo.png" alt="UMC Logo" onerror="this.style.display='none'">
          <div class="rpt-header-text">
            <div class="rpt-church-name">Tagaytay United Methodist Church</div>
            <div class="rpt-church-address">Maglabe Drive, Asisan, Tagaytay City</div>
            <div class="rpt-title">Statement of Receipts and Disbursements</div>
            <div class="rpt-period">${periodText}</div>
          </div>
        </div>

        <table class="fs-table ${showBudgetCols ? 'has-budget' : ''}" id="export-table">
          <tr class="col-header-row">
            <td class="col-desc">Account</td>
            <td class="col-sub">Detail</td>
            <td class="col-main">Amount</td>
            ${headerBudgetCells}
          </tr>
          <tr class="bold-row">
            <td class="col-desc">Beginning Balance (General Fund)</td>
            <td class="col-sub"></td>
            <td class="col-main ${begBal<0?'amount-negative':''}">₱ ${fmt(begBal)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Receipts / Income (General Fund)</td>
          </tr>
          ${incRows || `<tr><td class="indent-1 col-desc" colspan="${COLSPAN}" style="color:#aaa;padding:8px 0;">No income recorded for this period.</td></tr>`}
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Total Cash Receipts</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(totalIn)}</td>
            ${budgetCellsHtml(totalIncomeBudget, ytdTotalIn, false, false)}
          </tr>
          <tr class="bold-row">
            <td class="col-desc">Total Cash Available</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(begBal + totalIn)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Disbursements / Expenses (General Fund)</td>
          </tr>
          ${expRows || `<tr><td class="indent-1 col-desc" colspan="${COLSPAN}" style="color:#aaa;padding:8px 0;">No expenses recorded for this period.</td></tr>`}
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Total Disbursements</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(totalOut)}</td>
            ${budgetCellsHtml(totalExpenseBudget, ytdTotalOut, true, false)}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Restricted Fund Activity</td>
          </tr>
          ${restrictedActivityHtml}
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="bold-row">
            <td class="col-desc">Net Fund Transfers (into)/out of General Fund</td>
            <td class="col-sub"></td>
            <td class="col-main ${netTransferGF < 0 ? 'amount-negative' : ''}">₱ ${fmt(netTransferGF)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="total-row">
            <td class="col-desc">Ending Balance (General Fund)</td>
            <td class="col-sub"></td>
            <td class="col-main ${endBal<0?'amount-negative':'amount-positive'}">₱ ${fmt(endBal)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Surplus / Deficit Computation (General Fund)</td>
          </tr>
          <tr class="bold-row">
            <td class="col-desc">Total Income</td>
            <td class="col-sub"></td>
            <td class="col-main">₱ ${fmt(totalIn)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="subtotal-row">
            <td class="col-desc">Less: Total Disbursements</td>
            <td class="col-sub">-</td>
            <td class="col-main">₱ ${fmt(totalOut)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="subtotal-row bold-row">
            <td class="col-desc">${netChange >= 0 ? 'Surplus' : 'Deficit'}</td>
            <td class="col-sub">=</td>
            <td class="col-main ${netChange < 0 ? 'amount-negative' : 'amount-positive'}">₱ ${fmt(Math.abs(netChange))}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">General Fund Accounts</td>
          </tr>
          ${gfAccountRows}
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Subtotal, General Fund</td>
            <td class="col-sub"></td>
            <td class="col-main ${gfTrueEndBalance < 0 ? 'amount-negative' : ''}">₱ ${fmt(gfTrueEndBalance)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Restricted Funds</td>
          </tr>
          ${restrictedAccountRows}
          <tr class="subtotal-row bold-row">
            <td class="col-desc">Subtotal, Restricted Funds</td>
            <td class="col-sub"></td>
            <td class="col-main ${restrictedTrueEndBalance < 0 ? 'amount-negative' : ''}">₱ ${fmt(restrictedTrueEndBalance)}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="total-row">
            <td class="col-desc">Grand Total, All Accounts</td>
            <td class="col-sub"></td>
            <td class="col-main ${grandTotalBalance < 0 ? 'amount-negative' : ''}">₱ ${fmt(grandTotalBalance)}</td>
            ${emptyBudgetCells}
          </tr>
          ${reconcileLineHtml}
          <tr class="reconcile-row">
            <td class="col-desc">General Fund accounts vs Ending Balance</td>
            <td class="col-sub"></td>
            <td class="col-main">${reconcileCheckHtml}</td>
            ${emptyBudgetCells}
          </tr>
          <tr class="spacer-row"><td colspan="${COLSPAN}"></td></tr>

          <tr class="section-header">
            <td colspan="${COLSPAN}">Church Obligations</td>
          </tr>
          ${obligationsTableHtml || `<tr><td class="indent-1 col-desc" colspan="${COLSPAN}" style="color:#aaa;padding:8px 0;">No outstanding church obligations for this year.</td></tr>`}
        </table>

        <div class="sig-section">

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.chairpersonLabel)}</div>
            ${workflowSignatureHtml('chairperson', signatories.chairpersonName, signatories.chairpersonTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.financeChairLabel)}</div>
            ${workflowSignatureHtml('financeChair', signatories.financeChairName, signatories.financeChairTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.treasurerLabel)}</div>
            ${workflowSignatureHtml('treasurer', signatories.treasurerName, signatories.treasurerTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.auditorLabel)}</div>
            ${workflowSignatureHtml('auditor', signatories.auditorName, signatories.auditorTitle)}
          </div>

          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${escapeHtml(signatories.pastorLabel)}</div>
            ${workflowSignatureHtml('pastor', signatories.pastorName, signatories.pastorTitle)}
          </div>

        </div>

        <div class="rpt-footer">
          <span>GraceBooks — TUMC Finance System</span>
          <span>Tagaytay United Methodist Church · ${footerText}</span>
        </div>
      </div>`;
  }

  function renderMonthly() {
    const year  = parseInt(document.getElementById('sel-year').value);
    const month = parseInt(document.getElementById('sel-month').value);
    document.getElementById('report-page').innerHTML = generateReportHTML(year, month, false);
  }

  function renderAnnual() {
    const year = parseInt(document.getElementById('sel-year').value);
    document.getElementById('report-page').innerHTML = generateReportHTML(year, null, true);
  }

  function renderSpecialProject() {
    populateSpecialProjectSelector();
    const projectId = document.getElementById('sel-special-project').value;
    const project = specialProjects.find(p => p.id === projectId && p.printReportPublished);
    document.getElementById('report-page').innerHTML = project
      ? generateSpecialProjectReportHTML(project)
      : `<div style="text-align:center; padding:60px; color:#777;">
          <div style="font-weight:700; color:var(--red); margin-bottom:8px;">No Special Project Selected</div>
          <div>Push a project from the Special Projects page first, then select it here.</div>
        </div>`;
  }

  function projectCostTotal(projectId) {
    return specialProjectCosts
      .filter(c => c.projectId === projectId)
      .reduce((sum, c) => sum + Number(c.amount || 0), 0);
  }

  function projectFundingTotal(projectId) {
    // Gross receipts (type 'Receipt') are money the fund raising activity
    // itself collected, not a funding source paying for the project's
    // cost, so they're excluded here just like in special-projects.html.
    return specialProjectEntries
      .filter(e => e.projectId === projectId && e.type !== 'Receipt')
      .reduce((sum, e) => sum + Number(e.amount || 0), 0);
  }

  function projectGrossReceiptsTotal(projectId) {
    return specialProjectEntries
      .filter(e => e.projectId === projectId && e.type === 'Receipt')
      .reduce((sum, e) => sum + Number(e.amount || 0), 0);
  }

  function projectExpensesIncurredTotal(projectId) {
    return allExpenseData
      .filter(e => e.specialProjectId === projectId && e.type !== 'transfer')
      .reduce((sum, e) => sum + Number(e.amount || 0), 0);
  }

  function groupRows(rows, keyFn) {
    return rows.reduce((acc, row) => {
      const key = keyFn(row) || 'Uncategorized';
      if (!acc[key]) acc[key] = [];
      acc[key].push(row);
      return acc;
    }, {});
  }

  function generateSpecialProjectReportHTML(project) {
    const projectCosts = specialProjectCosts.filter(c => c.projectId === project.id);
    const projectEntries = specialProjectEntries.filter(e => e.projectId === project.id && e.type !== 'Receipt');
    // Mirrors special-projects.html's proceedsEnabled(): 'Fund Raising' always
    // tallies proceeds, 'Activity Contribution' only when the Treasurer opted in.
    const isActivityContribution = project.projectType === 'Activity Contribution';
    const showsProceeds = project.projectType === 'Fund Raising'
      || (isActivityContribution && project.postProceedsToGeneralFund === true);
    const grossLabel = isActivityContribution ? 'Contributions Collected' : 'Gross Receipts';
    const proceedsHeading = isActivityContribution ? 'Activity Contribution Results' : 'Fund Raising Results';
    const grossReceipts = showsProceeds ? projectGrossReceiptsTotal(project.id) : 0;
    const expensesIncurred = showsProceeds ? projectExpensesIncurredTotal(project.id) : 0;
    const netProceeds = grossReceipts - expensesIncurred;
    const costTotal = projectCostTotal(project.id);
    const fundingTotal = projectFundingTotal(project.id);
    const remainingNeed = Math.max(0, costTotal - fundingTotal);
    const surplus = Math.max(0, fundingTotal - costTotal);
    const isClosed = project.status === 'Closed';
    const closedDateStr = isClosed && project.finishedAt
      ? new Date(project.finishedAt).toLocaleDateString('en-PH') : '';
    const fundingPct = costTotal > 0 ? Math.min(100, Math.round(fundingTotal / costTotal * 100)) : null;

    const actualCostTotal = projectCosts.filter(c => c.basis === 'Actual').reduce((s, c) => s + Number(c.amount || 0), 0);
    const estimatedCostTotal = projectCosts.filter(c => c.basis !== 'Actual').reduce((s, c) => s + Number(c.amount || 0), 0);
    const hasMixedBasis = actualCostTotal > 0 && estimatedCostTotal > 0;

    const costGroups = groupRows(projectCosts, c => c.mainCategory);
    const costRows = Object.keys(costGroups).sort().map(main => {
      const rows = costGroups[main];
      const total = rows.reduce((sum, r) => sum + Number(r.amount || 0), 0);
      return `
        <tr>
          <td class="col-desc indent-1" style="font-weight:bold;">${escapeHtml(main)}</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(total)}</td>
        </tr>
        ${rows.map(r => `
          <tr>
            <td class="col-desc indent-2">${escapeHtml(r.detail || 'Cost Item')} <span style="font-size:10px;font-weight:700;color:${r.basis === 'Actual' ? '#1e8449' : '#9a5b00'};">${escapeHtml(r.basis || 'Estimated')}</span></td>
            <td class="col-sub">₱ ${fmt(r.amount || 0)}</td>
            <td class="col-main"></td>
          </tr>`).join('')}`;
    }).join('');

    const fundingGroups = groupRows(projectEntries, e => SPECIAL_PROJECT_SOURCE_LABELS[e.sourceType] || 'Other Contributions');
    const fundingRows = Object.keys(fundingGroups).sort((a, b) => {
      const order = ['Church Funds', 'Pledges', 'Direct Contributions', 'Other Contributions'];
      const ai = order.indexOf(a) === -1 ? order.length : order.indexOf(a);
      const bi = order.indexOf(b) === -1 ? order.length : order.indexOf(b);
      return ai - bi || a.localeCompare(b);
    }).map(main => {
      const rows = fundingGroups[main];
      const total = rows.reduce((sum, r) => sum + Number(r.amount || 0), 0);
      return `
        <tr>
          <td class="col-desc indent-1" style="font-weight:bold;">${escapeHtml(main)}</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(total)}</td>
        </tr>
        ${rows.map(r => {
          const source = r.sourceType === 'Church Fund'
            ? `${r.sourceAccountName || r.sourceAccount || 'Church Fund'}${r.particulars ? ' - ' + r.particulars : ''}`
            : `${r.pledgerName || r.party || 'Contributor'}${r.particulars ? ' - ' + r.particulars : ''}`;
          return `
            <tr>
              <td class="col-desc indent-2">${escapeHtml(source)} <span style="color:#777;font-size:11px;">${escapeHtml(r.date || '')}</span></td>
              <td class="col-sub">₱ ${fmt(r.amount || 0)}</td>
              <td class="col-main"></td>
            </tr>`;
        }).join('')}`;
    }).join('');

    const receiptRows = showsProceeds
      ? specialProjectEntries.filter(e => e.projectId === project.id && e.type === 'Receipt')
          .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')))
          .map(r => `
            <tr>
              <td class="col-desc indent-2">${escapeHtml(r.party || r.particulars || (isActivityContribution ? 'Contribution' : 'Receipt'))} <span style="color:#777;font-size:11px;">${escapeHtml(r.date || '')}</span></td>
              <td class="col-sub">₱ ${fmt(r.amount || 0)}</td>
              <td class="col-main"></td>
            </tr>`).join('')
      : '';

    return `
      <div class="siksik-container" id="printable-content">
        <div class="rpt-header">
          <img src="umc-logo.png" alt="UMC Logo" onerror="this.style.display='none'">
          <div class="rpt-header-text">
            <div class="rpt-church-name">Tagaytay United Methodist Church</div>
            <div class="rpt-church-address">Maglabe Drive, Asisan, Tagaytay City</div>
            <div class="rpt-title">${escapeHtml(project.name || 'Special Project Report')}</div>
            <div class="rpt-period">Special Project Report</div>
          </div>
        </div>

        <table class="fs-table" id="export-table">
          <tr class="section-header"><td colspan="3">Project Details</td></tr>
