<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#8B0000"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>GraceBooks — Financial Reports</title>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="auth.js"></script>
<script>requireGraceBooksAuth();
try { if (window.self !== window.top && /[?&]review=1/.test(location.search)) document.documentElement.classList.add('embedded-review'); } catch (e) { document.documentElement.classList.add('embedded-review'); }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="receipt-annotator.js"></script>
  <script src="receipt-rotation.js"></script>

  <style>
    :root {
      --red:      #8B0000;
      --red-mid:  #c0392b;
      --red-light:#fdf2f2;
      --gold:     #c9a84c;
      --dark:     #1a1a1a;
      --gray:     #555;
      --line:     #ccc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f2f5;
      color: var(--dark);
      min-height: 100vh;
    }

    /* ── TOPBAR ─────────────────────────────────────────────── */
    .topbar {
      background: var(--red);
      color: white;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.25);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { height: 46px; }
    .brand-text { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .brand-sub  { font-size: 11px; opacity: 0.75; letter-spacing: 0.5px; }

    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action {
      padding: 8px 14px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      color: white; transition: 0.2s; font-family: 'Poppins', sans-serif;
    }
    .btn-action:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-back   { background: rgba(255,255,255,0.15); }
    .btn-excel  { background: #1e8449; }
    .btn-print  { background: #1a5276; }
    .btn-fullscreen { background: #5a2a7a; }

    /* ── CONTROLS ───────────────────────────────────────────── */
    .controls-bar {
      background: white;
      padding: 16px 28px;
      display: flex; gap: 14px; flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .controls-bar label { font-size: 12px; font-weight: 600; color: var(--gray); }
    .controls-bar select {
      padding: 8px 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 13px; background: white;
      font-family: 'Poppins', sans-serif;
    }
    .controls-bar select:focus { outline: none; border-color: var(--red); }
    .report-type-tabs {
      display: flex; gap: 6px;
    }
    .rtype-btn {
      padding: 7px 16px; border: 2px solid #ddd;
      border-radius: 20px; background: white;
      font-size: 12px; font-weight: 600; cursor: pointer;
      color: var(--gray); transition: 0.2s;
      font-family: 'Poppins', sans-serif;
    }
    .rtype-btn.active {
      background: var(--red); color: white; border-color: var(--red);
    }

    /* ── MODAL STYLES (For Signatories) ─────────────────────── */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; padding:30px; border-radius:12px; width:600px; max-width:95%; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
    .modal-header { font-size:18px; font-weight:700; margin-bottom:5px; border-bottom:1px solid #ddd; padding-bottom:10px; color:var(--dark); }
    .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .btn-cancel { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600; background:#eee; color:#333; }
    .btn-save { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600; background:var(--red); color:white; }
    
    .sig-header-label { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 8px; margin-top: 15px; border-bottom: 1px solid #eee; padding-bottom: 3px; }
    .sig-grid { display: grid; grid-template-columns: 1fr 1.5fr 1.5fr; gap: 10px; margin-bottom: 10px; }
    .sig-grid label { font-size: 11px; color: var(--gray); font-weight: 600; margin-bottom: 3px; display: block; }
    .sig-grid input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 13px; }

    /* ── REPORT WRAPPER ─────────────────────────────────────── */
    .report-wrapper {
      max-width: 860px;
      margin: 28px auto;
      padding: 0 20px 60px;
    }

    /* ── REPORT PAGE (Printable) ────────────────────────────── */
    .report-page {
      background: white;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 48px 56px;
      position: relative;
    }
    .report-page::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: linear-gradient(to bottom, var(--red), var(--red-mid));
    }

    .fullscreen-toolbar {
      display: none;
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 2000;
      gap: 8px;
      align-items: center;
      background: rgba(26,26,26,0.9);
      color: white;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    .fs-tool-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.14);
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    .fs-tool-btn:hover { background: rgba(255,255,255,0.24); }
    .fs-zoom-label {
      min-width: 52px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }
    body.report-fullscreen {
      overflow: auto;
      background: #1a1a1a;
    }
    body.report-fullscreen .topbar,
    body.report-fullscreen .controls-bar {
      display: none;
    }
    body.report-fullscreen .fullscreen-toolbar {
      display: flex;
    }
    body.report-fullscreen .report-wrapper {
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 56px 24px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
    }
    body.report-fullscreen .report-page {
      transform: scale(var(--report-zoom, 1));
      transform-origin: top center;
      margin-bottom: 40px;
    }

    /* ── REPORT HEADER ──────────────────────────────────────── */
    .rpt-header {
      display: flex;
      align-items: center; 
      gap: 20px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--red);
    }
    .rpt-header img { height: 70px; }
    .rpt-header-text { flex: 1; text-align: center; }
    .rpt-church-name {
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--red);
    }
    .rpt-church-address { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .rpt-title { font-size: 14px; font-weight: 700; color: var(--dark); text-transform: uppercase; margin-top: 10px; }
    .rpt-period { font-size: 12px; color: var(--gray); margin-top: 2px; }

    /* ── SIKSIK LAYOUT CONTAINER ────────────────────────────── */
    .siksik-container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* ── FINANCIAL STATEMENT TABLE ──────────────── */
    .fs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .fs-table td {
      padding: 2.5px 4px;
      vertical-align: top;
      line-height: 1.5;
    }
    .col-desc { width: 60%; color: #111; }
    .col-sub  { width: 20%; text-align: right; padding-right: 12px; color: var(--gray); }
    .col-main { width: 20%; text-align: right; font-weight: 600; }
    .indent-1 { padding-left: 18px !important; font-weight: 600; }
    .indent-2 { padding-left: 36px !important; color: #111; font-size: 12px; }
    .indent-3 { padding-left: 54px !important; color: #222; font-size: 11.5px; }

    /* Budget / % Used columns (Item 7) - only emitted when the "Show budget
       columns" toggle is on, so widths only need to account for the 5-column
       layout; the 3-column layout keeps col-desc/col-sub/col-main at 60/20/20
       as above. */
    .fs-table.has-budget .col-desc { width: 40%; }
    .fs-table.has-budget .col-sub  { width: 14%; }
    .fs-table.has-budget .col-main { width: 16%; }
    .col-budget, .col-pct { width: 15%; text-align: right; padding-right: 8px; font-size: 11px; color: var(--gray); }
    .fs-table.has-budget .col-budget, .fs-table.has-budget .col-pct { font-size: 11px; }
    .pct-over  { color: var(--red-mid); font-weight: 700; }
    .pct-under { color: #b8860b; font-weight: 700; }

    /* Miscellaneous (Unbudgeted) helper note + entry counts */
    .screen-only-note { color: #a04000; font-size: 11px; font-style: italic; padding-top: 4px; }
    .misc-note { color: #888; font-size: 10.5px; font-style: italic; }
    .entry-count { color: #6b6b6b; font-size: 10.5px; font-weight: 400; }

    /* Church Obligations compact sub-table (Item 6) */
    .obligation-table, .unbudgeted-table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 2px 0 4px; }
    .obligation-table td, .unbudgeted-table td { padding: 3px 5px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .obligation-table .obligation-header-row td, .unbudgeted-table .unbudgeted-header-row td {
      font-weight: 700; font-size: 10px; text-transform: uppercase; color: var(--red);
      border-bottom: 1px solid var(--red); padding-top: 4px !important; padding-bottom: 4px !important;
    }
    .obligation-table .obligation-totals-row td {
      font-weight: 700; border-top: 1px solid var(--dark); border-bottom: none;
    }
    .obligation-table td.ob-num { text-align: right; }
    .obligation-table td.ob-status { text-align: center; white-space: nowrap; }
    .unbudgeted-table td.ub-num { text-align: right; white-space: nowrap; }
    .unbudgeted-table td.ub-side { white-space: nowrap; }
    .unbudgeted-note { color: #888; font-size: 10.5px; font-style: italic; padding: 2px 0 4px; }

    .section-header td {
      font-weight: 700;
      font-size: 12.5px;
      text-transform: uppercase;
      padding-top: 14px !important;
      padding-bottom: 4px !important;
      color: var(--red);
      border-bottom: 1px solid var(--red);
    }

    .bold-row td { font-weight: 700; }
    .subtotal-row td { font-weight: 700; border-top: 1px solid var(--line); padding-top: 4px !important; }
    .total-row td {
      font-weight: 700; font-size: 13px; border-top: 2px solid var(--dark);
      border-bottom: 3px double var(--dark); padding-top: 5px !important; padding-bottom: 5px !important; color: var(--dark);
    }
    .spacer-row td { padding: 5px 0 !important; }

    .amount-positive { color: #1e8449; }
    .amount-negative { color: var(--red-mid); }

    /* Column header row (Account / Detail / Amount) - styled like the
       section headers above, but with three separate cells instead of one
       colspan title, so it needs its own class (kept distinct from
       .section-header so exportToExcel's className-based row detection
       doesn't merge it into a single-cell section title). */
    .col-header-row td {
      font-weight: 700; font-size: 10.5px; text-transform: uppercase;
      letter-spacing: 0.4px; padding-top: 6px !important; padding-bottom: 6px !important;
      color: var(--red); border-bottom: 1px solid var(--red);
    }
    .col-header-row .col-sub, .col-header-row .col-main { font-weight: 700; }

    /* Reconciliation line (General Fund accounts vs Ending Balance). */
    .reconcile-row td { padding-top: 6px !important; font-size: 11.5px; }
    .reconcile-ok { color: #1e8449; font-weight: 700; }
    .reconcile-bad { color: var(--red-mid); font-weight: 700; }

    /* ── SIGNATURES ──────────────────────────────────────────── */
    .sig-section { margin-top: 60px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .sig-box { text-align: center; flex: 1 1 145px; max-width: 180px; }
    .workflow-sig-space { height: 48px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 3px; }
    .workflow-sig-img { max-width: 155px; max-height: 46px; object-fit: contain; display: block; filter: brightness(0); }
    .workflow-sig-line { border-top: 1px solid var(--dark); margin-bottom: 2px; }
    .workflow-sig-unavailable { font-size: 9px; color: #777; padding-bottom: 5px; }
    
    /* ── FOOTER ──────────────────────────────────────────────── */
    .rpt-footer {
      margin-top: 32px; padding-top: 12px; border-top: 1px solid #eee;
      display: flex; justify-content: space-between; font-size: 10px; color: #aaa;
    }

    /* ── PRINT STYLES ───────────────────────────────────────── */

    /* Default: Long Bond 8.5 x 13 */
    @page { size: 8.5in 13in; margin: 0.6in 0.65in; }

    /* Letter 8.5 x 11 — activated when <body> has class 'paper-letter' */
    body.paper-letter { --paper: letter; }
    @media print {
      body.paper-letter { }
    }
    /* Swap @page size via a dedicated stylesheet injected by JS */

    @media print {
      .topbar, .controls-bar, .fullscreen-toolbar, .no-print, .review-only { display: none !important; }
      body { background: white; }
      .report-wrapper { margin: 0; padding: 0; max-width: 100%; }
      .report-page { box-shadow: none; border-radius: 0; padding: 0; margin: 0; }
      .report-page::before { display: none; }
      .siksik-container { max-width: 100% !important; }

      /* ── Page-break rules ── */
      /* Never break immediately after a section header or bold category row */
      .section-header   { break-after: avoid; page-break-after: avoid; }
      .bold-row         { break-after: avoid; page-break-after: avoid; }
      /* Never orphan a sub-row from its parent category */
      .fs-table tr      { break-inside: avoid; page-break-inside: avoid; }
      /* Keep signature block together on one page */
      .sig-section      { break-inside: avoid; page-break-inside: avoid;
                          break-before: auto; page-break-before: auto; }
      .rpt-footer       { break-inside: avoid; page-break-inside: avoid; }
      .obligation-table, .unbudgeted-table { break-inside: avoid; page-break-inside: avoid; }
      .screen-only-note-row { display: none !important; }

      /* ── Font scaling per paper size ── */
      /* Long bond — default, comfortable */
      body:not(.paper-letter) .fs-table       { font-size: 12.5px; }
      body:not(.paper-letter) .fs-table td    { padding: 2.5px 4px; }
      /* Letter — slightly tighter to fit more per page */
      body.paper-letter .fs-table             { font-size: 11.5px; }
      body.paper-letter .fs-table td          { padding: 1.5px 4px; }
      body.paper-letter .spacer-row td        { padding: 3px 0 !important; }
      body.paper-letter .section-header td    { padding-top: 10px !important; }
      /* A4 — similar to letter, slightly adjusted */
      body.paper-a4 .fs-table                 { font-size: 11.5px; }
      body.paper-a4 .fs-table td              { padding: 2px 4px; }
      body.paper-a4 .spacer-row td            { padding: 3px 0 !important; }
      body.paper-a4 .section-header td        { padding-top: 11px !important; }

      /* Budget columns make each row wider - shrink a little further so the
         5-column layout still fits comfortably on one printed line. */
      .fs-table.has-budget            { font-size: 11px; }
      .fs-table.has-budget .col-budget,
      .fs-table.has-budget .col-pct   { font-size: 10px; }
      .obligation-table, .unbudgeted-table { font-size: 10px; }
    }

    /* ── PHONE LAYOUT (screen only - print output is untouched) ───────────
       At <=600px the topbar is a compact, non-sticky, full-width bar whose
       buttons scroll horizontally in one row, and the report "paper" is
       auto-fitted to the screen: fitReportToScreen() measures the table's
       natural width and publishes --fit-width / --fit-zoom, which only this
       screen rule consumes (so printing from a phone stays at full size). */
    @media screen {
      /* Amounts never wrap; give the 5-column (budget) layout a little more
         room on screen so the description column doesn't pay for it. Print
         keeps its own max-width:100% rule. */
      .siksik-container:has(.fs-table.has-budget) { max-width: 640px; }
      .col-sub, .col-main, .col-budget, .col-pct,
      .obligation-table td.ob-num, .rpeso { white-space: nowrap; }
    }
    @media screen and (max-width: 600px) {
      .topbar { position: static; flex-wrap: wrap; padding: 8px 12px; gap: 6px 10px; }
      .brand { gap: 10px; }
      .brand img { height: 32px; width: auto; flex: 0 0 auto; }
      .brand-text { font-size: 17px; }
      .brand-sub { display: none; }
      .top-actions { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
      .top-actions > * { flex: 0 0 auto; }
      .btn-action { padding: 7px 11px; white-space: nowrap; }
      .controls-bar { padding: 10px 12px; gap: 10px; }
      .report-type-tabs { flex-wrap: wrap; }
      .report-wrapper { margin: 10px auto 0; padding: 0 6px 40px; }
      /* Embedded as report-workflow's Report Preview (iframe + review=1): the
         parent already owns period/type selection and offers "Open full
         screen", so on a phone the iframe shows just the statement instead
         of spending most of its small height on toolbars. */
      html.embedded-review .topbar, html.embedded-review .controls-bar { display: none; }
      /* The paper is laid out at a fixed "design width" (--fit-width, measured
         by fitReportToScreen() from the table's real min-content width) and
         then scaled to the screen with transform: scale() - not CSS zoom,
         whose layout behaviour differs between Chrome versions. Scaling
         leaves the layout box at design size, so the wrapper's height
         (--fit-h) is set to the scaled height to avoid a blank tail. */
      body:not(.report-fullscreen) .report-wrapper { height: var(--fit-h, auto); }
      body:not(.report-fullscreen) .report-page {
        padding: 22px 14px 22px 20px;
        width: var(--fit-width, auto);
        transform: scale(var(--fit-zoom, 1));
        transform-origin: 0 0;
        -webkit-text-size-adjust: none; text-size-adjust: none;
      }
      body:not(.report-fullscreen) .siksik-container,
      body:not(.report-fullscreen) .siksik-container:has(.fs-table.has-budget) { max-width: none; }
      /* Column proportions: the numeric columns shrink-wrap their (nowrap)
         content and the description column takes everything left, so
         member-name detail rows are not squeezed into a sliver. */
      body:not(.report-fullscreen) .fs-table .col-desc,
      body:not(.report-fullscreen) .fs-table.has-budget .col-desc { width: auto; }
      body:not(.report-fullscreen) .fs-table .col-sub,
      body:not(.report-fullscreen) .fs-table .col-main,
      body:not(.report-fullscreen) .fs-table .col-budget,
      body:not(.report-fullscreen) .fs-table .col-pct,
      body:not(.report-fullscreen) .fs-table.has-budget .col-sub,
      body:not(.report-fullscreen) .fs-table.has-budget .col-main { width: 1%; }
      body:not(.report-fullscreen) .fs-table .col-sub { padding-right: 6px; }
      body:not(.report-fullscreen) .fs-table .col-budget,
      body:not(.report-fullscreen) .fs-table .col-pct { padding-right: 4px; padding-left: 4px; }
      body:not(.report-fullscreen) .fs-table td.col-desc { overflow-wrap: break-word; }
      body:not(.report-fullscreen) .fs-table .indent-1 { padding-left: 10px !important; }
      body:not(.report-fullscreen) .fs-table .indent-2 { padding-left: 20px !important; }
      body:not(.report-fullscreen) .fs-table .indent-3,
      body:not(.report-fullscreen) .fs-table td.col-desc[style*="padding-left:54px"] { padding-left: 30px !important; }
      /* "General Fund accounts vs Ending Balance" verdict: it sits in the
         (nowrap) Amount cell and would widen that whole column. With budget
         columns on, lay it out in a fixed-width block whose negative margin
         cancels its width for column sizing, so the text runs on across the
         empty Budget/% cells to its right instead. Without them the same
         zero-net-width trick floats it against the right edge. */
      body:not(.report-fullscreen) .reconcile-row .col-main:has(> .reconcile-ok, > .reconcile-bad) { white-space: normal; text-align: left; }
      body:not(.report-fullscreen) .fs-table.has-budget .reconcile-row .col-main > .reconcile-ok,
      body:not(.report-fullscreen) .fs-table.has-budget .reconcile-row .col-main > .reconcile-bad { display: block; width: 19em; margin-right: -19em; }
      body:not(.report-fullscreen) .fs-table:not(.has-budget) .reconcile-row .col-main > .reconcile-ok,
      body:not(.report-fullscreen) .fs-table:not(.has-budget) .reconcile-row .col-main > .reconcile-bad { float: right; width: 15em; margin-left: -15em; text-align: right; }
      body:not(.report-fullscreen) .obligation-table, body:not(.report-fullscreen) .unbudgeted-table { font-size: 10px; }

  const firebaseConfig = {

  const db = firebase.firestore();

  // Special Project spending only belongs in the church's regular reports when the
  // money actually left the General Fund - Cash on Hand or Cash in Bank. Project
  // costs paid out of the Building/Mission/Petty Cash/Investment funds, or out of
  // the pledges and donations raised for the project itself, are accounted for in
  // the project ledger on special-projects.html and must not be double-reported as
  // church expenses here. Legacy rows stored a payment mode instead of an account
  // id, so both shapes are recognised; a blank account falls back to Cash on Hand
  // the same way the cash-balance code does.
  const GENERAL_FUND_EXPENSE_ACCOUNTS = ['cash-hand', 'cash-bank', 'cash', 'cash on hand', 'cash in bank', 'bank transfer', 'bank'];
  function isReportableSpecialProjectExpense(d) {
    if (!d || !d.isSpecialProject) return true;
    const account = (d.targetAccId || d.payment || 'cash-hand').toString().trim().toLowerCase();
    return GENERAL_FUND_EXPENSE_ACCOUNTS.includes(account);
  }

  let incomeData   = [];
  let expenseData  = [];
  let allIncomeData = [];
  let allExpenseData = [];
  let obligationsData = [];
  // Item 7 (Budget / % Used columns): budgets/{year} is loaded once per year
  // with a one-time .get() and cached here (keyed by year), reloaded only
  // when the selected year changes. A missing doc caches as null ("no
  // budget"), not undefined, so it's never re-fetched needlessly.
  let budgetsCache = {};
  let currentBudgets = null;
  let showBudgetCols = true;
  async function ensureBudgetsForYear(year) {
    if (Object.prototype.hasOwnProperty.call(budgetsCache, year)) return budgetsCache[year];
    try {
      const doc = await db.collection('budgets').doc(String(year)).get();
      budgetsCache[year] = doc.exists ? doc.data() : null;
    } catch (err) {
      console.warn('Unable to load budget for year', year, err);
      budgetsCache[year] = null;
    }
    return budgetsCache[year];
  }
  function toggleBudgetCols(checked) {
    showBudgetCols = checked;
    render();
  }
  // Scheduling helpers mirrored from budget-vs-actual.html (no shared JS
  // modules in this repo - see CLAUDE.md), operating on a passed-in budgets
  // doc rather than a page-level global.
  function getScheduleMonths(sched) {
    if (!sched) return [];
    if (Array.isArray(sched.months) && sched.months.length) {
      return [...new Set(sched.months.map(m => parseInt(m)).filter(m => Number.isInteger(m) && m >= 0 && m <= 11))].sort((a,b)=>a-b);
    }
    if (Number.isInteger(sched.month)) return [sched.month];
    return [];
  }
  function isRecurringExpense(key, budgetsObj) {
    const sched = (budgetsObj.expenseSchedule || {})[key];
    return !sched || sched.recurring !== false;
  }
  function expenseBudgetForMonth(key, month, budgetsObj) {
    const ann = (budgetsObj.expense || {})[key] || 0;
    if (isRecurringExpense(key, budgetsObj)) return ann / 12;
    const months = getScheduleMonths((budgetsObj.expenseSchedule || {})[key]);
    if (!months.length) return 0;
    return months.includes(month) ? ann / months.length : 0;
  }
  function isRecurringIncome(key, budgetsObj) {
    const sched = (budgetsObj.incomeSchedule || {})[key];
    return !sched || sched.recurring !== false;
  }
  function incomeBudgetForMonth(key, month, budgetsObj) {
    const ann = (budgetsObj.income || {})[key] || 0;
    if (isRecurringIncome(key, budgetsObj)) return ann / 12;
    const months = getScheduleMonths((budgetsObj.incomeSchedule || {})[key]);
    if (!months.length) return 0;
    return months.includes(month) ? ann / months.length : 0;
  }
  let specialProjects = [];
  let specialProjectEntries = [];
  let specialProjectCosts = [];
  let memberNameById = {};
  let memberNameByLegacyKey = {};
  let accountOrder = { income: [], expense: [] }; 
  let reportType   = 'monthly';
  let systemInitialBalance = 0; 
  let beginningAccounts = {};
  let generalFundAccounts = {};
  let reportZoom = 1;
  let workflowSignatures = {};

  // ── Review mode (embedded in report-workflow.html's Report Preview card,
  // or opened full screen from there) ────────────────────────────────────
  // Lets a Treasurer/Auditor click a statement line to see the entries
  // behind it (receipts/vouchers for expenses, count sheets for income),
  // and lets the Treasurer fix a missing receipt/voucher/count sheet right
  // there. Never affects the statement's own numbers, and the normal
  // (non-review) page is completely unaffected - reviewMode stays false
  // unless ?review=1 is present AND the gate below passes.
  // (initialReviewRequested itself is set further down, right after
  // initialReportParams is declared - see there.)
  let initialReviewRequested = false;
  let reviewMode = false;
  let reviewGateChecked = false;
  let currentWorkflowStatus = '';
  // Pass-through ("in and out") collections: settings/passThroughItems = { items: [{ side: 'income'|'expense', key, label, ... }] },
  // tagged by the Treasurer in budget-vs-actual.html (Setup Budget); the Council Dashboard only reads them. A tagged Miscellaneous (Unbudgeted) line is shown under its own heading
  // instead (same amounts, only the heading changes). Keys use the same label logic as the Miscellaneous lines:
  // side + '|' + normalizeGroupKey(pickMiscLabel(...)). Read once; a failed read or no tags = nothing changes.
  const PT_INC_MAIN = 'Pass-through Collections (for remittance)';
  const PT_EXP_MAIN = 'Pass-through Remittances';
  let passThroughKeys = new Set();
  const isPassThroughLabel = (side, label) => passThroughKeys.size > 0 && passThroughKeys.has(side + '|' + normalizeGroupKey(label));
  let reviewIncGroups = null; // set by buildIncGroups(fInc) each render; entries kept per sub-line
  let reviewExpGroups = null; // set by buildExpGroups(fExp) each render; entries kept per sub-line
  let reviewIncLineEntries = {}; // 'inc|main|subKey' -> income docs for that displayed line
  let reviewExpLineEntries = {}; // 'exp|main|subCategory' -> expense docs for that displayed line
  let reviewRestrictedEntries = {}; // 'rst|accountId' -> {name, income, expense, transferIn, transferOut} for that restricted account
  let reviewLiquidationMap = new Map();
  let reviewCountSheetMap = new Map();
  let reviewMonthSheetMap = new Map(); // 'YYYY-MM' -> month-level (scope 'month') tally sheet docs; never mixed into the weekly map above
  let reviewDataLoadedForPeriod = '';
  let reviewOpenPanelKeys = new Set();
  let currentRole = (function () {
    try { return sessionStorage.getItem('role') || ''; } catch (e) { return ''; }
  })();
  const FINANCIAL_ACCOUNTS = [
    { id:'cash-hand',  name:'Cash on Hand' },
    { id:'cash-bank',  name:'Cash in Bank' },
    { id:'petty-cash', name:'Petty Cash Fund' },
    { id:'building',   name:'Building Fund' },
    { id:'mission',    name:'Mission Fund' },
    { id:'investment', name:'Investments/TD' }
  ];
  
  // Default Signatories Variables (Nakalagay na ang Label, Name, at Title)
  let signatories = {
    chairpersonLabel: "Approved by",
    chairpersonName: "",
    chairpersonTitle: "Church Council Chairperson",

    financeChairLabel: "Approved by",
    financeChairName: "",
    financeChairTitle: "Finance Chair",

    treasurerLabel: "Prepared by",
    treasurerName: "",
    treasurerTitle: "Church Treasurer",

    auditorLabel: "Audited by",
    auditorName: "",
    auditorTitle: "Church Auditor",

    pastorLabel: "Noted by",
    pastorName: "",
    pastorTitle: "Church Pastor"
  };

  function syncSignatoryInputs() {
    document.getElementById('sig-chairperson-label').value = signatories.chairpersonLabel;

    document.getElementById('sig-treasurer-name').value = signatories.treasurerName;
    document.getElementById('sig-treasurer-title').value = signatories.treasurerTitle;

    document.getElementById('sig-auditor-label').value = signatories.auditorLabel;

    document.getElementById('sig-pastor-name').value = signatories.pastorName;
    document.getElementById('sig-pastor-title').value = signatories.pastorTitle;
  }

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const SPECIAL_PROJECT_SOURCE_LABELS = {
    'Church Fund': 'Church Funds',
    'Pledge': 'Pledges',
    'Direct Contribution': 'Direct Contributions'
  };

  function fmt(num) {
    return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatCategoryName(str) {
    if (!str) return '';
    str = String(str).trim();
    if (!str) return '';
    // Preserve words that are all-uppercase (acronyms like SSS, HDMF, BIR, VAT, etc.)
    return str.split(' ').map(word => {
      if (!word) return word;
      // If the word (ignoring slashes and digits) is all uppercase letters, preserve it
      const letters = word.replace(/[^a-zA-Z]/g, '');
      if (letters.length > 0 && letters === letters.toUpperCase()) return word;
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }).join(' ');
  }

  function getMemberId(d) {
    return (d.memberId || d.memberID || d.memberCode || '').toString().trim();
  }

  // Case/whitespace-insensitive key for merging near-duplicate Miscellaneous
  // (Unbudgeted) sub-labels - e.g. "Meralco" and "MERALCO" - into a single
  // report line instead of one line per spelling variant. Used only for
  // grouping; the *displayed* label is still whichever formatCategoryName()
  // form was seen first for that key, so acronyms in the original text
  // survive rather than being re-derived from a lowercased key.
  function normalizeGroupKey(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  }

  // ── Miscellaneous (Unbudgeted) labelling helpers ───────────────────────
  // The unbudgeted lines are what the Finance Committee reads when deciding
  // next year's budget, so a line must say WHAT it was. Generic words
  // ("Source of Funds", "Not in the budget / Miscellaneous", "Others"...)
  // are not labels; the label is the most specific human text on the entry.
  const MISC_GENERIC_PHRASES = new Set(['source of funds', 'occasional offering', 'special offering', 'miscellaneous', 'misc',
    'others', 'other', 'unbudgeted', 'n a', 'na', 'none', 'general', '']);
  const MISC_GENERIC_WORDS = new Set(['source', 'of', 'funds', 'occasional', 'offering', 'special', 'miscellaneous', 'misc',
    'others', 'other', 'unbudgeted', 'na', 'n', 'a', 'none', 'general']);
  // Strips "not in (the) budget" and edge punctuation; returns '' when what is
  // left is only generic words (case/punctuation-insensitive).
  function cleanMiscLabel(text) {
    const cleaned = String(text || '').replace(/not in( the)? budget/ig, ' ')
      .replace(/^[\s\-\:\/\.,;]+|[\s\-\:\/\.,;]+$/g, '').replace(/\s+/g, ' ').trim();
    const norm = cleaned.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (MISC_GENERIC_PHRASES.has(norm)) return '';
    if (norm.split(' ').every(w => MISC_GENERIC_WORDS.has(w))) return '';
    return cleaned;
  }
  // First candidate that survives cleanMiscLabel(); a candidate may be a
  // plain string (formatted like every other category label) or
  // {text, raw:true} for a person's name, which is shown exactly as stored.
  function pickMiscLabel(candidates, fallback) {
    for (const cand of candidates) {
      const raw = cand && typeof cand === 'object';
      const cleaned = cleanMiscLabel(raw ? cand.text : cand);
      if (cleaned) return raw ? cleaned : formatCategoryName(cleaned);
    }
    return fallback;
  }
  const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // "Mar, Jun, Sep" for an annual report; "5, 19 Sep" for a monthly one.
  function miscWhen(entries, isAnnual) {
    const parsed = entries.map(e => String(e.date || '').match(/^(\d{4})-(\d{2})-(\d{2})/)).filter(Boolean)
      .map(m => ({ mo: parseInt(m[2], 10) - 1, day: parseInt(m[3], 10) }));
    if (!parsed.length) return '';
    if (isAnnual) {
      return [...new Set(parsed.map(p => p.mo))].sort((a, b) => a - b).map(mo => SHORT_MONTHS[mo]).join(', ');
    }
    const days = [...new Set(parsed.map(p => p.day))].sort((a, b) => a - b);
    return `${days.join(', ')} ${SHORT_MONTHS[parsed[0].mo]}`;
  }
  // The single entry's payer/payee when it adds information beyond the label.
  function miscSingleExtra(entries, label, who) {
    if (entries.length !== 1) return '';
    const name = String(who || '').trim();
    if (!name || name.toLowerCase() === 'general collection') return '';
    return normalizeGroupKey(name) === normalizeGroupKey(label) ? '' : name;
  }
  function miscDetailText(entries, isAnnual, extra) {
    const parts = [`${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`];
    const when = miscWhen(entries, isAnnual);
    if (when) parts.push(when);
    if (extra) parts.push(extra);
    return parts.join(' · ');
  }

  // ── Income detail labels ────────────────────────────────────────────────
  // A collection with no payer (member "General Collection" - Loose Offering,
  // Sunday School, Investment Income, special offerings...) must still say
  // WHAT it was. One rule, duplicated per page (see reports.html):
  //   1. a real payer name (not blank / Anonymous / General Collection /
  //      Loose Offering);
  //   2. else the specific detail in budgetDetails, then notes (generic words
  //      like "general collection", "loose offering", "offering" don't count);
  //   3. else a dated fallback, "<Type/Sub> — 7 Sep".
  // Exception: the MONTHLY member lists still show "Anonymous" as its own row
  // (isListedPayerName); everywhere else Anonymous stays payer-less.
  // Presentation only: no amount or total is derived from these labels.
  const INCOME_NONPAYER_NAMES = new Set(['', 'anonymous', 'general collection', 'loose offering']);
  const INCOME_GENERIC_DETAIL = new Set(['general collection', 'general collections', 'loose offering', 'loose offerings',
    'offering', 'offerings', 'collection', 'collections', 'sunday school', 'tithes', 'tithe', 'investment income']);
  function isRealPayerName(name) {
    return !INCOME_NONPAYER_NAMES.has(String(name || '').trim().toLowerCase());
  }
  // Monthly member lists keep "Anonymous" as its own row (owner's choice); it is still never used as a Miscellaneous label.
  function isListedPayerName(name) {
    return isRealPayerName(name) || String(name || '').trim().toLowerCase() === 'anonymous';
  }
  function cleanIncomeDetail(text) {
    let t = cleanMiscLabel(text);
    if (!t) return '';
    const norm = t.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (INCOME_GENERIC_DETAIL.has(norm)) return '';
    if (t.length > 70) t = t.slice(0, 67).trim() + '…';
    return t;
  }
  function incomeDetailOf(d, subLabel) {
    const det = cleanIncomeDetail(d.budgetDetails) || cleanIncomeDetail(d.notes);
    if (det && subLabel && normalizeGroupKey(det) === normalizeGroupKey(subLabel)) return '';
    return det;
  }
  const FULL_WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function incomeDateParts(d) {
    const m = String(d.date || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    const y = +m[1], mo = +m[2] - 1, day = +m[3];
    return { key: m[0], short: `${day} ${SHORT_MONTHS[mo]}`, weekday: FULL_WEEKDAYS[new Date(y, mo, day).getDay()], mo };
  }
  // Consecutive months collapse into ranges: "Jan–Dec", "Jan–Sep, Dec", "Mar, Jun".
  function incomeMonthsText(entries) {
    const mos = [...new Set(entries.map(e => (incomeDateParts(e) || {}).mo).filter(x => x !== undefined))].sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i < mos.length;) {
      let j = i;
      while (j + 1 < mos.length && mos[j + 1] === mos[j] + 1) j++;
      if (j - i >= 2) out.push(`${SHORT_MONTHS[mos[i]]}–${SHORT_MONTHS[mos[j]]}`);
      else for (let k = i; k <= j; k++) out.push(SHORT_MONTHS[mos[k]]);
      i = j + 1;
    }
    return out.join(', ');
  }
  // Monthly rows for the payer-less entries of one income sub-line:
  // [{label, amt}] - one row per date for Sunday-type lines, otherwise one
  // per distinct label (specific detail, else dated fallback).
  function buildGeneralIncomeRows(entries, subLabel, sundayLine, isMiscLine) {
    const rows = {}, order = [];
    entries.forEach(d => {
      const amt = parseFloat(d.amount || 0);
      const dp = incomeDateParts(d);
      const det = incomeDetailOf(d, subLabel);
      let label, key, isDetail = false;
      if (sundayLine) {
        key = 'd|' + (dp ? dp.key : '');
        label = dp ? `${dp.weekday}, ${dp.short}` : subLabel;
      } else if (det) {
        key = 'l|' + normalizeGroupKey(det); label = det; isDetail = true;
      } else {
        label = dp ? `${subLabel} — ${dp.short}` : subLabel;
        key = 'l|' + normalizeGroupKey(label);
      }
      if (!rows[key]) { rows[key] = { label, amt: 0, n: 0, date: dp ? dp.key : '', details: [], isDetail }; order.push(key); }
      const r = rows[key];
      r.amt += amt; r.n += 1;
      if (sundayLine && det && !r.details.some(x => normalizeGroupKey(x) === normalizeGroupKey(det))) r.details.push(det);
      if (dp && (!r.date || dp.key < r.date)) r.date = dp.key;
    });
    return order.map(k => rows[k])
      // A Miscellaneous line is already named after its detail; repeating it as its own row adds nothing.
      .filter(r => !(isMiscLine && r.isDetail && normalizeGroupKey(r.label) === normalizeGroupKey(subLabel)))
      .sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.label.localeCompare(b.label))
      .map(r => {
        let label = r.label;
        if (r.details.length) label += ' — ' + r.details.join('; ');
        else if (!sundayLine && r.n > 1) label += ` (${r.n} entries)`;
        return { label, amt: r.amt };
      });
  }
  // Annual: up to 8 detail rows (by total, biggest first) for a payer-less,
  // non-Sunday line whose entries carry specific details, the rest under Others.
  function buildAnnualGeneralRows(entries, subLabel) {
    const groups = {}, order = [];
    let otherAmt = 0, otherN = 0;
    entries.forEach(d => {
      const amt = parseFloat(d.amount || 0);
      const det = incomeDetailOf(d, subLabel);
      if (!det) { otherAmt += amt; otherN += 1; return; }
      const key = normalizeGroupKey(det);
      if (!groups[key]) { groups[key] = { label: det, amt: 0, n: 0 }; order.push(key); }
      groups[key].amt += amt; groups[key].n += 1;
    });
    if (!order.length) return [];
    const list = order.map(k => groups[k]).sort((a, b) => b.amt - a.amt || a.label.localeCompare(b.label));
    const shown = list.slice(0, 8);
    list.slice(8).forEach(g => { otherAmt += g.amt; otherN += g.n; });
    const out = shown.map(g => ({ label: g.n > 1 ? `${g.label} (${g.n} entries)` : g.label, amt: g.amt }));
    if (otherN) out.push({ label: `Others (${otherN} ${otherN === 1 ? 'entry' : 'entries'})`, amt: otherAmt });
    return out;
  }

  // Adds `amt` to a Miscellaneous-style group keyed by the case/whitespace
  // -insensitive form of `label`, recording the first-seen label as the
  // group's display text. `bucket.totals` maps normalized key -> amount,
  // `bucket.labels` maps normalized key -> display label.
  function addToMiscBucket(bucket, label, amt) {
    const key = normalizeGroupKey(label) || 'other unbudgeted';
    if (!bucket.labels[key]) bucket.labels[key] = label || 'Other Unbudgeted';
    bucket.totals[key] = (bucket.totals[key] || 0) + amt;
    return key;
  }

  function resolveMemberName(d) {
    const memberId = getMemberId(d);
    if (memberId && memberNameById[memberId]) return memberNameById[memberId];
    const rawName = (d.member || d.name || d.Member || '').trim();
    const legacyName = memberNameByLegacyKey[normalizeMemberLookupName(rawName)];
    if (legacyName && legacyName !== '__AMBIGUOUS__') return legacyName;
    return rawName || 'General Collection';
  }

  function formatMemberName(d) {
    const last = d.last || d.lastName || '';
    const first = d.first || d.firstName || '';
    return `${last}, ${first}`.replace(/^,\s*|\s*,\s*$/g, '').trim();
  }

  function normalizeMemberLookupName(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function addMemberNameAlias(rawName, currentName) {
    const key = normalizeMemberLookupName(rawName);
    if (!key || !currentName) return;
    if (memberNameByLegacyKey[key] && memberNameByLegacyKey[key] !== currentName) {
      memberNameByLegacyKey[key] = '__AMBIGUOUS__';

    }
    memberNameByLegacyKey[key] = currentName;

  function addMemberNameAliases(d, currentName) {
    const last = (d.last || d.lastName || '').toString().trim();
    const first = (d.first || d.firstName || '').toString().trim();
    const firstToken = first.split(/\s+/).filter(Boolean)[0] || '';

    addMemberNameAlias(currentName, currentName);
    addMemberNameAlias(`${last}, ${first}`, currentName);
    addMemberNameAlias(`${first} ${last}`, currentName);
    addMemberNameAlias(`${last} ${first}`, currentName);
    if (firstToken && firstToken !== first) {
      addMemberNameAlias(`${firstToken} ${last}`, currentName);
      addMemberNameAlias(`${last}, ${firstToken}`, currentName);
      addMemberNameAlias(`${last} ${firstToken}`, currentName);
    }
  }

  // ── Legacy "Cash Advance Return" income docs ───────────────────────────
  // Before liquidation-reimbursements.html stopped creating them, an
  // itemized reconcile of an UNDERSPENT cash advance (a) deleted the
  // release-time placeholder expense for the full advance and replaced it
  // with item expenses for the spent amount only - which already restores the
  // unspent money to the fund - and then (b) ALSO added a type:'transfer'
  // "Cash Advance Return" income doc for the unspent balance, crediting the
  // fund a second time (financial-overview.html adds income-transfers to the
  // account balance). Per the owner the return must be silent: not income,
  // not shown here. So such a doc is dropped from EVERY income-side pool in
  // this report (incomeData, transfer netting, account balances used by the
  // reconciliation, Restricted Fund Activity, review panels, Excel), which
  // keeps both sides of the reconciliation on the same basis.
  // A return whose linked request was reconciled on paper (no
  // liquidationItems, placeholder expense kept) is legitimate and stays.
  const CASH_ADVANCE_RETURN_LABEL = 'cash advance return';
  const PLACEHOLDER_ADVANCE_CATEGORY = 'Non-Budgeted - Staff Cash Advance (Pending Liquidation)';
  let rawIncomeDocs = null;            // every income doc as loaded
  let liquidationItemizedById = null;  // Map reqId -> true/false once liquidationRequests were readable
  function isCashAdvanceReturnDoc(d) {
    return !!d && [d.category, d.budgetCategory, d.type].some(v => String(v || '').trim().toLowerCase() === CASH_ADVANCE_RETURN_LABEL);
  }
  // True when the return's linked request was reconciled with itemized
  // expenses (so the placeholder was replaced and the return double-counts).
  function requestWasItemized(reqId) {
    if (!reqId) return false;
    if (liquidationItemizedById) return liquidationItemizedById.get(reqId) === true;
    // liquidationRequests not readable for this role (e.g. Finance
    // Committee): infer from expenses - an itemized reconcile leaves
    // categorized expenses linked to the request, a paper one only leaves the
    // placeholder.
    return allExpenseData.some(e => e.linkedLiquidationRequestId === reqId && e.category !== PLACEHOLDER_ADVANCE_CATEGORY);
  }
  function isDuplicateCashAdvanceReturn(d) {
    return isCashAdvanceReturnDoc(d) && requestWasItemized(d.linkedLiquidationRequestId);
  }
  function rebuildIncomeData() {
    if (!rawIncomeDocs) return;
    // Keep the complete income pool for Financial Overview account balances.
    allIncomeData = rawIncomeDocs.filter(d => !d.isSpecialProject && !isDuplicateCashAdvanceReturn(d));
    incomeData = allIncomeData.filter(d => {
      // Skip transfers - a fund transfer is a cash movement between
      // accounts, not real income; generateReportHTML() nets transfers
      // separately (see its own "Skip transfers" comment) so the General
      // Fund ending balance still reconciles with the true account
      // balances. Building Fund income is deliberately no longer excluded
      // here: it now flows into whichever of the General Fund / Restricted
      // Fund Activity sections its account belongs to (see
      // isGeneralFundAccount()), instead of silently vanishing from the
      // report entirely as it used to.
      if (d.type === 'transfer') return false;
      // Skip legacy special project inflows; project reports handle these separately.
      if (d.isSpecialProject) return false;
      return true;
    });
  }

  db.collection('income').get().then(s => {
    // A doc with no date counts as 2026-01-01, exactly as Financial Overview
    // treats it, so the two never disagree about an undated entry.
    rawIncomeDocs = s.docs.map(d => ({ id: d.id, ...d.data() })).map(d => d.date ? d : { ...d, date: '2026-01-01', dateDefaulted: true });
    rebuildIncomeData();
    render();
  });

  // One-time read, only to tell itemized reconciles from paper ones (see
  // above). Roles that cannot read liquidationRequests fall back to the
  // expense-based inference in requestWasItemized().
  db.collection('liquidationRequests').get().then(s => {
    liquidationItemizedById = new Map();
    s.forEach(doc => { const d = doc.data() || {}; liquidationItemizedById.set(doc.id, Array.isArray(d.liquidationItems) && d.liquidationItems.length > 0); });
    rebuildIncomeData();
    render();
  }).catch(err => {
    console.warn('liquidationRequests not readable; inferring itemized reconciles from expenses', err && err.message);
    liquidationItemizedById = null;
  });

  db.collection('expenses').get().then(s => {
    // Keep the complete expense pool for Financial Overview account balances.
    allExpenseData = s.docs.map(d => ({ id: d.id, ...d.data() })).map(d => d.date ? d : { ...d, date: '2026-01-01', dateDefaulted: true }); // undated = 2026-01-01, as in Financial Overview
    // Deduction-payment entries settle a liability already expensed at gross when
    // payroll was generated (the withheld amount is part of that gross figure).
    // Counting them again here would double the expense for the same cash outflow.
    // Special Project expenses are only church expenses when they were paid out
    // of Cash on Hand / Cash in Bank (see helper above); allExpenseData keeps the
    // complete pool so account balances and the project report stay accurate.
    expenseData = allExpenseData.filter(d => d.type !== 'transfer' && d.type !== 'deduction-payment' && isReportableSpecialProjectExpense(d));
    rebuildIncomeData(); // the expense-based fallback in requestWasItemized() needs these
    render();

  // Function pang-save ng Signatories sa Firebase (Tatlong fields per person)
