    const fundingGroups = groupRows(projectEntries, e => SPECIAL_PROJECT_SOURCE_LABELS[e.sourceType] || 'Other Contributions');
    const fundingRows = Object.keys(fundingGroups).sort((a, b) => {
      const order = ['Church Funds', 'Pledges', 'Direct Contributions', 'Other Contributions'];
      const ai = order.indexOf(a) === -1 ? order.length : order.indexOf(a);
      const bi = order.indexOf(b) === -1 ? order.length : order.indexOf(b);
      return ai - bi || a.localeCompare(b);
    }).map(main => {
      const rows = fundingGroups[main];
      const total = rows.reduce((sum, r) => sum + Number(r.amount || 0), 0);
      return `
        <tr>
          <td class="col-desc indent-1" style="font-weight:bold;">${escapeHtml(main)}</td>
          <td class="col-sub"></td>
          <td class="col-main">₱ ${fmt(total)}</td>
        </tr>
        ${rows.map(r => {
          const source = r.sourceType === 'Church Fund'
            ? `${r.sourceAccountName || r.sourceAccount || 'Church Fund'}${r.particulars ? ' - ' + r.particulars : ''}`
            : `${r.pledgerName || r.party || 'Contributor'}${r.particulars ? ' - ' + r.particulars : ''}`;
          return `
            <tr>
              <td class="col-desc indent-2">${escapeHtml(source)} <span style="color:#777;font-size:11px;">${escapeHtml(r.date || '')}</span></td>
              <td class="col-sub">₱ ${fmt(r.amount || 0)}</td>
              <td class="col-main"></td>
            </tr>`;
        }).join('')}`;
    }).join('');

    const receiptRows = showsProceeds
      ? specialProjectEntries.filter(e => e.projectId === project.id && e.type === 'Receipt')
          .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')))
          .map(r => `
            <tr>
              <td class="col-desc indent-2">${escapeHtml(r.party || r.particulars || (isActivityContribution ? 'Contribution' : 'Receipt'))} <span style="color:#777;font-size:11px;">${escapeHtml(r.date || '')}</span></td>
              <td class="col-sub">₱ ${fmt(r.amount || 0)}</td>

            </tr>`).join('')
      : '';

    return `
      <div class="siksik-container" id="printable-content">
        <div class="rpt-header">
          <img src="umc-logo.png" alt="UMC Logo" onerror="this.style.display='none'">
          <div class="rpt-header-text">

            <div class="rpt-title">${escapeHtml(project.name || 'Special Project Report')}</div>

        </div>

        <table class="fs-table" id="export-table">
          <tr class="section-header"><td colspan="3">Project Details</td></tr>
          <tr><td class="col-desc indent-1" style="color:#667085;">Type</td><td class="col-sub"></td><td class="col-main" style="color:#334;">${escapeHtml(project.projectType || 'Special Project')}</td></tr>
          <tr><td class="col-desc indent-1" style="color:#667085;">Status</td><td class="col-sub"></td><td class="col-main" style="color:${isClosed ? '#667085' : '#1e8449'};font-weight:700;">${isClosed ? 'Closed' + (closedDateStr ? ' — ' + closedDateStr : '') : 'Open'}</td></tr>
          ${project.startDate ? `<tr><td class="col-desc indent-1" style="color:#667085;">Started</td><td class="col-sub"></td><td class="col-main" style="color:#334;">${escapeHtml(project.startDate)}</td></tr>` : ''}
          ${project.notes ? `<tr><td class="col-desc indent-1" style="color:#667085;vertical-align:top;">Notes</td><td class="col-sub"></td><td class="col-main" style="color:#334;white-space:pre-wrap;">${escapeHtml(project.notes)}</td></tr>` : ''}
          <tr class="spacer-row"><td colspan="3"></td></tr>

          <tr class="section-header"><td colspan="3">Financial Summary</td></tr>
          <tr class="bold-row"><td class="col-desc">Total Project Cost</td><td class="col-sub"></td><td class="col-main">₱ ${fmt(costTotal)}</td></tr>
          <tr class="bold-row"><td class="col-desc">Total Funding Secured</td><td class="col-sub"></td><td class="col-main">₱ ${fmt(fundingTotal)}</td></tr>
          ${fundingPct !== null ? `<tr><td class="col-desc indent-1" style="color:#667085;">Funding Progress</td><td class="col-sub"></td><td class="col-main" style="color:${fundingPct >= 100 ? '#1e8449' : '#9a5b00'};font-weight:700;">${fundingPct}%</td></tr>` : ''}
          <tr class="total-row"><td class="col-desc">${surplus > 0 ? 'Project Surplus' : 'Remaining Need'}</td><td class="col-sub"></td><td class="col-main ${remainingNeed > 0 ? 'amount-negative' : 'amount-positive'}">₱ ${fmt(surplus > 0 ? surplus : remainingNeed)}</td></tr>
          <tr class="spacer-row"><td colspan="3"></td></tr>

          ${showsProceeds ? `
          <tr class="section-header"><td colspan="3">${escapeHtml(proceedsHeading)}</td></tr>
          <tr><td class="col-desc indent-1" style="color:#667085;">Total ${escapeHtml(grossLabel)}</td><td class="col-sub"></td><td class="col-main">₱ ${fmt(grossReceipts)}</td></tr>
          <tr><td class="col-desc indent-1" style="color:#667085;">Expenses Incurred</td><td class="col-sub"></td><td class="col-main">₱ ${fmt(expensesIncurred)}</td></tr>
          <tr class="total-row"><td class="col-desc">Net Proceeds</td><td class="col-sub"></td><td class="col-main ${netProceeds < 0 ? 'amount-negative' : 'amount-positive'}">₱ ${fmt(netProceeds)}</td></tr>
          ${(Array.isArray(project.proceedsPostings) && project.proceedsPostings.length) ? project.proceedsPostings.map(p => { const amt = Number(p.amount || 0); return `<tr><td class="col-desc indent-1" style="color:#667085;">${p.kind === 'adjustment' ? 'Correction' : 'Posted to Income'}${p.date ? ' \u2014 ' + escapeHtml(String(p.date).slice(0, 10)) : ''}</td><td class="col-sub"></td><td class="col-main" style="color:${amt < 0 ? '#c0392b' : '#1e8449'};">${amt < 0 ? '-' : ''}₱ ${fmt(Math.abs(amt))}</td></tr>`; }).join('') + `<tr><td class="col-desc indent-1" style="color:#667085;"><strong>Total Posted to Income</strong></td><td class="col-sub"></td><td class="col-main" style="color:#1e8449;"><strong>${project.proceedsPostings.reduce((s, p) => s + Math.round(Number(p.amount || 0) * 100), 0) < 0 ? '-' : ''}₱ ${fmt(Math.abs(project.proceedsPostings.reduce((s, p) => s + Math.round(Number(p.amount || 0) * 100), 0)) / 100)}</strong></td></tr>` : ''}
          ${(!(Array.isArray(project.proceedsPostings) && project.proceedsPostings.length) && project.linkedIncomeId) ? `<tr><td class="col-desc indent-1" style="color:#667085;">Posted to Income</td><td class="col-sub"></td><td class="col-main" style="color:#1e8449;">₱ ${fmt(project.linkedIncomeAmount || 0)}${project.linkedIncomePostedAt ? ' on ' + escapeHtml(String(project.linkedIncomePostedAt).slice(0, 10)) : ''}</td></tr>` : ''}
          <tr class="spacer-row"><td colspan="3"></td></tr>
          <tr class="section-header"><td colspan="3">${escapeHtml(grossLabel)}</td></tr>
          ${receiptRows || `<tr><td class="indent-1 col-desc" colspan="3" style="color:#aaa;padding:8px 0;">No ${isActivityContribution ? 'contributions' : 'receipts'} recorded.</td></tr>`}
          <tr class="spacer-row"><td colspan="3"></td></tr>` : ''}

          <tr class="section-header"><td colspan="3">Cost Breakdown</td></tr>
          ${hasMixedBasis ? `
          <tr><td class="col-desc indent-1" style="color:#667085;">Actual</td><td class="col-sub"></td><td class="col-main" style="color:#1e8449;">₱ ${fmt(actualCostTotal)}</td></tr>
          <tr><td class="col-desc indent-1" style="color:#667085;">Estimated</td><td class="col-sub"></td><td class="col-main" style="color:#9a5b00;">₱ ${fmt(estimatedCostTotal)}</td></tr>
          <tr class="spacer-row"><td colspan="3"></td></tr>` : ''}
          ${costRows || '<tr><td class="indent-1 col-desc" colspan="3" style="color:#aaa;padding:8px 0;">No cost breakdown recorded.</td></tr>'}
          <tr class="spacer-row"><td colspan="3"></td></tr>

          <tr class="section-header"><td colspan="3">Source of Funding</td></tr>
          ${fundingRows || '<tr><td class="indent-1 col-desc" colspan="3" style="color:#aaa;padding:8px 0;">No funding sources recorded.</td></tr>'}
        </table>

        <div class="sig-section">
          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${signatories.chairpersonLabel}</div>
            ${workflowSignatureHtml('chairperson', signatories.chairpersonName, signatories.chairpersonTitle)}
          </div>
          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${signatories.financeChairLabel}</div>
            ${workflowSignatureHtml('financeChair', signatories.financeChairName, signatories.financeChairTitle)}
          </div>
          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${signatories.treasurerLabel}</div>
            ${workflowSignatureHtml('treasurer', signatories.treasurerName, signatories.treasurerTitle)}
          </div>
          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${signatories.auditorLabel}</div>
            ${workflowSignatureHtml('auditor', signatories.auditorName, signatories.auditorTitle)}
          </div>
          <div class="sig-box">
            <div style="text-align:left; font-size:11px; margin-bottom:30px;">${signatories.pastorLabel}</div>
            ${workflowSignatureHtml('pastor', signatories.pastorName, signatories.pastorTitle)}

        <div class="rpt-footer">
          <span>GraceBooks — TUMC Finance System</span>
          <span>Special Project Report · ${escapeHtml(project.name || '')}</span>
        </div>
      </div>`;
  }

  const KNOWN_ACCOUNT_IDS = new Set(FINANCIAL_ACCOUNTS.map(account => account.id));

  function normalizeAccountId(value) {
    const raw = String(value || '').trim();
    return KNOWN_ACCOUNT_IDS.has(raw) ? raw : '';
  }

  // The Building Fund is ALWAYS a restricted fund in this statement, whatever
  // the Treasurer's per-account "General Fund" setting says: it is reported
  // separately (Restricted Fund Activity) and never mixed into the General
  // Fund Receipts/Disbursements. Every other account still follows the
  // setting (default: General Fund).
  function isGeneralFundAccount(id) {
    if (id === 'building') return false;
    return generalFundAccounts[id] !== false;
  }

  // Is this income/expense entry Building Fund money? True for an explicit
  // 'building' account, or when its budgetCategory/type/category names the
  // Building Fund (same "building fund" text test budget-vs-actual.html's
  // isBuildingFund() uses, applied to each field so it doesn't matter which
  // one carries it). Used wherever an income/expense ENTRY is classified as
  // General Fund vs restricted - the account alone is not enough, because a
  // Building Fund entry can be posted to (or paid from) cash-on-hand/bank.
  // Fund transfers (type:'transfer') are not classified by this: they are
  // pure account-to-account movements, decided by their account alone.
  function isBuildingFundEntry(d, isExpense) {
    if (!d) return false;
    // The entry's account as Financial Overview resolves it (an income's
    // typed Building Fund already resolves to 'building').
    if ((isExpense ? getExpenseAccountId(d) : getIncomeAccountId(d)) === 'building') return true;
    return [d.budgetCategory, d.type, d.category].some(v => String(v || '').toLowerCase().includes('building fund'));
  }
  function isGeneralFundIncome(d) {
    return !isBuildingFundEntry(d, false) && isGeneralFundAccount(getIncomeAccountId(d));
  }
  function isGeneralFundExpense(d) {
    return !isBuildingFundEntry(d, true) && isGeneralFundAccount(getExpenseAccountId(d));
  }
  // The account a restricted-side entry is REPORTED under in Restricted Fund
  // Activity. Building Fund money sitting in a General Fund account (e.g.
  // cash-hand) is reported under 'building'; anything else stays under the
  // account it was actually posted to.
  function getIncomeReportAccountId(d) {
    const id = getIncomeAccountId(d);
    return (isBuildingFundEntry(d, false) && isGeneralFundAccount(id)) ? 'building' : id;
  }
  function getExpenseReportAccountId(d) {
    const id = getExpenseAccountId(d);
    return (isBuildingFundEntry(d, true) && isGeneralFundAccount(id)) ? 'building' : id;
  }

  function getGeneralFundBeginningBalance() {
    return FINANCIAL_ACCOUNTS
      .filter(account => isGeneralFundAccount(account.id))
      .reduce((sum, account) => sum + (parseFloat(beginningAccounts[account.id]) || 0), 0);
  }

  // Account resolution mirrors financial-overview.html's own rules EXACTLY
  // (its income/expense listeners), because this statement's balances must
  // tally with Financial Overview's Grand Total and each account balance.
  // Income: a typed fund (Building Fund / Mission Fund / Investment Income)
  // OVERRIDES any explicit account; otherwise the doc's `targetAccount` (NOT
  // `targetAccId` - every income writer, tithe-entry and special-projects
  // included, sets targetAccount; Financial Overview's own transfers set
  // both), else Cash in Bank when paid by Bank Transfer, else Cash on Hand.
  // An id that is not one of the six known accounts stays as-is and is
  // simply skipped by getAccountBalancesThrough(), as Financial Overview
  // skips it.
  function getIncomeAccountId(d) {
    if (d.type === 'Building Fund') return 'building';
    if (d.type === 'Mission Fund') return 'mission';
    if (d.type === 'Investment Income') return 'investment';
    if (d.targetAccount) return d.targetAccount;
    return d.payment === 'Bank Transfer' ? 'cash-bank' : 'cash-hand';
  }

  // Expense: `targetAccId`, else the payment mapping (Bank Transfer ->
  // Cash in Bank, Petty Cash -> Petty Cash Fund), else Cash on Hand - the same
  // as Financial Overview's expense listener.
  function getExpenseAccountId(d) {
    return d.targetAccId || (d.payment === 'Bank Transfer' ? 'cash-bank' : d.payment === 'Petty Cash' ? 'petty-cash' : 'cash-hand');
  }

  function getExpenseCashImpact(d) {
    // Payroll is recognized as an expense at gross, but the withheld portion
    // (tithe/SSS/other deductions) only actually leaves the cash account later via
    // a separate deduction-payment record. Using the gross amount here for payroll
    // would double-subtract that withheld portion once the deduction is remitted -
    // mirrors the cash-impact logic in financial-overview.html.
    const netPay = parseFloat(d.netPay);
    const hasNetPayroll = d.isPayrollGenerated && !d.isBenefit && Number.isFinite(netPay);
    return hasNetPayroll ? Math.max(0, netPay) : (parseFloat(d.amount) || 0);
  }

  // The true per-account cash balances through `endDate`. Deliberately the
  // same rules as financial-overview.html's combineAndRender(): every income
  // doc except special-project inflows (INCLUDING type:'transfer' credits),
  // every expense doc (including transfers, deduction-payments and special-
  // project costs) at its net cash impact, an entry with a missing date
  // counted as 2026-01-01 (done where the docs are loaded), and an entry
  // whose account is not one of the six known ones skipped. The only
  // deliberate difference is the duplicate legacy "Cash Advance Return"
  // income docs, which are dropped from allIncomeData (see above) until the
  // Treasurer removes them in Liquidation & Reimbursements.
  function getAccountBalancesThrough(endDate) {
    const balances = {};
    FINANCIAL_ACCOUNTS.forEach(a => balances[a.id] = parseFloat(beginningAccounts[a.id] || 0));

    allIncomeData.forEach(d => {
      if (!d.date || new Date(d.date) > endDate) return;
      const id = getIncomeAccountId(d);
      if (balances[id] === undefined) return;
      balances[id] += parseFloat(d.amount || 0);
    });

    allExpenseData.forEach(d => {
      if (!d.date || new Date(d.date) > endDate) return;
      const id = getExpenseAccountId(d);
      if (balances[id] === undefined) return;
      balances[id] -= getExpenseCashImpact(d);
    });

    return balances;
  }

  // ── EXPORT FUNCTIONALITY ──────────────────────────────────────────────────
  function exportToExcel() {
    const year  = parseInt(document.getElementById('sel-year').value);
    const month = parseInt(document.getElementById('sel-month').value);
    const isAnnual = reportType === 'annual';
    const periodText = isAnnual
      ? `For the Year ${year}`
      : `For the Month of ${MONTHS[month]} ${year}`;
    const filename = isAnnual
      ? `Financial_Report_${year}.xlsx`
      : `Financial_Report_${MONTHS[month]}_${year}.xlsx`;

    // ── Helpers ──────────────────────────────────────────────────────────────
    const wb = XLSX.utils.book_new();
    const ws = {};
    let R = 0; // current row (0-indexed)

    // Cell address helper
    const addr = (r, c) => XLSX.utils.encode_cell({ r, c });

    // Write a cell with optional style
    function cell(r, c, v, s) {
      const a = addr(r, c);
      ws[a] = { v, t: typeof v === 'number' ? 'n' : 's', s: s || {} };
    }

    // Merge helper — pushes to ws['!merges']
    if (!ws['!merges']) ws['!merges'] = [];
    function merge(r1, c1, r2, c2) {
      ws['!merges'].push({ s: { r: r1, c: c1 }, e: { r: r2, c: c2 } });
    }

    // ── Shared style objects ─────────────────────────────────────────────────
    const RED   = 'FF8B0000';
    const GOLD  = 'FFC9A84C';
    const DARK  = 'FF1A1A1A';
    const GRAY  = 'FF555555';
    const WHITE = 'FFFFFFFF';
    const LGRAY = 'FFF5F5F5';

    const fontBase   = { name: 'Calibri', sz: 10 };
    const fontBold   = { ...fontBase, bold: true };
    const fontHeader = { name: 'Calibri', sz: 13, bold: true, color: { rgb: WHITE } };
    const fontSub    = { name: 'Calibri', sz: 10, color: { rgb: GRAY } };
    const fontTitle  = { name: 'Calibri', sz: 14, bold: true };
    const fontChurch = { name: 'Calibri', sz: 16, bold: true, color: { rgb: RED } };
    const fontSection = { name: 'Calibri', sz: 10, bold: true, color: { rgb: WHITE } };
    const fontIndent1 = { name: 'Calibri', sz: 10, bold: true };
    const fontIndent2 = { name: 'Calibri', sz: 9.5, color: { rgb: '44333333' } };
    const fontTotal  = { name: 'Calibri', sz: 11, bold: true };

    const alignR  = { horizontal: 'right', vertical: 'center' };
    const alignC  = { horizontal: 'center', vertical: 'center' };
    const alignL  = { horizontal: 'left',  vertical: 'center' };

    const borderThin = { style: 'thin', color: { rgb: 'FFCCCCCC' } };
    const borderMed  = { style: 'medium', color: { rgb: DARK } };
    const borderDbl  = { style: 'double', color: { rgb: DARK } };
    const borderRed  = { style: 'medium', color: { rgb: RED } };

    const numFmt = '₱ #,##0.00';

    // Style factories
    function sAmount(extra = {}) {
      return { font: { ...fontBase, ...extra.font }, alignment: alignR,
               numFmt, border: extra.border || {} };
    }
    function sAmountBold(extra = {}) {
      return { font: { ...fontBold, ...extra.font }, alignment: alignR,
               numFmt, border: extra.border || {} };
    }

    // ── HEADER ROWS ──────────────────────────────────────────────────────────
    // Row 0: Church name (merged A-C)
    merge(R, 0, R, 2);
    cell(R, 0, 'Tagaytay United Methodist Church', {
      font: fontChurch, alignment: alignC
    });
    R++;

    // Row 1: Address
    merge(R, 0, R, 2);
    cell(R, 0, 'Maglabe Drive, Asisan, Tagaytay City', {
      font: fontSub, alignment: alignC
    });
    R++;

    // Row 2: Report title
    merge(R, 0, R, 2);
    cell(R, 0, 'Statement of Receipts and Disbursements', {
      font: fontTitle, alignment: alignC
    });
    R++;

    // Row 3: Period
    merge(R, 0, R, 2);
    cell(R, 0, periodText, {
      font: { ...fontBase, italic: true }, alignment: alignC
    });
    R++;

    // Spacer
    R++;

    // ── Reads data from the already-rendered report HTML ──────────────────────
    // We pull the live data from the DOM's rendered report table rows.
    // This is the most reliable source since generateReportHTML already processed everything.
    const reportTable = document.getElementById('export-table');
    if (!reportTable) { alert('No report data to export.'); return; }

    const rows = reportTable.querySelectorAll('tr');

    rows.forEach(tr => {
      const tds = tr.querySelectorAll('td');
      if (!tds.length) return;

      const cls = tr.className || '';
      // Review mode (report-workflow.html's embedded preview) inserts its
      // own supporting-document panel rows into this same table and marks
      // review-only bits (like the 📎 count clip appended to a line's
      // label) with data-export-skip - neither should ever reach the
      // export. A panel row is skipped outright here (same idea as the
      // obligation-wrapper-row skip below); cellText() strips
      // data-export-skip content out of an otherwise-real cell.
      if (cls.includes('review-panel-row') || cls.includes('screen-only-note-row')) { return; }
      const cellText = td => {
        if (!td) return '';
        if (!td.querySelector('[data-export-skip]')) return td.innerText.trim();
        const clone = td.cloneNode(true);
        clone.querySelectorAll('[data-export-skip]').forEach(el => el.remove());
        return clone.innerText.trim();
      };
      const tdCls0 = tds[0] ? (tds[0].className || '') : '';
      const text0  = cellText(tds[0]);
      const text1  = cellText(tds[1]);
      const text2  = cellText(tds[2]);
      // Budget / % Used (Item 7) - only present (tds[3]/tds[4]) when the
      // "Show budget columns" toggle is on; a plain 3-column row simply has
      // no tds[3]/tds[4] and these come back empty.
      const text3  = cellText(tds[3]);
      const text4  = cellText(tds[4]);

      // Helper: parse peso text to number
      const parsePeso = t => parseFloat((t || '').replace(/[₱,\s]/g, '')) || null;
      // Same idea, but a genuine ₱0.00 (e.g. an obligation with nothing paid
      // yet) must come through AS zero, not fall through to blank the way
      // `0 || null` above does - parsePeso's fallback reads a 0 amount as
      // "no amount text", which the Church Obligations table (Item 6) hits
      // routinely (an unpaid obligation's Paid column is legitimately 0).
      const parsePesoStrict = t => {
        if (!t) return null;
        const n = parseFloat(t.replace(/[₱,\s]/g, ''));
        return Number.isFinite(n) ? n : null;
      };
      // Writes the Budget (col D) / % Used (col E) pair for the current row,
      // reusing whichever font the row's other cells used so the extra
      // columns read consistently with the rest of the line.
      function appendBudgetCols(font) {
        const budgetAmt = parsePeso(text3);
        if (budgetAmt !== null) cell(R, 3, budgetAmt, { font: font || fontBase, alignment: alignR, numFmt });
        else if (text3) cell(R, 3, text3, { font: font || fontBase, alignment: alignR });
        if (text4) cell(R, 4, text4, { font: font || fontBase, alignment: alignR });
      }

      // ── Church Obligations compact sub-table (Item 6) - the wrapper row's
      // own single <td colspan> holds the *entire* nested table, so it must
      // be skipped here (its innerText would otherwise read as one giant,
      // meaningless cell); the nested table's own rows are still visited by
      // this same querySelectorAll('tr') walk right after it, in document
      // order, and are handled by the three branches below instead. ──
      // ── Unbudgeted items block (annual): same nested-table treatment. ──
      if (cls.includes('unbudgeted-wrapper-row')) { return; }
      if (cls.includes('unbudgeted-header-row')) {
        const ubCols = [tds[0], tds[1], tds[2], tds[3], tds[4]].map(td => td ? td.innerText.trim() : '');
        ubCols.forEach((t, i) => cell(R, i, t, { font: fontSection, fill: { patternType: 'solid', fgColor: { rgb: RED } }, alignment: (i === 2 || i === 4) ? alignR : alignL }));
        R++; return;
      }
      if (cls.includes('unbudgeted-row')) {
        cell(R, 0, tds[0] ? tds[0].innerText.trim() : '', { font: fontBase, alignment: { ...alignL, wrapText: true } });
        cell(R, 1, tds[1] ? tds[1].innerText.trim() : '', { font: fontBase, alignment: alignL });
        const ubCount = parseInt((tds[2] ? tds[2].innerText : '').trim(), 10);
        if (Number.isFinite(ubCount)) cell(R, 2, ubCount, { font: fontBase, alignment: alignR });
        cell(R, 3, tds[3] ? tds[3].innerText.trim() : '', { font: fontBase, alignment: { ...alignL, wrapText: true } });
        const ubAmt = parsePesoStrict(tds[4] ? tds[4].innerText.trim() : '');
        if (ubAmt !== null) cell(R, 4, ubAmt, sAmount());
        R++; return;
      }
      if (cls.includes('obligation-wrapper-row')) { return; }
      if (cls.includes('obligation-header-row')) {
        const obCols = [tds[0], tds[1], tds[2], tds[3], tds[4], tds[5]].map(td => td ? td.innerText.trim() : '');
        obCols.forEach((t, i) => cell(R, i, t, { font: fontSection, fill: { patternType: 'solid', fgColor: { rgb: RED } }, alignment: i >= 2 ? alignR : alignL }));
        R++; return;
      }
      if (cls.includes('obligation-totals-row')) {
        // tds[0] carries colspan="2" (Obligation + Due Date) but is still
        // one <td> element, so Amount/Paid/Balance are tds[1..3] here, not
        // tds[2..4] - the obligation-row branch below has no such colspan
        // and does use [2,3,4].
        cell(R, 0, tds[0] ? tds[0].innerText.trim() : 'Total', { font: fontBold, alignment: alignL, border: { top: borderThin } });
        [1, 2, 3].forEach((tdIdx, n) => {
          const amt = parsePesoStrict(tds[tdIdx] ? tds[tdIdx].innerText.trim() : '');
          if (amt !== null) cell(R, 2 + n, amt, sAmountBold({ border: { top: borderThin } }));
        });
        R++; return;
      }
      if (cls.includes('obligation-row')) {
        cell(R, 0, tds[0] ? tds[0].innerText.trim() : '', { font: fontBase, alignment: alignL });
        cell(R, 1, tds[1] ? tds[1].innerText.trim() : '', { font: fontBase, alignment: alignC });
        [2, 3, 4].forEach(i => {
          const amt = parsePesoStrict(tds[i] ? tds[i].innerText.trim() : '');
          if (amt !== null) cell(R, i, amt, sAmount());
        });
        cell(R, 5, tds[5] ? tds[5].innerText.trim() : '', { font: fontBase, alignment: alignC });
        R++; return;
      }

      // ── Column header row (Account / Detail / Amount[ / Budget / % Used]) ──
      if (cls.includes('col-header-row')) {
        const headFill = { patternType: 'solid', fgColor: { rgb: RED } };
        cell(R, 0, text0, { font: fontSection, fill: headFill, alignment: { ...alignL, indent: 1 } });
        cell(R, 1, text1, { font: fontSection, fill: headFill, alignment: alignC });
        cell(R, 2, text2, { font: fontSection, fill: headFill, alignment: alignC });
        if (text3) cell(R, 3, text3, { font: fontSection, fill: headFill, alignment: alignC });
        if (text4) cell(R, 4, text4, { font: fontSection, fill: headFill, alignment: alignC });
        R++; return;
      }

      // ── Reconciliation line (General Fund accounts vs Ending Balance,
      // Payroll withholdings held for remittance) ──
      if (cls.includes('reconcile-row')) {
        const amt = parsePeso(text2);
        cell(R, 0, text0, { font: fontBold, alignment: alignL });
        if (amt !== null) {
          cell(R, 2, amt, sAmount());
        } else if (text2) {
          // The on-screen check/cross is rendered as coloured HTML; innerText
          // still gives the plain "✓ Matches..." / "✗ Off by ₱..." text.
          cell(R, 2, text2, { font: fontBold, alignment: alignR });
        }
        R++; return;
      }

      // ── Section header (Receipts / Disbursements) ──
      if (cls.includes('section-header')) {
        merge(R, 0, R, 2);
        cell(R, 0, text0.replace(/\n/g, ' '), {
          font: fontSection,
          fill: { patternType: 'solid', fgColor: { rgb: RED } },
          alignment: { ...alignL, indent: 1 },
          border: { bottom: borderRed }
        });
        R++; return;
      }

      // ── Spacer row ──
      if (cls.includes('spacer-row')) { R++; return; }

      // ── Total row (Ending Balance) ──
      if (cls.includes('total-row')) {
        const amt = parsePeso(text2);
        cell(R, 0, text0, {
          font: fontTotal, alignment: alignL,
          border: { top: borderMed, bottom: borderDbl }
        });
        cell(R, 1, text1 || '', { alignment: alignC });
        if (amt !== null) {
          cell(R, 2, amt, {
            font: fontTotal, alignment: alignR, numFmt,
            border: { top: borderMed, bottom: borderDbl }
          });
        }
        appendBudgetCols(fontTotal);
        R++; return;
      }

      // ── Subtotal row ──
      if (cls.includes('subtotal-row')) {
        const amt = parsePeso(text2);
        cell(R, 0, text0, {
          font: fontBold, alignment: alignL,
          border: { top: borderThin }
        });
        cell(R, 1, text1 || '', { alignment: alignC });
        if (amt !== null) {
          cell(R, 2, amt, sAmountBold({ border: { top: borderThin } }));
        }
        appendBudgetCols(fontBold);
        R++; return;
      }

      // ── Bold row (Beginning Balance, Total Cash Available) ──
      if (cls.includes('bold-row')) {
        const amt = parsePeso(text2);
        cell(R, 0, text0, { font: fontBold, alignment: alignL });
        cell(R, 1, text1 || '', { alignment: alignC });
        if (amt !== null) {
          cell(R, 2, amt, sAmountBold());
        }
        appendBudgetCols(fontBold);
        R++; return;
      }

      // ── Category (indent-1, bold) ──
      if (tdCls0.includes('indent-1')) {
        const amt = parsePeso(text2);
        cell(R, 0, '  ' + text0, {
          font: fontIndent1, alignment: alignL,
          fill: { patternType: 'solid', fgColor: { rgb: 'FFF9F2F2' } }
        });
        cell(R, 1, '', {
          fill: { patternType: 'solid', fgColor: { rgb: 'FFF9F2F2' } }
        });
        if (amt !== null) {
          cell(R, 2, amt, {
            font: fontIndent1, alignment: alignR, numFmt,
            fill: { patternType: 'solid', fgColor: { rgb: 'FFF9F2F2' } }
          });
        }
        appendBudgetCols(fontIndent1);
        R++; return;
      }

      // ── Sub-category (indent-2) ──
      // Its total now lives in col-main (Amount), not col-sub (Detail) - see
      // generateReportHTML()'s report-line levelling: a sub-category total
      // and its own detail rows must never share a column, or the sheet
      // reads like the details are additional amounts on top of the total.
      if (tdCls0.includes('indent-2')) {
        const subAmt = parsePeso(text2);
        cell(R, 0, '      ' + text0, { font: fontIndent2, alignment: alignL });
        cell(R, 1, '', {});
        if (subAmt !== null) {
          cell(R, 2, subAmt, { font: fontIndent2, alignment: alignR, numFmt });
        }
        appendBudgetCols(fontIndent2);
        R++; return;
      }

      // ── Detail rows (indent-3) - only ever the budget's own multi-level
      // categories (see generateReportHTML), never free-text notes. Kept in
      // col-sub (Detail) so paper, screen and Excel agree on where a
      // sub-category's own breakdown belongs. ──
      if (tdCls0.includes('indent-3')) {
        const detailAmt = parsePeso(text1);
        cell(R, 0, '          ' + text0, {
          font: { ...fontBase, sz: 9, color: { rgb: GRAY } }, alignment: alignL
        });
        if (detailAmt !== null) {
          cell(R, 1, detailAmt, {
            font: { ...fontBase, sz: 9, color: { rgb: GRAY } }, alignment: alignR, numFmt
          });
        }
        cell(R, 2, '', {});
        R++; return;
      }

      // ── Sub-sub rows (member breakdown, small indent) ──
      if (tds.length >= 2 && text0.startsWith('-')) {
        const amt = parsePeso(text1);
        cell(R, 0, '          ' + text0, {
          font: { ...fontBase, sz: 9, color: { rgb: GRAY } }, alignment: alignL
        });
        if (amt !== null) {
          cell(R, 1, amt, {
            font: { ...fontBase, sz: 9, color: { rgb: GRAY } }, alignment: alignR, numFmt
          });
        }
        cell(R, 2, '', {});
        R++; return;
      }
    });

    // Spacer before signatures
    R += 2;

    // ── SIGNATURE BLOCK ──────────────────────────────────────────────────────
    // 5 columns: Chairperson | Finance Chair | Treasurer | Auditor | Pastor
    // Label row
    cell(R, 0, signatories.chairpersonLabel || 'Approved by', { font: fontBase, alignment: alignC });
    cell(R, 1, signatories.financeChairLabel || 'Approved by', { font: fontBase, alignment: alignC });
    cell(R, 2, signatories.treasurerLabel || 'Prepared by', { font: fontBase, alignment: alignC });
    cell(R, 3, signatories.auditorLabel || 'Audited by', { font: fontBase, alignment: alignC });
    cell(R, 4, signatories.pastorLabel || 'Noted by', { font: fontBase, alignment: alignC });
    R += 3; // space for signature

    // Signature line + name
    const sigLine = { top: { style: 'thin', color: { rgb: DARK } } };
    cell(R, 0, signatories.chairpersonName || '', { font: fontBold, alignment: alignC, border: sigLine });
    cell(R, 1, signatories.financeChairName || '', { font: fontBold, alignment: alignC, border: sigLine });
    cell(R, 2, signatories.treasurerName || '', { font: fontBold, alignment: alignC, border: sigLine });
    cell(R, 3, signatories.auditorName || '', { font: fontBold, alignment: alignC, border: sigLine });
    cell(R, 4, signatories.pastorName || '', { font: fontBold, alignment: alignC, border: sigLine });
    R++;

    // Title
    cell(R, 0, signatories.chairpersonTitle || 'Church Council Chairperson', { font: fontSub, alignment: alignC });
    cell(R, 1, signatories.financeChairTitle || 'Finance Chair', { font: fontSub, alignment: alignC });
    cell(R, 2, signatories.treasurerTitle || 'Church Treasurer', { font: fontSub, alignment: alignC });
    cell(R, 3, signatories.auditorTitle || 'Church Auditor', { font: fontSub, alignment: alignC });
    cell(R, 4, signatories.pastorTitle || 'Church Pastor', { font: fontSub, alignment: alignC });
    R++;

    // ── Footer ──────────────────────────────────────────────────────────────
    R++;
    merge(R, 0, R, 4);
    cell(R, 0, `GraceBooks — TUMC Finance System · ${MONTHS[month] || ''} ${year}`, {
      font: { ...fontBase, sz: 8.5, color: { rgb: 'FFAAAAAA' } }, alignment: alignC
    });

    // ── Sheet dimensions ─────────────────────────────────────────────────────
    // Column F (index 5) only ever holds the obligation sub-table's Status
    // column; every other section of the sheet uses A-E.
    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: R, c: 5 } });
    ws['!cols'] = [
      { wch: 42 }, // A: description (wide)
      { wch: 16 }, // B: sub amount / obligation due date
      { wch: 16 }, // C: main amount
      { wch: 16 }, // D: budget (Item 7) / obligation paid
      { wch: 16 }, // E: % used (Item 7) / obligation balance
      { wch: 14 }, // F: obligation status
    ];
    ws['!rows'] = [
      { hpt: 22 }, // church name
      { hpt: 14 }, // address
      { hpt: 18 }, // title
      { hpt: 13 }, // period
    ];

    XLSX.utils.book_append_sheet(wb, ws, 'Financial Report');
    XLSX.writeFile(wb, filename);
  }

  // ══════════════════════════════════════════════════════════════════════
  // REVIEW MODE — embedded statement review for report-workflow.html's
  // Report Preview card (and its "Open full screen" link). See CLAUDE.md,
  // "Report workflow" / "Print Report" sections. Everything below only
  // ever runs when reviewMode is true (see updateReviewModeGate()); the
  // normal page never calls any of it.
  // ══════════════════════════════════════════════════════════════════════

  // Auditor picks up the auth-ready role slightly after this script first
  // runs (sessionStorage is usually already warm from an earlier page in
  // the same session, but this covers a cold/direct load too).
  if (window.graceBooksAuthReady) {
    window.graceBooksAuthReady.then(profile => {
      if (profile && profile.role && profile.role !== currentRole) {
        currentRole = profile.role;
        updateReviewModeGate();
        applyReviewModeUI();
      }
    }).catch(() => {});
  }

  function applyReviewModeUI() {
    const slot = document.getElementById('review-banner-slot');
    if (!slot) return;
    if (!initialReviewRequested) { slot.innerHTML = ''; return; }
    if (reviewMode) {
      slot.innerHTML = `<div class="review-banner no-print">📎 Review mode — click a line to see its supporting documents.</div>`;
    } else {
      const reason = (reportType !== 'monthly' && reportType !== 'annual')
        ? 'Review mode is only available for the Monthly and Annual statements.'
        : (currentRole === 'Auditor'
            ? 'Review mode appears once the Treasurer submits this report.'
            : 'Review mode is not available for your role.');
      slot.innerHTML = `<div class="review-banner no-print" style="background:#f3f3f3; border-color:#ddd; color:#777;">${escapeHtml(reason)}</div>`;
    }
    // Collapse any panel left open from a previous render (the table was
    // just rebuilt from scratch by generateReportHTML).
    reviewOpenPanelKeys.clear();
  }

  // ── One-time supporting data (liquidationRequests, countSheets) ────────
  // Loaded once per period, the first time a panel is opened in review
  // mode - never on page load, and never for the normal (non-review) page.
  async function ensureReviewSupportData() {
    const periodKey = currentWorkflowId();
    if (reviewDataLoadedForPeriod === periodKey) return;
    const liquidationIds = [...new Set(
      (fExpForReview()).flatMap(d => [d.linkedLiquidationRequestId, d.sourceLiquidationRequestId]).filter(Boolean)
    )];
    const [liqSnaps, sheetSnap] = await Promise.all([
      Promise.all(liquidationIds.map(id => db.collection('liquidationRequests').doc(id).get())),
      db.collection('countSheets')
        .where('date', '>=', reviewPeriodRange().start)
        .where('date', '<=', reviewPeriodRange().end)
        .get()
        .catch(err => { console.warn('Unable to load count sheets for review mode.', err); return { docs: [] }; })
    ]);
    reviewLiquidationMap = new Map();
    liqSnaps.forEach(snap => { if (snap.exists) reviewLiquidationMap.set(snap.id, { id: snap.id, ...snap.data() }); });
    reviewCountSheetMap = new Map();
    // Month-level tally sheets (scope 'month', dated YYYY-MM-01) fall inside
    // this date-range query but are NOT any Sunday's sheet - kept out of the
    // weekly map (see reviewMonthSheetMap / ensureReviewMonthlyLine()).
    sheetSnap.docs.forEach(d => { if (d.data().scope !== 'month') reviewCountSheetMap.set(d.id, { id: d.id, ...d.data() }); });
    reviewDataLoadedForPeriod = periodKey;
  }

  function fExpForReview() {
    // The same General-Fund, period-filtered expense pool generateReportHTML
    // built as fExp - recomputed cheaply from expenseData rather than piping
    // an extra return value through generateReportHTML.
    const year = parseInt(document.getElementById('sel-year').value);
    const isAnnual = reportType === 'annual';
    const month = parseInt(document.getElementById('sel-month').value);
    return expenseData.filter(d => {
      if (!d.date) return false;
      const dt = new Date(d.date);
      return isAnnual ? dt.getFullYear() === year : (dt.getFullYear() === year && dt.getMonth() === month);
    });
  }

  function reviewPeriodRange() {
    const year = parseInt(document.getElementById('sel-year').value);
    if (reportType === 'annual') return { start: `${year}-01-01`, end: `${year}-12-31` };
    const month = String(parseInt(document.getElementById('sel-month').value) + 1).padStart(2, '0');
    return { start: `${year}-${month}-01`, end: `${year}-${month}-31` };
  }

  // ── Panel toggling ───────────────────────────────────────────────────
  async function toggleReviewPanel(trEl) {
    const rk = trEl.getAttribute('data-rk');
    if (!rk) return;
    const existing = trEl.nextElementSibling;
    if (existing && existing.classList.contains('review-panel-row') && existing.getAttribute('data-panel-for') === rk) {
      existing.remove();
      reviewOpenPanelKeys.delete(rk);
      return;
    }
    // Close any other open panel for this same row (defensive - shouldn't
    // normally exist) and insert a loading placeholder immediately.
    const colCount = trEl.querySelectorAll('td').length;
    const panelRow = document.createElement('tr');
    panelRow.className = 'review-panel-row review-only';
    panelRow.setAttribute('data-panel-for', rk);
    panelRow.innerHTML = `<td colspan="${colCount}"><div class="review-panel"><div class="review-panel-loading">Loading…</div></div></td>`;
    trEl.parentNode.insertBefore(panelRow, trEl.nextSibling);
    reviewOpenPanelKeys.add(rk);

    try {
      await ensureReviewSupportData();
      const [type] = rk.split('|');
      const html = type === 'exp' ? buildExpensePanelHtml(rk) : (type === 'rst' ? buildRestrictedPanelHtml(rk) : buildIncomePanelHtml(rk));
      const cell = panelRow.querySelector('td > div');
      if (cell) cell.innerHTML = html;
    } catch (error) {
      console.error(error);
      const cell = panelRow.querySelector('td > div');
      if (cell) cell.innerHTML = `<span style="color:#b03a2e;">Unable to load supporting documents: ${escapeHtml(error.message || 'Unknown error')}</span>`;
    }
  }

  // ── Expense line panel (receipts / vouchers / payslips) ─────────────────
  const LIQUIDATION_PLACEHOLDER_ADVANCE_CATEGORY = 'Non-Budgeted - Staff Cash Advance (Pending Liquidation)';

  function liquidationReceiptPool(request) {
    const existing = (request.liquidationReceipts || []).concat(request.supportingReceipts || []);
    const seen = new Set();
    const pool = [];
    existing.forEach(receipt => {
      const id = receipt.receiptId || receipt.receiptPath;
      if (!id || seen.has(id)) return;
      seen.add(id);
      pool.push({ id, name: receipt.receiptName || 'Receipt', url: receipt.receiptUrl });
    });
    return pool;
  }

  function findMatchingLiquidationItem(request, expense) {
    const items = request.liquidationItems || [];
    if (!items.length) return null;
    // Split expenses from an overspent cash advance carry only a partial
    // amount, so the amount match below can't find them - prefer the
    // explicit item index written at reconcile/release time. The description
    // guard keeps a stale index from binding to the wrong item.
    const idx = expense.liquidationItemIndex;
    if (Number.isInteger(idx) && idx >= 0 && idx < items.length
      && (!expense.sub || !items[idx].description || items[idx].description === expense.sub)) {
      return items[idx];
    }
    const matches = items.filter(item => {
      const amountMatch = Math.abs(Number(item.amount || 0) - Number(expense.amount || 0)) < 0.01;
      const descMatch = (item.description || '') === (expense.sub || '');
      const dateMatch = !item.date || !expense.date || item.date === expense.date;
      return amountMatch && descMatch && dateMatch;
    });
    return matches.length === 1 ? matches[0] : null;
  }

  // Mirrors report-workflow.html's resolveExpenseReceipts() exactly (no
  // shared JS modules in this repo - see CLAUDE.md).
  function resolveExpenseReceipts(expense) {
    const candidates = [];
    if (expense.receiptUrl) {
      candidates.push({
        id: 'own', name: expense.receiptName || 'Receipt', url: expense.receiptUrl,
        annotations: expense.receiptAnnotations || [], locked: !!expense.receiptAnnotationsLocked, source: 'expense'
      });
    }
    const request = expense.linkedLiquidationRequestId ? reviewLiquidationMap.get(expense.linkedLiquidationRequestId) : null;
    let isFallbackPool = false;
    let awaitingLiquidation = false;
    if (request) {
      const isCashAdvanceRequest = request.type !== 'Reimbursement';
      awaitingLiquidation = isCashAdvanceRequest
        && ['Released', 'Liquidation Submitted'].includes(request.status)
        && expense.category === LIQUIDATION_PLACEHOLDER_ADVANCE_CATEGORY;
      // Reimbursed part of an overspent cash advance: items/receipts live on
      // the SOURCE cash advance request (see report-workflow.html).
      const itemRequest = (expense.liquidationSplit === 'reimburse' && expense.sourceLiquidationRequestId
        && reviewLiquidationMap.get(expense.sourceLiquidationRequestId)) || request;
      if (!candidates.length) {
        const pool = liquidationReceiptPool(itemRequest);
        const matchedItem = findMatchingLiquidationItem(itemRequest, expense);
        if (matchedItem && (matchedItem.receiptIds || []).length) {
          matchedItem.receiptIds.forEach(receiptId => {
            const found = pool.find(p => p.id === receiptId);
            if (found) {
              candidates.push({
                id: found.id, name: found.name, url: found.url,
                annotations: (matchedItem.annotations || []).filter(a => a.receiptId === receiptId),
                locked: !!matchedItem.annotationsLocked, source: 'item'
              });
            }
          });
        } else if (pool.length) {
          isFallbackPool = true;
          pool.forEach(p => candidates.push({ id: p.id, name: p.name, url: p.url, annotations: [], locked: false, source: 'pool' }));
        }
      }
    }
    const voucherId = expense.voucherId || (request && request.voucherId) || '';
    const voucherNo = expense.voucherNo || (request && request.voucherNo) || '';
    return { candidates, isFallbackPool, awaitingLiquidation, voucherId, voucherNo, requestId: request ? request.id : null };
  }

  // Keeps the last-rendered expense entries + their resolved receipts so
  // the receipt viewer/chooser and the Treasurer action buttons can find
  // them by id without re-resolving on every click.
  let reviewExpenseById = new Map();
  let reviewResolvedById = new Map();

  function buildExpensePanelHtml(rk) {
    const entries = (reviewExpLineEntries[rk] || []).slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
    if (!entries.length) return '<div class="muted">No entries.</div>';
    return `<div data-rk="${escapeAttr(rk)}">` + entries.map(e => renderExpenseEntryHtml(e)).join('') + `</div>`;
  }

  function renderExpenseEntryHtml(e) {
    reviewExpenseById.set(e.id, e);
    const resolved = resolveExpenseReceipts(e);
    reviewResolvedById.set(e.id, resolved);
    let receiptCell;
    if (resolved.candidates.length === 0) {
      if (resolved.awaitingLiquidation) {
        receiptCell = '<span class="rbadge rbadge-awaiting">Awaiting liquidation</span>';
      } else {
        receiptCell = '<span class="rbadge rbadge-missing">No receipt</span>';
      }
    } else {
      const label = resolved.candidates.length === 1 && !resolved.isFallbackPool
        ? 'View Receipt'
        : (resolved.isFallbackPool ? `Receipts on liquidation request (${resolved.candidates.length})` : `View Receipts (${resolved.candidates.length})`);
      receiptCell = `<button type="button" class="rbtn rbtn-view" onclick="openReviewReceipt('${escapeAttr(e.id)}')">${escapeHtml(label)}</button>`;
    }
    const voucherCell = resolved.voucherId
      ? `<a href="cash-voucher.html?view=${encodeURIComponent(resolved.voucherId)}" target="_blank" rel="noopener noreferrer" class="rbtn rbtn-view">🧾 ${escapeHtml(resolved.voucherNo || 'View Voucher')}</a>`
      : '<span class="rbadge rbadge-missing">No voucher</span>';
    const liquidationLink = e.linkedLiquidationRequestId
      ? ` <a href="liquidation-reimbursements.html" target="_blank" rel="noopener noreferrer" class="rbtn rbtn-view" title="Open Liquidation / Reimbursements">🔗 Liquidation</a>`
      : '';
    const payslipLink = e.isPayrollGenerated
      ? ` <a href="payslips.html?period=monthly&month=${encodeURIComponent(e.payrollMonth || String(e.date || '').slice(0, 7))}&role=${encodeURIComponent(e.role || '')}" target="_blank" rel="noopener noreferrer" class="rbtn rbtn-view">View Payslip</a>`
      : '';

    let treasurerActions = '';
    if (currentRole === 'Treasurer') {
      const uploadLabel = resolved.candidates.length ? 'Replace' : 'Upload receipt';
      treasurerActions = `
        <label class="rbtn rbtn-upload" style="cursor:pointer;">
          ${escapeHtml(uploadLabel)}
          <input type="file" accept="image/*,application/pdf" style="display:none;" onchange="handleReviewReceiptFile('${escapeAttr(e.id)}', this)">
        </label>
        ${!resolved.voucherId ? `<button type="button" class="rbtn rbtn-voucher" onclick="makeReviewVoucher('${escapeAttr(e.id)}')">Make voucher</button>` : ''}
        <button type="button" class="rbtn rbtn-refresh" title="Refresh this entry" onclick="refreshReviewExpense('${escapeAttr(e.id)}')">↻</button>
      `;
    }

    return `
      <div class="review-entry" id="review-entry-${escapeAttr(e.id)}">
        <div class="review-entry-main">
          ${escapeHtml(e.date || '-')} · ${escapeHtml(e.payee || e.category || 'Expense')} · <span class="rpeso">₱ ${fmt(e.amount || 0)}</span>
        </div>
        <div class="review-entry-actions">
          ${receiptCell}
          ${voucherCell}
          ${liquidationLink}
          ${payslipLink}
          ${treasurerActions}
        </div>
      </div>`;
  }

  function refreshReviewEntryRow(id) {
    const el = document.getElementById(`review-entry-${CSS.escape(id)}`);
    if (!el) return;
    const e = reviewExpenseById.get(id);
    if (!e) return;
    el.outerHTML = renderExpenseEntryHtml(e);
  }

  async function refreshReviewExpense(id) {
    try {
      const doc = await db.collection('expenses').doc(id).get();
      if (!doc.exists) return;
      const fresh = { id: doc.id, ...doc.data() };
      const old = reviewExpenseById.get(id) || {};
      Object.keys(old).forEach(k => delete old[k]);
      Object.assign(old, fresh);
      for (const reqId of [old.linkedLiquidationRequestId, old.sourceLiquidationRequestId].filter(Boolean)) {
        const reqDoc = await db.collection('liquidationRequests').doc(reqId).get();
        if (reqDoc.exists) reviewLiquidationMap.set(reqDoc.id, { id: reqDoc.id, ...reqDoc.data() });
      }
      refreshReviewEntryRow(id);
    } catch (error) {
      console.error(error);
      alert('Unable to refresh this entry: ' + (error.message || error));
    }
  }

  // ── Treasurer: upload/replace a receipt ─────────────────────────────────
  function generateStorageToken() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }
  function safeFileExtension(fileName) {
    const match = /\.([a-zA-Z0-9]{1,8})$/.exec(fileName || '');
    return match ? `.${match[1].toLowerCase()}` : '';
  }
  function receiptContentType(file) {
    const fileType = (file && file.type || '').toLowerCase();
    const fileName = (file && file.name || '').toLowerCase();
    if (fileType.startsWith('image/') || fileType === 'application/pdf') return fileType;
    if (fileName.endsWith('.pdf')) return 'application/pdf';
    if (fileName.endsWith('.png')) return 'image/png';
    if (fileName.endsWith('.jpg') || fileName.endsWith('.jpeg')) return 'image/jpeg';
    if (fileName.endsWith('.gif')) return 'image/gif';
    if (fileName.endsWith('.webp')) return 'image/webp';
    return '';
  }

  async function writeReviewAuditLog(action, docId, before, after, summary, collection) {
    const user = firebase.auth().currentUser;
    await db.collection('auditLogs').add({
      action, collection: collection || 'expenses', docId, summary,
      before: before || null, after: after || null,
      actorUid: user ? user.uid : '', actorEmail: user ? user.email : '',
      actorName: (window.graceBooksUser && window.graceBooksUser.name) || '',
      actorRole: currentRole || '', createdAt: new Date().toISOString()
    });
  }

  async function handleReviewReceiptFile(expenseId, inputEl) {
    const file = inputEl.files && inputEl.files[0];
    inputEl.value = '';
    if (!file) return;
    const contentType = receiptContentType(file);
    if (!(contentType.startsWith('image/') || contentType === 'application/pdf')) {
      alert('Receipt must be an image or PDF file.');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      alert('Receipt must be 5 MB or smaller.');
      return;
    }
    const e = reviewExpenseById.get(expenseId);
    if (!e) return;
    const oldPath = (!e.receiptSharedFromLiquidation && e.receiptPath) ? e.receiptPath : null;
    let receiptPath = '';
    try {
      receiptPath = `expense-receipts/${expenseId}/${generateStorageToken()}${safeFileExtension(file.name)}`;
      const ref = storage.ref(receiptPath);
      await ref.put(file, { contentType });
      const receiptUrl = await ref.getDownloadURL();
      const payload = {
        receiptName: file.name, receiptPath, receiptUrl,
        receiptUploadedAt: new Date().toISOString()
      };
      if (oldPath) {
        payload.receiptAnnotations = [];
        payload.receiptAnnotationsLocked = firebase.firestore.FieldValue.delete();
        payload.receiptAnnotationsUpdatedAt = firebase.firestore.FieldValue.delete();
        payload.receiptAnnotationsUpdatedBy = firebase.firestore.FieldValue.delete();
        payload.receiptSharedFromLiquidation = firebase.firestore.FieldValue.delete();
      }
      await db.collection('expenses').doc(expenseId).update(payload);
      await writeReviewAuditLog(
        oldPath ? 'receipt_replaced' : 'receipt_uploaded', expenseId,
        oldPath ? { receiptPath: oldPath } : null,
        { receiptName: file.name, receiptPath, fileSize: file.size, fileType: file.type },
        oldPath ? `Replaced receipt for expense ${expenseId} (via Report Preview review mode)` : `Uploaded receipt for expense ${expenseId} (via Report Preview review mode)`
      );
      if (oldPath) { try { await storage.ref(oldPath).delete(); } catch (err) { console.warn(err); } }
      Object.assign(e, payload, { receiptAnnotations: oldPath ? [] : (e.receiptAnnotations || []), receiptAnnotationsLocked: oldPath ? false : e.receiptAnnotationsLocked, receiptSharedFromLiquidation: oldPath ? false : e.receiptSharedFromLiquidation });
      refreshReviewEntryRow(expenseId);
    } catch (error) {
      console.error(error);
      if (receiptPath) {
        alert('The receipt file uploaded, but saving it to the expense record failed. Please try again — the orphaned file will not appear anywhere else.\n\n' + (error.message || error));
      } else {
        alert('Unable to upload receipt: ' + (error.message || error));
      }
    }
  }

  function makeReviewVoucher(expenseId) {
    const e = reviewExpenseById.get(expenseId);
    if (!e) return;
    const url = e.linkedLiquidationRequestId
      ? `cash-voucher.html?liquidationId=${encodeURIComponent(e.linkedLiquidationRequestId)}`
      : `cash-voucher.html?expenseId=${encodeURIComponent(expenseId)}`;
    window.open(url, '_blank', 'noopener');
    lastVoucherFlowExpenseId = expenseId;
  }
  let lastVoucherFlowExpenseId = null;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lastVoucherFlowExpenseId && reviewMode) {
      const id = lastVoucherFlowExpenseId;
      lastVoucherFlowExpenseId = null;
      refreshReviewExpense(id);
    }
  });

  // ── Receipt viewer (review mode) ─────────────────────────────────────────
  function openReviewReceipt(expenseId) {
    const record = reviewExpenseById.get(expenseId);
    const resolved = reviewResolvedById.get(expenseId);
    if (!record || !resolved || !resolved.candidates.length) return;
    if (resolved.candidates.length === 1) { openReviewReceiptCandidate(record, resolved.candidates[0]); return; }
    document.getElementById('review-receipt-viewer-title').textContent = resolved.isFallbackPool
      ? 'Receipts on Liquidation Request' : `Receipts (${resolved.candidates.length})`;
    document.getElementById('review-receipt-viewer-body').innerHTML = `
      <ul class="receipt-chooser-list" style="list-style:none; padding:0; margin:0;">
        ${resolved.candidates.map((c, i) => `
          <li style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #eee;">
            <span>${escapeHtml(c.name || 'Receipt')}</span>
            <button type="button" class="rbtn rbtn-view" onclick="openReviewReceiptCandidateByIndex('${escapeAttr(expenseId)}', ${i})">View</button>
          </li>`).join('')}
      </ul>`;
    document.getElementById('reviewReceiptViewerModal').style.display = 'flex';
  }
  function openReviewReceiptCandidateByIndex(expenseId, index) {
    const record = reviewExpenseById.get(expenseId);
    const resolved = reviewResolvedById.get(expenseId);
    if (!record || !resolved || !resolved.candidates[index]) return;
    closeReviewReceiptViewer();
    openReviewReceiptCandidate(record, resolved.candidates[index]);
  }
  function openReviewReceiptCandidate(record, candidate) {
    const isPdf = !window.GraceBooksAnnotator || !window.GraceBooksAnnotator.isAnnotatableUrl(candidate.name, candidate.url);
    if (isPdf) {
      document.getElementById('review-receipt-viewer-title').textContent = candidate.name || 'Receipt';
      document.getElementById('review-receipt-viewer-body').innerHTML =
        `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:150px;">
           <p style="margin:0; color:#555;">PDF files open in a new browser tab for viewing.</p>
           <a href="${escapeHtml(candidate.url)}" target="_blank" rel="noopener noreferrer" class="rbtn rbtn-view">Open PDF in New Tab</a>
         </div>`;
      document.getElementById('reviewReceiptViewerModal').style.display = 'flex';
      return;
    }
    window.GraceBooksAnnotator.open({
      title: candidate.name || 'Receipt', imageUrl: candidate.url, fileName: candidate.name || '',
      subtitle: `${record.category || record.sub || 'Expense'} — ₱${fmt(record.amount || 0)}`,
      annotations: candidate.annotations || [], editable: false, locked: !!candidate.locked
    });
  }
  function closeReviewReceiptViewer() {
    document.getElementById('review-receipt-viewer-body').innerHTML = '';
    document.getElementById('reviewReceiptViewerModal').style.display = 'none';
  }

  // ── Income line panel (dates / entries / count sheets) ──────────────────
  let reviewIncomeDateCache = new Map(); // date -> {sheets, entries}

  function buildIncomePanelHtml(rk) {
    const entries = reviewIncLineEntries[rk] || [];
    if (!entries.length) return '<div class="muted">No entries.</div>';
    const byDate = new Map();
    entries.forEach(e => {
      const date = e.date || 'Unknown date';
      if (!byDate.has(date)) byDate.set(date, []);
      byDate.get(date).push(e);
    });
    const dates = [...byDate.keys()].sort();
    return dates.map(date => renderIncomeDateGroupHtml(date, byDate.get(date))).join('');
  }

  function renderIncomeDateGroupHtml(date, entries) {
    reviewIncomeDateCache.set(date, entries);
    const lineTotal = entries.reduce((s, r) => s + Number(r.amount || 0), 0);
    // A count sheet covers the whole Sunday, not just the report line that
    // was clicked, so every count-sheet check below (linked count, cash
    // counted vs recorded, entries changed since count) runs against ALL of
    // that date's income entries - the rows listed still show only this
    // line's entries.
    const dayEntries = reviewDayEntries(date, entries);
    const total = dayEntries.reduce((s, r) => s + Number(r.amount || 0), 0);
    const cashTotal = dayEntries.filter(r => r.payment === 'Cash').reduce((s, r) => s + Number(r.amount || 0), 0);
    const sheets = [...reviewCountSheetMap.values()].filter(s => s.date === date && s.scope !== 'month');
    const linkedCount = dayEntries.filter(r => r.countSheetId).length;

    let sheetCell;
    if (!sheets.length) {
      sheetCell = '<span class="rbadge rbadge-missing">No count sheet</span>';
      if (currentRole === 'Treasurer') {
        sheetCell += ` <button type="button" class="rbtn rbtn-upload" title="You can select 2 or more photos at once (front/back, receipts)" onclick="openAttachCountSheetPrompt('${escapeAttr(date)}')">Attach count sheet</button>`;
      }
    } else {
      const label = sheets.length > 1 ? `View Count Sheets (${sheets.length})` : 'View Count Sheet';
      const totalFiles = sheets.reduce((n, sh) => n + (sh.files || []).length, 0);
      if (!totalFiles) {
        // The sheet doc (denominations, income links) stays even when its
        // last photo was removed - it just has no photo any more.
        sheetCell = '<span style="font-size:11px; color:#888;">Count sheet (no photo)</span>';
        if (currentRole === 'Treasurer') {
          sheetCell += ` · <button type="button" class="rbtn rbtn-upload" title="You can select 2 or more photos at once" onclick="openReviewAddSheetFiles('${escapeAttr(date)}')">Add photo</button>`;
        }
      } else {
        sheetCell = `<button type="button" class="rbtn rbtn-view" onclick="openReviewCountSheet('${escapeAttr(date)}')">${escapeHtml(label)}</button>`;
        if (currentRole === 'Treasurer') {
          if (totalFiles === 1) {
            const onlySheet = sheets.find(sh => (sh.files || []).length);
            sheetCell += csActionBtnsHtml('week', date, onlySheet.id, onlySheet.files[0].fileId);
          }
          sheetCell += ` <button type="button" class="rbtn rbtn-upload" title="You can select 2 or more photos at once" onclick="openReviewAddSheetFiles('${escapeAttr(date)}')">Add photo/file</button>`;
        }
      }
      if (linkedCount < dayEntries.length) sheetCell += ` <span style="font-size:11px; color:#888;">(${linkedCount}/${dayEntries.length} entries linked)</span>`;
      const sheetsWithCount = sheets.filter(sh => sh.countedCashTotal != null && Number(sh.countedCashTotal) > 0);
      if (sheetsWithCount.length) {
        const countedCashTotal = sheetsWithCount.reduce((s, sh) => s + Number(sh.countedCashTotal || 0), 0);
        const cashMismatch = Math.abs(countedCashTotal - cashTotal) > 0.004;
        sheetCell += cashMismatch
          ? ` <span class="rbadge rbadge-mismatch">Cash counted <span class="rpeso">₱${fmt(countedCashTotal)}</span> ≠ recorded <span class="rpeso">₱${fmt(cashTotal)}</span></span>`
          : ` <span class="rbadge rbadge-ok">Cash counted <span class="rpeso">₱${fmt(countedCashTotal)}</span></span>`;
      } else {
        sheetCell += ` <span style="font-size:11px; color:#888;">No denomination count saved</span>`;
      }

      // Separate note: have the LINKED entries themselves changed (edited
      // or deleted) since the sheet was saved? Copied from
      // report-workflow.html's Supporting Documents card (no shared JS
      // modules here): only checked when every entry for the date is
      // linked, compared against the sheets' own saved totalAmount.
      if (linkedCount === dayEntries.length) {
        const linkedNowTotal = dayEntries.reduce((s, r) => s + Number(r.amount || 0), 0);
        const sheetRecordedTotal = sheets.reduce((s, sh) => s + Number(sh.totalAmount || 0), 0);
        if (Math.abs(linkedNowTotal - sheetRecordedTotal) > 0.004) {
          sheetCell += ` <span class="rbadge rbadge-mismatch">Entries changed since count (<span class="rpeso">₱${fmt(sheetRecordedTotal)}</span> at count, <span class="rpeso">₱${fmt(linkedNowTotal)}</span> now)</span>`;
        }
      }
    }

    const rows = entries.map(e => `
      <div class="review-entry">
        <div class="review-entry-main">${escapeHtml(resolveMemberName(e))} · <span class="rpeso">₱ ${fmt(e.amount || 0)}</span> · ${escapeHtml(e.payment || '-')}</div>
      </div>`).join('');

    return `
      <div class="review-date-group" data-review-date="${escapeAttr(date)}">
        <div class="review-date-head">${escapeHtml(date)} <span style="font-weight:400; color:#777;">(${entries.length} · <span class="rpeso">₱ ${fmt(lineTotal)}</span>${dayEntries.length > entries.length ? ` · whole day ${dayEntries.length} · <span class="rpeso">₱ ${fmt(total)}</span>` : ''})</span> ${sheetCell}</div>
        ${rows}
      </div>`;
  }

  // All of a date's income entries (same pool the Supporting Documents card
  // uses: period income, transfers excluded) - falls back to the line's own
  // entries if the pool has none for that exact date string.
  function reviewDayEntries(date, fallback) {
    const day = incomeData.filter(r => r.date === date);
    return day.length ? day : fallback;
  }

  // ── Restricted Fund Activity panel (one per restricted account) ─────────
  // The account's name row is the clickable line. Lists its income (grouped
  // by date with count-sheet status, same renderer as the income panels),
  // its expenses (same renderer as the expense panels: receipts, voucher,
  // badges, Treasurer actions) and its transfer docs (no receipts exist).
  function buildRestrictedPanelHtml(rk) {
    const r = reviewRestrictedEntries[rk];
    if (!r) return '<div class="muted">No entries.</div>';
    const byDate = (a, b) => String(a.date || '').localeCompare(String(b.date || ''));
    let html = '';
    if (r.income.length) {
      const groups = new Map();
      r.income.forEach(e => { const d = e.date || 'Unknown date'; if (!groups.has(d)) groups.set(d, []); groups.get(d).push(e); });
      html += `<div class="review-sub-head">Receipts In</div>` + [...groups.keys()].sort().map(d => renderIncomeDateGroupHtml(d, groups.get(d))).join('');
    }
    if (r.expense.length) {
      html += `<div class="review-sub-head">Disbursements Out</div>` + `<div data-rk="${escapeAttr(rk)}">` + r.expense.slice().sort(byDate).map(e => renderExpenseEntryHtml(e)).join('') + `</div>`;
    }
    const transfers = r.transferIn.map(e => ({ e, from: e.fromAccount || 'another account', to: r.name, note: e.member }))
      .concat(r.transferOut.map(e => ({ e, from: r.name, to: e.toAccount || 'another account', note: e.sub })))
      .sort((a, b) => byDate(a.e, b.e));
    if (transfers.length) {
      html += `<div class="review-sub-head">Transfers</div>` + transfers.map(t => `
        <div class="review-entry">
          <div class="review-entry-main">${escapeHtml(String(t.e.date || '-').slice(0, 10))} · ${escapeHtml(t.from)} → ${escapeHtml(t.to)} · <span class="rpeso">₱ ${fmt(t.e.amount || 0)}</span>${t.note ? ` · ${escapeHtml(t.note)}` : ''}</div>
          <div class="review-entry-actions"><span class="rbadge rbadge-ok" style="background:#eef1f4; color:#556;">Transfer - no receipt</span></div>
        </div>`).join('') + `<div style="font-size:11px; color:#888; padding-top:4px;">Fund transfers move cash between accounts and carry no receipt.</div>`;
    }
    return html || '<div class="muted">No entries.</div>';
  }

  function refreshIncomeDateGroup(date) {
    const el = document.querySelector(`.review-date-group[data-review-date="${CSS.escape(date)}"]`);
    if (!el) return;
    const entries = reviewIncomeDateCache.get(date) || [];
    el.outerHTML = renderIncomeDateGroupHtml(date, entries);
  }

  function openReviewCountSheet(date) {
    const sheets = [...reviewCountSheetMap.values()].filter(s => s.date === date && s.scope !== 'month');
    if (!sheets.length) return;
    const allFiles = [];
    sheets.forEach(sheet => (sheet.files || []).forEach(f => allFiles.push({ sheet, file: f })));
    if (!allFiles.length) { alert('This count sheet has no attached photo files.'); return; }
    csChooserState = { kind: 'week', key: date };
    document.getElementById('review-receipt-viewer-title').textContent = `Count Sheet — ${date}`;
    document.getElementById('review-receipt-viewer-body').innerHTML = `
      <ul style="list-style:none; padding:0; margin:0;">
        ${allFiles.map(({ sheet, file }, i) => `
          <li style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 0; border-bottom:1px solid #eee;">
            <span>${escapeHtml(file.name || 'Count sheet photo')}</span>
            <span><button type="button" class="rbtn rbtn-view" onclick="openReviewCountSheetFile('${escapeAttr(date)}', ${i})">View</button>${currentRole === 'Treasurer' ? csActionBtnsHtml('week', date, sheet.id, file.fileId) : ''}</span>
          </li>`).join('')}
      </ul>`;
    document.getElementById('reviewReceiptViewerModal').style.display = 'flex';
  }
  function openReviewCountSheetFile(date, index) {
    const sheets = [...reviewCountSheetMap.values()].filter(s => s.date === date && s.scope !== 'month');
    const allFiles = [];
    sheets.forEach(sheet => (sheet.files || []).forEach(f => allFiles.push(f)));
    const file = allFiles[index];
    if (!file) return;
    closeReviewReceiptViewer();
    const isPdf = !window.GraceBooksAnnotator || !window.GraceBooksAnnotator.isAnnotatableUrl(file.name, file.url);
    if (isPdf || !file.url) {
      document.getElementById('review-receipt-viewer-title').textContent = file.name || 'Count sheet';
      document.getElementById('review-receipt-viewer-body').innerHTML =
        `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:150px;">
           <p style="margin:0; color:#555;">${file.url ? 'PDF files open in a new browser tab for viewing.' : 'File not available.'}</p>
           ${file.url ? `<a href="${escapeHtml(file.url)}" target="_blank" rel="noopener noreferrer" class="rbtn rbtn-view">Open PDF in New Tab</a>` : ''}
         </div>`;
      document.getElementById('reviewReceiptViewerModal').style.display = 'flex';
      return;
    }
    window.GraceBooksAnnotator.open({

      subtitle: `Count sheet — ${date}`, annotations: [], editable: false, locked: true
    });
  }

  // ── Add more files to an existing sheet (Treasurer) ────────────────────
  // Uploads to count-sheets/{sheetId}/{uid}/{token}{ext} (images/PDF, <= 5 MB)
  // and appends with arrayUnion so a concurrent edit to `files` isn't
  // clobbered. Mirrors income-log.html (no shared JS modules in this repo).
  function validateReviewSheetFiles(files) {
    for (const file of files) {
      const okType = /^image\//.test(file.type) || file.type === 'application/pdf';
      if (!okType) return `"${file.name}" must be an image or PDF.`;
      if (file.size > 5 * 1024 * 1024) return `"${file.name}" must be 5 MB or smaller.`;
    }
    return '';
  }
  async function uploadReviewSheetFiles(sheetId, files) {
    const uid = firebase.auth().currentUser.uid;
    const uploaded = [];
    for (const file of files) {
      const fileId = generateStorageToken();
      const path = `count-sheets/${sheetId}/${uid}/${fileId}${safeFileExtension(file.name)}`;
      const fileRef = storage.ref(path);
      await fileRef.put(file);
      const url = await fileRef.getDownloadURL();
      uploaded.push({ fileId, name: file.name, path, url, contentType: file.type || '', size: file.size || 0 });
    }
    return uploaded;
  }
  function pickReviewSheetFiles(onFiles) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,application/pdf';
    input.multiple = true;
    input.onchange = () => { const files = Array.from(input.files || []); if (files.length) onFiles(files); };
    input.click();
  }
  // Appends to an existing sheet doc (arrayUnion), audit-logs it, and
  // returns the uploaded file objects.
  async function appendFilesToReviewSheet(sheetId, files, label) {
    const uploaded = await uploadReviewSheetFiles(sheetId, files);
    await db.collection('countSheets').doc(sheetId).update({ files: firebase.firestore.FieldValue.arrayUnion(...uploaded) });
    await writeReviewAuditLog('count_sheet_files_added', sheetId, null,
      { sheetId, fileNames: uploaded.map(f => f.name) },
      `Added ${uploaded.length} file${uploaded.length === 1 ? '' : 's'} to ${label} (via Report Preview review mode)`, 'countSheets');
    return uploaded;
  }

  function openReviewAddSheetFiles(date) {
    if (currentRole !== 'Treasurer') return;
    const sheets = [...reviewCountSheetMap.values()].filter(s => s.date === date && s.scope !== 'month');
    if (!sheets.length) return;
    let sheet = sheets[0];
    if (sheets.length > 1) {
      const list = sheets.map((sh, i) => `${i + 1}) ${(sh.files || []).length} file(s)${sh.createdBy && sh.createdBy.name ? ', by ' + sh.createdBy.name : ''}`).join('\n');
      const answer = window.prompt(`${date} has ${sheets.length} count sheets. Add files to which one? (enter a number)\n${list}`, '1');
      if (answer === null) return;
      const idx = parseInt(answer, 10) - 1;
      if (!(idx >= 0 && idx < sheets.length)) { alert('Please enter a valid number.'); return; }
      sheet = sheets[idx];
    }
    pickReviewSheetFiles(async files => {
      const err = validateReviewSheetFiles(files);
      if (err) return alert(err);
      try {
        const uploaded = await appendFilesToReviewSheet(sheet.id, files, `count sheet for ${date}`);
        const local = reviewCountSheetMap.get(sheet.id);

  // ── Monthly tally sheet line (review mode only) ────────────────────────
  // A month-level countSheets doc (scope 'month'). Shown as review-only UI
  // at the top of the Receipts / Income section: hidden in print, skipped
  // by the Excel export (review-panel-row), and never emitted at all on the
  // normal page.
  function reviewMonthlyPlaceholderRowHtml(colspan) {
    return `<tr class="review-panel-row review-only" data-monthly-sheet-row="1"><td colspan="${colspan}"><div class="review-panel review-monthly-sheet" id="review-monthly-sheet-box"><span class="review-panel-loading">Loading monthly tally sheet…</span></div></td></tr>`;
  }

  const REVIEW_MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let reviewMonthlyLoadedFor = '';
  let reviewMonthlyLoading = null;

  function reviewMonthlyScope() {
    const year = document.getElementById('sel-year').value;
    if (reportType === 'annual') return { annual: true, year, key: `annual-${year}` };
    const month = `${year}-${String(parseInt(document.getElementById('sel-month').value) + 1).padStart(2, '0')}`;
    return { annual: false, year, month, key: month };
  }

  async function ensureReviewMonthlyLine() {
    const scope = reviewMonthlyScope();
    if (reviewMonthlyLoadedFor === scope.key) { renderReviewMonthlyLine(); return; }
    if (!reviewMonthlyLoading || reviewMonthlyLoading.key !== scope.key) {
      const load = (async () => {
        const map = new Map();
        try {
          let query = db.collection('countSheets');
          query = scope.annual
            ? query.where('month', '>=', `${scope.year}-01`).where('month', '<=', `${scope.year}-12`)
            : query.where('month', '==', scope.month);
          const snap = await query.get();
          snap.docs.forEach(d => {
            const data = d.data();
            if (data.scope !== 'month' || !data.month) return;
            if (!map.has(data.month)) map.set(data.month, []);
            map.get(data.month).push({ id: d.id, ...data });
          });
        } catch (err) {
          console.warn('Unable to load monthly tally sheets for review mode.', err);
        }
        return map;
      })();
      reviewMonthlyLoading = { key: scope.key, promise: load };
    }
    const pending = reviewMonthlyLoading;
    const map = await pending.promise;
    if (reviewMonthlyLoading !== pending) return; // a newer period took over
    reviewMonthSheetMap = map;
    reviewMonthlyLoadedFor = scope.key;
    reviewMonthlyLoading = null;
    if (reviewMonthlyScope().key === scope.key) renderReviewMonthlyLine();
  }

  function reviewMonthlyStatusHtml(month, recorded, compact) {
    const isTreasurer = currentRole === 'Treasurer';
    const sheets = reviewMonthSheetMap.get(month) || [];
    const attachTip = 'You can select 2 or more photos at once';
    if (!sheets.length) {
      const attach = isTreasurer
        ? ` <button type="button" class="rbtn rbtn-upload" title="${attachTip}" onclick="openReviewMonthlyAttach('${escapeAttr(month)}')">${compact ? 'Attach' : 'Attach monthly sheet'}</button>` : '';
      return `<span class="rbadge rbadge-missing">No monthly sheet</span>${attach}`;
    }
    const fileCount = sheets.reduce((n, sh) => n + (sh.files || []).length, 0);
    let html;
    if (!fileCount) {
      // The month doc (sheet total, notes) stays after its last file was removed.
      html = '<span class="rbadge rbadge-missing">No monthly sheet file</span>';
      if (isTreasurer) html += ` <button type="button" class="rbtn rbtn-upload" title="${attachTip}" onclick="openReviewMonthlyAttach('${escapeAttr(month)}')">${compact ? 'Attach' : 'Attach monthly sheet'}</button>`;
    } else {
      html = `<button type="button" class="rbtn rbtn-view" onclick="openReviewMonthlySheet('${escapeAttr(month)}')">View (${fileCount} file${fileCount === 1 ? '' : 's'})</button>`;
      if (isTreasurer) {
        if (fileCount === 1) {
          const onlySheet = sheets.find(sh => (sh.files || []).length);
          html += csActionBtnsHtml('month', month, onlySheet.id, onlySheet.files[0].fileId);
        }
        html += ` <button type="button" class="rbtn rbtn-upload" title="${attachTip}" onclick="openReviewMonthlyAttach('${escapeAttr(month)}')">Add files</button>`;
      }
    }
    const withTotal = sheets.filter(sh => sh.monthlyTotal != null && isFinite(Number(sh.monthlyTotal)));
    if (withTotal.length) {
      const sheetTotal = Number(withTotal[0].monthlyTotal);
      const mismatch = Math.abs(sheetTotal - recorded) > 0.004;
      html += mismatch
        ? ` <span class="rbadge rbadge-mismatch">Sheet total <span class="rpeso">₱${fmt(sheetTotal)}</span> ≠ recorded <span class="rpeso">₱${fmt(recorded)}</span></span>`
        : ` <span class="rbadge rbadge-ok">Sheet total <span class="rpeso">₱${fmt(sheetTotal)}</span> · recorded <span class="rpeso">₱${fmt(recorded)}</span></span>`;
    }
    if (isTreasurer) {
      const target = withTotal[0] || sheets[0];
      html += ` <button type="button" class="rbtn rbtn-upload" data-cs-act="editmonthly" data-cs-kind="month" data-cs-key="${escapeAttr(month)}" data-cs-sheet="${escapeAttr(target.id)}">${withTotal.length ? 'Edit total/notes' : 'Set total/notes'}</button>`;
    }
    return html;
  }

  function renderReviewMonthlyLine() {
    const box = document.getElementById('review-monthly-sheet-box');
    if (!box || !reviewMode) return;
    const scope = reviewMonthlyScope();
    // Recorded income on the statement's own basis: incomeData already
    // excludes fund transfers and the duplicate legacy cash advance returns.
    const recordedFor = month => incomeData.filter(d => String(d.date || '').slice(0, 7) === month).reduce((s, d) => s + Number(d.amount || 0), 0);
    if (!scope.annual) {
      box.innerHTML = `<strong>Monthly tally sheet:</strong> ${reviewMonthlyStatusHtml(scope.month, recordedFor(scope.month), false)}`;
      return;
    }
    const items = [];
    for (let m = 1; m <= 12; m++) {
      const month = `${scope.year}-${String(m).padStart(2, '0')}`;
      const recorded = recordedFor(month);
      const hasSheet = (reviewMonthSheetMap.get(month) || []).length > 0;
      if (!hasSheet && !incomeData.some(d => String(d.date || '').slice(0, 7) === month)) continue;
      items.push(`<span style="display:inline-block; margin:2px 10px 2px 0;"><strong>${REVIEW_MONTH_SHORT[m - 1]}</strong> ${reviewMonthlyStatusHtml(month, recorded, true)}</span>`);
    }

  }
