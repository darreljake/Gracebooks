        paid: Math.min(Math.max(0, parseFloat(o.amount || 0)), getObligationPaidAmount(o)), status: getObligationStatus(o),
        overdue: !!(o.dueDate && o.dueDate < todayIso && getObligationBalance(o) > 0)
      }))
    };

    // ── 7. Special projects & Building Fund ──
    // copied from special-projects.html projectTotals()/getProceedsPostings() - keep in step
    const projectsOut = (raw.projects || []).filter(p => p.status !== 'Closed').map(p => {
      const pc = (raw.projectCosts || []).filter(c => c.projectId === p.id);
      const pe = (raw.projectEntries || []).filter(e => e.projectId === p.id && e.type !== 'Receipt');
      const pr = (raw.projectEntries || []).filter(e => e.projectId === p.id && e.type === 'Receipt');
      const costBreakdownTotal = sumF(pc, c => Number(c.amount || 0));
      const plannedCost = Math.max(costBreakdownTotal, Number(p.targetCost || 0));
      const churchFund = sumF(pe.filter(e => e.sourceType === 'Church Fund'), e => Number(e.amount || 0));
      const otherFunding = sumF(pe.filter(e => e.sourceType !== 'Church Fund'), e => Number(e.amount || 0));
      const grossReceipts = sumF(pr, e => Number(e.amount || 0));
      const expensesIncurred = sumF(allExpenseData.filter(e => e.specialProjectId === p.id && e.type !== 'transfer'), e => Number(e.amount || 0));
      let postings = [];
      if (Array.isArray(p.proceedsPostings) && p.proceedsPostings.length) postings = p.proceedsPostings;
      else if (p.linkedIncomeId) postings = [{ amount: Number(p.linkedIncomeAmount || 0) }];
      return {
        name: p.name || 'Special Project', type: p.projectType || 'Project Fund', status: p.status || 'Open',
        target: plannedCost, raised: otherFunding + grossReceipts, churchFund, grossReceipts, costs: expensesIncurred,
        net: grossReceipts - expensesIncurred, posted: sumF(postings, x => Number(x.amount || 0))
      };
    });
    const bRow = st.restrictedActivityAll.find(r => r.id === 'building') || { realInAmt: 0, realOutAmt: 0, transferNet: 0, net: 0, balance: 0 };
    const bRowYtd = stYtd.restrictedActivityAll.find(r => r.id === 'building') || { realInAmt: 0, realOutAmt: 0, transferNet: 0, net: 0 };
    kpi.projects = {
      list: projectsOut,
      building: {
        inAmt: bRow.realInAmt, outAmt: bRow.realOutAmt, transfers: bRow.transferNet, net: bRow.net,
        balance: bRow.balance, heldInGf: st.buildingHeldAtEnd, total: bRow.balance + st.buildingHeldAtEnd,
        ytdIn: bRowYtd.realInAmt, ytdOut: bRowYtd.realOutAmt, ytdTransfers: bRowYtd.transferNet
      }
    };

    // ── 8. People ──
    let roll = null;
    if (raw.membershipRoll) {
      const cnt = { Active: 0, Inactive: 0, Overseas: 0 };
      let other = 0;
      raw.membershipRoll.forEach(m => { const s = String(m.status || 'Active'); if (cnt[s] !== undefined) cnt[s]++; else other++; });
      roll = { ...cnt, other, total: raw.membershipRoll.length };
    } else kpi.unavailable.roll = true;
    kpi.people = {
      attendanceAvg, attendancePriorAvg, attendanceChange: pctChange(attendanceAvg, attendancePriorAvg), attendanceYtdAvg,
      attendanceSum, monthsWithData: attMonthsWithData, series: series.attendance, roll
    };

    // ── 9. Stewardship & controls (Treasurer + Auditor only) ──
    kpi.controls = CONTROLS_ROLES.includes(kpi.role) ? computeControls(raw, period, st, now) : null;
    return kpi;
  }

  // Receipt/voucher coverage, count sheets, outstanding advances, workflow status, reconciliation.
  function computeControls(raw, period, st, now) {
    const year = period.year, monthSet = new Set(period.months);
    const liq = new Map((raw.liquidation || []).map(r => [r.id, r]));
    // Expenses that should carry a receipt/voucher: this selection's General Fund expenses excluding payroll and
    // release-time cash-advance placeholders (awaiting liquidation).
    const elig = st.fExp.filter(d => !d.isPayrollGenerated && d.type !== 'deduction-payment' && d.category !== PLACEHOLDER_ADVANCE_CATEGORY);
    // simplified from print-report.html/report-workflow.html resolveExpenseReceipts() - keep in step
    const hasReceipt = d => {
      if (d.receiptUrl) return true;
      const r = d.linkedLiquidationRequestId ? liq.get(d.linkedLiquidationRequestId) : null;
      if (!r) return false;
      const src = (d.liquidationSplit === 'reimburse' && d.sourceLiquidationRequestId && liq.get(d.sourceLiquidationRequestId)) || r;
      return (src.liquidationReceipts || []).length + (src.supportingReceipts || []).length > 0 || !!r.receiptUrl;
    };
    const hasVoucher = d => {
      if (d.voucherId) return true;
      const r = d.linkedLiquidationRequestId ? liq.get(d.linkedLiquidationRequestId) : null;
      return !!(r && r.voucherId);
    };
    const withReceipt = elig.filter(hasReceipt).length, withVoucher = elig.filter(hasVoucher).length;
    // Count sheets: Sunday-dated income days in the selection
    const sheets = (raw.countSheets || []).filter(s => s.scope !== 'month');
    const byDate = {};
    st.periodIncome.forEach(d => { (byDate[d.date] = byDate[d.date] || []).push(d); });
    const sundays = Object.keys(byDate).filter(dt => { const l = localDate(dt); return l && l.getDay() === 0; });
    let withSheet = 0, mismatches = 0, checked = 0;
    sundays.forEach(dt => {
      const entries = byDate[dt];
      const dateSheets = sheets.filter(s => s.date === dt);
      const linked = entries.some(e => e.countSheetId) || dateSheets.length > 0;
      if (linked) withSheet++;
      const counted = sumF(dateSheets, s => parseFloat(s.countedCashTotal) || 0);
      if (counted > 0) {
        checked++;
        const cashRecorded = sumF(entries.filter(e => e.payment === 'Cash'), e => parseFloat(e.amount) || 0);
        if (Math.abs(counted - cashRecorded) >= 0.01) mismatches++;
      }
    });
    // Cash advances released but not yet liquidated (cash advances + older 'Liquidation' type)
    const open = (raw.liquidation || []).filter(r => (r.type === 'Cash Advance' || r.type === 'Liquidation') && (r.status === 'Released' || r.status === 'Liquidation Submitted'));
    let oldest = 0;
    open.forEach(r => { const d = localDate(r.releasedAt || r.createdAt || ''); if (d) oldest = Math.max(oldest, Math.floor((now - d) / 86400000)); });
    const wfId = period.count === 12 ? `annual-${year}` : (period.count === 1 ? `monthly-${year}-${pad2(period.first + 1)}` : '');
    const review = wfId ? reviewByDocId[wfId] : null;
    const WF = { draft: 'Draft', submitted_to_auditor: 'Submitted', returned_by_auditor: 'Returned', submitted_to_finance: 'Approved by Auditor',
      returned_by_finance: 'Returned', routed_to_chairperson: 'Approved - signing', routed_to_pastor: 'Approved - signing', finalized: 'Signed' };
    return {
      expenseCount: elig.length, receiptPct: elig.length ? withReceipt / elig.length * 100 : null, voucherPct: elig.length ? withVoucher / elig.length * 100 : null,
      missingReceipt: elig.length - withReceipt, missingVoucher: elig.length - withVoucher,
      sundays: sundays.length, sundaysWithSheet: withSheet, countMismatches: mismatches, countChecked: checked, countSheetsReadable: raw.countSheets !== null,
      advancesOpen: open.length, advancesAmount: sumF(open, r => Number(r.amount || 0)), advancesOldestDays: oldest,
      workflowApplies: !!wfId, workflowStatus: wfId ? (review ? (WF[review.status] || review.status || 'Draft') : 'Not started') : '',
      reconcileClean: st.reconcileIsClean, reconcileDiff: st.reconcileDiff
    };
  }

  // ───────────────────────────────────────────────────────────────────────
  // 5. RENDERING (pure functions of kpi + sizing; hand-rolled inline SVG, no chart library)
  // ───────────────────────────────────────────────────────────────────────
  const peso = n => (n < 0 ? '-' : '') + '₱' + fmt(Math.abs(n));
  const pesoW = n => (n < 0 ? '-' : '') + '₱' + Math.round(Math.abs(n)).toLocaleString('en-US');
  function pesoShort(n) {
    const a = Math.abs(n), s = n < 0 ? '-' : '';
    if (a >= 1e6) return `${s}₱${(a / 1e6).toFixed(a >= 1e7 ? 1 : 2)}M`;
    if (a >= 1e4) return `${s}₱${(a / 1e3).toFixed(0)}k`;
    if (a >= 1e3) return `${s}₱${(a / 1e3).toFixed(1)}k`;
    return `${s}₱${Math.round(a)}`;
  }
  const pctTxt = (v, d = 0) => v === null || v === undefined || !Number.isFinite(v) ? '—' : `${v.toFixed(d)}%`;
  const num0 = n => Math.round(n).toLocaleString('en-US');
  function chip(v, goodWhenUp = true) {
    if (v === null || v === undefined || !Number.isFinite(v)) return '<span class="chip flat">no last-year data</span>';
    if (Math.abs(v) < 0.5) return '<span class="chip flat">flat vs last year</span>';
    const up = v > 0, good = up === goodWhenUp;
    return `<span class="chip ${good ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(v).toFixed(0)}% vs last year</span>`;
  }
  function changeWords(v) {
    if (v === null || v === undefined || !Number.isFinite(v)) return 'with no same-months figure from last year to compare';
    if (Math.abs(v) < 0.5) return 'about the same as the same months last year';
    return `${v > 0 ? 'up' : 'down'} ${Math.abs(v).toFixed(0)}% from the same months last year`;
  }
  const LEVEL_FILL = { green: '#2e9e5b', yellow: '#e0b11a', red: '#d6453a', black: '#212121' };
  const LEVEL_ON_NAVY = { green: '#52d68a', yellow: '#f7cf47', red: '#ff7468', black: '#e5e7eb' };
  const LEVEL_ICON = { green: '●', yellow: '▲', red: '◆', black: '■' };
  function lvlBadge(l) { return `<span class="lvl ${l.color}"><span aria-hidden="true">${LEVEL_ICON[l.color] || ''}</span>${escapeHtml(l.color.toUpperCase())} · ${escapeHtml(l.level)}</span>`; }
  const CAT_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
  const CAT_HEX = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'];
  const OTHER_HEX = '#8a8f98';

  function svgOpen(w, h, label) {
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${escapeAttr(label)}" preserveAspectRatio="xMidYMid meet">`;
  }
  const tip = t => ` data-tip="${escapeAttr(t)}"`;
  function tableView(headers, rows) {
    return `<details class="tv"><summary>Table view</summary><div class="tbl-scroll"><table class="t"><thead><tr>${headers.map((h, i) => `<th class="${i ? 'n' : ''}">${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${
      rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'n' : ''}">${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  }

  // sparkline (inline, 2px line, end dot with surface ring)
  function spark(values, color, w = 130, h = 34) {
    const v = values.map(x => Number.isFinite(x) ? x : 0);
    const mn = Math.min(...v), mx = Math.max(...v), rng = (mx - mn) || 1, pad = 4;
    const pts = v.map((x, i) => [pad + i * ((w - 2 * pad) / Math.max(1, v.length - 1)), h - pad - ((x - mn) / rng) * (h - 2 * pad)]);
    const lastPt = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Trend over the last 12 months" style="max-width:100%">
      <polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/></svg>`;
  }

  // progress ring
  function ring(pct, size, color, big, small, onDark) {
    const r = size / 2 - 12, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0)) / 100;
    const track = onDark ? 'rgba(255,255,255,.18)' : '#ece8dd';
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${escapeAttr(big + ' ' + small)}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="16"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      <text x="${size / 2}" y="${size / 2 + 2}" text-anchor="middle" font-size="${size * 0.2}" font-weight="800" style="fill:${onDark ? '#fff' : 'var(--navy)'}">${escapeHtml(big)}</text>
      <text x="${size / 2}" y="${size / 2 + size * 0.14}" text-anchor="middle" font-size="${Math.max(11, size * 0.075)}" style="fill:${onDark ? '#dbe3f3' : 'var(--muted)'}">${escapeHtml(small)}</text></svg>`;
  }

  // waterfall: Beginning -> Receipts -> Disbursements -> (Transfers) -> (Other months in between) -> Ending
  function waterfallSvg(k, w) {
    const s = k.stmt, narrow = w < 520;
    const steps = [{ t: 'total', label: narrow ? 'Begin' : 'Beginning', v: s.begBal, color: 'var(--navy)' },
      { t: 'delta', label: 'Receipts', v: s.receipts, color: 'var(--s1)' },
      { t: 'delta', label: narrow ? 'Disbursed' : 'Disbursements', v: -s.disbursements, color: 'var(--s2)' }];
    if (Math.abs(s.transfers) >= 0.005) steps.push({ t: 'delta', label: 'Transfers', v: s.transfers, color: 'var(--s-other)' });
    if (!s.contiguous && Math.abs(s.inBetween) >= 0.005) steps.push({ t: 'delta', label: narrow ? 'Between' : 'Other months in between', v: s.inBetween, color: 'var(--s-other)', hatch: true });
    steps.push({ t: 'total', label: 'Ending', v: s.endBal, color: 'var(--navy)' });
    let run = 0;
    const geo = steps.map(st => {
      if (st.t === 'total') { run = st.v; return { ...st, from: null, to: st.v, level: st.v }; }
      const from = run, to = run + st.v; run = to; return { ...st, from, to, level: to };
    });
    // Levels the bars actually reach (total bars run from the axis base up to their value).
    const reach = [];
    geo.forEach(g => { reach.push(g.to); if (g.from !== null) reach.push(g.from); });
    const lvMin = Math.min(...reach), lvMax = Math.max(...reach), span = (lvMax - lvMin) || 1;
    const biggestChange = Math.max(...geo.filter(g => g.t === 'delta').map(g => Math.abs(g.v)), 0);
    // When the changes are small next to the balances the axis base is lifted (and flagged under the chart)
    // so the receipts/disbursements bars are visible instead of slivers.
    const lifted = lvMin > 0 && biggestChange < lvMin * 0.35;
    const base = lifted ? Math.max(0, lvMin - Math.max(span, biggestChange) * 0.8) : Math.min(0, lvMin);
    const mn = base, mx = lvMax + span * 0.04, rng = (mx - mn) || 1;
    const top = 26, bottom = narrow ? 44 : 38, h = narrow ? 250 : 290, plotH = h - top - bottom;
    const yOf = v => top + (1 - (v - mn) / rng) * plotH;
    const n = geo.length, bw = w / n, barW = Math.min(88, bw * 0.62);
    let out = svgOpen(w, h, `Cash waterfall from beginning balance ${peso(s.begBal)} to ending balance ${peso(s.endBal)}`);
    if (!lifted) out += `<line x1="0" x2="${w}" y1="${yOf(0).toFixed(1)}" y2="${yOf(0).toFixed(1)}" stroke="#c9c3b3" stroke-width="1"/>`;
    geo.forEach((g, i) => {
      const pA = g.t === 'total' ? g.to : g.from, pB = g.t === 'total' ? (lifted ? mn : 0) : g.to;
      const y1 = Math.min(yOf(pA), yOf(pB)), bh = Math.max(3, Math.abs(yOf(pA) - yOf(pB)));
      const x = i * bw + (bw - barW) / 2;
      const text = g.t === 'total' ? pesoShort(g.v) : `${g.v >= 0 ? '+' : '-'}${pesoShort(Math.abs(g.v)).replace('-', '')}`;
      const full = g.t === 'total' ? peso(g.v) : `${g.v >= 0 ? '+' : '-'}${peso(Math.abs(g.v)).replace('-', '')}`;
      out += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${g.color}"${g.hatch ? ' fill-opacity=".55" stroke="#6b7280" stroke-dasharray="4 3"' : ''}${tip(`${g.label}: ${full}`)}/>`;
      const labelAbove = g.t === 'total' ? g.v >= 0 : g.v >= 0;
      out += `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${(labelAbove ? y1 - 6 : y1 + bh + 14).toFixed(1)}" text-anchor="middle" font-size="${narrow ? 11 : 13}" font-weight="700" style="fill:var(--navy)">${escapeHtml(text)}</text>`;
      out += `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${h - bottom + 20}" text-anchor="middle" font-size="${narrow ? 11 : 13}">${escapeHtml(g.label)}</text>`;
      if (i < n - 1) out += `<line x1="${(x + barW).toFixed(1)}" x2="${((i + 1) * bw + (bw - barW) / 2).toFixed(1)}" y1="${yOf(g.level).toFixed(1)}" y2="${yOf(g.level).toFixed(1)}" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="3 3"/>`;
    });
    out += '</svg>';
    return out + (lifted ? `<div class="note">The vertical axis starts at ${escapeHtml(pesoShort(base))}, not zero, so the changes are visible.</div>` : '');
  }

  // semicircle cash-runway gauge: Black / Red / Yellow / Green bands, needle at months of cover
  function gaugeSvg(months, level, w) {
    const r = Math.min(w / 2 - 14, 170), cx = w / 2, cy = r + 16, bandW = 28;
    // piecewise-linear dial so the narrow Black/Red bands stay readable: months -> fraction of the arc
    const stops = [[0, 0], [0.5, 0.14], [1, 0.34], [3, 0.66], [6, 1]];
    const frac = m => { const x = Math.max(0, Math.min(6, m)); for (let i = 1; i < stops.length; i++) if (x <= stops[i][0]) { const [a, fa] = stops[i - 1], [b, fb] = stops[i]; return fa + (x - a) / (b - a) * (fb - fa); } return 1; };
    const pt = (f, rad) => { const a = Math.PI * (1 - f); return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)]; };
    const arc = (f1, f2, color, title) => { const [x1, y1] = pt(f1, r), [x2, y2] = pt(f2, r); return `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${bandW}"${tip(title)}/>`; };
    const g = 0.004;
    let out = svgOpen(w, cy + 54, `Cash runway gauge, ${Number.isFinite(months) ? months.toFixed(1) + ' months of cover' : 'not set up'}, level ${level.level}`);
    out += arc(0, 0.14 - g, LEVEL_FILL.black, 'Black: under 0.5 months') + arc(0.14, 0.34 - g, LEVEL_FILL.red, 'Red: 0.5 to 1 month')
      + arc(0.34, 0.66 - g, LEVEL_FILL.yellow, 'Yellow: 1 to 3 months') + arc(0.66, 1, LEVEL_FILL.green, 'Green: 3 months or more');
    [[0, '0'], [0.5, '½'], [1, '1'], [3, '3'], [6, '6+']].forEach(([m, t]) => { const [x, y] = pt(frac(m), r + bandW / 2 + 12); out += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="12">${t}</text>`; });
    if (Number.isFinite(months)) {
      const [nx, ny] = pt(frac(months), r - bandW / 2 - 6);
      out += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--navy)" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="9" fill="var(--navy)" stroke="#fff" stroke-width="2"/>`;
    }
    out += `<text x="${cx}" y="${cy + 38}" text-anchor="middle" font-size="12">months of essential expenses covered</text></svg>`;
    return out;
  }

  // 6-month projected Available Operating Cash with coloured level bands
  function projectionSvg(liq, w) {
    const p = liq.projection, narrow = w < 520, h = narrow ? 240 : 270, left = narrow ? 44 : 58, right = 10, top = 22, bottom = 34;
    const pts = [{ label: 'Today', cash: liq.available }].concat(p.rows.map(r => ({ label: r.label.split(' ')[0], cash: r.cash, level: r.level, row: r })));
    const E = liq.essential, vals = pts.map(x => x.cash);
    let mn = Math.min(...vals, 0), mx = Math.max(...vals);
    if (E > 0) { mx = Math.max(mx, E * 3.4); mn = Math.min(mn, 0); }
    const rng = (mx - mn) || 1, plotH = h - top - bottom, plotW = w - left - right;
    const yOf = v => top + (1 - (v - mn) / rng) * plotH, xOf = i => left + i * (plotW / (pts.length - 1));
    let out = svgOpen(w, h, `Projected available operating cash for the next ${p.rows.length} months`);
    if (E > 0) {
      const bands = [[mn, E * 0.5, '#212121', .12, 'Black'], [E * 0.5, E, '#d6453a', .13, 'Red'], [E, E * 3, '#e0b11a', .15, 'Yellow'], [E * 3, mx, '#2e9e5b', .13, 'Green']];
      bands.forEach(([a, b, c, o, nm]) => { const y1 = yOf(Math.min(b, mx)), y2 = yOf(Math.max(a, mn)); out += `<rect x="${left}" y="${y1.toFixed(1)}" width="${plotW}" height="${Math.max(0, y2 - y1).toFixed(1)}" fill="${c}" fill-opacity="${o}"/>`; });
      let lastLy = -99; [[E * 3, '3 mo'], [E, '1 mo'], [E * 0.5, '½ mo']].forEach(([v, t]) => { const showLbl = Math.abs(yOf(v) - lastLy) >= 13; if (showLbl) lastLy = yOf(v); out += `<line x1="${left}" x2="${w - right}" y1="${yOf(v).toFixed(1)}" y2="${yOf(v).toFixed(1)}" stroke="#8b8576" stroke-width="1" stroke-dasharray="4 4"/>${showLbl ? `<text x="${left - 6}" y="${(yOf(v) + 4).toFixed(1)}" text-anchor="end" font-size="11">${t}</text>` : ''}`; });
    }
    out += `<line x1="${left}" x2="${w - right}" y1="${yOf(0).toFixed(1)}" y2="${yOf(0).toFixed(1)}" stroke="#9aa3b2" stroke-width="1"/>`;
    out += `<polyline fill="none" stroke="var(--s1)" stroke-width="3" stroke-linejoin="round" points="${pts.map((x, i) => `${xOf(i).toFixed(1)},${yOf(x.cash).toFixed(1)}`).join(' ')}"/>`;
    pts.forEach((x, i) => {
      const lv = x.level ? ` (${x.level.color} · ${x.level.level})` : '';
      out += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(x.cash).toFixed(1)}" r="5" fill="var(--s1)" stroke="#fff" stroke-width="2"${tip(`${x.label}: ${peso(x.cash)}${lv}`)}/>`;
      out += `<text x="${xOf(i).toFixed(1)}" y="${h - 14}" text-anchor="middle" font-size="${narrow ? 11 : 12}">${escapeHtml(x.label)}</text>`;
    });
    [0, pts.length - 1].forEach(i => { out += `<text x="${(xOf(i) + (i ? -4 : 4)).toFixed(1)}" y="${(yOf(pts[i].cash) - 10).toFixed(1)}" text-anchor="${i ? 'end' : 'start'}" font-size="12" font-weight="700" style="fill:var(--navy)">${escapeHtml(pesoShort(pts[i].cash))}</text>`; });
    return out + '</svg>';
  }

  // budget bullet bars: bar = actual, tick = budget for the selected months
  function bulletSvg(rows, w, side) {
    if (!rows.length) return '<div class="note">No budget lines for this selection.</div>';
    const narrowB = w < 480, rowH = narrowB ? 72 : 54, labelW = w, h = rows.length * rowH + 4;
    let out = svgOpen(w, h, `Budget versus actual bullet bars, ${side}`);
    rows.forEach((r, i) => {
      const y = i * rowH + 4, maxv = Math.max(r.actual, r.budget, 1) * 1.1, bar = v => Math.max(0, Math.min(1, v / maxv)) * w;
      const over = side === 'expense' && r.budget > 0 && r.actual > r.budget;
      const behind = side === 'income' && r.budget > 0 && r.actual < r.budget;
      const pct = r.budget > 0 ? `${(r.actual / r.budget * 100).toFixed(0)}%` : 'no budget';
      const name = r.name.length > (w < 480 ? 24 : 44) ? r.name.slice(0, w < 480 ? 23 : 43) + '…' : r.name;
      out += `<text x="0" y="${y + 14}" font-size="14" font-weight="600" style="fill:var(--navy)">${escapeHtml(name)}</text>`;
      out += `<text x="${narrowB ? 0 : labelW}" y="${y + (narrowB ? 32 : 14)}" text-anchor="${narrowB ? 'start' : 'end'}" font-size="13" style="fill:${over ? 'var(--bad)' : 'var(--ink-2)'}" font-weight="${over ? 700 : 400}">${escapeHtml(pesoShort(r.actual))} of ${escapeHtml(r.budget > 0 ? pesoShort(r.budget) : '—')} · ${pct}${over ? ' over' : behind ? ' behind' : ''}</text>`;
      out += `<rect x="0" y="${y + (narrowB ? 42 : 22)}" width="${w}" height="16" rx="8" fill="#ece8dd"/>`;
      out += `<rect x="0" y="${y + (narrowB ? 42 : 22)}" width="${Math.max(4, bar(r.actual)).toFixed(1)}" height="16" rx="8" fill="${over ? '#b3261e' : 'var(--navy-2)'}"${tip(`${r.name}: spent/received ${peso(r.actual)}; budget for the selected months ${peso(r.budget)}`)}/>`;
      if (r.budget > 0) out += ` <rect x="${(bar(r.budget) - 1.5).toFixed(1)}" y="${y + (narrowB ? 37 : 17)}" width="3" height="26" rx="1.5" fill="var(--gold)" stroke="#fff" stroke-width="1"/>`;
    });
    return out + '</svg>';
  }

  // "Every ₱100" waffle: 10x10 dots, row-major, in category order
  function waffleSvg(rows, w) {
    const size = Math.min(w, 360), cell = size / 10;
    const cols = []; rows.forEach((r, i) => { for (let n = 0; n < r.pesos; n++) cols.push({ i, r }); });
    let out = svgOpen(size, size, 'Every one hundred pesos of disbursements by category');
    cols.forEach((c, idx) => {
      const x = (idx % 10) * cell + cell / 2, y = Math.floor(idx / 10) * cell + cell / 2;
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(cell * 0.4).toFixed(1)}" fill="${c.r.other ? OTHER_HEX : CAT_HEX[c.i]}"${tip(`${c.r.name}: ₱${c.r.pesos} of every ₱100`)}/>`;
    });
    return out + '</svg>';
  }

  // 12-month combo: receipts/disbursements bars + net line, last year's net as a ghost line
  function comboSvg(k, w) {
    const s = k.series, narrow = w < 520, h = narrow ? 270 : 310, left = narrow ? 42 : 56, right = 8, top = 14, bottom = 38;
    const all = s.receipts.concat(s.disbursements, s.net, s.lastYearNet, [0]);
    const mn = Math.min(...all), mx = Math.max(...all), rng = (mx - mn) || 1, plotH = h - top - bottom, plotW = w - left - right;
    const yOf = v => top + (1 - (v - mn) / rng) * plotH, gw = plotW / 12, bw = Math.max(5, Math.min(22, gw * 0.36));
    let out = svgOpen(w, h, 'Twelve month receipts, disbursements and net, with last year net');
    for (let i = 0; i <= 4; i++) { const v = mn + rng * i / 4, y = yOf(v); out += `<line x1="${left}" x2="${w - right}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#ece6d6" stroke-width="1"/><text x="${left - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11">${escapeHtml(pesoShort(v))}</text>`; }
    out += `<line x1="${left}" x2="${w - right}" y1="${yOf(0).toFixed(1)}" y2="${yOf(0).toFixed(1)}" stroke="#9aa3b2" stroke-width="1"/>`;
    const gx = i => left + i * gw + gw / 2;
    s.labels.forEach((lab, i) => {
      const x = gx(i), y0 = yOf(0);
      const bar = (v, dx, color, name) => { const y = yOf(v), hh = Math.abs(y0 - y); return `<rect x="${(x + dx).toFixed(1)}" y="${Math.min(y, y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, hh).toFixed(1)}" rx="3" fill="${color}"${tip(`${lab}: ${name} ${peso(v)}`)}/>`; };
      out += bar(s.receipts[i], -bw - 1, 'var(--s1)', 'receipts') + bar(s.disbursements[i], 1, 'var(--s2)', 'disbursements');
      if (s.selected[i]) out += `<rect x="${(x - gw * 0.46).toFixed(1)}" y="${h - bottom + 22}" width="${(gw * 0.92).toFixed(1)}" height="4" rx="2" fill="var(--gold)"/>`;
      if (!narrow || i % 2 === 0 || s.selected[i]) out += `<text x="${x.toFixed(1)}" y="${h - bottom + 16}" text-anchor="middle" font-size="${narrow ? 10 : 11}">${escapeHtml(lab)}</text>`;
    });
    const line = (arr, color, dash, wd) => `<polyline fill="none" stroke="${color}" stroke-width="${wd}"${dash ? ' stroke-dasharray="6 5"' : ''} stroke-linejoin="round" points="${arr.map((v, i) => `${gx(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ')}"/>`;
    out += line(s.lastYearNet, '#9aa3b2', true, 2) + line(s.net, 'var(--navy)', false, 2.5);
    s.net.forEach((v, i) => { out += `<circle cx="${gx(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="4" fill="var(--navy)" stroke="#fff" stroke-width="2"${tip(`${s.labels[i]}: net ${peso(v)}; same month last year ${peso(s.lastYearNet[i])}`)}/>`; });
    return out + '</svg>';
  }

  // 13-Sunday giving heatmap (sequential single-hue ramp, light to dark)
  const HEAT = ['#f6edd0', '#ecd28a', '#d9ae3c', '#b5811a', '#7a4f08'];
  function heatmapSvg(weeks, w) {
    const perRow = w < 520 ? 7 : 13, gap = 6, cell = Math.min(74, Math.floor((w - gap * (perRow - 1)) / perRow)), rows = Math.ceil(weeks.length / perRow), cellH = cell + 4;
    const mx = Math.max(...weeks.map(x => x.amount), 1);
    let out = svgOpen(perRow * (cell + gap) - gap, rows * (cellH + gap) - gap, 'Weekly Sunday collections, last 13 Sundays, darker means more');
    weeks.forEach((wk, i) => {
      const x = (i % perRow) * (cell + gap), y = Math.floor(i / perRow) * (cellH + gap);
      const lvl = wk.amount <= 0 ? -1 : Math.min(4, Math.floor(wk.amount / mx * 4.999));
      const fill = lvl < 0 ? '#f1eee6' : HEAT[lvl], dark = lvl >= 3;
      out += `<rect x="${x}" y="${y}" width="${cell}" height="${cellH}" rx="8" fill="${fill}"${tip(`Week of ${wk.label}: ${wk.amount > 0 ? peso(wk.amount) : 'no collection recorded'}`)}/>`;
      out += `<text x="${x + cell / 2}" y="${y + 16}" text-anchor="middle" font-size="${cell < 50 ? 10 : 12}" style="fill:${dark ? '#fff' : 'var(--ink-2)'}">${escapeHtml(wk.label)}</text>`;
      out += `<text x="${x + cell / 2}" y="${y + cellH - 12}" text-anchor="middle" font-size="${cell < 50 ? 11 : 14}" font-weight="700" style="fill:${dark ? '#fff' : 'var(--navy)'}">${wk.amount > 0 ? escapeHtml(pesoShort(wk.amount)) : '–'}</text>`;
    });
    return out + '</svg>';
  }

  // horizontal thermometer
  function thermometer(pct, color, w) {
    const h = 26, p = Math.max(0, Math.min(100, pct || 0));
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${p.toFixed(0)} percent"><rect x="0" y="4" width="${w}" height="18" rx="9" fill="#ece8dd"/><rect x="0" y="4" width="${Math.max(10, w * p / 100).toFixed(1)}" height="18" rx="9" fill="${color}"/><text x="${w - 6}" y="18" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--navy)">${p.toFixed(0)}%</text></svg>`;
  }

  // ── KPI tile helpers ──
  function tile(label, val, sub, sparkHtml) { return `<div class="tile"><div class="lbl">${escapeHtml(label)}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}${sparkHtml ? `<div class="spark">${sparkHtml}</div>` : ''}</div>`; }
  function naTile(label, why) { return `<div class="tile na"><div class="lbl">${escapeHtml(label)}</div><div class="val">Not available for your role</div>${why ? `<div class="sub">${escapeHtml(why)}</div>` : ''}</div>`; }
  const signClass = v => v < 0 ? 'neg' : 'pos';
  function countUp(n) { return `<span data-count="${n}">${pesoW(n)}</span>`; }

  // ── Slide bodies ──
  function slideHero(k, o) {
    const s = k.stmt, L = k.liquidity, ringColor = LEVEL_ON_NAVY[L.level.color] || '#fff';
    const monthsTxt = Number.isFinite(L.months) ? L.months.toFixed(1) : '—';
    const cashRing = ring(Number.isFinite(L.months) ? Math.min(100, L.months / 6 * 100) : 0, 190, ringColor, monthsTxt, 'months of cover', true);
    const big = (label, n, cls, cmp) => `<div class="big"><div class="lbl">${label}</div><div class="num ${cls}">${o.static ? pesoW(n) : countUp(n)}</div><div class="cmp">${cmp}</div></div>`;
    const heroCmp = (ytd, ch, up) => `Year to date ${pesoW(ytd)}<br>${chip(ch, up)}`;
    const hero = `<div class="hero">
      ${big('Total Cash Receipts', s.receipts, '', heroCmp(k.ytd.receipts, k.change.receipts, true))}
      <div class="ring-box">${cashRing}<div class="ring-cap"><span class="lvl ${L.level.color}">${LEVEL_ICON[L.level.color] || ''} ${escapeHtml(L.level.color.toUpperCase())} · ${escapeHtml(L.level.level)}</span></div><div class="ring-cap">cash level today</div></div>
      ${big('Total Disbursements', s.disbursements, '', heroCmp(k.ytd.disbursements, k.change.disbursements, false))}
      ${big(s.net >= 0 ? 'Net Surplus' : 'Net Deficit', s.net, s.net >= 0 ? 'pos' : 'neg', `Year to date <b>${pesoW(k.ytd.net)}</b><br>${chip(k.change.net, true)}`)}
    </div>`;
    const note = !s.contiguous ? `<div class="note" style="background:var(--yellow-bg);border:1px solid #f7dc6f;border-radius:10px;padding:8px 12px"><b>Non-consecutive months selected</b> - balances span ${SHORT_MONTHS[k.period.first]} to ${SHORT_MONTHS[k.period.last]}; receipts and disbursements cover the selected months only.</div>` : '';
    const wf = `<div class="panel"><h3>How the cash moved <span class="hint">General Fund · same basis as the signed Print Report</span></h3>${note}<div class="svgwrap">${waterfallSvg(k, o.w.half)}</div>
      ${tableView(['Step', 'Amount'], [['Beginning Balance', peso(s.begBal)], ['Receipts', peso(s.receipts)], ['Disbursements', peso(-s.disbursements)], ['Net fund transfers', peso(s.transfers)]].concat(!s.contiguous ? [['Other months in between', peso(s.inBetween)]] : []).concat([['Ending Balance', peso(s.endBal)]]))}</div>`;
    const sr = k.series;
    const tiles = `<div class="tiles">
      ${tile('Ending Balance', `<span class="${signClass(s.endBal)}">${pesoW(s.endBal)}</span>`, `Beginning ${peso(s.begBal)}`, spark(sr.net.map((_, i) => sr.receipts[i] - sr.disbursements[i]), 'var(--navy)'))}
      ${tile('Receipts, 12 months', pesoShort(sumF(sr.receipts, x => x)), 'rolling to the last selected month', spark(sr.receipts, 'var(--s1)'))}
      ${tile('Disbursements, 12 months', pesoShort(sumF(sr.disbursements, x => x)), 'rolling to the last selected month', spark(sr.disbursements, 'var(--s2)'))}
      ${tile('Year to date net', `<span class="${signClass(k.ytd.net)}">${pesoShort(k.ytd.net)}</span>`, `Receipts ${pesoShort(k.ytd.receipts)} − disbursements ${pesoShort(k.ytd.disbursements)}`)}
    </div>`;
    return hero + `<div class="grid2">${wf}<div class="panel"><h3>At a glance</h3>${tiles}</div></div>`;
  }

  function slideLiquidity(k, o) {
    const L = k.liquidity, p = L.projection, hasE = L.essential > 0;
    const left = `<div class="panel"><h3>Can we pay our bills? <span class="hint">as of today · Financial Overview basis</span></h3>
      <div class="svgwrap" style="max-width:440px;margin:0 auto">${gaugeSvg(L.months, L.level, Math.min(o.w.half, 420))}</div>
      <div style="text-align:center;margin-top:6px">${lvlBadge(L.level)}</div>
      <div class="legend" style="justify-content:center"><span><i style="background:${LEVEL_FILL.black}"></i>Black &lt; ½ mo</span><span><i style="background:${LEVEL_FILL.red}"></i>Red ½-1</span><span><i style="background:${LEVEL_FILL.yellow}"></i>Yellow 1-3</span><span><i style="background:${LEVEL_FILL.green}"></i>Green ≥ 3</span></div></div>`;
    const tiles = `<div class="panel"><h3>The numbers</h3><div class="tiles">
      ${tile('Available operating cash', `<span class="${signClass(L.available)}">${pesoW(L.available)}</span>`, `Cash ${peso(L.generalCash)} − designated ${peso(L.restrictedDesignated)} − payables ${peso(L.approvedPayables)}`)}
      ${tile('Months of cover', hasE ? `${Number.isFinite(L.months) ? L.months.toFixed(1) : '—'}` : 'Not set', hasE ? `Essential monthly expense ${peso(L.essential)}` : 'Set it in Financial Overview › Cash Controls')}
    </div><div class="note" style="margin-top:8px">${escapeHtml(L.level.control)}</div></div>`;
    let projHtml;
    if (p.noTrend) projHtml = '<div class="note">Not enough completed months of recorded General Fund transactions yet to project cash.</div>';
    else {
      const alert = L.firstBad ? `<div class="chip down" style="font-size:14px;margin-bottom:8px">Reaches ${escapeHtml(L.firstBad.level.color.toUpperCase())} in ${escapeHtml(L.firstBad.label)} at the conservative trend</div>`
        : L.firstDrop ? `<div class="chip flat" style="font-size:14px;margin-bottom:8px">Drops to ${escapeHtml(L.firstDrop.level.color.toUpperCase())} in ${escapeHtml(L.firstDrop.label)}</div>`
        : `<div class="chip up" style="font-size:14px;margin-bottom:8px">Stays ${escapeHtml(p.startLevel.color.toUpperCase())} through ${escapeHtml(p.rows[p.rows.length - 1].label)}</div>`;
      projHtml = `${alert}<div class="svgwrap">${projectionSvg(L, o.w.full)}</div>
        <div class="note">Conservative (Hybrid): each month uses the lower of the recent income trend vs budgeted income and the higher of the recent expense trend vs budgeted expense (avg of ${escapeHtml(p.monthsUsed.join(', '))}).</div>
        ${tableView(['Month', 'Cash', 'Months of cover', 'Level'], p.rows.map(r => [r.label, peso(r.cash), Number.isFinite(r.cover) ? Math.max(0, r.cover).toFixed(2) : '—', `${r.level.color} · ${r.level.level}`]))}`;
    }
    const proj = `<div class="panel"><h3>Next 6 months, projected <span class="hint">available operating cash</span></h3>${projHtml}</div>`;
    const bar = (label, v, color) => `<tr><td><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${color};margin-right:6px"></i>${escapeHtml(label)}</td><td class="n">${peso(v)}</td></tr>`;
    const split = `<div class="panel"><h3>Free cash vs. money set aside <span class="hint">as of today · statement basis</span></h3><div class="tbl-scroll"><table class="t"><tbody>
      ${bar('General Fund cash (Cash on Hand + Bank)', L.gfCash, 'var(--s1)')}
      ${bar('Less: payroll withholdings held for remittance', -L.withholdings, 'var(--s-other)')}
      ${bar('Less: Building Fund money held in General Fund accounts', -L.buildingHeld, 'var(--s4)')}
      <tr><td><b>Free General Fund cash</b></td><td class="n"><b>${peso(L.freeGf)}</b></td></tr>
      ${L.restricted.filter(r => Math.abs(r.balance) >= 0.01).map(r => bar(r.name + ' (restricted)', r.balance, 'var(--s3)')).join('')}
      </tbody></table></div><div class="note">Earmarked money is not free to spend on ordinary operations.</div></div>`;
    return `<div class="grid2">${left}${tiles}</div>${proj}${split}`;
  }

  function slideBudget(k, o) {
    const b = k.budget;
    if (!b.hasBudget) return `<div class="panel"><div class="note" style="font-size:16px">No budget has been set up for ${k.period.year}. Set one up in Budget vs Actual to compare actuals with the plan.</div></div>`;
    const pbar = (label, pct, fill, tickPct, cap) => `<div class="tile"><div class="lbl">${escapeHtml(label)}</div><div class="val">${pctTxt(pct)}</div>
      <div class="pbar"><div class="fill" style="width:${Math.min(100, pct || 0)}%;background:${fill}"></div>${tickPct ? `<div class="tick" style="left:${Math.min(100, tickPct)}%"></div>` : ''}</div><div class="pbar-cap">${cap}</div></div>`;
    const incFill = (b.incomePct || 0) >= 100 ? 'var(--good)' : 'var(--s1)';
    const expFill = (b.expensePct || 0) > 100 ? 'var(--bad)' : 'var(--navy-2)';
    const heads = `<div class="grid2">
      ${pbar('Income achieved (selected months)', b.incomePct, incFill, null, `<span>${peso(b.incomeActual)} of ${peso(b.incomeBudget)}</span>`)}
      ${pbar('Expenses used (selected months)', b.expensePct, expFill, null, `<span>${peso(b.expenseActual)} of ${peso(b.expenseBudget)}</span>`)}
      ${pbar('Income, year to date', b.ytdIncomePct, (b.ytdIncomePct || 0) >= 100 ? 'var(--good)' : 'var(--s1)', null, `<span>${peso(b.ytdIncomeActual)} of ${peso(b.ytdIncomeBudget)} YTD budget</span>`)}
      ${pbar('Expenses, year to date', b.ytdExpensePct, (b.ytdExpensePct || 0) > 100 ? 'var(--bad)' : 'var(--navy-2)', b.schedulePace || b.pace, `<span>${peso(b.ytdExpenseActual)} of ${peso(b.ytdExpenseBudget)} YTD budget</span><span>◼ ${((b.schedulePace || b.pace)).toFixed(0)}% of the year's budget is due by now</span>`)}
    </div>`;
    const expRows = b.expMain.slice(0, 9), incRows = b.incMain.slice(0, 6);
    const bullets = `<div class="grid2">
      <div class="panel"><h3>Spending by category <span class="hint">bar = spent · gold tick = budget for the selected months</span></h3><div class="svgwrap">${bulletSvg(expRows, o.w.half, 'expense')}</div>${tableView(['Category', 'Spent', 'Budget'], b.expMain.map(r => [r.name, peso(r.actual), peso(r.budget)]))}</div>
      <div class="panel"><h3>Income by category <span class="hint">bar = received · gold tick = budget</span></h3><div class="svgwrap">${bulletSvg(incRows, o.w.half, 'income')}</div>${tableView(['Category', 'Received', 'Budget'], b.incMain.map(r => [r.name, peso(r.actual), peso(r.budget)]))}</div></div>`;
    const li = (r, expense) => `<li><span>${escapeHtml(r.name)}</span><span class="${expense ? 'neg' : 'neg'}">${expense ? '+' : '−'}${peso(Math.abs(r.actual - r.budget))}</span></li>`;
    const lists = `<div class="grid3">
      <div class="panel"><h3>Top 5 over budget</h3>${b.topOver.length ? `<ul class="rank">${b.topOver.map(r => li(r, true)).join('')}</ul>` : '<div class="note">No expense line is over its budget for these months.</div>'}</div>
      <div class="panel"><h3>Top 5 behind budget (income)</h3>${b.topBehind.length ? `<ul class="rank">${b.topBehind.map(r => li(r, false)).join('')}</ul>` : '<div class="note">No income line is behind budget for these months.</div>'}</div>
      <div class="panel"><h3>Unbudgeted (Miscellaneous)</h3><div class="tiles" style="grid-template-columns:1fr 1fr">${tile('Spent, selected months', pesoW(b.unbudgetedExp), '')}${tile('Spent, year to date', pesoW(b.unbudgetedExpYtd), `Unbudgeted income YTD ${peso(b.unbudgetedIncYtd)}`)}</div></div></div>`;
    return heads + bullets + lists;
  }

  function slideGiving(k, o) {
    const g = k.giving, sr = k.series;
    const tiles = `<div class="tiles">
      ${tile('Tithes, selected months', pesoW(g.tithes), chip(g.tithesChange, true), spark(g.tithesSeries, 'var(--s1)'))}
      ${tile('Tithes, year to date', pesoW(g.tithesYtd), chip(g.tithesYtdChange, true))}
      ${tile('Loose offerings, YTD', pesoW(g.looseYtd), chip(pctChange(g.looseYtd, g.loosePriorYtd), true))}
      ${tile('Unique tithers', num0(g.tithers), `${num0(g.tithersYtd)} this year to date · ${chip(g.tithersChange, true)}`, spark(g.titherSeries, 'var(--s3)'))}
      ${tile('Average tithe per tither', pesoW(g.avgTithe), 'selected months')}
      ${tile('Tither participation', g.participation === null ? '—' : pctTxt(g.participation, 1), g.participation === null ? 'attendance not recorded' : `${num0(g.tithers)} tithers / ${num0(k.people.attendanceAvg)} average attendance`)}
      ${tile('New tithers this year', num0(g.newTithers), 'first tithe this year (count only)')}
      ${tile('Lapsed tithers', num0(g.lapsedTithers), 'gave last year, nothing in the last 3 months (count only)')}
      ${tile('Giving concentration', g.concentration === null ? '—' : pctTxt(g.concentration), g.concentration === null ? 'needs at least 10 tithers' : 'share of tithes from the top 10% of tithers')}
    </div>`;
    const heat = `<div class="panel"><h3>Sunday collections <span class="hint">last 13 Sundays · darker = more given</span></h3><div class="svgwrap">${heatmapSvg(g.weeks, o.w.full)}</div>
      <div class="legend"><span>less</span>${HEAT.map(c => `<span><i style="background:${c}"></i></span>`).join('')}<span>more</span></div>
      ${tableView(['Week of', 'Collection'], g.weeks.map(w => [w.label, peso(w.amount)]))}</div>`;
    return tiles + heat + `<div class="note">Privacy: this page shows counts and percentages only - never a giver's name or amount.</div>`;
  }

  function slidePer100(k, o) {
    const basis = o.per100 === 'ytd' ? 'ytd' : 'period', d = k.per100[basis];
    const toggle = o.static ? '' : `<div class="seg per100-toggle" style="border-color:var(--line);margin-bottom:8px"><button onclick="setPer100('period')" class="${basis === 'period' ? 'on' : ''}" style="color:var(--navy)">Selected months</button><button onclick="setPer100('ytd')" class="${basis === 'ytd' ? 'on' : ''}" style="color:var(--navy)">Year to date</button></div>`;
    if (!d.total) return `<div class="panel"><div class="note" style="font-size:16px">No General Fund disbursements recorded for these months.</div></div>`;
    const sentence = r => {
      const nm = escapeHtml(r.name);
      return `<div class="coin-row"><i style="background:${r.other ? OTHER_HEX : CAT_COLORS[d.rows.indexOf(r)]}"></i><div><b>₱${r.pesos}</b> went to ${nm} <span class="note">(${peso(r.amount)})</span></div></div>`;
    };
    const ratios = `<div class="tiles" style="grid-template-columns:1fr 1fr">
      ${tile('Staff cost ratio', pctTxt(basis === 'ytd' ? k.per100.staffRatioYtd : k.per100.staffRatio, 0), 'payroll (gross) ÷ total disbursements')}
      ${tile('Ministry spending ratio', pctTxt(basis === 'ytd' ? k.per100.ministryRatioYtd : k.per100.ministryRatio, 0), 'Nurture, Outreach, Witness ÷ total')}</div>`;
    return `<div class="grid2"><div class="panel"><h3>Every ₱100 we spent</h3>${toggle}<div class="svgwrap" style="max-width:360px;margin:0 auto">${waffleSvg(d.rows, o.w.half)}</div>
      <div class="note" style="text-align:center">Total ${peso(d.total)} · each dot = ₱1 of every ₱100</div></div>
      <div class="panel"><h3>In plain words</h3>${d.rows.map(sentence).join('')}<div style="margin-top:10px">${ratios}</div></div></div>
      ${tableView(['Category', 'Amount', 'Per ₱100'], d.rows.map(r => [r.name, peso(r.amount), '₱' + r.pesos]))}`;
  }

  function slideObligations(k, o) {
    const ob = k.obligations, y = ob.year;
    if (!ob.rows.length) return `<div class="panel"><div class="note" style="font-size:16px">No church obligations are recorded for ${k.period.year}.</div></div>`;
    const ringBox = `<div class="panel" style="text-align:center"><h3 style="justify-content:center">Apportionments paid, ${k.period.year}</h3>
      <div class="svgwrap" style="max-width:200px;margin:0 auto">${ring(y.pct || 0, 200, (y.pct || 0) >= 100 ? 'var(--good)' : 'var(--s1)', pctTxt(y.pct), 'paid', false)}</div>
      <div class="note">${peso(y.paid)} of ${peso(y.due)} · balance ${peso(y.balance)}</div></div>`;
    const tiles = `<div class="panel"><h3>The numbers</h3><div class="tiles">
      ${tile('Due this year', pesoW(y.due), `${y.count} obligation${y.count === 1 ? '' : 's'}`)}
      ${tile('Paid', pesoW(y.paid), pctTxt(y.pct) + ' paid')}
      ${tile('Balance', pesoW(y.balance), '')}
      ${tile('Overdue', `<span class="${ob.overdue ? 'neg' : 'pos'}">${ob.overdue}</span>`, ob.overdue ? `${peso(ob.overdueAmount)} past due date` : 'nothing past its due date')}
      ${tile('Due in selected months', pesoW(ob.selected.due), `${peso(ob.selected.paid)} paid · ${pctTxt(ob.selected.pct)}`)}
    </div></div>`;
    const tbl = `<div class="panel"><h3>Obligations</h3><div class="tbl-scroll"><table class="t"><thead><tr><th>Obligation</th><th>Due</th><th class="n">Amount</th><th class="n">Paid</th><th>Status</th></tr></thead><tbody>${
      ob.rows.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.due || '—')}</td><td class="n">${peso(r.amount)}</td><td class="n">${peso(r.paid)}</td><td>${r.overdue ? '<span class="chip down">Overdue</span> ' : ''}${escapeHtml(r.status)}</td></tr>`).join('')}</tbody></table></div></div>`;
    return `<div class="grid2">${ringBox}${tiles}</div>${tbl}`;
  }

  function slideProjects(k, o) {
    const P = k.projects, B = P.building, tw = Math.max(120, Math.min(o.w.half, 380));
    const cards = P.list.length ? P.list.map(p => {
      const pct = p.target > 0 ? p.raised / p.target * 100 : null;
      return `<div class="panel"><h3>${escapeHtml(p.name)} <span class="hint">${escapeHtml(p.type)}</span></h3>
        ${pct !== null ? `<div class="svgwrap">${thermometer(pct, 'var(--s3)', tw)}</div>` : '<div class="note">No target set</div>'}
        <div class="tbl-scroll"><table class="t"><tbody>
          <tr><td>Target (planned cost)</td><td class="n">${p.target > 0 ? peso(p.target) : '—'}</td></tr>
          <tr><td>Raised (pledges, gifts, receipts)</td><td class="n">${peso(p.raised)}</td></tr>
          <tr><td>Church funds put in</td><td class="n">${peso(p.churchFund)}</td></tr>
          <tr><td>Costs so far</td><td class="n">${peso(p.costs)}</td></tr>
          ${p.grossReceipts > 0 || p.posted > 0 ? `<tr><td>Net proceeds (receipts − costs)</td><td class="n ${signClass(p.net)}">${peso(p.net)}</td></tr><tr><td>Posted to General Fund</td><td class="n">${peso(p.posted)}</td></tr>` : ''}
        </tbody></table></div></div>`;
    }).join('') : '<div class="panel"><div class="note">No active special projects.</div></div>';
    const bf = `<div class="panel"><h3>Building Fund <span class="hint">restricted · reported separately</span></h3>
      <div class="tiles">
        ${tile('Receipts in, selected months', pesoW(B.inAmt), `year to date ${peso(B.ytdIn)}`)}
        ${tile('Paid out, selected months', pesoW(B.outAmt), `year to date ${peso(B.ytdOut)}`)}
        ${tile('Net transfers in/out', pesoW(B.transfers), `year to date ${peso(B.ytdTransfers)}`)}
        ${tile('Balance', pesoW(B.total), `account ${peso(B.balance)}${Math.abs(B.heldInGf) >= 0.01 ? (B.heldInGf >= 0 ? ' + ' : ' − ') + peso(Math.abs(B.heldInGf)) + ' held in General Fund accounts' : ''}`)}
      </div></div>`;
    return `<div class="grid2">${cards}${bf}</div>`;
  }

  function slidePeople(k, o) {
    const p = k.people, hasAtt = p.attendanceAvg > 0;
    const att = `<div class="tiles">
      ${tile(k.period.count > 1 ? 'Average monthly attendance' : 'Attendance', hasAtt ? num0(p.attendanceAvg) : '—', hasAtt ? chip(p.attendanceChange, true) : 'not recorded for these months', spark(p.series, 'var(--s3)'))}
      ${tile('Attendance average, year to date', p.attendanceYtdAvg > 0 ? num0(p.attendanceYtdAvg) : '—', 'per month')}
      ${tile('Same months last year', p.attendancePriorAvg > 0 ? num0(p.attendancePriorAvg) : '—', 'average per month')}
    </div>`;
    const r = p.roll;
    const roll = r ? `<div class="tiles">${tile('Active members', num0(r.Active), `of ${num0(r.total)} on the roll`)}${tile('Inactive', num0(r.Inactive), '')}${tile('Overseas', num0(r.Overseas), '')}</div>`
      : `<div class="tiles">${naTile('Membership roll', 'Visible to the Treasurer, Pastor and Chairperson')}</div>`;
    return `<div class="grid2"><div class="panel"><h3>Worship attendance</h3>${att}</div><div class="panel"><h3>Membership roll</h3>${roll}</div></div>`;
  }

  function slideControls(k, o) {
    const c = k.controls;
    const good = (cond) => cond ? 'pos' : 'neg';
    const pctOk = v => v === null ? '—' : `<span class="${v >= 90 ? 'pos' : v >= 60 ? '' : 'neg'}">${v.toFixed(0)}%</span>`;
    const rec = `<div class="tile"><div class="lbl">Ending Balance check</div><div class="val ${c.reconcileClean ? 'pos' : 'neg'}">${c.reconcileClean ? '✓ Balanced' : '✗ Off by ' + peso(c.reconcileDiff)}</div><div class="sub">General Fund accounts vs the statement's Ending Balance</div></div>`;
    return `<div class="tiles">
      ${rec}
      ${tile('Expenses with a receipt', pctOk(c.receiptPct), c.expenseCount ? `${c.expenseCount - c.missingReceipt} of ${c.expenseCount}` : 'no expenses to check')}
      ${tile('Expenses with a cash voucher', pctOk(c.voucherPct), c.expenseCount ? `${c.expenseCount - c.missingVoucher} of ${c.expenseCount}` : 'no expenses to check')}
      ${tile('Sundays with a count sheet', c.sundays ? `${c.sundaysWithSheet} / ${c.sundays}` : '—', c.countSheetsReadable ? (c.countChecked ? `${c.countMismatches} cash-count mismatch${c.countMismatches === 1 ? '' : 'es'} of ${c.countChecked} checked` : 'no denomination counts saved') : 'count sheets not readable')}
      ${tile('Cash advances not yet liquidated', `<span class="${c.advancesOpen ? 'neg' : 'pos'}">${c.advancesOpen}</span>`, c.advancesOpen ? `${peso(c.advancesAmount)} · oldest ${c.advancesOldestDays} days` : 'all liquidated')}
      ${tile('Report workflow', c.workflowApplies ? escapeHtml(c.workflowStatus) : 'n/a', c.workflowApplies ? 'monthly / annual report status' : 'applies to a single month or the full year')}
    </div>`;
  }

  const SLIDES = [
    { id: 'hero', title: 'Where we stand', q: 'How did the church do, and how healthy is our cash?', fn: slideHero },
    { id: 'liquidity', title: 'Can we pay our bills?', q: 'Liquidity, runway and what cash is really free', fn: slideLiquidity },
    { id: 'budget', title: 'Are we on plan?', q: 'Actuals against the approved budget', fn: slideBudget },
    { id: 'giving', title: 'Is our giving base healthy?', q: 'Tithes, tithers and weekly collections', fn: slideGiving },
    { id: 'per100', title: 'How we use the offering', q: 'Where every ₱100 goes', fn: slidePer100 },
    { id: 'obligations', title: 'Faithful to the wider church?', q: 'Apportionments and other obligations', fn: slideObligations },
    { id: 'projects', title: 'Our building and mission work', q: 'Special projects and the Building Fund', fn: slideProjects },
    { id: 'people', title: 'Who we serve', q: 'Attendance and the membership roll', fn: slidePeople },
    { id: 'controls', title: 'Can the Council trust these numbers?', q: 'Stewardship and controls (Treasurer and Auditor)', fn: slideControls, only: CONTROLS_ROLES }
  ];
  function slidesFor(k) { return SLIDES.filter(s => !s.only || (s.id === 'controls' ? !!k.controls : true)); }

  // ───────────────────────────────────────────────────────────────────────
  // 6. TALKING POINTS: auto sentences from the kpi object; the Treasurer may edit them per slide
  // ───────────────────────────────────────────────────────────────────────
  function autoTalkingPoints(k) {
    const s = k.stmt, L = k.liquidity, b = k.budget, g = k.giving, P = k.per100, ob = k.obligations, pj = k.projects, pe = k.people, lab = k.period.label;
    const T = {};
    T.hero = [
      `Receipts for ${lab} were ${pesoW(s.receipts)}, ${changeWords(k.change.receipts)}.`,
      `We spent ${pesoW(s.disbursements)} (${changeWords(k.change.disbursements)}), leaving a ${s.net >= 0 ? 'surplus' : 'deficit'} of ${pesoW(Math.abs(s.net))}.`,
      `Year to date we have received ${pesoW(k.ytd.receipts)} and spent ${pesoW(k.ytd.disbursements)}: a ${k.ytd.net >= 0 ? 'surplus' : 'deficit'} of ${pesoW(Math.abs(k.ytd.net))}.`,
      `The General Fund ${s.endBal >= 0 ? 'ended with' : 'ended at'} ${pesoW(s.endBal)}; cash level today is ${L.level.color.toUpperCase()} (${L.level.level})${Number.isFinite(L.months) ? ` with ${L.months.toFixed(1)} months of cover` : ''}.`
    ];
    T.liquidity = [];
    if (Number.isFinite(L.months)) T.liquidity.push(`We hold ${pesoW(L.available)} of available operating cash - enough for ${L.months.toFixed(1)} months of essential expenses (${L.level.level}).`);
    else T.liquidity.push(`Available operating cash is ${pesoW(L.available)}; the Essential Monthly Operating Expense is not set yet, so the cash level cannot be graded.`);
    if (!L.projection.noTrend) {
      if (L.firstBad) T.liquidity.push(`At the conservative trend, cash falls to ${L.firstBad.level.color.toUpperCase()} by ${L.firstBad.label} - the Council should discuss a plan now.`);
      else if (L.firstDrop) T.liquidity.push(`At the conservative trend, the cash level slips to ${L.firstDrop.level.color.toUpperCase()} by ${L.firstDrop.label}.`);

  function effectivePoints(id, k) {

    }

  function syncControlsUi() {

  function presetMonths(name, year) {
    const now = nowDate(), curY = now.getFullYear(), curM = now.getMonth();
    switch (name) {
      case 'this': return { year: curY, months: [curM] };
      case 'last': { const d = new Date(curY, curM - 1, 1); return { year: d.getFullYear(), months: [d.getMonth()] }; }
      case 'q1': case 'q2': case 'q3': case 'q4': { const q = parseInt(name[1], 10) - 1; return { year, months: [q * 3, q * 3 + 1, q * 3 + 2] }; }
      case 'ytd': { const lastM = year === curY ? curM : 11; return { year, months: Array.from({ length: lastM + 1 }, (_, i) => i) }; }
      case 'year': return { year, months: Array.from({ length: 12 }, (_, i) => i) };
      default: return { year, months: [] };
    }
  }
  function setupControls(years) {
    const sel = $('sel-year');

    }
    document.addEventListener('mousemove', show);
    document.addEventListener('click', show);

    } else {

  function presenterWords(d) {

  function updateFollowUi() {
    const bar = $('follow-bar'), btn = $('btn-follow');
    document.body.classList.toggle('following', follow.on);
    if (isTreasurer()) { bar.style.display = 'none'; btn.style.display = 'none'; return; }
    btn.style.display = '';
    const act = follow.doc && follow.doc.active;
    btn.classList.toggle('pulse', !!act && !follow.on);
    btn.disabled = false;
    btn.textContent = follow.on ? 'Stop following' : 'Follow Treasurer';
    $('follow-hint').textContent = follow.on ? '' : (act ? `Treasurer is presenting ${presenterWords(follow.doc)}` : 'Treasurer is not presenting right now');
    if (follow.on) {
      bar.style.display = 'flex';
      $('follow-text').textContent = follow.paused ? 'Following paused - you changed the view.' : `Following the Treasurer - showing ${presenterWords(follow.last) || ui.period.label}`;
      $('btn-resume').style.display = follow.paused ? '' : 'none';
    } else bar.style.display = 'none';
  }
  async function checkPresenterOnce() {
    follow.doc = await getDocData('settings', PRESENTER_DOC);
    if (isTreasurer()) { // restore the button after a reload
      presenter.active = !!(follow.doc && follow.doc.active && follow.doc.by && activeUserProfile && follow.doc.by.uid === (firebase.auth().currentUser || {}).uid);
      updateBroadcastButton();
    }
    updateFollowUi();
  }
  async function toggleFollow() {
    if (isTreasurer()) return;
    if (follow.on) { endFollow(); return; }
    follow.doc = await getDocData('settings', PRESENTER_DOC);
    if (!(follow.doc && follow.doc.active)) { updateFollowUi(); return; }
    startFollow();
  }
  // DELIBERATE EXCEPTION to the one-time-read convention: while (and only while) a viewer follows the Treasurer,
  // this attaches an onSnapshot listener to the single settings/councilPresenter doc. It is detached on
  // unfollow, when the presenter stops, and on pagehide.
  function startFollow() {
    follow.on = true; follow.paused = false;
    follow.unsub = db.collection('settings').doc(PRESENTER_DOC).onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      follow.last = d; follow.doc = d;
      if (!d || !d.active) { endFollow('Presentation ended'); return; }
      if (!follow.paused) applyRemote(d);
      updateFollowUi();
    }, err => { console.warn('Follow listener error', err && err.message); endFollow('Lost connection to the presenter'); });
    updateFollowUi();
  }
  function endFollow(msg) {
    if (follow.unsub) { try { follow.unsub(); } catch (e) { /* ignore */ } }
    follow.unsub = null; follow.on = false; follow.paused = false; follow.last = null;
    if (msg) { follow.doc = { active: false }; $('follow-hint').textContent = msg; }
    updateFollowUi();
    if (msg) $('follow-hint').textContent = msg;
  }
  function resumeFollow() { follow.paused = false; if (follow.last) applyRemote(follow.last); updateFollowUi(); }
  async function applyRemote(d) {
    if (follow.applying) { follow.pending = d; return; }
    follow.applying = true;
    try {
      const months = (d.months || []).map(s => parseInt(String(s).slice(5, 7), 10) - 1);
      const sameSel = ui.period && ui.period.year === d.year && JSON.stringify(ui.period.months) === JSON.stringify(makePeriod(d.year, months).months);
      if (!sameSel) await setSelection(d.year, months, { remote: true });
      if (d.presentationMode && !ui.presenting) startPresentation({ remote: true });
      else if (!d.presentationMode && ui.presenting) stopPresentation({ remote: true });
      let idx = ui.slides.findIndex(s => s.id === d.section);
      if (idx < 0) idx = Math.min(d.slideIndex || 0, ui.slides.length - 1);
      goToSlide(idx, { remote: true });
    } finally {
      follow.applying = false;
      if (follow.pending) { const p = follow.pending; follow.pending = null; if (!follow.paused) applyRemote(p); }
    }
  }
  window.addEventListener('pagehide', () => { if (follow.unsub) { try { follow.unsub(); } catch (e) { /* ignore */ } follow.unsub = null; } });

  // ───────────────────────────────────────────────────────────────────────
  // 10. GENERATE & SAVE VERSION (Treasurer only) -> reportArchive + Storage, like the other pages
  // ───────────────────────────────────────────────────────────────────────
  function buildSnapshotShell(title, periodLabel, bodyHtml) {
    const generatedBy = activeUserProfile ? `${activeUserProfile.name} (${activeUserProfile.role})` : 'Unknown';
    const generatedAt = new Date().toLocaleString('en-PH');
    const css = $('dash-css').textContent;
    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(title)}</title>
<style>${css}</style>
<style>.snap-head{background:#8B0000;color:#fff;padding:16px 22px}.snap-head h1{font-size:22px}.snap-head div{font-size:12px;opacity:.9;margin-top:4px;line-height:1.5}</style>
</head>
<body>
  <div class="snap-head"><h1>${escapeHtml(title)}</h1><div>${escapeHtml(periodLabel || '')}<br>Generated by ${escapeHtml(generatedBy)} on ${escapeHtml(generatedAt)}<br>GraceBooks - Tagaytay United Methodist Church · counts and percentages only, no giver names</div></div>
  <div id="dash">${bodyHtml}</div>
</body>
</html>`;
  }
  async function saveReportVersion({ sourcePage, title, periodLabel, bodyHtml }) {
    const html = buildSnapshotShell(title, periodLabel, bodyHtml);
    const blob = new Blob([html], { type: 'text/html' });
    const docRef = db.collection('reportArchive').doc();
    const storagePath = `report-archive/${docRef.id}/snapshot.html`;
    await storage.ref(storagePath).put(blob, { contentType: 'text/html' });
    const user = firebase.auth().currentUser;
    const createdAt = new Date().toISOString();
    const meta = {
      sourcePage, title, periodLabel: periodLabel || '', storagePath,
      actorUid: user ? user.uid : '', actorEmail: user ? user.email : '',
      actorName: activeUserProfile ? activeUserProfile.name : '', actorRole: activeUserProfile ? activeUserProfile.role : '', createdAt
    };
    await docRef.set(meta);
    await db.collection('auditLogs').add({
      action: 'report_version_saved', collection: 'reportArchive', docId: docRef.id,
      summary: `Saved report version: ${title}`, before: null, after: { sourcePage, title, periodLabel, storagePath },
      actorUid: meta.actorUid, actorEmail: meta.actorEmail, actorName: meta.actorName, actorRole: meta.actorRole, createdAt
    });
  }
  async function saveCouncilVersion() {
    if (!isTreasurer() || !ui.kpi || !ui.period.count) return;
    const btn = $('save-version-btn');
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      const k = ui.kpi, o = { static: true, w: { full: 1000, half: 480 }, per100: ui.per100, editing: false };
      const body = slidesFor(k).map((def, i) => slideHtml(def, i + 1, k, o)).join('');
      await saveReportVersion({ sourcePage: 'council-dashboard', title: `Council Dashboard — ${k.period.label}`, periodLabel: k.period.label, bodyHtml: body });
      alert('Version saved to Report Archive.');
    } catch (err) { console.error(err); alert('Could not save version. Please try again.'); }
    btn.disabled = false; btn.textContent = 'Generate & Save Version';
  }

  // ───────────────────────────────────────────────────────────────────────
  // 11. BOOT
  // ───────────────────────────────────────────────────────────────────────
  window.graceBooksAuthReady.then(async profile => {
    activeUserProfile = profile;
    if (!COUNCIL_ALLOWED_ROLES.includes(profile.role)) { window.location.href = 'index.html'; return; }
    $('who-line').textContent = `${profile.name} · ${profile.role}`;
    $('save-version-btn').style.display = isTreasurer() ? '' : 'none';
    $('btn-broadcast').style.display = isTreasurer() ? '' : 'none';
    $('btn-follow').style.display = isTreasurer() ? 'none' : '';
    updateEditButtons();
    try {
      const raw = await loadRaw(profile);
      if (!raw.income || !raw.expenses) throw new Error('Income or expenses could not be read.');
      ui.raw = raw;
      const now = nowDate();
      const yrs = new Set([now.getFullYear()]);
      if (raw.yearsCfg && Array.isArray(raw.yearsCfg.list)) raw.yearsCfg.list.forEach(y => yrs.add(parseInt(y, 10)));
      raw.income.concat(raw.expenses).forEach(d => { const y = parseInt(String(d.date).slice(0, 4), 10); if (y > 2000) yrs.add(y); });
      const years = [...yrs].filter(Number.isFinite).sort((a, b) => b - a);
      setupControls(years);
      const start = presetMonths('last', years[0]);
      await setSelection(start.year, start.months, { remote: true });
      checkPresenterOnce();
    } catch (err) {
      console.error(err);
      $('dash').innerHTML = `<div class="status-msg err">Could not load the numbers: ${escapeHtml(err.message || err)}. Please reload the page.</div>`;
    }
  });
</script>
</body>
</html>
