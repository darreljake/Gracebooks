<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#8B0000"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Council Dashboard — GraceBooks</title>
  <style id="dash-css">
    /* Council Dashboard: "Sunday story" - big calm numbers on clean cards, UMC cross-and-flame
       accents (deep red / warm gold / navy). Chart colours: categorical slots 1-6 of the validated
       reference palette (blue, orange, aqua, yellow, magenta, green) + a neutral for "Other";
       status colours are reserved for cash levels / good-bad and always ship with a label. */
    :root {
      --red: #8B0000; --red-d: #6a0000; --gold: #C9A84C; --gold-l: #f6edd0; --navy: #14233f; --navy-2: #22365e;
      --ink: #1f2937; --ink-2: #4b5563; --muted: #6b7280; --line: #e5e0d4; --bg: #f5f1e8; --card: #ffffff;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s-other: #8a8f98;
      --green: #1e8449; --green-bg: #e9f7ef; --yellow: #9a7d0a; --yellow-bg: #fef9e7; --redst: #c0392b; --red-bg: #fdedec; --black: #212121;
      --good: #1e8449; --bad: #b3261e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; line-height: 1.4; }
    button, select { font-family: inherit; }

    /* ── Top bar / controls ─────────────────────────────── */
    .topbar { background: var(--red); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; flex: 1 1 auto; }
    .topbar h1 small { display: block; font-size: 12px; font-weight: 400; opacity: .85; }
    .btn { border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,.18); color: #fff; }
    .btn:hover { background: rgba(255,255,255,.3); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.gold { background: var(--gold); color: var(--navy); }
    .btn.gold:hover { background: #d8b95c; }
    .controls { background: var(--navy); color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; overflow: hidden; }
    .seg button { background: transparent; color: #fff; border: 0; padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .seg button.on { background: var(--gold); color: var(--navy); font-weight: 700; }
    .controls select { padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.35); background: #fff; color: var(--navy); font-size: 14px; }
    .controls .spacer { flex: 1 1 auto; }
    .controls .btn { background: rgba(255,255,255,.14); }
    .controls .btn.gold { background: var(--gold); }
    .period-label { font-size: 13px; opacity: .85; }


    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button, .presets button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; min-width: 46px; }
    .chips button.on { background: var(--gold); color: var(--navy); font-weight: 800; border-color: var(--gold); }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .presets button { background: rgba(255,255,255,.1); font-size: 13px; padding: 6px 10px; }
    .presets button:hover, .chips button:hover { background: rgba(255,255,255,.25); }
    .chips button.on:hover { background: #d8b95c; }
    .follow-bar { position: sticky; top: 0; z-index: 40; background: #0b5ed7; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-weight: 600; }
    .follow-bar .btn { background: rgba(255,255,255,.2); }
    #btn-follow.pulse { background: var(--gold); color: var(--navy); animation: pulse 1.4s infinite; }
    #btn-broadcast.live { background: #b3261e; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(201,168,76,.7); } 70% { box-shadow: 0 0 0 10px rgba(201,168,76,0); } 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0); } }
    @media (prefers-reduced-motion: reduce) { #btn-follow.pulse, #btn-broadcast.live { animation: none; } }
    body.presenting .follow-bar { position: fixed; left: 0; right: 0; top: 0; }

    /* ── Dashboard shell ───────────────────────────────── */
    #dash { max-width: 1240px; margin: 0 auto; padding: 18px 16px 60px; }
    .status-msg { background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 30px 18px; text-align: center; color: var(--muted); font-size: 16px; }
    .status-msg.err { color: var(--bad); border-color: #f1b5b0; }

    .slide { background: var(--card); border-radius: 18px; box-shadow: 0 3px 16px rgba(20,35,63,.09); margin-bottom: 26px; overflow: hidden; border-top: 6px solid var(--red); }
    .slide-head { display: flex; align-items: center; gap: 14px; padding: 18px 22px 8px; }
    .slide-num { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: var(--navy); color: var(--gold); font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center; }
    .slide-head h2 { font-size: 26px; color: var(--red); line-height: 1.15; }
    .slide-head .q { font-size: 15px; color: var(--ink-2); margin-top: 2px; }
    .slide-body { padding: 8px 22px 18px; display: grid; gap: 18px; }
    .grid2 { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
    .grid3 { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); }
    .panel { background: #fcfaf5; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
    .panel h3 { font-size: 15px; color: var(--navy); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .panel h3 .hint { font-size: 12px; font-weight: 400; color: var(--muted); }
    .svgwrap { width: 100%; min-width: 0; }
    .svgwrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .svgwrap text { font-family: inherit; fill: var(--ink-2); }

    /* KPI tiles */
    .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
    .tile .lbl { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    .tile .val { font-size: 26px; font-weight: 800; color: var(--navy); line-height: 1.1; margin-top: 4px; white-space: nowrap; }
    .tile .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
    .tile .spark { margin-top: 6px; height: 34px; }
    .tile.na { background: #f3f1ec; border-style: dashed; }
    .tile.na .val { font-size: 15px; color: var(--muted); font-weight: 600; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .chip.up { background: var(--green-bg); color: var(--good); }
    .chip.down { background: var(--red-bg); color: var(--bad); }
    .chip.flat { background: #eee; color: var(--ink-2); }
    .pos { color: var(--good); } .neg { color: var(--bad); }

    /* Hero */
    .hero { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; border-radius: 16px; padding: 22px 20px; display: grid; gap: 18px; grid-template-columns: 1fr auto 1fr 1fr; align-items: center; }
    .hero .big { min-width: 0; }
    .hero .big .lbl { font-size: 14px; letter-spacing: .6px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .hero .big .num { font-size: clamp(30px, 3.6vw, 50px); font-weight: 800; line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .hero .big .num.neg { color: #ff9b94; } .hero .big .num.pos { color: #8be2b0; }
    .hero .big .cmp { font-size: 14px; margin-top: 6px; color: #dbe3f3; }
    .hero .chip.up { background: #1e8449; color: #fff; } .hero .chip.down { background: #b3261e; color: #fff; } .hero .chip.flat { background: #5a6a8a; color: #fff; }
    .ring-box { text-align: center; }
    .ring-box .ring-cap { font-size: 13px; color: #dbe3f3; margin-top: 4px; }
    .ring-box svg text { fill: #fff; }
    .lvl { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; }
    .lvl.green { background: var(--green-bg); color: var(--green); border: 1px solid #a9dfbf; }
    .lvl.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #f7dc6f; }
    .lvl.red { background: var(--red-bg); color: var(--redst); border: 1px solid #f5b7b1; }
    .lvl.black { background: var(--black); color: #fff; border: 1px solid var(--black); }

    /* progress / pace bar */
    .pbar { position: relative; height: 22px; background: #ece8dd; border-radius: 11px; overflow: visible; margin: 8px 0 4px; }
    .pbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 11px; min-width: 6px; }
    .pbar .tick { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--navy); border-radius: 2px; }
    .pbar-cap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    /* lists / tables */
    .tbl-scroll { overflow-x: auto; max-width: 100%; }
    table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
    table.t td { padding: 7px 8px; border-bottom: 1px solid #efeadf; vertical-align: top; }
    table.t td.n, table.t th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    ul.rank { list-style: none; display: grid; gap: 6px; }
    ul.rank li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #efeadf; }
    ul.rank li span:first-child { min-width: 0; overflow-wrap: anywhere; }
    ul.rank li span:last-child { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    details.tv { margin-top: 8px; font-size: 13px; }
    details.tv summary { cursor: pointer; color: var(--navy-2); font-weight: 600; }
    .sentences { list-style: none; display: grid; gap: 8px; }
    .sentences li { font-size: 17px; line-height: 1.35; padding-left: 26px; position: relative; }
    .sentences li::before { content: ''; position: absolute; left: 4px; top: 7px; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); }
    .sentences .coin { font-weight: 800; color: var(--navy); }
    .note { font-size: 13px; color: var(--muted); }

    /* talking points */
    .points { border-top: 2px dashed var(--line); background: var(--gold-l); padding: 14px 22px 16px; }
    .points h3 { font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--red); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .points ul { list-style: none; display: grid; gap: 6px; }
    .points li { font-size: 18px; color: var(--navy); padding-left: 24px; position: relative; line-height: 1.35; }
    .points li::before { content: '\2726'; position: absolute; left: 0; color: var(--red); }
    .points textarea { width: 100%; min-height: 96px; font-size: 16px; padding: 10px; border: 1px solid var(--gold); border-radius: 8px; font-family: inherit; color: var(--navy); }
    .edited-badge { font-size: 11px; background: var(--navy); color: #fff; border-radius: 999px; padding: 1px 8px; text-transform: none; letter-spacing: 0; }

    /* navigation helpers */
    .tools { display: none; }
    body.presenting .per100-toggle { display: none; }
    body.presenting.following .slide { height: calc(100vh - 54px); margin-top: 54px; }
    .pres-ui { display: none; }

    /* waffle legend sentences */
    .coin-row { display: flex; align-items: flex-start; gap: 10px; font-size: 17px; padding: 5px 0; }
    .coin-row i { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; }
    .coin-row b { color: var(--navy); }

    #tip { position: fixed; z-index: 99; pointer-events: none; background: var(--navy); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 13px; max-width: 260px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 899px) {
      .grid2, .grid3 { grid-template-columns: 1fr; }
      .hero { grid-template-columns: 1fr; text-align: center; }
      .ring-box { order: -1; }
    }
    @media (max-width: 600px) {
      .topbar h1 { font-size: 18px; }
      #dash { padding: 12px 12px 40px; }
      .slide-head { padding: 14px 14px 6px; gap: 10px; }
      .slide-head h2 { font-size: 21px; }
      .slide-num { width: 38px; height: 38px; font-size: 18px; }
      .slide-body { padding: 6px 14px 14px; }
      .points { padding: 12px 14px; }
      .points li { font-size: 16px; }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .tile .val { font-size: 21px; }
      .hero { padding: 16px 14px; }
      .controls { padding: 10px 12px; }
      .controls .btn { padding: 8px 10px; font-size: 13px; }
    }

    /* ── Presentation mode ─────────────────────────────── */
    body.presenting { overflow: hidden; background: var(--navy); }
    body.presenting .topbar, body.presenting .controls { display: none; }
    body.presenting #dash { max-width: none; height: 100vh; padding: 0; margin: 0; }
    body.presenting .slide { display: none; margin: 0; border-radius: 0; height: 100vh; overflow-y: auto; border-top-width: 10px; }
    body.presenting .slide.active { display: block; }
    body.presenting .slide-head h2 { font-size: clamp(26px, 3.6vw, 48px); }
    body.presenting .slide-head .q { font-size: clamp(16px, 1.8vw, 24px); }
    body.presenting .slide-num { width: 64px; height: 64px; font-size: 30px; }
    body.presenting .slide-body { padding: 10px 4vw 18px; }
    body.presenting .tile .val { font-size: clamp(24px, 2.3vw, 36px); }
    body.presenting .tiles { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    body.presenting .tile .lbl, body.presenting .tile .sub, body.presenting table.t, body.presenting ul.rank li, body.presenting .legend { font-size: clamp(13px, 1.15vw, 18px); }
    body.presenting .points { padding: 16px 4vw 70px; }
    body.presenting .points li { font-size: clamp(18px, 2vw, 28px); }
    body.presenting .coin-row { font-size: clamp(17px, 1.8vw, 26px); }
    body.presenting .hero .big .num { font-size: clamp(32px, 3.6vw, 58px); }
    body.presenting .tools, body.presenting details.tv { display: none; }
    body.presenting .pres-ui { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(20,35,63,.94); color: #fff; padding: 8px 16px; align-items: center; gap: 12px; }
    body.presenting .pres-ui .dots { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    body.presenting .pres-ui .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.3); display: block; }
    body.presenting .pres-ui .dots i.on { background: var(--gold); }
    body.presenting .pres-ui .ctr { font-weight: 700; min-width: 56px; }
    body.presenting .pres-ui .btn { padding: 6px 12px; }

    /* ── Print: one section per page, no buttons ───────── */
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .topbar, .controls, .tools, .per100-toggle, .follow-bar, .pres-ui, details.tv, #tip, .edit-only { display: none !important; }
      #dash { max-width: none; padding: 0; }
      .slide { box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; margin: 0; border-top: 6px solid var(--red); }
      .slide:last-child { break-after: auto; page-break-after: auto; }
      .slide, .panel, .tile { break-inside: avoid; }
      .points { background: var(--gold-l); }
      .hero { background: var(--navy) !important; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="btn" id="btn-back" onclick="location.href='index.html'">&larr; Back</button>
    <h1>Council Dashboard<small id="who-line">Tagaytay United Methodist Church</small></h1>
    <button class="btn" onclick="window.print()">Print / PDF</button>
  </div>
  <div class="controls" id="controls">
    <select id="sel-year" aria-label="Year"></select>
    <div class="chips" id="month-chips" role="group" aria-label="Months to include"></div>
    <div class="presets" id="presets" role="group" aria-label="Quick selections">
      <button type="button" data-p="this">This month</button><button type="button" data-p="last">Last month</button>
      <button type="button" data-p="q1">Q1</button><button type="button" data-p="q2">Q2</button><button type="button" data-p="q3">Q3</button><button type="button" data-p="q4">Q4</button>
      <button type="button" data-p="ytd">YTD</button><button type="button" data-p="year">Full year</button><button type="button" data-p="clear">Clear</button>
    </div>
    <span class="period-label" id="period-label"></span>
    <span class="spacer"></span>
    <span class="period-label" id="follow-hint"></span>
    <button class="btn" id="btn-follow" style="display:none" onclick="toggleFollow()">Follow Treasurer</button>
    <button class="btn" id="btn-edit" style="display:none" onclick="toggleEditPoints()">Edit talking points</button>
    <button class="btn" id="btn-save-points" style="display:none" onclick="saveTalkingPoints()">Save talking points</button>
    <button class="btn" id="btn-reset-points" style="display:none" onclick="resetTalkingPoints()">Reset to auto</button>
    <button class="btn" id="btn-cancel-points" style="display:none" onclick="cancelEditPoints()">Cancel</button>
    <button class="btn gold" id="save-version-btn" style="display:none" onclick="saveCouncilVersion()">Generate &amp; Save Version</button>
    <button class="btn" id="btn-broadcast" style="display:none" onclick="toggleBroadcast()">&#128225; Start presenting</button>
    <button class="btn gold" id="btn-present" onclick="startPresentation()">&#9654; Slide show</button>
  </div>
  <div class="follow-bar" id="follow-bar" style="display:none">
    <span id="follow-text"></span>
    <button class="btn" id="btn-resume" style="display:none" onclick="resumeFollow()">Resume following</button>
    <button class="btn" onclick="toggleFollow()">Stop following</button>
  </div>

  <div id="dash"><div class="status-msg" id="loading-msg">Loading the numbers&hellip;</div></div>

  <div class="pres-ui" id="pres-ui">
    <button class="btn" onclick="presNav(-1)" aria-label="Previous slide">&larr;</button>
    <span class="ctr" id="pres-ctr">1 / 1</span>
    <div class="dots" id="pres-dots"></div>
    <button class="btn" onclick="presNav(1)" aria-label="Next slide">&rarr;</button>
    <button class="btn" onclick="stopPresentation()">Esc &times;</button>
  </div>
  <div id="tip" role="tooltip"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
  <script src="auth.js"></script>
  <script>requireGraceBooksAuth();</script>
<script>
  // ═══════════════════════════════════════════════════════════════════════
  // COUNCIL DASHBOARD - see COUNCIL-DASHBOARD-PLAN.md / CLAUDE.md.
  // Pipeline: loadRaw() (one-time reads) -> applyBasis(raw) -> computeKpis(raw, period)
  //           -> render*(kpi) / autoTalkingPoints(kpi) / snapshot. Rendering never queries Firestore.
  // Every basis helper in section 1 is COPIED (no shared modules in this repo) from the page named in
  // its comment - keep them in step with their source.
  // ═══════════════════════════════════════════════════════════════════════
  const firebaseConfig = {
    apiKey: "AIzaSyCimlS-2_tInj_khQ6KIaeocHYVVK0hwtc",
    authDomain: "gracebooks-7eebc.firebaseapp.com",
    projectId: "gracebooks-7eebc",
    storageBucket: "gracebooks-7eebc.firebasestorage.app",
    messagingSenderId: "423871889231",
    appId: "1:423871889231:web:b2053c9df3517e3c210f3a"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  // Roles allowed on the page (all can read income/expenses/budgets/churchObligations/specialProjects*,
  // per firestore.rules). Others are sent back to index.html, as financial-overview.html does.
  const COUNCIL_ALLOWED_ROLES = ['Treasurer', 'Pastor', 'Auditor', 'Finance Chair', 'Chairperson', 'Finance Committee'];
  const CONTROLS_ROLES = ['Treasurer', 'Auditor'];                                   // section 9
  const ROLL_READ_ROLES = ['Treasurer', 'Membership Secretary', 'Deaconess', 'Pastor', 'Chairperson']; // membershipRoll rules
  const LIQ_READ_ROLES = ['Treasurer', 'Auditor', 'Pastor', 'Deaconess', 'Admin Assistant'];           // liquidationRequests rules
  let activeUserProfile = null;

  const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const LONG_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));
  }
  const escapeAttr = escapeHtml;
  // copied from print-report.html fmt()
  function fmt(num) {
    return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ───────────────────────────────────────────────────────────────────────
  // 1. BASIS HELPERS (verbatim copies)
  // ───────────────────────────────────────────────────────────────────────
  // copied from print-report.html - keep in step
  const FINANCIAL_ACCOUNTS = [
    { id:'cash-hand',  name:'Cash on Hand' },
    { id:'cash-bank',  name:'Cash in Bank' },
    { id:'petty-cash', name:'Petty Cash Fund' },
    { id:'building',   name:'Building Fund' },
    { id:'mission',    name:'Mission Fund' },
    { id:'investment', name:'Investments/TD' }
  ];

  // Module-level basis state, named exactly as in print-report.html so the copied helpers below
  // can stay verbatim. applyBasis() (re)builds it from the raw one-time reads.
  let incomeData = [];
  let expenseData = [];
  let allIncomeData = [];
  let allExpenseData = [];
  let rawIncomeDocs = null;
  let liquidationItemizedById = null;
  let obligationsData = [];
  let accountOrder = { income: [], expense: [] };
  let beginningAccounts = {};
  let generalFundAccounts = {};

  // copied from print-report.html - keep in step
  const GENERAL_FUND_EXPENSE_ACCOUNTS = ['cash-hand', 'cash-bank', 'cash', 'cash on hand', 'cash in bank', 'bank transfer', 'bank'];
  function isReportableSpecialProjectExpense(d) {
    if (!d || !d.isSpecialProject) return true;
    const account = (d.targetAccId || d.payment || 'cash-hand').toString().trim().toLowerCase();
    return GENERAL_FUND_EXPENSE_ACCOUNTS.includes(account);
  }

  // copied from print-report.html (mirrored there from budget-vs-actual.html) - keep in step
  function getScheduleMonths(sched) {
    if (!sched) return [];
    if (Array.isArray(sched.months) && sched.months.length) {
      return [...new Set(sched.months.map(m => parseInt(m)).filter(m => Number.isInteger(m) && m >= 0 && m <= 11))].sort((a,b)=>a-b);
    }
    if (Number.isInteger(sched.month)) return [sched.month];
    return [];
  }
  function isRecurringExpense(key, budgetsObj) {
    const sched = (budgetsObj.expenseSchedule || {})[key];
    return !sched || sched.recurring !== false;
  }
  function expenseBudgetForMonth(key, month, budgetsObj) {
    const ann = (budgetsObj.expense || {})[key] || 0;
    if (isRecurringExpense(key, budgetsObj)) return ann / 12;
    const months = getScheduleMonths((budgetsObj.expenseSchedule || {})[key]);
    if (!months.length) return 0;
    return months.includes(month) ? ann / months.length : 0;
  }
  function isRecurringIncome(key, budgetsObj) {
    const sched = (budgetsObj.incomeSchedule || {})[key];
    return !sched || sched.recurring !== false;
  }
  function incomeBudgetForMonth(key, month, budgetsObj) {
    const ann = (budgetsObj.income || {})[key] || 0;
    if (isRecurringIncome(key, budgetsObj)) return ann / 12;
    const months = getScheduleMonths((budgetsObj.incomeSchedule || {})[key]);
    if (!months.length) return 0;
    return months.includes(month) ? ann / months.length : 0;
  }

  // copied from print-report.html - keep in step
  function formatCategoryName(str) {
    if (!str) return '';
    str = String(str).trim();
    if (!str) return '';
    return str.split(' ').map(word => {
      if (!word) return word;
      const letters = word.replace(/[^a-zA-Z]/g, '');
      if (letters.length > 0 && letters === letters.toUpperCase()) return word;
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }).join(' ');
  }
  function getMemberId(d) {
    return (d.memberId || d.memberID || d.memberCode || '').toString().trim();
  }

  // copied from print-report.html - keep in step
  function getObligationPaidAmount(o) {
    if (o.paidAmount !== undefined) return Math.max(0, parseFloat(o.paidAmount) || 0);
    return o.status === 'Paid' ? (parseFloat(o.amount) || 0) : 0;
  }
  function getObligationBalance(o) {
    const amount = Math.max(0, parseFloat(o.amount) || 0);
    return Math.max(0, amount - getObligationPaidAmount(o));
  }
  function getObligationStatus(o) {
    const amount = Math.max(0, parseFloat(o.amount) || 0);
    const paidAmount = Math.min(amount, getObligationPaidAmount(o));
    if (amount > 0 && paidAmount >= amount) return 'Paid';
    if (paidAmount > 0) return 'Partially Paid';
    return 'Unpaid';
  }

  // copied from print-report.html - keep in step
  // The Building Fund is ALWAYS a restricted fund in this statement, whatever the Treasurer's
  // per-account "General Fund" setting says. Every other account follows the setting.
  function isGeneralFundAccount(id) {
    if (id === 'building') return false;
    return generalFundAccounts[id] !== false;
  }
  // Building Fund money = explicit 'building' account, or category/type text naming the Building Fund.
  function isBuildingFundEntry(d, isExpense) {
    if (!d) return false;
    if ((isExpense ? getExpenseAccountId(d) : getIncomeAccountId(d)) === 'building') return true;
    return [d.budgetCategory, d.type, d.category].some(v => String(v || '').toLowerCase().includes('building fund'));
  }
  function isGeneralFundIncome(d) {
    return !isBuildingFundEntry(d, false) && isGeneralFundAccount(getIncomeAccountId(d));
  }
  function isGeneralFundExpense(d) {
    return !isBuildingFundEntry(d, true) && isGeneralFundAccount(getExpenseAccountId(d));
  }
  function getIncomeReportAccountId(d) {
    const id = getIncomeAccountId(d);
    return (isBuildingFundEntry(d, false) && isGeneralFundAccount(id)) ? 'building' : id;
  }
  function getExpenseReportAccountId(d) {
    const id = getExpenseAccountId(d);
    return (isBuildingFundEntry(d, true) && isGeneralFundAccount(id)) ? 'building' : id;
  }
  // Income account: a typed fund overrides any explicit account, else targetAccount, else bank for Bank Transfer, else cash-hand.
  function getIncomeAccountId(d) {
    if (d.type === 'Building Fund') return 'building';
    if (d.type === 'Mission Fund') return 'mission';
    if (d.type === 'Investment Income') return 'investment';
    if (d.targetAccount) return d.targetAccount;
    return d.payment === 'Bank Transfer' ? 'cash-bank' : 'cash-hand';
  }
  function getExpenseAccountId(d) {
    return d.targetAccId || (d.payment === 'Bank Transfer' ? 'cash-bank' : d.payment === 'Petty Cash' ? 'petty-cash' : 'cash-hand');
  }
  // Payroll is an expense at gross, but only the NET pay leaves cash at once (withheld amounts leave via deduction-payment later).
  function getExpenseCashImpact(d) {
    const netPay = parseFloat(d.netPay);
    const hasNetPayroll = d.isPayrollGenerated && !d.isBenefit && Number.isFinite(netPay);
    return hasNetPayroll ? Math.max(0, netPay) : (parseFloat(d.amount) || 0);
  }
  // True per-account cash balances through endDate (same rules as financial-overview.html's combineAndRender()).
  function getAccountBalancesThrough(endDate) {
    const balances = {};
    FINANCIAL_ACCOUNTS.forEach(a => balances[a.id] = parseFloat(beginningAccounts[a.id] || 0));

    allIncomeData.forEach(d => {
      if (!d.date || new Date(d.date) > endDate) return;
      const id = getIncomeAccountId(d);
      if (balances[id] === undefined) return;
      balances[id] += parseFloat(d.amount || 0);
    });

    allExpenseData.forEach(d => {
      if (!d.date || new Date(d.date) > endDate) return;
      const id = getExpenseAccountId(d);
      if (balances[id] === undefined) return;
      balances[id] -= getExpenseCashImpact(d);
    });

    return balances;
  }
  function getGeneralFundBeginningBalance() {
    return FINANCIAL_ACCOUNTS
      .filter(account => isGeneralFundAccount(account.id))
      .reduce((sum, account) => sum + (parseFloat(beginningAccounts[account.id]) || 0), 0);
  }

  // copied from print-report.html - keep in step
  // Legacy "Cash Advance Return" income docs that double-credit the fund are dropped from every income-side pool.
  const CASH_ADVANCE_RETURN_LABEL = 'cash advance return';
  const PLACEHOLDER_ADVANCE_CATEGORY = 'Non-Budgeted - Staff Cash Advance (Pending Liquidation)';
  function isCashAdvanceReturnDoc(d) {
    return !!d && [d.category, d.budgetCategory, d.type].some(v => String(v || '').trim().toLowerCase() === CASH_ADVANCE_RETURN_LABEL);
  }
  function requestWasItemized(reqId) {
    if (!reqId) return false;
    if (liquidationItemizedById) return liquidationItemizedById.get(reqId) === true;
    return allExpenseData.some(e => e.linkedLiquidationRequestId === reqId && e.category !== PLACEHOLDER_ADVANCE_CATEGORY);
  }
  function isDuplicateCashAdvanceReturn(d) {
    return isCashAdvanceReturnDoc(d) && requestWasItemized(d.linkedLiquidationRequestId);
  }
  function rebuildIncomeData() {
    if (!rawIncomeDocs) return;
    allIncomeData = rawIncomeDocs.filter(d => !d.isSpecialProject && !isDuplicateCashAdvanceReturn(d));
    incomeData = allIncomeData.filter(d => {
      if (d.type === 'transfer') return false;
      if (d.isSpecialProject) return false;
      return true;
    });
  }

  // copied from print-report.html generateReportHTML() (nested there) - keep in step
  // Cumulative GF payroll withheld minus remitted through a date (both balances are put on "net of withholdings held").
  function outstandingWithholdingsThrough(throughDate) {
    let withheld = 0;
    let remitted = 0;
    allExpenseData.forEach(d => {
      if (!d.date) return;
      const dt = new Date(d.date);
      if (dt > throughDate) return;
      if (!isGeneralFundAccount(getExpenseAccountId(d))) return;
      if (d.isPayrollGenerated && !d.isBenefit) {
        const netPay = parseFloat(d.netPay);
        if (Number.isFinite(netPay)) withheld += Math.max(0, parseFloat(d.amount || 0) - netPay);
      } else if (d.type === 'deduction-payment') {
        remitted += parseFloat(d.amount || 0);
      }
    });
    return withheld - remitted;
  }
  // Building Fund money sitting in General Fund accounts (earmarked, not free GF cash).
  function buildingFundHeldInGfThrough(throughDate) {
    let held = 0;
    incomeData.forEach(d => {
      if (!d.date || new Date(d.date) > throughDate) return;
      if (isBuildingFundEntry(d, false) && isGeneralFundAccount(getIncomeAccountId(d))) held += parseFloat(d.amount || 0);
    });
    expenseData.forEach(d => {
      if (!d.date || new Date(d.date) > throughDate) return;
      if (isBuildingFundEntry(d, true) && isGeneralFundAccount(getExpenseAccountId(d))) held -= parseFloat(d.amount || 0);
    });
    return held;
  }

  // copied from financial-overview.html getCashLevel() (Section 15 thresholds) - keep in step
  function getCashLevel(months) {
    if (!Number.isFinite(months)) {
      return { color: 'yellow', level: 'Needs Setup', control: 'Set essential monthly operating expense to activate SOP monitoring.' };
    }
    if (months >= 3) return { color:'green', level:'Stable', control:'Normal operations; ordinary controls continue.' };
    if (months >= 1) return { color:'yellow', level:'Caution', control:'Treasurer informs Finance Chair; closer review of non-routine spending; 30-60 day cash forecast if trending down.' };
    if (months >= 0.5) return { color:'red', level:'Critical', control:'Finance Committee and Auditor notified; essential obligations only unless specifically approved; payment priority list applies.' };
    return { color:'black', level:'Emergency', control:'Spending freeze except survival essentials; emergency Finance/Council action required.' };
  }
  // copied from budget-vs-actual.html trendBudgetedForMonth/trendBudgetHasAmounts/trendCashLevel - keep in step
  function trendBudgetedForMonth(budgetDoc, side, month) {
    const amounts = (budgetDoc && budgetDoc[side]) || {};
    const schedule = (budgetDoc && budgetDoc[side === 'income' ? 'incomeSchedule' : 'expenseSchedule']) || {};
    return Object.keys(amounts).reduce((s, k) => {
      if (k.toLowerCase().includes('transfer')) return s;
      const ann = parseFloat(amounts[k]) || 0;
      const sched = schedule[k];
      if (sched && sched.recurring === false) {
        const months = getScheduleMonths(sched);
        return s + (months.length && months.includes(month) ? ann / months.length : 0);
      }
      return s + ann / 12;
    }, 0);
  }
  function trendBudgetHasAmounts(budgetDoc) {
    if (!budgetDoc) return false;
    return ['income', 'expense'].some(side => Object.keys(budgetDoc[side] || {})
      .some(k => !k.toLowerCase().includes('transfer') && (parseFloat(budgetDoc[side][k]) || 0) > 0));
  }
  function trendCashLevel(months) {
    if (!Number.isFinite(months)) return { color: 'yellow', level: 'Needs Setup' };
    if (months >= 3) return { color: 'green', level: 'Stable' };
    if (months >= 1) return { color: 'yellow', level: 'Caution' };
    if (months >= 0.5) return { color: 'red', level: 'Critical' };
    return { color: 'black', level: 'Emergency' };
  }

  // copied from budget-vs-actual.html fetchLiveAvailableOperatingCash() (the computation only; the reads
  // are shared with this page's own one-time loader) - keep in step. Deliberately counts EVERYTHING
  // Financial Overview counts (duplicate legacy cash advance returns included) as of today.
  const LIVE_CASH_ACCOUNTS = ['cash-hand', 'cash-bank', 'petty-cash', 'building', 'mission', 'investment'];
  function liveCashParseLocalDate(value) {
    const parts = String(value || '').slice(0, 10).split('-').map(Number);
    if (parts.length === 3 && parts.every(Boolean)) return new Date(parts[0], parts[1] - 1, parts[2]);
    const parsed = new Date(value);
    return isNaN(parsed.getTime()) ? null : new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
  }
  function computeLiveCash(incomeDocs, expenseDocs, beginningDocData, ccs, now) {
    function liveCashIsEffectiveAsOfToday(dateValue) {
      const dt = liveCashParseLocalDate(dateValue);
      if (!dt) return false;
      const today = new Date(now.getTime());
      today.setHours(23, 59, 59, 999);
      return dt <= today;
    }
    const accounts = {};
    LIVE_CASH_ACCOUNTS.forEach(id => { accounts[id] = { balance: 0, includedInGeneralFund: true }; });
    if (beginningDocData) {
      const beg = beginningDocData.accounts || {};
      const included = beginningDocData.generalFundAccounts || {};
      LIVE_CASH_ACCOUNTS.forEach(id => {
        accounts[id].balance = parseFloat(beg[id]) || 0;
        accounts[id].includedInGeneralFund = included[id] !== false;
      });
    }
    const txns = [];
    incomeDocs.forEach(data => {
      if (data.isSpecialProject) return;
      let targetAccId = data.targetAccount;
      if (data.type === 'Building Fund') targetAccId = 'building';
      else if (data.type === 'Mission Fund') targetAccId = 'mission';
      else if (data.type === 'Investment Income') targetAccId = 'investment';
      else if (!targetAccId) targetAccId = data.payment === 'Bank Transfer' ? 'cash-bank' : 'cash-hand';
      txns.push({ sign: 1, targetAccId, amount: parseFloat(data.amount) || 0, date: data.date || '2026-01-01' });
    });
    let grossPayrollDeductions = 0;
    let paidDeductionPayments = 0;
    expenseDocs.forEach(data => {
      const targetAccId = data.targetAccId || (data.payment === 'Bank Transfer' ? 'cash-bank' : data.payment === 'Petty Cash' ? 'petty-cash' : 'cash-hand');
      const grossAmount = parseFloat(data.amount) || 0;
      const netPay = parseFloat(data.netPay);
      const isDeductionPayment = data.type === 'deduction-payment';
      const hasNetPayroll = data.isPayrollGenerated && !data.isBenefit && Number.isFinite(netPay);
      const cashImpactAmount = hasNetPayroll ? Math.max(0, netPay) : grossAmount;
      const date = data.date || '2026-01-01';
      txns.push({ sign: -1, targetAccId, amount: cashImpactAmount, date });
      if (liveCashIsEffectiveAsOfToday(date)) {
        if (hasNetPayroll) grossPayrollDeductions += Math.max(0, grossAmount - netPay);
        if (isDeductionPayment) paidDeductionPayments += grossAmount;
      }
    });
    // Same pass builds financial-overview.html's getMonthlyIncomeExpenseSeries() input (cash-hand + cash-bank,
    // transfers included, payroll at net-pay cash impact) - the "actual trend" behind its cash forecast.
    const gfByMonth = {};
    txns.forEach(t => {
      if (!liveCashIsEffectiveAsOfToday(t.date)) return;
      const acc = accounts[t.targetAccId];
      if (acc) acc.balance += t.sign * t.amount;
      if (t.targetAccId === 'cash-hand' || t.targetAccId === 'cash-bank') {
        const ym = String(t.date || '').slice(0, 7);
        if (!ym) return;
        if (!gfByMonth[ym]) gfByMonth[ym] = { income: 0, expense: 0 };
        if (t.sign > 0) gfByMonth[ym].income += t.amount;
        else gfByMonth[ym].expense += t.amount;
      }
    });
    const gfMonthlySeries = Object.keys(gfByMonth).sort().map(ym => ({ ym, income: gfByMonth[ym].income, expense: gfByMonth[ym].expense }));
    const generalCash = accounts['cash-hand'].balance + accounts['cash-bank'].balance;
    const restrictedDesignated = ['petty-cash', 'building', 'mission', 'investment']
      .filter(id => accounts[id].includedInGeneralFund === false)
      .reduce((s, id) => s + accounts[id].balance, 0);
    const payrollPayable = Math.max(0, grossPayrollDeductions - paidDeductionPayments);
    const approvedPayables = (parseFloat((ccs || {}).approvedPayables) || 0) + payrollPayable;
    const essential = parseFloat((ccs || {}).essentialMonthlyExpense) || 0;
    return {
      availableOperatingCash: generalCash - restrictedDesignated - approvedPayables,
      generalCash, restrictedDesignated, payrollPayable, approvedPayables, essential, gfMonthlySeries
    };
  }
  // copied from budget-vs-actual.html computeTrendProjection() (Conservative Hybrid basis, parameterised by
  // `now`/horizon/budgets instead of page globals) - keep in step.
  function computeTrendProjection(live, forecastBudgets, now, horizon, conservative) {
    const currentYm = now.toISOString().slice(0, 7);
    const used = live.gfMonthlySeries.filter(r => r.ym < currentYm).slice(-3);
    if (!used.length) return { noTrend: true, rows: [] };
    const avgIncome = used.reduce((s, r) => s + r.income, 0) / used.length;
    const avgExpense = used.reduce((s, r) => s + r.expense, 0) / used.length;
    const realYear = now.getFullYear();
    const essential = live.essential;
    const startCash = live.availableOperatingCash;
    const startLevel = trendCashLevel(essential > 0 ? startCash / essential : NaN);
    let running = startCash;
    const rows = [];
    for (let i = 1; i <= horizon; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      const y = d.getFullYear();
      const m = d.getMonth();
      // Next year's budget once it has amounts; otherwise the current year's schedule wraps (as FO does).
      const budgetDoc = trendBudgetHasAmounts(forecastBudgets[y]) ? forecastBudgets[y] : forecastBudgets[realYear];
      const budgetedIncome = trendBudgetedForMonth(budgetDoc, 'income', m);
      const budgetedExpense = trendBudgetedForMonth(budgetDoc, 'expense', m);
      const hasBudget = budgetedIncome > 0 || budgetedExpense > 0;
      const inflow = conservative && hasBudget ? Math.min(avgIncome, budgetedIncome) : avgIncome;
      const outflow = conservative && hasBudget ? Math.max(avgExpense, budgetedExpense) : avgExpense;
      const net = inflow - outflow;
      running += net;
      const cover = essential > 0 ? running / essential : NaN;
      rows.push({ label: `${SHORT_MONTHS[m]} ${y}`, inflow, outflow, net, cash: running, cover, level: trendCashLevel(cover) });
    }
    return { avgIncome, avgExpense, monthsUsed: used.map(r => r.ym), startCash, startLevel, essential, rows };
  }

  // ───────────────────────────────────────────────────────────────────────
  // 2. LOADER - one-time reads only (no onSnapshot). Queries only collections the role may read.
  // ───────────────────────────────────────────────────────────────────────
  const budgetsByYear = {};      // year -> doc data | null
  const reviewByDocId = {};      // reportReviews doc id -> data | null
  async function getDocData(coll, id) {
    try {
      const doc = await db.collection(coll).doc(id).get();
      return doc.exists ? doc.data() : null;
    } catch (err) { console.warn('Unable to read', coll, id, err && err.message); return null; }
  }
  async function getCollection(coll) {
    try {
      const snap = await db.collection(coll).get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (err) { console.warn('Unable to read', coll, err && err.message); return null; }
  }
  async function ensureBudgets(years) {
    await Promise.all(years.map(async y => {
      if (Object.prototype.hasOwnProperty.call(budgetsByYear, y)) return;
      budgetsByYear[y] = await getDocData('budgets', String(y));
    }));
  }
  async function ensureReview(docId) {
    if (Object.prototype.hasOwnProperty.call(reviewByDocId, docId)) return;
    reviewByDocId[docId] = await getDocData('reportReviews', docId);
  }
  async function loadRaw(profile) {
    const role = profile.role;
    const realYear = new Date().getFullYear();
    const [income, expenses, obligations, projects, projectEntries, projectCosts, attendance, countSheets,
           beginning, structure, cashControl, yearsCfg, liq, roll] = await Promise.all([
      getCollection('income'), getCollection('expenses'), getCollection('churchObligations'),
      getCollection('specialProjects'), getCollection('specialProjectEntries'), getCollection('specialProjectCosts'),
      getCollection('attendance'), getCollection('countSheets'),
      getDocData('settings', 'beginningBalances'), getDocData('settings', 'accountStructure'),
      getDocData('settings', 'cashControlSettings'), getDocData('settings', 'yearsConfig'),
      LIQ_READ_ROLES.includes(role) ? getCollection('liquidationRequests') : Promise.resolve(null),
      ROLL_READ_ROLES.includes(role) ? getCollection('membershipRoll') : Promise.resolve(null)
    ]);
    await ensureBudgets([realYear, realYear + 1]);
    const dflt = d => d.date ? d : { ...d, date: '2026-01-01', dateDefaulted: true }; // undated = 2026-01-01, as in Financial Overview
    return {
      income: income ? income.map(dflt) : null,
      expenses: expenses ? expenses.map(dflt) : null,
      obligations: obligations || [], projects: projects || [], projectEntries: projectEntries || [], projectCosts: projectCosts || [],
      attendance: attendance || [], countSheets: countSheets, // null = unreadable
      beginning, structure, cashControl, yearsCfg, liquidation: liq, membershipRoll: roll
    };
  }

  // Rebuild the print-report.html basis arrays from the raw reads (same filters as its listeners).
  function applyBasis(raw) {
    beginningAccounts = (raw.beginning && raw.beginning.accounts) || {};
    generalFundAccounts = (raw.beginning && raw.beginning.generalFundAccounts) || {};
    accountOrder = raw.structure || { income: [], expense: [] };
    obligationsData = raw.obligations || [];
    liquidationItemizedById = null;
    if (raw.liquidation) {
      liquidationItemizedById = new Map();
      raw.liquidation.forEach(d => liquidationItemizedById.set(d.id, Array.isArray(d.liquidationItems) && d.liquidationItems.length > 0));
    }
    allExpenseData = raw.expenses || [];
    // Deduction-payment entries settle a liability already expensed at gross; special-project spending only counts
    // when paid from Cash on Hand / Cash in Bank (print-report.html's expenseData filter).
    expenseData = allExpenseData.filter(d => d.type !== 'transfer' && d.type !== 'deduction-payment' && isReportableSpecialProjectExpense(d));
    rawIncomeDocs = raw.income || [];
    rebuildIncomeData();
  }

  // ───────────────────────────────────────────────────────────────────────
  // 3. PERIOD = a year + a sorted set of months (single month, run, or non-contiguous)
  // ───────────────────────────────────────────────────────────────────────
  const pad2 = n => String(n).padStart(2, '0');
  function makePeriod(year, monthIdxs) {
    const months = [...new Set(monthIdxs.filter(m => m >= 0 && m <= 11))].sort((a, b) => a - b);
    const first = months[0], last = months[months.length - 1];
    const contiguous = months.length > 0 && (last - first + 1) === months.length;
    let label = '';
    if (!months.length) label = 'No months selected';
    else if (months.length === 12) label = `Full year ${year}`;
    else if (months.length === 1) label = `${LONG_MONTHS[first]} ${year}`;
    else if (contiguous) label = `${SHORT_MONTHS[first]}-${SHORT_MONTHS[last]} ${year}`;
    else label = `${months.map(m => SHORT_MONTHS[m]).join(', ')} ${year}`;
    const keys = months.map(m => `${year}-${pad2(m + 1)}`);
    // Talking-points doc id suffix: single month = YYYY-MM (plan), else YYYY-MM_MM..., whole year = YYYY-FY.
    const notesKey = months.length === 12 ? `${year}-FY` : months.length === 1 ? keys[0] : `${year}-${months.map(m => pad2(m + 1)).join('_')}`;
    return { year, months, first, last, contiguous, label, keys, notesKey, count: months.length };
  }

  // ───────────────────────────────────────────────────────────────────────
  // 4. computeKpis(raw, period, now) - PURE (given raw + period); applyBasis() first.
  // ───────────────────────────────────────────────────────────────────────
  // copied from reports.html - keep in step
  function isTitheRecord(d) {
    const category = `${d.budgetCategory || ''} ${d.category || ''} ${d.type || ''}`.toLowerCase();
    return category.includes('tithe') && !category.includes('loose');
  }
  function isLooseOfferingRecord(d) {
    const category = `${d.budgetCategory || ''} ${d.category || ''} ${d.type || ''} ${d.member || ''}`.toLowerCase();
    return category.includes('loose');
  }
  function isNamedTither(d) {
    return isTitheRecord(d)
      && d.member
      && d.member.trim() !== ''
      && d.member !== 'Anonymous'
      && d.member !== 'General Collection'
      && d.member.toLowerCase() !== 'loose offering';
  }
  function isNowMinistryExpense(d) {
    const category = `${d.category || ''} ${d.budgetCategory || ''}`.toLowerCase();
    return category.includes('nurture') || category.includes('outreach') || category.includes('witness');
  }
  // Giver identity is INTERNAL ONLY (counting unique givers) - never rendered.
  function titherKey(d) { return getMemberId(d) || String(d.member || '').trim().toLowerCase(); }

  // copied from print-report.html generateReportHTML() budget-structure block - keep in step
  function buildBudgetStructure() {
    const expOrderMain = [], expOrderSub = {}, catKeyToMain = {}, catKeyToSub = {};
    const isBuildingFundKey = k => String(k || '').toLowerCase().includes('building fund');
    const gfExpenseKeys = (accountOrder.expense || []).filter(k => !isBuildingFundKey(k));
    const gfIncomeKeys = (accountOrder.income || []).filter(k => !isBuildingFundKey(k));
    const expAllKeys = gfExpenseKeys;
    function resolveMainGroup(k, allKeys) {
      if (!k.includes(' - ')) return k;
      const parts = k.split(' - ');
      for (let i = parts.length - 1; i >= 1; i--) {
        const prefix = parts.slice(0, i).join(' - ');
        const prefixDash = prefix + ' - ';
        if (allKeys.some(other => other !== k && other.startsWith(prefixDash))) return prefix;
      }
      return parts[0];
    }
    expAllKeys.forEach(k => {
      let rawMain = resolveMainGroup(k, expAllKeys);
      let rawSub  = k.startsWith(rawMain + ' - ') ? k.slice(rawMain.length + 3).trim() : (k.includes(' - ') ? k.split(' - ').slice(1).join(' - ').trim() : '');
      let m = formatCategoryName(rawMain);
      let s = rawSub || k;
      if (!expOrderMain.includes(m)) expOrderMain.push(m);
      if (!expOrderSub[m]) expOrderSub[m] = [];
      if (!expOrderSub[m].includes(s)) expOrderSub[m].push(s);
      catKeyToMain[k] = m;
      catKeyToSub[k]  = s;
    });
    const incOrderMain = [], incOrderSub = {}, incKeyToMain = {}, incKeyToSub = {};
    gfIncomeKeys.forEach(k => {
      let parts = k.split(' - ');
      let m = formatCategoryName(parts[0].trim());
      let s = parts.length > 1 ? formatCategoryName(parts.slice(1).join(' - ').trim()) : 'Others';
      if (!incOrderMain.includes(m)) incOrderMain.push(m);
      if (!incOrderSub[m]) incOrderSub[m] = [];
      if (!incOrderSub[m].includes(s)) incOrderSub[m].push(s);
      incKeyToMain[k] = m;
      incKeyToSub[k] = s;
    });
    return { expOrderMain, expOrderSub, catKeyToMain, catKeyToSub, incOrderMain, incOrderSub, incKeyToMain, incKeyToSub, gfExpenseKeys, gfIncomeKeys };
  }
  const MISC_MAIN = 'Miscellaneous (Unbudgeted)';
  // Main/sub classification copied from print-report.html buildExpGroups()/buildIncGroups() (labels for the
  // Miscellaneous sub-lines are not needed here, only which MAIN bucket an entry lands in) - keep in step.
  function classifyExpense(d, S) {
    const rawVal = (d.category || '').trim();
    const rawLow = rawVal.toLowerCase();
    let main, sub;
    if (S.catKeyToMain[rawVal]) {
      main = S.catKeyToMain[rawVal];
      sub  = S.catKeyToSub[rawVal];
    } else {
      let parts = rawVal.includes(' - ') ? rawVal.split(' - ') : [rawVal];
      main = parts[0].trim() ? formatCategoryName(parts[0].trim()) : MISC_MAIN;
      sub  = parts.length > 1 ? formatCategoryName(parts.slice(1).join(' - ').trim()) : '';
      const checkMain = main.toLowerCase();
      if (rawLow.includes('not in') || checkMain === 'others' || checkMain === 'unbudgeted'
          || checkMain === 'miscellaneous' || !S.expOrderMain.includes(main)) {
        main = MISC_MAIN;
      }
    }
    if (main === MISC_MAIN) sub = 'Unbudgeted';
    else if (!sub || sub.toLowerCase() === 'n/a') sub = 'Others';
    return { main, sub };
  }
  function classifyIncome(d, S) {
    let mainType = (d.type || '').trim();
    let budgetCat = (d.budgetCategory || d.category || '').trim();
    let subLow = budgetCat.toLowerCase();
    let mainLow = mainType.toLowerCase();
    let checkMain = formatCategoryName(mainType);
    let finalMain = '';
    let sub = '';
    let isKnown = false;
    if (S.incOrderMain.length === 0) isKnown = true;
    else if (S.incOrderMain.includes(checkMain)) isKnown = true;
    if (mainType === 'Source of Funds' || subLow.includes('tithe') || subLow.includes('loose') || subLow.includes('sunday school') || mainType === 'Occasional Offering') isKnown = true;
    if (subLow.includes('not in') || mainLow.includes('not in') || !isKnown) {
      finalMain = MISC_MAIN; sub = 'Unbudgeted';
    } else if (mainType === 'Source of Funds' || subLow.includes('tithe') || subLow.includes('loose') || subLow.includes('sunday school')) {
      finalMain = 'Source of Funds';
      if (subLow.includes('tithe')) sub = 'Tithes';
      else if (subLow.includes('loose') || subLow === 'offering') sub = 'Loose Offering';
      else if (subLow.includes('sunday school')) sub = 'Sunday School';
      else sub = formatCategoryName(budgetCat);
    } else if (mainType === 'Occasional Offering') {
      finalMain = 'Occasional Offering';
      let cleanedSub = budgetCat;
      if (cleanedSub.toLowerCase().startsWith('occasional offering')) cleanedSub = cleanedSub.replace(/occasional offering/i, '').replace(/^[\s\-]+/, '').trim();
      if (!cleanedSub) cleanedSub = 'General';
      sub = formatCategoryName(cleanedSub) || 'Others';
    } else {
      finalMain = checkMain;
      sub = formatCategoryName(budgetCat) || 'Others';
    }
    if (finalMain !== MISC_MAIN && (finalMain.toLowerCase() === 'miscellaneous' || finalMain.toLowerCase() === 'others')) { finalMain = MISC_MAIN; sub = 'Unbudgeted'; }
    return { main: finalMain, sub };
  }
  function groupByMainSub(list, classify, S) {
    const g = {};
    list.forEach(d => {
      const c = classify(d, S);
      const amt = parseFloat(d.amount || 0);
      if (!g[c.main]) g[c.main] = { t: 0, s: {} };
      g[c.main].t += amt;
      g[c.main].s[c.sub] = (g[c.main].s[c.sub] || 0) + amt;
    });
    return g;
  }

  // Parse a stored ISO date as a LOCAL calendar date (for Sunday/week bucketing and "today" comparisons only).
  function localDate(value) {
    const p = String(value || '').slice(0, 10).split('-').map(Number);
    return p.length === 3 && p.every(Boolean) ? new Date(p[0], p[1] - 1, p[2]) : null;
  }
  function isoOf(dt) { return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`; }
  const monthIdx = dt => dt.getFullYear() * 12 + dt.getMonth();

  // Statement over a year + month set. For a single month or any contiguous run this is exactly print-report.html's
  // generateReportHTML() arithmetic (Beginning Balance through the day before the first month, Ending Balance
  // through the end of the last). A non-contiguous selection additionally reports the unselected months in between
  // as `inBetween` so Beginning + Receipts - Disbursements + Transfers + In-between = Ending still ties out.
  function computeStatement(year, monthsArr) {
    const first = monthsArr[0], last = monthsArr[monthsArr.length - 1];
    const monthSet = new Set(monthsArr);
    const targetDate = new Date(year, first, 1);
    const periodEndDate = new Date(year, last + 1, 0, 23, 59, 59);
    const dayBeforeStart = new Date(targetDate.getTime() - 1);

    const gfAccounts = FINANCIAL_ACCOUNTS.filter(a => isGeneralFundAccount(a.id));
    const restrictedAccounts = FINANCIAL_ACCOUNTS.filter(a => !isGeneralFundAccount(a.id));
    const gfIds = gfAccounts.map(a => a.id);
    const restrictedIds = restrictedAccounts.map(a => a.id);
    function sumIds(balances, ids) { return ids.reduce((s, id) => s + (parseFloat(balances[id]) || 0), 0); }

    const beginningAccountBalances = getAccountBalancesThrough(dayBeforeStart);
    const accountBalances = getAccountBalancesThrough(periodEndDate);
    const gfTrueEndBalance = sumIds(accountBalances, gfIds);
    const restrictedTrueEndBalance = sumIds(accountBalances, restrictedIds);

    const outstandingWithholdingsBeforePeriod = outstandingWithholdingsThrough(dayBeforeStart);
    const outstandingWithholdingsAtEnd = outstandingWithholdingsThrough(periodEndDate);
    const buildingHeldBeforePeriod = buildingFundHeldInGfThrough(dayBeforeStart);
    const buildingHeldAtEnd = buildingFundHeldInGfThrough(periodEndDate);
    const begBal = sumIds(beginningAccountBalances, gfIds) - outstandingWithholdingsBeforePeriod - buildingHeldBeforePeriod;

    const inSel = d => { if (!d.date) return false; const dt = new Date(d.date); return dt.getFullYear() === year && monthSet.has(dt.getMonth()); };
    const inSpan = d => { if (!d.date) return false; const dt = new Date(d.date); return dt.getFullYear() === year && dt.getMonth() >= first && dt.getMonth() <= last; };

    const periodIncome = incomeData.filter(inSel);
    const periodExpense = expenseData.filter(inSel);
    const fInc = periodIncome.filter(isGeneralFundIncome);
    const fExp = periodExpense.filter(isGeneralFundExpense);
    const restrictedIncomeRows = periodIncome.filter(d => !isGeneralFundIncome(d));
    const restrictedExpenseRows = periodExpense.filter(d => !isGeneralFundExpense(d));

    const periodTransferIn = allIncomeData.filter(d => d.type === 'transfer' && inSel(d));
    const periodTransferOut = allExpenseData.filter(d => d.type === 'transfer' && inSel(d));
    const transferIntoGF = periodTransferIn.filter(d => isGeneralFundAccount(getIncomeAccountId(d))).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const transferOutOfGF = periodTransferOut.filter(d => isGeneralFundAccount(getExpenseAccountId(d))).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const netTransferGF = transferIntoGF - transferOutOfGF;

    const totalIn = fInc.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const totalOut = fExp.reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const netChange = totalIn - totalOut;

    // The whole first..last span (equals the selection when it is contiguous).
    const sInc = incomeData.filter(inSpan).filter(isGeneralFundIncome).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const sOut = expenseData.filter(inSpan).filter(isGeneralFundExpense).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const sTin = allIncomeData.filter(d => d.type === 'transfer' && inSpan(d) && isGeneralFundAccount(getIncomeAccountId(d))).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const sTout = allExpenseData.filter(d => d.type === 'transfer' && inSpan(d) && isGeneralFundAccount(getExpenseAccountId(d))).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const spanNet = (sInc - sOut) + (sTin - sTout);
    const inBetween = spanNet - (netChange + netTransferGF);
    const endBal = begBal + netChange + netTransferGF + inBetween;

    const reconcileDiff = (gfTrueEndBalance - outstandingWithholdingsAtEnd - buildingHeldAtEnd) - endBal;
    const reconcileIsClean = Math.abs(reconcileDiff) < 0.01;

    const restrictedActivityAll = restrictedAccounts.map(a => {
      const realInAmt = restrictedIncomeRows.filter(d => getIncomeReportAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const realOutAmt = restrictedExpenseRows.filter(d => getExpenseReportAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const transferInAmt = periodTransferIn.filter(d => getIncomeAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const transferOutAmt = periodTransferOut.filter(d => getExpenseAccountId(d) === a.id).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
      const transferNet = transferInAmt - transferOutAmt;
      const inAmt = realInAmt + transferInAmt;
      const outAmt = realOutAmt + transferOutAmt;
      return { id: a.id, name: a.name, realInAmt, realOutAmt, transferNet, inAmt, outAmt, net: inAmt - outAmt, balance: parseFloat(accountBalances[a.id]) || 0 };
    });
    return {
      begBal, totalIn, totalOut, netChange, netTransferGF, inBetween, endBal, reconcileDiff, reconcileIsClean,
      outstandingWithholdingsAtEnd, buildingHeldAtEnd, gfTrueEndBalance, restrictedTrueEndBalance, accountBalances,
      gfAccounts, restrictedAccounts, restrictedActivityAll, fInc, fExp, periodIncome
    };
  }

  function pctChange(cur, prev) { return Math.abs(prev) > 0.005 ? ((cur - prev) / Math.abs(prev)) * 100 : null; }
  const sumF = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);

  function computeKpis(raw, period, now) {
    applyBasis(raw);
    const year = period.year, months = period.months, last = period.last;
    const monthSet = new Set(months);
    const ytdMonths = Array.from({ length: last + 1 }, (_, i) => i);
    const kpi = { period, now: now.toISOString(), unavailable: {}, role: activeUserProfile ? activeUserProfile.role : '' };

    // ── Statement (General Fund basis, same as Print Report) ──
    const st = computeStatement(year, months);
    const stYtd = computeStatement(year, ytdMonths);
    kpi.stmt = {
      begBal: st.begBal, receipts: st.totalIn, disbursements: st.totalOut, net: st.netChange, transfers: st.netTransferGF,
      inBetween: st.inBetween, endBal: st.endBal, reconcileDiff: st.reconcileDiff, reconcileClean: st.reconcileIsClean,
      contiguous: period.contiguous
    };
    kpi.ytd = { receipts: stYtd.totalIn, disbursements: stYtd.totalOut, net: stYtd.netChange };

    // ── Monthly buckets (General Fund) for series, last-year comparison, giving ──
    const buckets = {};
    const slot = dt => { const i = monthIdx(dt); return buckets[i] || (buckets[i] = { rec: 0, dis: 0, tithes: 0, loose: 0, tithers: new Set() }); };
    const gfIncAll = incomeData.filter(isGeneralFundIncome);
    const gfExpAll = expenseData.filter(isGeneralFundExpense);
    gfIncAll.forEach(d => {
      const dt = new Date(d.date); const b = slot(dt); const a = parseFloat(d.amount || 0);
      b.rec += a;
      if (isTitheRecord(d)) { b.tithes += a; if (isNamedTither(d)) b.tithers.add(titherKey(d)); }
      if (isLooseOfferingRecord(d)) b.loose += a;
    });
    gfExpAll.forEach(d => { slot(new Date(d.date)).dis += parseFloat(d.amount || 0); });
    const bk = (y, m) => buckets[y * 12 + m] || { rec: 0, dis: 0, tithes: 0, loose: 0, tithers: new Set() };
    const sumB = (y, ms, f) => ms.reduce((s, m) => s + f(bk(y, m)), 0);
    const unionTithers = (y, ms) => { const s = new Set(); ms.forEach(m => bk(y, m).tithers.forEach(k => s.add(k))); return s; };

    kpi.prior = {
      receipts: sumB(year - 1, months, b => b.rec), disbursements: sumB(year - 1, months, b => b.dis)
    };
    kpi.prior.net = kpi.prior.receipts - kpi.prior.disbursements;
    kpi.priorYtd = { receipts: sumB(year - 1, ytdMonths, b => b.rec), disbursements: sumB(year - 1, ytdMonths, b => b.dis) };
    kpi.priorYtd.net = kpi.priorYtd.receipts - kpi.priorYtd.disbursements;
    kpi.change = {
      receipts: pctChange(kpi.stmt.receipts, kpi.prior.receipts),
      disbursements: pctChange(kpi.stmt.disbursements, kpi.prior.disbursements),
      net: pctChange(kpi.stmt.net, kpi.prior.net),
      ytdReceipts: pctChange(kpi.ytd.receipts, kpi.priorYtd.receipts)
    };

    // 12 months ending at the last selected month (rolling) - sparklines, combo chart
    const attByIdx = {};
    (raw.attendance || []).forEach(a => {
      const y = parseInt(a.year || String(a.monthKey || '').slice(0, 4), 10);
      const m = parseInt(a.month || String(a.monthKey || '').slice(5, 7), 10) - 1;
      if (Number.isFinite(y) && Number.isFinite(m)) attByIdx[y * 12 + m] = (attByIdx[y * 12 + m] || 0) + (parseInt(a.attendance, 10) || 0);
    });
    const series = { labels: [], selected: [], receipts: [], disbursements: [], net: [], lastYearNet: [], lastYearReceipts: [], lastYearDisb: [], tithes: [], tithers: [], attendance: [] };
    for (let i = 11; i >= 0; i--) {
      const idx = year * 12 + last - i;
      const y = Math.floor(idx / 12), m = idx % 12;
      const b = bk(y, m), bl = bk(y - 1, m);
      series.labels.push(`${SHORT_MONTHS[m]}${m === 0 || i === 11 ? ' ' + String(y).slice(2) : ''}`);
      series.selected.push(y === year && monthSet.has(m));
      series.receipts.push(b.rec); series.disbursements.push(b.dis); series.net.push(b.rec - b.dis);
      series.lastYearNet.push(bl.rec - bl.dis); series.lastYearReceipts.push(bl.rec); series.lastYearDisb.push(bl.dis);
      series.tithes.push(b.tithes); series.tithers.push(b.tithers.size); series.attendance.push(attByIdx[idx] || 0);
    }
    kpi.series = series;

    // ── 2. Liquidity (Financial Overview basis, as of today) ──
    const realYear = now.getFullYear();
    const live = computeLiveCash(raw.income || [], raw.expenses || [], raw.beginning, raw.cashControl, now);
    const months6 = live.essential > 0 ? live.availableOperatingCash / live.essential : NaN;
    const proj = computeTrendProjection(live, { [realYear]: budgetsByYear[realYear] || {}, [realYear + 1]: budgetsByYear[realYear + 1] || {} }, now, 6, true);
    let firstBad = null, firstDrop = null;
    if (!proj.noTrend) {
      const RANK = { green: 0, yellow: 1, red: 2, black: 3 };
      proj.rows.forEach(r => {
        if (!firstBad && (r.level.color === 'red' || r.level.color === 'black')) firstBad = r;
        if (!firstDrop && RANK[r.level.color] > RANK[proj.startLevel.color]) firstDrop = r;
      });
    }
    const asOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    const todayBalances = getAccountBalancesThrough(asOfToday);
    kpi.liquidity = {
      available: live.availableOperatingCash, essential: live.essential, months: months6, level: getCashLevel(months6),
      payrollPayable: live.payrollPayable, approvedPayables: live.approvedPayables, generalCash: live.generalCash, restrictedDesignated: live.restrictedDesignated,
      projection: proj, firstBad, firstDrop,
      // Restricted vs free cash on the statement basis, as of today
      freeGf: sumF(FINANCIAL_ACCOUNTS.filter(a => isGeneralFundAccount(a.id)), a => todayBalances[a.id])
              - outstandingWithholdingsThrough(asOfToday) - buildingFundHeldInGfThrough(asOfToday),
      withholdings: outstandingWithholdingsThrough(asOfToday), buildingHeld: buildingFundHeldInGfThrough(asOfToday),
      gfCash: sumF(FINANCIAL_ACCOUNTS.filter(a => isGeneralFundAccount(a.id)), a => todayBalances[a.id]),
      restricted: FINANCIAL_ACCOUNTS.filter(a => !isGeneralFundAccount(a.id)).map(a => ({ id: a.id, name: a.name, balance: todayBalances[a.id] || 0 }))
    };
    kpi.liquidity.restrictedTotal = sumF(kpi.liquidity.restricted, r => r.balance);

    // ── 3. Budget performance (sum of each selected month's own budget; schedule aware) ──
    const S = buildBudgetStructure();
    const budgetsObj = budgetsByYear[year] || null;
    const bo = budgetsObj || { expense: {}, income: {}, expenseSchedule: {}, incomeSchedule: {} };
    const sumBudget = (fn, key, ms) => ms.reduce((s, m) => s + fn(key, m, bo), 0);
    function budgetTree(keys, kToMain, kToSub, fn, ms) {
      const main = {}, annual = {};
      keys.forEach(k => {
        const m = kToMain[k], s = kToSub[k];
        const v = sumBudget(fn, k, ms);
        if (!main[m]) main[m] = { t: 0, a: 0, s: {} };
        main[m].t += v; main[m].a += (bo[fn === expenseBudgetForMonth ? 'expense' : 'income'] || {})[k] || 0;
        if (!main[m].s[s]) main[m].s[s] = { t: 0, a: 0 };
        main[m].s[s].t += v; main[m].s[s].a += (bo[fn === expenseBudgetForMonth ? 'expense' : 'income'] || {})[k] || 0;
      });
      return main;
    }
    const expBudSel = budgetTree(S.gfExpenseKeys, S.catKeyToMain, S.catKeyToSub, expenseBudgetForMonth, months);
    const incBudSel = budgetTree(S.gfIncomeKeys, S.incKeyToMain, S.incKeyToSub, incomeBudgetForMonth, months);
    const expBudYtd = budgetTree(S.gfExpenseKeys, S.catKeyToMain, S.catKeyToSub, expenseBudgetForMonth, ytdMonths);
    const incBudYtd = budgetTree(S.gfIncomeKeys, S.incKeyToMain, S.incKeyToSub, incomeBudgetForMonth, ytdMonths);
    const expActSel = groupByMainSub(st.fExp, classifyExpense, S);
    const incActSel = groupByMainSub(st.fInc, classifyIncome, S);
    const sumTree = tree => Object.keys(tree).reduce((s, m) => s + tree[m].t, 0);
    const sumAnnual = tree => Object.keys(tree).reduce((s, m) => s + tree[m].a, 0);
    const hasBudget = !!budgetsObj && (Object.keys(bo.expense || {}).length + Object.keys(bo.income || {}).length) > 0;
    // Budget and actual labels are matched case/whitespace-insensitively (formatCategoryName() turns "Source of Funds"
    // into "Source Of Funds" on the budget side but the actual side keeps its own spelling), preferring the actual's.
    const nk = x => String(x || '').trim().replace(/\s+/g, ' ').toLowerCase();
    const pairUp = (budMap, actMap) => {
      const out = {};
      Object.keys(budMap).forEach(n => { out[nk(n)] = { name: n, bud: budMap[n] }; });
      Object.keys(actMap).forEach(n => { out[nk(n)] = { ...(out[nk(n)] || {}), name: n, act: actMap[n] }; });
      return Object.values(out);
    };
    const mainRows = (budTree, actTree) => pairUp(budTree, actTree).map(p => ({
      name: p.name, actual: (p.act || {}).t || 0, budget: (p.bud || {}).t || 0, annual: (p.bud || {}).a || 0, isMisc: p.name === MISC_MAIN
    })).filter(r => r.actual > 0.005 || r.budget > 0.005).sort((a, b) => Math.max(b.actual, b.budget) - Math.max(a.actual, a.budget));
    const lineRows = (budTree, actTree) => {
      const out = [];
      pairUp(budTree, actTree).forEach(p => {
        if (p.name === MISC_MAIN) return;
        pairUp((p.bud || {}).s || {}, (p.act || {}).s || {}).forEach(sp => {
          out.push({ name: nk(sp.name) === nk(p.name) ? p.name : `${p.name} › ${sp.name}`, actual: sp.act || 0, budget: (sp.bud || {}).t || 0 });
        });
      });
      return out;
    };
    const expLines = lineRows(expBudSel, expActSel), incLines = lineRows(incBudSel, incActSel);
    const incBudgetSel = sumTree(incBudSel), expBudgetSel = sumTree(expBudSel);
    const incBudgetYtd = sumTree(incBudYtd), expBudgetYtd = sumTree(expBudYtd);
    kpi.budget = {
      hasBudget,
      incomeActual: st.totalIn, incomeBudget: incBudgetSel, incomePct: incBudgetSel > 0 ? st.totalIn / incBudgetSel * 100 : null,
      expenseActual: st.totalOut, expenseBudget: expBudgetSel, expensePct: expBudgetSel > 0 ? st.totalOut / expBudgetSel * 100 : null,
      ytdIncomeActual: stYtd.totalIn, ytdIncomeBudget: incBudgetYtd, ytdIncomePct: incBudgetYtd > 0 ? stYtd.totalIn / incBudgetYtd * 100 : null,
      ytdExpenseActual: stYtd.totalOut, ytdExpenseBudget: expBudgetYtd, ytdExpensePct: expBudgetYtd > 0 ? stYtd.totalOut / expBudgetYtd * 100 : null,
      incomeAnnual: sumAnnual(incBudSel), expenseAnnual: sumAnnual(expBudSel),
      pace: (last + 1) / 12 * 100,                       // straight-line YTD pace
      schedulePace: sumAnnual(expBudYtd) > 0 ? expBudgetYtd / sumAnnual(expBudYtd) * 100 : null, // schedule-weighted YTD pace
      expMain: mainRows(expBudSel, expActSel), incMain: mainRows(incBudSel, incActSel),
      topOver: expLines.filter(r => r.budget > 0 && r.actual > r.budget).sort((a, b) => (b.actual - b.budget) - (a.actual - a.budget)).slice(0, 5),
      topBehind: incLines.filter(r => r.budget > 0 && r.actual < r.budget).sort((a, b) => (b.budget - b.actual) - (a.budget - a.actual)).slice(0, 5),
      unbudgetedExp: (expActSel[MISC_MAIN] || {}).t || 0, unbudgetedInc: (incActSel[MISC_MAIN] || {}).t || 0
    };
    const expActYtd = groupByMainSub(stYtd.fExp, classifyExpense, S), incActYtd = groupByMainSub(stYtd.fInc, classifyIncome, S);
    kpi.budget.unbudgetedExpYtd = (expActYtd[MISC_MAIN] || {}).t || 0;
    kpi.budget.unbudgetedIncYtd = (incActYtd[MISC_MAIN] || {}).t || 0;

    // ── 4. Giving health (counts and percentages only - no giver names or amounts) ──
    const tithesSel = sumB(year, months, b => b.tithes), tithesYtd = sumB(year, ytdMonths, b => b.tithes);
    const tithesPrior = sumB(year - 1, months, b => b.tithes), tithesYtdPrior = sumB(year - 1, ytdMonths, b => b.tithes);
    const tithersSel = unionTithers(year, months), tithersYtd = unionTithers(year, ytdMonths), tithersPrior = unionTithers(year - 1, months);
    const attendanceSum = sumF(months, m => attByIdx[year * 12 + m]);
    const attMonthsWithData = months.filter(m => (attByIdx[year * 12 + m] || 0) > 0).length;
    const attendanceAvg = attMonthsWithData ? attendanceSum / attMonthsWithData : 0;
    const attPriorMonths = months.filter(m => (attByIdx[(year - 1) * 12 + m] || 0) > 0);
    const attendancePriorAvg = attPriorMonths.length ? sumF(attPriorMonths, m => attByIdx[(year - 1) * 12 + m]) / attPriorMonths.length : 0;
    const attYtdMonths = ytdMonths.filter(m => (attByIdx[year * 12 + m] || 0) > 0);
    const attendanceYtdAvg = attYtdMonths.length ? sumF(attYtdMonths, m => attByIdx[year * 12 + m]) / attYtdMonths.length : 0;
    // new / lapsed (counts): tithe history over ALL named tithes
    const everBefore = new Set(), inLastYear = new Set(), inLast3 = new Set();
    gfIncAll.filter(isNamedTither).forEach(d => {
      const dt = new Date(d.date), k = titherKey(d), idx = monthIdx(dt);
      if (idx < year * 12) everBefore.add(k);
      if (dt.getFullYear() === year - 1) inLastYear.add(k);
      if (idx > year * 12 + last - 3 && idx <= year * 12 + last) inLast3.add(k);
    });
    const newTithers = [...tithersYtd].filter(k => !everBefore.has(k)).length;
    const lapsedTithers = [...inLastYear].filter(k => !inLast3.has(k)).length;
    // concentration: share of YTD tithes given by the top 10% of tithers (a single percentage)
    const perTither = {};
    gfIncAll.filter(d => isNamedTither(d) && new Date(d.date).getFullYear() === year && new Date(d.date).getMonth() <= last)
      .forEach(d => { const k = titherKey(d); perTither[k] = (perTither[k] || 0) + parseFloat(d.amount || 0); });
    const amts = Object.values(perTither).sort((a, b) => b - a);
    const totNamed = amts.reduce((s, v) => s + v, 0);
    const topN = Math.max(1, Math.ceil(amts.length * 0.1));
    const concentration = amts.length >= 10 && totNamed > 0 ? amts.slice(0, topN).reduce((s, v) => s + v, 0) / totNamed * 100 : null;
    // Weekly Sunday collections: last 13 Sundays up to the end of the selection (or today)
    const endSel = new Date(year, last + 1, 0);
    const endCap = endSel > now ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : endSel;
    const lastSunday = new Date(endCap.getFullYear(), endCap.getMonth(), endCap.getDate() - endCap.getDay());
    const weekTotals = {};
    gfIncAll.forEach(d => {
      const ld = localDate(d.date); if (!ld) return;
      const ws = isoOf(new Date(ld.getFullYear(), ld.getMonth(), ld.getDate() - ld.getDay()));
      weekTotals[ws] = (weekTotals[ws] || 0) + parseFloat(d.amount || 0);
    });
    const weeks = [];
    for (let i = 12; i >= 0; i--) {
      const wd = new Date(lastSunday.getFullYear(), lastSunday.getMonth(), lastSunday.getDate() - i * 7);
      weeks.push({ date: isoOf(wd), label: `${wd.getDate()} ${SHORT_MONTHS[wd.getMonth()]}`, amount: weekTotals[isoOf(wd)] || 0 });
    }
    kpi.giving = {
      tithes: tithesSel, tithesYtd, tithesPrior, tithesYtdPrior,
      tithesChange: pctChange(tithesSel, tithesPrior), tithesYtdChange: pctChange(tithesYtd, tithesYtdPrior),
      loose: sumB(year, months, b => b.loose), looseYtd: sumB(year, ytdMonths, b => b.loose),
      loosePriorYtd: sumB(year - 1, ytdMonths, b => b.loose),
      tithers: tithersSel.size, tithersYtd: tithersYtd.size, tithersPrior: tithersPrior.size,
      tithersChange: pctChange(tithersSel.size, tithersPrior.size),
      avgTithe: tithersSel.size ? tithesSel / tithersSel.size : 0,
      participation: attendanceAvg > 0 ? tithersSel.size / attendanceAvg * 100 : null,
      newTithers, lapsedTithers, concentration, weeks, titherSeries: series.tithers, tithesSeries: series.tithes
    };

    // ── 5. Where every ₱100 goes (GF disbursements by main category) ──
    function per100Of(list) {
      const g = groupByMainSub(list, classifyExpense, S);
      const total = Object.keys(g).reduce((s, m) => s + g[m].t, 0);
      const rows = Object.keys(g).map(name => ({ name, amount: g[name].t })).filter(r => r.amount > 0.005).sort((a, b) => b.amount - a.amount);
      const top = rows.slice(0, 6);
      const rest = rows.slice(6).reduce((s, r) => s + r.amount, 0);
      if (rest > 0.005) top.push({ name: 'All other categories', amount: rest, other: true });
      // largest-remainder rounding so the 100 dots always total exactly 100
      const raws = top.map(r => total > 0 ? r.amount / total * 100 : 0);
      const floors = raws.map(Math.floor);
      let left = total > 0 ? 100 - floors.reduce((s, v) => s + v, 0) : 0;
      raws.map((v, i) => ({ i, f: v - Math.floor(v) })).sort((a, b) => b.f - a.f).forEach(o => { if (left > 0) { floors[o.i]++; left--; } });
      return { total, rows: top.map((r, i) => ({ ...r, share: raws[i], pesos: floors[i] })) };
    }
    const payrollOf = list => list.filter(d => d.isPayrollGenerated).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    const ministryOf = list => list.filter(isNowMinistryExpense).reduce((s, d) => s + parseFloat(d.amount || 0), 0);
    kpi.per100 = {
      period: per100Of(st.fExp), ytd: per100Of(stYtd.fExp),
      staffRatio: st.totalOut > 0 ? payrollOf(st.fExp) / st.totalOut * 100 : null,
      ministryRatio: st.totalOut > 0 ? ministryOf(st.fExp) / st.totalOut * 100 : null,
      staffRatioYtd: stYtd.totalOut > 0 ? payrollOf(stYtd.fExp) / stYtd.totalOut * 100 : null,
      ministryRatioYtd: stYtd.totalOut > 0 ? ministryOf(stYtd.fExp) / stYtd.totalOut * 100 : null
    };

    // ── 6. Church obligations ──
    const todayIso = isoOf(now);
    const obYear = obligationsData.filter(o => {
      if (!o.dueDate) return true;
      const dt = new Date(o.dueDate);
      return !isNaN(dt.getTime()) && dt.getFullYear() === year;
    });
    const obSel = obYear.filter(o => { if (!o.dueDate) return false; const dt = new Date(o.dueDate); return monthSet.has(dt.getMonth()); });
    const obTotals = list => {
      const due = sumF(list, o => Math.max(0, parseFloat(o.amount || 0)));
      const paid = sumF(list, o => Math.min(Math.max(0, parseFloat(o.amount || 0)), getObligationPaidAmount(o)));
      return { due, paid, balance: sumF(list, o => getObligationBalance(o)), pct: due > 0 ? paid / due * 100 : null, count: list.length };
    };
    kpi.obligations = {
      year: obTotals(obYear), selected: obTotals(obSel),
      overdue: obYear.filter(o => o.dueDate && o.dueDate < todayIso && getObligationBalance(o) > 0).length,
      overdueAmount: sumF(obYear.filter(o => o.dueDate && o.dueDate < todayIso && getObligationBalance(o) > 0), o => getObligationBalance(o)),
      rows: obYear.slice().sort((a, b) => String(a.dueDate || '9999').localeCompare(String(b.dueDate || '9999'))).map(o => ({
        name: o.name || 'Church Obligation', due: o.dueDate || '', amount: Math.max(0, parseFloat(o.amount || 0)),
