  // ───────────────────────────────────────────────────────────────────────
  // Slide 10 / "The bottom line": a one-screen scorecard + three auto-generated lists, built ONLY from the kpi object.
  // ───────────────────────────────────────────────────────────────────────
  // SUMMARY RULES - the one table that decides the three lists. EASY TO EDIT, nothing else needs to change.
  // A rule fires when its test returns a sentence (otherwise null). Within a list, rules are tried in table order
  // (= priority) and the first 3 that fire are shown. Thresholds are plain differences/percentages - no outside benchmark.
  //   list   id           fires when
  //   good   cash-green   cash level today is GREEN (>= 3 months of Essential Monthly Operating Expense)
  //   good   surplus      net surplus for the selected months (net > 0)
  //   good   income-pace  income achieved is at or above 100% of the budget counted so far
  //   good   spend-ok     spending used <= 100% of the budget counted so far and no expense line is over budget
  //   good   tithes-up    tithes are up on the same months last year
  //   good   obl-clear    church obligations exist, none overdue, and at least 50% paid
  //   good   attend-up    average Sunday attendance is up on the same months last year
  //   good   controls-ok  (Treasurer/Auditor) the Ending Balance check balances and >= 90% of expenses have a receipt
  //   watch  cash-yellow  cash level is YELLOW (1 to < 3 months of cover)
  //   watch  deficit      net deficit for the selected months (net < 0)
  //   watch  income-behind income achieved is more than 10 points below 100% of the budget counted so far
  //   watch  spend-ahead  year-to-date spending is above 110% of the budget due so far, or any expense line is over budget
  //   watch  tithes-down  tithes are down more than 5% on the same months last year
  //   watch  particip-drop tither participation fell more than 5 points on the same months last year
  //   watch  attend-drop  average Sunday attendance is down more than 5% on the same months last year
  //   watch  spend-up     disbursements are up more than 20% on the same months last year
  //   watch  staff-over   the staff-cost ratio is more than 10 points above the budget plan (matches the ₱100 tile's amber)
  //   watch  vouchers     (Treasurer/Auditor) fewer than 90% of expenses have a cash voucher
  //   watch  cash-slips   the trend projection slips a cash level (but not yet to Red/Black)
  //   action cash-bad     cash level is RED or BLACK (< 1 month of cover)  ->  agree a plan to rebuild cash
  //   action cash-proj    the trend projection reaches RED or BLACK within 6 months  ->  plan ahead
  //   action overdue      one or more church obligations are past their due date  ->  settle them
  //   action remit        pass-through collections are still to be remitted (> 0)  ->  remit them
  //   action no-sheets    (Treasurer/Auditor) Sundays with income but no count sheet  ->  attach the sheets
  //   action advances     (Treasurer/Auditor) cash advances not yet liquidated  ->  liquidate them
  //   action reconcile    (Treasurer/Auditor) the Ending Balance check is off  ->  investigate
  //   action receipts     (Treasurer/Auditor) < 90% of expenses have a receipt on file  ->  collect the missing receipts
  // Scorecard status dots (always shown with a text label): green "On track" / amber "Watch" / red "Needs attention" / grey "No data".
  //   Results: green net >= 0; amber deficit up to 5% of receipts; red worse.   Cash: level Green / Yellow / Red+Black
  //   (amber if a Red/Black month is projected); Budget: red if spending > 110% or income < 80% of budget, amber if
  //   spending > 100% or income < 90%; Giving: red tithes down > 10%, amber tithes down > 5% or participation down > 5 pts;
  //   ₱100: amber if the staff-cost ratio is > 10 points above the budget plan; Obligations: red if any overdue;
  //   Projects: red if Building Fund balance < 0, amber if a project's costs exceed what it raised; Attendance: amber down > 5%,
  //   red down > 15%; Pass-through: amber while anything is still to remit; Controls: red if the check is off, amber if any gap.
  const SUMMARY_RULES = [
    { list: 'good', id: 'cash-green', test: k => k.liquidity.level.color === 'green' && Number.isFinite(k.liquidity.months) ? `Cash is GREEN: ${k.liquidity.months.toFixed(1)} months of essential expenses in hand.` : null },
    { list: 'good', id: 'surplus', test: k => k.stmt.net > 0.005 ? `A surplus of ${pesoW(k.stmt.net)} for ${k.period.label} (receipts ${pesoW(k.stmt.receipts)}, disbursements ${pesoW(k.stmt.disbursements)}).` : null },
    { list: 'good', id: 'income-pace', test: k => k.budget.hasBudget && k.budget.incomePct !== null && k.budget.incomePct >= 100 ? `Income is at ${pctTxt(k.budget.incomePct)} of budget.` : null },
    { list: 'good', id: 'spend-ok', test: k => k.budget.hasBudget && k.budget.expensePct !== null && k.budget.expensePct <= 100 && !k.budget.topOver.length ? `Spending used ${pctTxt(k.budget.expensePct)} of budget with no line over its budget.` : null },
    { list: 'good', id: 'tithes-up', test: k => k.giving.tithesChange !== null && k.giving.tithesChange > 0.5 ? `Tithes are up ${k.giving.tithesChange.toFixed(0)}% on the same months last year (${pesoW(k.giving.tithes)}).` : null },
    { list: 'good', id: 'obl-clear', test: k => k.obligations.rows.length && !k.obligations.overdue && k.obligations.year.pct !== null && k.obligations.year.pct >= 50 ? `Church obligations are ${pctTxt(k.obligations.year.pct)} paid and none is overdue.` : null },
    { list: 'good', id: 'attend-up', test: k => k.people.attendanceChange !== null && k.people.attendanceChange > 0.5 && k.people.attendanceAvg > 0 ? `Average Sunday attendance is up ${k.people.attendanceChange.toFixed(0)}% (${num0(k.people.attendanceAvg)} per Sunday).` : null },
    { list: 'good', id: 'controls-ok', test: k => k.controls && k.controls.reconcileClean && k.controls.receiptPct !== null && k.controls.receiptPct >= 90 ? `The Ending Balance check balances and ${k.controls.receiptPct.toFixed(0)}% of expenses have a receipt.` : null },

    { list: 'watch', id: 'cash-yellow', test: k => k.liquidity.level.color === 'yellow' ? `Cash is YELLOW: ${Number.isFinite(k.liquidity.months) ? k.liquidity.months.toFixed(1) + ' months' : 'limited cover'} of essential expenses.` : null },
    { list: 'watch', id: 'deficit', test: k => k.stmt.net < -0.005 ? `We spent ${pesoW(-k.stmt.net)} more than we received in ${k.period.label}.` : null },
    { list: 'watch', id: 'income-behind', test: k => k.budget.hasBudget && k.budget.incomePct !== null && k.budget.incomePct < 90 ? `Income is ${(100 - k.budget.incomePct).toFixed(0)} points behind the budget counted so far (${pctTxt(k.budget.incomePct)}).` : null },
    { list: 'watch', id: 'spend-ahead', test: k => {
        const b = k.budget; if (!b.hasBudget) return null;
        const ahead = b.ytdExpensePct !== null && b.ytdExpensePct > 110;   // year-to-date spending vs the budget due so far (100% = on pace)
        if (b.topOver.length) return `${b.topOver.length === 5 ? '5 or more' : b.topOver.length} expense line${b.topOver.length === 1 ? ' is' : 's are'} over budget; the largest is ${b.topOver[0].name} (${pesoW(b.topOver[0].actual - b.topOver[0].budget)} over).`;
        return ahead ? `Year-to-date spending is ${pctTxt(b.ytdExpensePct)} of the budget due so far.` : null; } },
    { list: 'watch', id: 'tithes-down', test: k => k.giving.tithesChange !== null && k.giving.tithesChange < -5 ? `Tithes are down ${Math.abs(k.giving.tithesChange).toFixed(0)}% on the same months last year.` : null },
    { list: 'watch', id: 'particip-drop', test: k => k.giving.participation !== null && k.giving.participationPrior !== null && k.giving.participationPrior - k.giving.participation > 5 ? `Tither participation fell from ${k.giving.participationPrior.toFixed(1)}% to ${k.giving.participation.toFixed(1)}%.` : null },
    { list: 'watch', id: 'attend-drop', test: k => k.people.attendanceChange !== null && k.people.attendanceChange < -5 && k.people.attendanceAvg > 0 ? `Average Sunday attendance is down ${Math.abs(k.people.attendanceChange).toFixed(0)}% (${num0(k.people.attendanceAvg)} per Sunday).` : null },
    { list: 'watch', id: 'spend-up', test: k => k.change.disbursements !== null && k.change.disbursements > 20 ? `Disbursements are up ${k.change.disbursements.toFixed(0)}% on the same months last year (${pesoW(k.stmt.disbursements)} vs ${pesoW(k.prior.disbursements)}).` : null },
    { list: 'watch', id: 'staff-over', test: k => { const P = k.per100.period; return P.staffRatio !== null && P.staffPlan !== null && P.staffRatio - P.staffPlan > 10 ? `Staff costs are ${pctTxt(P.staffRatio, 0)} of spending, ${(P.staffRatio - P.staffPlan).toFixed(0)} points above the ${pctTxt(P.staffPlan, 0)} in the budget plan.` : null; } },
    { list: 'watch', id: 'vouchers', test: k => k.controls && k.controls.voucherPct !== null && k.controls.voucherPct < 90 ? `Only ${k.controls.voucherPct.toFixed(0)}% of expenses have a cash voucher (${k.controls.missingVoucher} missing).` : null },
    { list: 'watch', id: 'cash-slips', test: k => k.liquidity.firstDrop && !k.liquidity.firstBad ? `At the conservative trend, cash slips to ${k.liquidity.firstDrop.level.color.toUpperCase()} by ${k.liquidity.firstDrop.label}.` : null },

    { list: 'action', id: 'cash-bad', test: k => (k.liquidity.level.color === 'red' || k.liquidity.level.color === 'black') ? `Cash is ${k.liquidity.level.color.toUpperCase()}: agree a plan to rebuild it (${Number.isFinite(k.liquidity.months) ? k.liquidity.months.toFixed(1) + ' months' : 'under 1 month'} of cover).` : null },
    { list: 'action', id: 'cash-proj', test: k => k.liquidity.firstBad && k.liquidity.level.color !== 'red' && k.liquidity.level.color !== 'black' ? `Plan ahead: at the conservative trend cash reaches ${k.liquidity.firstBad.level.color.toUpperCase()} by ${k.liquidity.firstBad.label}.` : null },
    { list: 'action', id: 'overdue', test: k => k.obligations.overdue ? `Settle ${k.obligations.overdue} overdue church obligation${k.obligations.overdue === 1 ? '' : 's'} (${pesoW(k.obligations.overdueAmount)}).` : null },
    { list: 'action', id: 'remit', test: k => k.passThrough.hasItems && k.passThrough.toRemitYtd > 0.005 ? `Remit the ${pesoW(k.passThrough.toRemitYtd)} of pass-through collections still held.` : null },
    { list: 'action', id: 'no-sheets', test: k => k.controls && k.controls.sundays > k.controls.sundaysWithSheet ? `Attach count sheets for ${k.controls.sundays - k.controls.sundaysWithSheet} Sunday${k.controls.sundays - k.controls.sundaysWithSheet === 1 ? '' : 's'} that have none.` : null },
    { list: 'action', id: 'advances', test: k => k.controls && k.controls.advancesOpen ? `Liquidate ${k.controls.advancesOpen} cash advance${k.controls.advancesOpen === 1 ? '' : 's'} (${pesoW(k.controls.advancesAmount)}), the oldest ${k.controls.advancesOldestDays} days old.` : null },
    { list: 'action', id: 'reconcile', test: k => k.controls && !k.controls.reconcileClean ? `Investigate the ${pesoW(Math.abs(k.controls.reconcileDiff))} difference in the Ending Balance check.` : null },
    { list: 'action', id: 'receipts', test: k => k.controls && k.controls.receiptPct !== null && k.controls.receiptPct < 90 ? `Collect the ${k.controls.missingReceipt} missing expense receipt${k.controls.missingReceipt === 1 ? '' : 's'} (${k.controls.receiptPct.toFixed(0)}% on file).` : null }
  ];
  const SUMMARY_LIST_META = [
    { key: 'good', title: 'Going well', cls: 'good', empty: 'Nothing stands out as a strength under the summary rules.' },
    { key: 'watch', title: 'Watch closely', cls: 'watch', empty: 'Nothing to watch under the summary rules.' },
    { key: 'action', title: "For the Council's attention", sub: 'suggested actions', cls: 'action', empty: 'No action items under the summary rules.' }
  ];
  const SUMMARY_STATUS = { green: 'On track', amber: 'Watch', red: 'Needs attention', na: 'No data' };

  function buildSummary(k) {
    const s = k.stmt, L = k.liquidity, b = k.budget, g = k.giving, pe = k.people, ob = k.obligations, pj = k.projects, P = k.per100.period, ptk = k.passThrough, c = k.controls;
    const rows = [];
    const row = (id, title, status, figure, lines, wide) => rows.push({ id, title, status, label: SUMMARY_STATUS[status], figure, lines: lines.filter(Boolean), wide: !!wide });
    // 1. Results
    row('results', 'Results', s.net >= 0 ? 'green' : (s.receipts > 0 && -s.net <= s.receipts * 0.05 ? 'amber' : 'red'),
      `<span class="${signClass(s.net)}">${s.net >= 0 ? 'Surplus' : 'Deficit'} ${pesoW(Math.abs(s.net))}</span>`,
      [`Receipts ${pesoW(s.receipts)} ${chip(k.change.receipts, true)}`, `Disbursements ${pesoW(s.disbursements)} ${chip(k.change.disbursements, false)}`]);
    // 2. Cash
    const lc = L.level.color, lvlSt = !Number.isFinite(L.months) ? 'na' : lc === 'green' ? 'green' : lc === 'yellow' ? 'amber' : 'red';
    row('cash', 'Cash', lvlSt === 'green' && L.firstBad ? 'amber' : lvlSt,
      `<span class="sc-nb">${pesoW(s.endBal)}</span> <span class="sc-unit">ending balance</span>`,
      [`${Number.isFinite(L.months) ? L.months.toFixed(1) + ' months of cover' : 'months of cover not set'} · ${lvlBadge(L.level)}`,
       L.projection.noTrend ? 'Projection needs 3 completed months of history' : (L.firstBad ? `Projected ${L.firstBad.level.color.toUpperCase()} by ${escapeHtml(L.firstBad.label)}` : 'No Red or Black month projected (6 months)')]);
    // 3. Budget
    const bst = !b.hasBudget || (b.incomePct === null && b.expensePct === null) ? 'na'
      : ((b.expensePct !== null && b.expensePct > 110) || (b.incomePct !== null && b.incomePct < 80)) ? 'red'
      : ((b.expensePct !== null && b.expensePct > 100) || (b.incomePct !== null && b.incomePct < 90)) ? 'amber' : 'green';
    const pm = b.partialMonth;
    row('budget', 'Budget', bst, b.hasBudget ? `<span class="sc-nb">Income ${pctTxt(b.incomePct)}</span> <span class="sc-nb">Spending ${pctTxt(b.expensePct)}</span>` : 'No budget set',
      b.hasBudget ? [`of the budget due for the selected months (100% = on pace)`, pm ? `${escapeHtml(pm.label)}: ${pm.prorated ? `budget counted through today (${pm.elapsed} of ${pm.days} days)` : 'full month budget'}` : `Year to date: income ${pctTxt(b.ytdIncomePct)}, spending ${pctTxt(b.ytdExpensePct)}`] : []);
    // 4. Giving
    const gst = g.tithesChange !== null && g.tithesChange < -10 ? 'red'
      : (g.tithesChange !== null && g.tithesChange < -5) || (g.participation !== null && g.participationPrior !== null && g.participationPrior - g.participation > 5) ? 'amber' : (g.tithes > 0 ? 'green' : 'na');
    row('giving', 'Giving', gst, `Tithes ${pesoW(g.tithes)}`,
      [chip(g.tithesChange, true), `${num0(g.tithers)} unique tithers · participation ${g.participation === null ? '—' : pctTxt(g.participation, 1)}`, g.participation !== null ? `<span class="sc-fine">${num0(g.tithers)} tithers ÷ ${num0(pe.attendanceAvg)} avg Sunday attendance</span>` : '']);
    // 5. Where the P100 went
    const top3 = P.spend.lines.filter(l => l.pesos > 0).slice(0, 3);
    const staffOver = P.staffRatio !== null && P.staffPlan !== null && P.staffRatio - P.staffPlan > 10;
    row('per100', 'Where the ₱100 went', P.spend.total > 0 ? (staffOver ? 'amber' : 'green') : 'na',
      top3.length ? `<ul class="sc-top">${top3.map(l => `<li><b>₱${l.pesos}</b> ${escapeHtml(l.display)}</li>`).join('')}</ul>` : 'No spending recorded',
      [P.spend.total > 0 ? `Staff cost ${pctTxt(P.staffRatio, 0)}${P.staffPlan !== null ? ` (plan ${pctTxt(P.staffPlan, 0)})` : ''} · Ministry ${pctTxt(P.ministryRatio, 0)}${P.ministryPlan !== null ? ` (plan ${pctTxt(P.ministryPlan, 0)})` : ''}` : '']);
    // 6. Connectional obligations
    row('obligations', 'Connectional obligations', !ob.rows.length ? 'na' : ob.overdue ? 'red' : 'green',
      ob.rows.length ? `${pctTxt(ob.year.pct)} paid <span class="sc-unit">${k.period.year}</span>` : 'None recorded',
      ob.rows.length ? [`${pesoW(ob.year.paid)} of ${pesoW(ob.year.due)}`, ob.overdue ? `<span class="neg">${ob.overdue} overdue (${pesoW(ob.overdueAmount)})</span>` : 'Nothing overdue'] : []);
    // 7. Special projects and Building Fund
    const projBad = pj.list.some(p => p.costs > p.raised + p.churchFund + 0.005 && p.costs > 0);
    row('projects', 'Projects & Building Fund', pj.building.total < -0.005 ? 'red' : projBad ? 'amber' : 'green',
      `Building Fund ${pesoW(pj.building.total)}`,
      [`${pj.list.length} active special project${pj.list.length === 1 ? '' : 's'}${pj.list.length ? ` · ${pesoW(sumF(pj.list, p => p.raised))} raised, ${pesoW(sumF(pj.list, p => p.costs))} spent` : ''}`]);
    // 8. Attendance
    row('attendance', 'Attendance', !(pe.attendanceAvg > 0) ? 'na' : pe.attendanceChange !== null && pe.attendanceChange < -15 ? 'red' : pe.attendanceChange !== null && pe.attendanceChange < -5 ? 'amber' : 'green',
      pe.attendanceAvg > 0 ? `${num0(pe.attendanceAvg)} <span class="sc-unit">avg per Sunday</span>` : 'Not recorded',
      pe.attendanceAvg > 0 ? [chip(pe.attendanceChange, true), `${num0(pe.sel.sundays)} Sunday${pe.sel.sundays === 1 ? '' : 's'} recorded`] : []);
    // 9. Pass-through still to remit (only when something is held)
    if (ptk.hasItems && (Math.abs(ptk.toRemitYtd) > 0.005 || Math.abs(ptk.toRemitSel) > 0.005))
      row('passthrough', 'Pass-through to remit', ptk.toRemitYtd > 0.005 ? 'amber' : 'green', `${pesoW(ptk.toRemitYtd)} <span class="sc-unit">still to remit</span>`,
        [`${pesoW(ptk.collectedYtd)} collected · ${pesoW(ptk.remittedYtd)} remitted (year to date)`]);
    // 10. Controls (Treasurer + Auditor only)
    if (c) {
      const gaps = (c.receiptPct !== null && c.receiptPct < 90) + (c.sundays > c.sundaysWithSheet) + (c.advancesOpen > 0) + (c.receiptPct !== null && c.voucherPct < 90);
      row('controls', 'Controls', !c.reconcileClean ? 'red' : gaps ? 'amber' : 'green',
        c.reconcileClean ? '✓ Balanced' : `✗ Off by ₱${fmt(Math.abs(c.reconcileDiff))}`,
        [`Receipts ${c.receiptPct === null ? '—' : c.receiptPct.toFixed(0) + '%'} · vouchers ${c.voucherPct === null ? '—' : c.voucherPct.toFixed(0) + '%'}`,
         `Count sheets ${c.sundays ? c.sundaysWithSheet + ' of ' + c.sundays + ' Sundays' : '—'} · open advances ${c.advancesOpen}`]);
    }
    // the three lists (first 3 rules that fire, in table order)
    const lists = {}, fired = {};
    SUMMARY_LIST_META.forEach(m => {
      const out = [], ids = [];
      SUMMARY_RULES.filter(r => r.list === m.key).forEach(r => { let t = null; try { t = r.test(k); } catch (e) { console.warn('summary rule', r.id, e); } if (t) { out.push(t); ids.push(r.id); } });
      lists[m.key] = out.slice(0, 3); fired[m.key] = ids;
    });
    return { rows, lists, fired };
  }
  // The Treasurer's edits (settings/councilNotes-*.summary = { good: [...], watch: [...], action: [...] }) replace a list wholesale.
  function effectiveSummaryList(key, k) {
    const ov = ui.notes && ui.notes.summary && ui.notes.summary[key];
    if (Array.isArray(ov) && ov.length) return { list: ov, edited: true };
    return { list: (k.summary && k.summary.lists[key]) || [], edited: false };
  }
  function slideSummary(k, o) {
    const sm = k.summary;
    const tiles = sm.rows.map(r => `<div class="sc sc-${r.status}${r.wide ? ' sc-wide' : ''}" id="sc-${r.id}"><div class="sc-h"><span class="sc-t">${escapeHtml(r.title)}</span><span class="sc-st"><i aria-hidden="true"></i>${escapeHtml(r.label)}</span></div>
      <div class="sc-fig">${r.figure}</div>${r.lines.map(l => `<div class="sc-d">${l}</div>`).join('')}</div>`).join('');
    const lists = SUMMARY_LIST_META.map(m => {
      const e = effectiveSummaryList(m.key, k);
      const head = `<h3>${escapeHtml(m.title)}${m.sub ? ` <span class="hint">${escapeHtml(m.sub)}</span>` : ''}${e.edited && !(o.editing && !o.static) ? ' <span class="edited-badge">edited by the Treasurer</span>' : ''}</h3>`;
      if (o.editing && !o.static) return `<div class="panel sl sl-${m.cls}">${head}<textarea data-summary="${m.key}" aria-label="${escapeAttr(m.title)} (one per line)">${escapeHtml(e.list.join('\n'))}</textarea><div class="note">one per line · save to keep, or clear it to go back to automatic</div></div>`;
      return `<div class="panel sl sl-${m.cls}" id="sl-${m.key}">${head}<ul class="sum-list">${e.list.length ? e.list.map(t => `<li>${escapeHtml(t)}</li>`).join('') : `<li class="none">${escapeHtml(m.empty)}</li>`}</ul></div>`;
    }).join('');
    return `<div class="scorecard">${tiles}</div><div class="sum-lists">${lists}</div>`;
  }

  const SLIDES = [
    { id: 'hero', short: 'Where we stand', title: 'Where we stand', q: 'How did the church do, and how healthy is our cash?', fn: slideHero },
    { id: 'liquidity', short: 'Cash', title: 'Can we pay our bills?', q: 'Liquidity, runway and what cash is really free', fn: slideLiquidity },
    { id: 'budget', short: 'Budget', title: 'Are we on plan?', q: 'Actuals against the approved budget', fn: slideBudget },
    { id: 'giving', short: 'Giving', title: 'Is our giving base healthy?', q: 'Tithes, tithers and weekly collections', fn: slideGiving },
    { id: 'per100', short: '₱100', title: 'How we use the offering', q: 'Where every ₱100 goes', fn: slidePer100 },
    { id: 'obligations', short: 'Obligations', title: 'Faithful to the wider church?', q: 'Apportionments and other obligations', fn: slideObligations },
    { id: 'projects', short: 'Projects', title: 'Our building and mission work', q: 'Special projects and the Building Fund', fn: slideProjects },
    { id: 'people', short: 'People', title: 'Who we serve', q: 'Attendance and the membership roll', fn: slidePeople },
    { id: 'controls', short: 'Controls', title: 'Can the Council trust these numbers?', q: 'Stewardship and controls (Treasurer and Auditor)', fn: slideControls, only: CONTROLS_ROLES },
    { id: 'summary', short: 'Bottom line', title: 'The bottom line', q: k => `Our finances at a glance for ${k.period.label}`, fn: slideSummary, noPoints: true }
  ];
  function slidesFor(k) { return SLIDES.filter(s => !s.only || (s.id === 'controls' ? !!k.controls : true)); }

  // ───────────────────────────────────────────────────────────────────────
  // 6. TALKING POINTS: auto sentences from the kpi object; the Treasurer may edit them per slide
  // ───────────────────────────────────────────────────────────────────────
  // "₱43 went to Administrative Pastor, ₱31 to Repairs And Maintenance and ₱9 to Utilities" - specific lines, biggest first.
  function topLinesText(lines, verb, prep, n) {
    const top = lines.filter(l => l.pesos > 0).slice(0, n);
    if (!top.length) return 'no single line reached ₱1';
    const parts = top.map((l, i) => `₱${l.pesos} ${i === 0 ? verb : prep} ${l.display}`);
    return parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : parts[0];
  }
  function autoTalkingPoints(k) {
    const s = k.stmt, L = k.liquidity, b = k.budget, g = k.giving, P = k.per100, ob = k.obligations, pj = k.projects, pe = k.people, lab = k.period.label;
    const T = {};
    T.hero = [
      `Receipts for ${lab} were ${pesoW(s.receipts)}, ${changeWords(k.change.receipts)}.`,
      `We spent ${pesoW(s.disbursements)} (${changeWords(k.change.disbursements)}), leaving a ${s.net >= 0 ? 'surplus' : 'deficit'} of ${pesoW(Math.abs(s.net))}.`,
      `Year to date we have received ${pesoW(k.ytd.receipts)} and spent ${pesoW(k.ytd.disbursements)}: a ${k.ytd.net >= 0 ? 'surplus' : 'deficit'} of ${pesoW(Math.abs(k.ytd.net))}.`,
      `The General Fund ${s.endBal >= 0 ? 'ended with' : 'ended at'} ${pesoW(s.endBal)}; cash level today is ${L.level.color.toUpperCase()} (${L.level.level})${Number.isFinite(L.months) ? ` with ${L.months.toFixed(1)} months of cover` : ''}.`
    ];
    T.liquidity = [];
    if (Number.isFinite(L.months)) T.liquidity.push(`We hold ${pesoW(L.available)} of available operating cash - enough for ${L.months.toFixed(1)} months of essential expenses (${L.level.level}).`);
    else T.liquidity.push(`Available operating cash is ${pesoW(L.available)}; the Essential Monthly Operating Expense is not set yet, so the cash level cannot be graded.`);

  // Charts are drawn at pixel width, so re-render when the WIDTH changes, or when the layout mode flips (portrait <-> short

  // ───────────────────────────────────────────────────────────────────────
  // 9b. PRESENTER ANNOTATIONS - anchors, scroll follow, highlight ("spotlight") and pen.
  //
  // All three ride the EXISTING debounced publish of settings/councilPresenter (section 9): nothing is written unless
  // the Treasurer is presenting, followers never write, and there is no live pointer/laser.
  //   scroll    : {anchor, frac, section, prev:[keys]} | null   published only after scrolling SETTLES
  //   highlight : {anchor} | null
  //   strokes   : [{id, anchor, color, pts:[x0,y0,x1,y1,...]}]   <= 30 strokes, <= 60 points each, published on pointer-up only
  //               (pts is FLAT: Firestore rejects an array directly inside an array, so [[x,y],...] cannot be stored)
  //

  //   a ~45 minute meeting over 10 sections ~= 10 section changes + ~20-30 settled scroll stops (500ms idle, and never more

  //   dragging a stroke, or while nobody is presenting.
  //
  // ANCHOR KEYS: every anchorable element gets data-anchor="<section>:<kind>:<slug of its own content>" after each render
  // (assignAnchors) - never a DOM index. Kinds: head, body, panel, tile, ring, chart, mark, legend, row, more, sc, li,
  // point(s), rc. A repeated key gets a "~2", "~3" suffix in document order. Examples: budget:tile:income-achieved,

  const ANCHOR_SEL = '.slide-head, .slide-body, .panel, .tile, .hero .big, .ring-box, .svgwrap, .legend > span, .bk-legend > span, table.t tbody tr, .pk-row, .pk-more > summary, .sc, ul.rank li, ul.sum-list li, .points, .points li, .rc-item, svg[data-chart] [data-tip]';
  function assignAnchors(only) {
    const slides = only ? [only] : [...document.querySelectorAll('.slide')];

      const sid = sl.dataset.slide, seen = Object.create(null);
      sl.querySelectorAll('[data-anchor]').forEach(e => { e.removeAttribute('data-anchor'); e.removeAttribute('data-role-only'); });
      sl.querySelectorAll(ANCHOR_SEL).forEach(el => {
        let key = null;
        const cl = el.classList;
        if (el.closest('svg') && el.tagName.toLowerCase() !== 'svg') {
          if (cl.contains('coin')) return;                                    // 100 identical coins: the legend items are the anchors
          const svg = el.closest('svg[data-chart]'); if (!svg) return;
          const tipText = (el.getAttribute('data-tip') || '').split(';')[0].replace(/₱[\d,.]+[Mk]?/g, '').replace(/[\s:+\-−·()]+$/g, '');
          key = `${sid}:mark:${svg.dataset.chart}:${slug(tipText, 40) || 'mark'}`;

    try {
      const k = ui.kpi, o = { static: true, w: { full: 1000, half: 480 }, per100: ui.per100, editing: false };
      const body = slidesFor(k).map((def, i) => slideHtml(def, i + 1, k, o)).join('');
      await saveReportVersion({ sourcePage: 'council-dashboard', title: `Council Dashboard — ${k.period.label}`, periodLabel: k.period.label, bodyHtml: body });
      alert('Version saved to Report Archive.');
    } catch (err) { console.error(err); alert('Could not save version. Please try again.'); }
    btn.disabled = false; btn.textContent = 'Generate & Save Version';
  }

  // ───────────────────────────────────────────────────────────────────────
  // 11. BOOT
  // ───────────────────────────────────────────────────────────────────────
  window.graceBooksAuthReady.then(async profile => {
    activeUserProfile = profile;
    if (!COUNCIL_ALLOWED_ROLES.includes(profile.role)) { window.location.href = 'index.html'; return; }
    $('who-line').textContent = `${profile.name} · ${profile.role}`;
    $('save-version-btn').style.display = isTreasurer() ? '' : 'none';
    $('btn-broadcast').style.display = isTreasurer() ? '' : 'none';
    $('btn-follow').style.display = isTreasurer() ? 'none' : '';
    updateEditButtons();
    try {
      const raw = await loadRaw(profile);
      if (!raw.income || !raw.expenses) throw new Error('Income or expenses could not be read.');
      ui.raw = raw;
      const now = nowDate();
      const yrs = new Set([now.getFullYear()]);
      if (raw.yearsCfg && Array.isArray(raw.yearsCfg.list)) raw.yearsCfg.list.forEach(y => yrs.add(parseInt(y, 10)));
      raw.income.concat(raw.expenses).forEach(d => { const y = parseInt(String(d.date).slice(0, 4), 10); if (y > 2000) yrs.add(y); });
      const years = [...yrs].filter(Number.isFinite).sort((a, b) => b - a);
      setupControls(years);
      const start = presetMonths('last', years[0]);
      await setSelection(start.year, start.months, { remote: true });
      checkPresenterOnce();
    } catch (err) {
      console.error(err);
      $('dash').innerHTML = `<div class="status-msg err">Could not load the numbers: ${escapeHtml(err.message || err)}. Please reload the page.</div>`;
    }
  });
</script>
</body>
</html>
