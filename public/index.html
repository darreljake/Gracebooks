<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#7A1F2E"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>GraceBooks - TUMC</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="theme.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
  <script src="auth.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      background: linear-gradient(rgba(58, 14, 22, 0.55), rgba(35, 8, 13, 0.72)),
                  url('church.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .login-container {
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: var(--surface);
      padding: 44px 40px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255,255,255,0.6);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .logo {
      width: 80px;
      height: 70px;
      object-fit: contain;
    }

    .login-box h1 {
      font-family: var(--font-display);
      color: var(--red);
      font-size: 29px;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .login-box p {
      color: var(--gray);
      font-size: 13px;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-family: var(--font-ui);
      background: var(--surface-alt);
      color: var(--ink);
    }

    input:focus { border-color: var(--red); outline: none; background: var(--surface); box-shadow: 0 0 0 3px var(--red-light); }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: var(--shadow-sm);
    }

    .btn:hover { background: var(--red-mid); box-shadow: var(--shadow); }
    .btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

    .error { color: var(--danger); font-size: 13px; margin-top: 10px; }
    .warning { color: var(--warning); font-size: 12px; margin-bottom: 15px; padding: 9px 10px; background: var(--warning-bg); border: 1px solid var(--warning-border); border-radius: var(--radius-sm); }

    .dashboard { display: none; }
    body.auth-resolved .login-container {
      display: flex;
    }
    body.auth-resolved.authenticated .login-container {
      display: none;
    }
    body.authenticated .dashboard {
      display: block;
    }
    .auth-loading {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 14px; font-weight: 600; letter-spacing: 0.2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    body.auth-resolved .auth-loading { display: none; }

    .topbar {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: white;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px; 
    }

    .topbar-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .topbar h2 {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .logout-btn {
      background: rgba(255,255,255,0.16);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-ui);
    }

    .logout-btn:hover { background: rgba(255,255,255,0.28); }

    .welcome-bar {
      background: var(--red-light);
      padding: 16px 24px;
      font-size: 14px;
      color: var(--red-dark);
      border-bottom: 1px solid var(--red-border);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      padding: 28px 24px 36px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .menu-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px 18px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      border-top: 3px solid transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-top-color: var(--gold);
    }

    .menu-card .icon {
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--red);
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-card .label {
      font-size: 13.5px;
      color: var(--ink);
      font-weight: 600;
    }

    .footer {
      text-align: center;
      padding: 30px 20px 40px;
      color: rgba(255,255,255,0.65);
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    #install-app-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--red);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-ui);
      box-shadow: var(--shadow-lg);
      cursor: pointer;
    }
    #install-app-btn:hover { background: var(--red-mid); }

    .notif-badge {
      position: absolute;
      top: -6px; right: -6px;
      background: #e53935;
      color: white;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      pointer-events: none;
    }
    .notif-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 300px;
      max-height: 380px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      color: var(--ink);
    }
    .notif-header {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
    }
    .notif-item { padding: 11px 16px; border-bottom: 1px solid #f5f5f5; font-size: 12px; }
    .notif-item:last-child { border-bottom: none; }
    .notif-item.unread { background: var(--red-light); }
    .notif-msg { color: var(--ink); margin-bottom: 3px; line-height: 1.4; }
    .notif-ts { color: var(--gray); font-size: 11px; }
    .notif-empty { padding: 18px 16px; text-align: center; font-size: 12px; color: var(--gray); }
  </style>
</head>

<body>
  <div class="auth-loading" id="auth-loading">Loading GraceBooks...</div>
  <button id="install-app-btn" onclick="installApp()">📲 Install GraceBooks App</button>

  <div class="login-container" id="login-page">
    <div class="login-box">
      <div class="logo-title">
        <img src="umc-logo.png" alt="UMC Logo" class="logo">
        <h1>GraceBooks</h1>
      </div>
      <p>Tagaytay United Methodist Church</p>

      <div class="warning" id="expiry-notice" style="display:none;">
        Testing access expires in <span id="days-left"></span> days
      </div>

      <input type="text" id="username" placeholder="Username" autocomplete="username" />
      <input type="password" id="password" placeholder="Password" autocomplete="off" />
      <button class="btn" id="login-btn" onclick="login()">Login</button>
      <div class="error" id="error-msg"></div>
    </div>
  </div>

  <div class="dashboard" id="dashboard-page">
    <div class="topbar">
      <div class="topbar-brand">
        <img src="umc-logo.png" alt="Logo" class="topbar-logo">
        <h2>GraceBooks</h2>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="role-label" style="font-weight:600;font-size:13px;opacity:0.9;"></span>
        <div style="position:relative;">
          <button class="logout-btn" id="notif-btn" onclick="toggleNotifications()" title="Notifications" style="padding:8px 11px;">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge" class="notif-badge" style="display:none;"></span>
          </button>
          <div id="notif-dropdown" class="notif-dropdown" style="display:none;">
            <div class="notif-header">Notifications</div>
            <div id="notif-list"></div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="welcome-bar">
      Good day, <strong id="welcome-name"></strong>! Welcome to GraceBooks - TUMC Finance System.
    </div>

    <div class="menu-grid" id="menu-grid"></div>

    <div class="footer">
      GRACEBOOKS (C) ESTABLISHED 2026 - TAGAYTAY UNITED METHODIST CHURCH

  </div>

    function isTestingExpired() {

      return now >= TESTING_END_DATE;
    }

    function getDaysRemaining() {
      const now = new Date().getTime();
      const remaining = Math.ceil((TESTING_END_DATE - now) / (1000 * 60 * 60 * 24));
      return Math.max(0, remaining);
    }

        { iconClass: 'fa-magnifying-glass-chart', label: 'Audit Log', link: 'audit-log.html' }
      ],

        { iconClass: 'fa-diagram-project', label: 'Special Projects', link: 'special-projects.html' },
        { iconClass: 'fa-handshake', label: 'Connectional Ministries', link: 'connectional-ministries.html' },
        { iconClass: 'fa-print', label: 'Print Report', link: 'print-report.html' },
        { iconClass: 'fa-file-signature', label: 'Report Workflow', link: 'report-workflow.html' },
        { iconClass: 'fa-magnifying-glass-chart', label: 'Audit Log', link: 'audit-log.html' },
        { iconClass: 'fa-clipboard-list', label: 'Income Log', link: 'income-log.html' },
        { iconClass: 'fa-receipt', label: 'Expense Log', link: 'expenses.html' }
      ],
      'District': [
        { iconClass: 'fa-chart-line', label: 'Reports', link: 'reports.html' },
        { iconClass: 'fa-users-viewfinder', label: 'Member Report View', link: 'member-report.html' },
        { iconClass: 'fa-bullseye', label: 'Budget vs Actual', link: 'budget-vs-actual.html' },
        { iconClass: 'fa-diagram-project', label: 'Special Projects', link: 'special-projects.html' },
        { iconClass: 'fa-handshake', label: 'Connectional Ministries', link: 'connectional-ministries.html' },
        { iconClass: 'fa-print', label: 'Print Report', link: 'print-report.html' },

      ],

        { iconClass: 'fa-bullseye', label: 'Budget vs Actual', link: 'budget-vs-actual.html' },
        { iconClass: 'fa-diagram-project', label: 'Special Projects', link: 'special-projects.html' },
        { iconClass: 'fa-handshake', label: 'Connectional Ministries', link: 'connectional-ministries.html' },
        { iconClass: 'fa-print', label: 'Print Report', link: 'print-report.html' },
        { iconClass: 'fa-file-signature', label: 'Report Workflow', link: 'report-workflow.html' }
      ],
      'Chairperson': [
        { iconClass: 'fa-chart-line', label: 'Reports', link: 'reports.html' },
        { iconClass: 'fa-users-viewfinder', label: 'Member Report View', link: 'member-report.html' },
        { iconClass: 'fa-bullseye', label: 'Budget vs Actual', link: 'budget-vs-actual.html' },
        { iconClass: 'fa-diagram-project', label: 'Special Projects', link: 'special-projects.html' },
        { iconClass: 'fa-handshake', label: 'Connectional Ministries', link: 'connectional-ministries.html' },
        { iconClass: 'fa-print', label: 'Print Report', link: 'print-report.html' },
        { iconClass: 'fa-file-signature', label: 'Report Workflow', link: 'report-workflow.html' }
      ],
      'Money Counter': [
        { iconClass: 'fa-hand-holding-dollar', label: 'Income Entry Log', link: 'tithe-entry.html' }
      ],
      'Membership Secretary': [
        { iconClass: 'fa-calendar-check', label: 'Weekly Attendance', link: 'membership-attendance.html' },
        { iconClass: 'fa-users', label: 'Members', link: 'members.html' }
      ],
      'Deaconess': [

        { iconClass: 'fa-diagram-project', label: 'Special Projects', link: 'special-projects.html' },

        { iconClass: 'fa-file-invoice-dollar', label: 'My Payslips', link: 'payslips.html' },
        { iconClass: 'fa-clipboard-check', label: 'Liquidation & Reimbursements', link: 'liquidation-reimbursements.html' },
        { iconClass: 'fa-calendar-check', label: 'Attendance', link: 'membership-attendance.html' }
      ],
      'Admin Assistant': [
        { iconClass: 'fa-file-invoice-dollar', label: 'My Payslips', link: 'payslips.html' },
        { iconClass: 'fa-clipboard-check', label: 'Liquidation & Reimbursements', link: 'liquidation-reimbursements.html' }
      ]
    };

    let currentUser = null;

    // INITIALIZATION
    window.onload = function() {
      const daysLeft = getDaysRemaining();
      if (daysLeft <= 7 && daysLeft > 0) {
        document.getElementById('expiry-notice').style.display = 'block';
        document.getElementById('days-left').textContent = daysLeft;
      }

      firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) {
          document.body.classList.remove('authenticated');
          document.body.classList.add('auth-resolved');
          return;
        }
        try {
          currentUser = await getGraceBooksProfile(user);
          showDashboard();
        } catch (error) {
          console.error(error);
          await firebase.auth().signOut();
          sessionStorage.clear();
          document.getElementById('error-msg').textContent = 'Your account is missing a GraceBooks role profile.';
          document.body.classList.remove('authenticated');
          document.body.classList.add('auth-resolved');
        }
      });
    };

    async function login() {
      if (isTestingExpired()) {
        alert('Testing period has expired. Contact administrator.');
        return;
      }

      const username = document.getElementById('username').value.trim().toLowerCase();
      const email = username.includes('@') ? username : `${username}@gracebooks.local`;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const loginBtn = document.getElementById('login-btn');

      if (!username || !password) {
        errorMsg.textContent = 'Username and password required.';
        return;
      }

      if (!/^[a-z0-9._-]{3,40}(@[a-z0-9.-]+)?$/.test(username)) {
        errorMsg.textContent = 'Invalid username format.';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      errorMsg.textContent = '';

      try {
        const result = await firebase.auth().signInWithEmailAndPassword(email, password);
        currentUser = await getGraceBooksProfile(result.user);
        showDashboard();
      } catch (error) {
        console.error(error);
        errorMsg.textContent = 'Invalid email/password or missing role profile.';
      }

      loginBtn.disabled = false;
      loginBtn.textContent = 'Login';
    }
    function showDashboard() {
      document.body.classList.add('authenticated', 'auth-resolved');
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('dashboard-page').style.display = 'block';
      document.getElementById('role-label').textContent = currentUser.role;
      document.getElementById('welcome-name').textContent = currentUser.name;

      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';

      const userMenu = menus[currentUser.role] || [];

      userMenu.forEach(item => {
        grid.innerHTML += `
          <a class="menu-card" href="${item.link}">
            <div class="icon"><i class="fa-solid ${item.iconClass}"></i></div>
            <div class="label">${item.label}</div>
          </a>`;
      });

      loadNotifications();
    }

    async function logout() {
      if (confirm('Are you sure you want to logout?')) {
        await firebase.auth().signOut();
        sessionStorage.clear();
        currentUser = null;
        document.body.classList.remove('authenticated');
        document.body.classList.add('auth-resolved');
        document.getElementById('login-page').style.display = 'flex';
        document.getElementById('dashboard-page').style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('error-msg').textContent = '';
      }
    }

    // Prevent back button access after logout
    window.addEventListener('pageshow', (event) => {
      if (event.persisted && !firebase.auth().currentUser) {
        window.location.href = 'index.html';
      }
    });

    let notificationsData = [];

    async function loadNotifications() {
      if (!currentUser) return;
      try {
        const snap = await firebase.firestore()
          .collection('notifications')
          .where('recipientRole', '==', currentUser.role)
          .get();
        notificationsData = snap.docs
          .map(d => d.data())
          .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))
          .slice(0, 30);
        updateNotifBadge();
      } catch (e) {
        console.warn('Notifications unavailable', e);
      }
    }

    function notifSeenKey() {
      return 'gb_notif_seen_' + (currentUser ? currentUser.role : '');
    }

    function updateNotifBadge() {
      const lastSeen = localStorage.getItem(notifSeenKey()) || '';
      const count = notificationsData.filter(n => (n.createdAt || '') > lastSeen).length;
      const badge = document.getElementById('notif-badge');
      if (!badge) return;
      if (count > 0) {
        badge.textContent = count > 9 ? '9+' : String(count);
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function toggleNotifications() {
      const dropdown = document.getElementById('notif-dropdown');
      if (!dropdown) return;
      const isOpen = dropdown.style.display !== 'none';
      if (isOpen) {
        dropdown.style.display = 'none';
      } else {
        renderNotifList();
        dropdown.style.display = 'block';
        localStorage.setItem(notifSeenKey(), new Date().toISOString());
        const badge = document.getElementById('notif-badge');
        if (badge) badge.style.display = 'none';
      }
    }

    function renderNotifList() {
      const lastSeen = localStorage.getItem(notifSeenKey()) || '';
      const list = document.getElementById('notif-list');
      if (!list) return;
      if (!notificationsData.length) {
        list.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
        return;
      }
      list.innerHTML = notificationsData.map(n => {
        const unread = (n.createdAt || '') > lastSeen;
        const dateStr = n.createdAt ? new Date(n.createdAt).toLocaleString('en-PH') : '';
        const meta = [n.periodLabel || n.reportId || '', n.actorName || ''].filter(Boolean).join(' • ');
        return '<div class="notif-item' + (unread ? ' unread' : '') + '">' +
          '<div class="notif-msg">' + safeHtml(n.message || 'Workflow update') + '</div>' +
          '<div class="notif-ts">' + safeHtml(meta) + (meta ? ' • ' : '') + safeHtml(dateStr) + '</div>' +
          '</div>';
      }).join('');
    }

    function safeHtml(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    document.addEventListener('click', function(e) {
      const btn = document.getElementById('notif-btn');
      const dropdown = document.getElementById('notif-dropdown');
      if (dropdown && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }

    // The browser's own install prompt only shows as a subtle, easy-to-miss
    // address-bar icon and depends on per-browser engagement heuristics that
    // app code can't accelerate. Capturing the event ourselves guarantees every
    // user sees the same clear "Install GraceBooks" button the moment their
    // browser decides the app is installable, instead of relying on whether
    // they happen to notice the native UI.
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      document.getElementById('install-app-btn').style.display = 'block';
    });

    window.installApp = async function installApp() {
      if (!deferredInstallPrompt) return;
      const btn = document.getElementById('install-app-btn');
      btn.style.display = 'none';
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
    };

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      document.getElementById('install-app-btn').style.display = 'none';
    });
  </script>
</body>
</html>
